    html: `<p class="lead">Bir Android uygulaması tek bir "main" fonksiyonuyla başlayıp biten sıradan bir program değildir. Framework, dört farklı component türünü Intent'lerle başlatır; bunlar bir Linux process içinde, bir event loop etrafında yaşar ve lifecycle callback'leriyle sürekli durum değiştirir. Bu bölüm resmi Android dokümanlarına dayanır.</p>

<h3>1. Dört component ve Intent ile başlatma</h3>
<p>Bir uygulamanın giriş noktası tek değildir; sistem dört ayrı component türünü bağımsız olarak başlatabilir. Her biri <code>AndroidManifest.xml</code>'de bildirilmek zorundadır — bildirilmeyen bir component sistem tarafından görülmez ve asla çalışamaz.</p>
<div class="deflist">
<div><dt>Activity</dt><dd>Kullanıcıyla etkileşimin giriş noktası; tek bir ekranı (UI) temsil eder.</dd></div>
<div><dt>Service</dt><dd>Arka planda iş sürdürmek için genel amaçlı giriş noktası; UI sağlamaz.</dd></div>
<div><dt>BroadcastReceiver</dt><dd>Sistemin, normal kullanıcı akışı dışında olayları (system-wide broadcast) uygulamaya iletmesini sağlar.</dd></div>
<div><dt>ContentProvider</dt><dd>Dosya sistemi, SQLite veya başka kalıcı depoda tutulan paylaşılan veriyi yönetir; ContentResolver ile erişilir.</dd></div>
</div>
<div class="manpage src-docs"><div class="ref">developer.android.com · fundamentals</div><p class="orig">An asynchronous message called an intent activates three of the four component types: activities, services, and broadcast receivers.</p><p>Activity, Service ve BroadcastReceiver bir <strong>Intent</strong> ile başlatılır; Intent hem açık (sınıf adıyla) hem örtük (bir eylem/veri tanımıyla) olabilir. ContentProvider ise istisnadır: Intent ile değil, bir <code>ContentResolver</code> isteğiyle hedeflenince aktive olur.</p></div>

<h3>2. Activity lifecycle</h3>
<p>Bir Activity, görünürlüğü ve kullanıcıyla etkileşimi değiştikçe bir dizi state arasında gezer; sistem her geçişte bir lifecycle callback çağırır. Bu callback'lerde doğru işi doğru anda yapmak (kaynak alma/bırakma), düzgün ve pil dostu bir uygulamanın temelidir.</p>
<div class="deflist">
<div><dt>onCreate</dt><dd>Activity ilk yaratıldığında bir kez; tüm ömür boyunca bir defa olması gereken başlatma işi burada.</dd></div>
<div><dt>onStart</dt><dd>Activity kullanıcıya görünür hale gelir; foreground'a ve etkileşime hazırlanır.</dd></div>
<div><dt>onResume</dt><dd>Foreground'a gelir; uygulamanın kullanıcıyla fiilen etkileştiği state.</dd></div>
<div><dt>onPause</dt><dd>Kullanıcının Activity'den ayrıldığının ilk işareti; çok kısa sürer, ağır save işi için uygun değildir.</dd></div>
<div><dt>onStop</dt><dd>Activity artık görünmez; görünür değilken gereksiz kaynaklar burada bırakılır.</dd></div>
<div><dt>onDestroy</dt><dd>Activity yok edilmeden önce; kalan tüm kaynaklar serbest bırakılır.</dd></div>
</div>
<div class="manpage src-docs"><div class="ref">developer.android.com · activity-lifecycle</div><p class="orig">When the activity enters the Resumed state, it comes to the foreground, and the system invokes the onResume callback. This is the state in which the app interacts with the user.</p><p>Kullanıcının gördüğü ve dokunduğu tek "canlı" state, Resumed state'tir. Uygulama ancak bu state'teyken kameraya, animasyona veya özel giriş olaylarına tam erişmelidir; başka bir uygulama öne çıkınca <code>onPause</code> ile bu kaynaklar bırakılmalıdır.</p></div>

<h3>3. Configuration change ve UI state</h3>
<p>Ekran döndürme veya multi-window'a geçiş gibi bir configuration change olduğunda, sistem varsayılan olarak Activity'yi <strong>yok edip yeniden yaratır</strong>. Bu, yeni kaynaklara (farklı layout, dil) uyum sağlamanın yoludur ama Activity içindeki geçici UI state'i siler.</p>
<div class="manpage src-docs"><div class="ref">developer.android.com · activity-lifecycle</div><p class="orig">If onDestroy is called as the result of a configuration change, the system immediately creates a new activity instance and then calls onCreate on that new instance in the new configuration.</p><p>Bu yüzden durum, Activity instance'ında değil; configuration change ve process death'e dayanıklı mekanizmalarda tutulmalıdır: iş mantığı/ekran durumu için <code>ViewModel</code>, hafif UI durumu için <code>rememberSaveable</code> (veya klasik <code>onSaveInstanceState</code>). Bu bundle mekanizması main thread'de serialize edildiği için yalnızca küçük veriye uygundur; büyük veri local storage'a gider.</p></div>

<h3>4. Main thread, event loop ve ANR</h3>
<p>Her uygulama process'i tek bir <strong>main thread</strong> (UI thread) ile başlar. Bu thread bir <code>Looper</code> çalıştırır: <code>MessageQueue</code>'dan sırayla mesaj/olay çeker ve bir <code>Handler</code> ile işler. Dokunma olayları, lifecycle callback'leri ve UI güncellemeleri hep bu tek thread üzerinde sıraya girer — bu yüzden iki kural çıkar: (1) UI yalnızca main thread'den güncellenebilir, (2) uzun süren iş (ağ, disk, hesaplama) main thread'i <em>bloklamamalıdır</em>.</p>
<div class="manpage src-docs"><div class="ref">developer.android.com · ANR</div><p class="orig">When the UI thread of an Android app is blocked for too long, an "Application Not Responding" (ANR) error is triggered.</p><p>Main thread bir girdi olayına ~5 saniye yanıt veremezse sistem <strong>ANR</strong> gösterir. Çözüm: ağır işi arka plan thread'ine (veya coroutine/WorkManager'a) taşıyıp sonucu bir <code>Handler</code>/post ile main thread'e geri vermek. Looper/Handler mekanizması, Linux thread'leri ve futex modülündeki senkronizasyonun framework düzeyindeki yüzüdür.</p></div>

<h3>5. Process, UID ve component'ler arası sınırlar</h3>
<p>Bir uygulama, lab'da gördüğümüz gibi Zygote'tan fork edilen bir Linux process'tir; sistem ona benzersiz bir Linux user ID verir ve varsayılan olarak kendi process'inde çalıştırır. Bu, uygulama sandbox'ının temelidir: bir uygulama başka bir uygulamanın belleğine veya özel dosyalarına doğrudan erişemez.</p>
<div class="manpage src-docs"><div class="ref">developer.android.com · fundamentals</div><p class="orig">The Android operating system is a multi-user Linux system in which each app is a different user. By default, every app runs in its own Linux process.</p><p>Component'ler process sınırlarını aşarak konuşmak zorunda kaldığında (örn. başka uygulamanın Service'ine bağlanmak, bir ContentProvider'dan veri çekmek) iletişim <strong>Binder</strong> üzerinden gider — yani Binder modülündeki tek-kopya IPC ve caller identity doğrulaması burada da devrededir. Performans için kritik native kod ise <code>JNI</code> ile çağrılır; Java/Kotlin dünyası ile C/C++ dünyası arasındaki köprü budur.</p></div>`
