    html: `<p class="lead">Android'in katmanlı yığını rastgele değil, iki baskı altında şekillendi: mobil donanımın kısıtları (bellek, pil, çeşitlilik) ve yüz milyonlarca cihazı güncelleyebilme ihtiyacı. Her katman bir soyutlama sınırıdır; bu sınırlar hem mühendislik hem güvenlik açısından nerede durduğunu belirler. Bu bölüm AOSP belgelerine dayanır.</p>

<h3>1. Framework kodu nerede çalışır?</h3>
<p>Yaygın bir yanılgı, framework'ün ayrı bir "sunucu" olduğudur. Aslında framework kodunun büyük kısmı <strong>her uygulamanın kendi process'inde</strong> çalışır; uygulama yalnızca gerçekten ayrıcalık gereken işler için system service'lere Binder üzerinden çağrı yapar. Yani <code>TextView</code> senin process'inde çizilir, ama "bu bildirimi göster" isteği system_server'a gider.</p>
<div class="manpage src-aosp"><div class="ref">AOSP · ARCHITECTURE</div><p class="orig">Framework code runs inside each app's process.</p><p>Framework sınıfları ayrı bir process'te değil, uygulamanın kendi adres alanında koşar. Bu yüzden bir uygulamanın çökmesi (crash) framework'ü değil yalnızca o process'i düşürür; sistem servisleri ayrı process'te (system_server) korunur.</p></div>

<h3>2. HAL: donanım çeşitliliğini soğurmak</h3>
<p>Binlerce farklı yonga, kamera, modem var. Android bu çeşitliliği üst katmanlardan gizlemek için standart bir arayüz tanımlar; vendor bu arayüzü doldurur. Böylece framework "fotoğraf çek" der, altındaki sürücünün kim olduğunu bilmez.</p>
<div class="manpage src-aosp"><div class="ref">AOSP · HAL</div><p class="orig">A HAL is an abstraction layer with a standard interface for hardware vendors to implement.</p><p>HAL, framework ile donanım sürücüsü arasındaki sözleşmedir. Treble (Android 8.0) ile bu arayüzler "binderized" edildi ve vendor kodu ayrı bir bölüme (partition) taşındı — sonuç: sistem güncellemesi gelirken vendor kodu aynı kalabiliyor, bu da güncelleme hızını artırdı.</p></div>

<h3>3. Çekirdek: Linux, ama Android'e göre eğilmiş</h3>
<p>Altta gerçek bir Linux kernel çalışır, ama Android onu mobil ihtiyaçlar için genişletir. Bu eklentilerin çoğu yıllarca mainline dışındaydı; GKI (Generic Kernel Image) ile çekirdek, donanımdan bağımsız çekirdek ile vendor modülleri olarak ikiye ayrıldı.</p>
<div class="manpage src-aosp"><div class="ref">AOSP · KERNEL</div><p class="orig">The kernel is the central part of any operating system and talks to the underlying hardware on a device.</p><p>AOSP çekirdeği, mümkün olduğunca donanımdan bağımsız (hardware-agnostic) çekirdek ile vendor'a özel modüllere ayrılır. Android'e özgü başlıca eklentiler:</p></div>
<div class="deflist">
<div><dt>binder</dt><dd>Android'in temel IPC mekanizması; bir kernel sürücüsü (<code>/dev/binder</code>) olarak çalışır. system service mimarisinin tamamı bunun üstündedir.</dd></div>
<div><dt>ashmem / memfd</dt><dd>Anonymous shared memory — process'ler arası büyük veri (ör. ekran tamponu) kopyalamadan paylaşılır.</dd></div>
<div><dt>lmkd</dt><dd>Low Memory Killer daemon; bellek azalınca, oom skoruna göre en az gereken uygulamayı sonlandırır. Masaüstü Linux'un OOM killer'ının mobil uyarlaması.</dd></div>
<div><dt>wakelocks</dt><dd>Suspend'e geçişi engelleyen güç yönetimi mekanizması; pil ömrü için kritik.</dd></div>
</div>

<h3>4. Bionic neden glibc değil?</h3>
<p>Android masaüstü Linux'un libc'si glibc'yi kullanmaz; kendi libc'si olan <strong>Bionic</strong>'i kullanır. Üç neden: lisans (glibc LGPL'dir, Bionic BSD lisanslı — statik bağlamada daha rahat), boyut (Bionic çok daha küçük, her uygulama process'i onu yükler) ve mobil optimizasyon (daha hafif thread/locale desteği). Dönüşü de var: Bionic tam POSIX/glibc uyumlu değildir, bu yüzden bazı masaüstü C kodu doğrudan derlenmez.</p>

<h3>5. Sürüm evrimi yığında okunur</h3>
<p>Android'in tarihi bu katmanların değişimidir: Dalvik → ART (5.0, AOT derleme), runtime permissions (6.0, izin modeli framework'te değişti), Project Treble (8.0, HAL/vendor ayrımı), Project Mainline / APEX (10+, çekirdek dışı sistem bileşenleri Play üzerinden güncellenebilir hale geldi), GKI (çekirdek modülerleşmesi). Her biri yığının belirli bir katmanına dokunur.</p>
<p>Uygulama geliştirici tarafında bu, <strong>API level</strong> ile görünür: her sürüm yeni API'ler ekler, eskileri "deprecated" yapar. <code>targetSdkVersion</code> uygulamanın hangi davranış kurallarına uyduğunu belirler.</p>`
