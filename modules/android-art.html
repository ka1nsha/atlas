  deepDive: {
    heading: "Derinlemesine: interpreter, JIT ve AOT",
    html: `<p class="lead">ART, aynı DEX bytecode'u üç farklı şekilde çalıştırabilir ve aralarında dinamik olarak geçiş yapar: yavaş ama anında başlayan interpreter, ısınan metodları derleyen JIT, ve kuruluma/boşta zamana yayılan AOT. Amaç, hem hızlı uygulama başlangıcı hem düşük bellek hem de sıcak kodda native hız elde etmektir. Bu bölüm AOSP belgelerine dayanır.</p>

<h3>1. Üç çalıştırma modu</h3>
<p>Bir metod ilk çağrıldığında ART onu <strong>interpreter</strong> ile çalıştırır — derleme yok, anında başlar, ama her bytecode tek tek yorumlandığı için yavaştır. Bir metod yeterince sık çalışırsa (hot method olursa) <strong>JIT</strong> (just-in-time) devreye girer ve o metodu çalışma anında native kod'a derleyip code cache'e koyar. Sonraki çağrılar doğrudan bu derlenmiş kodu kullanır.</p>
<div class="manpage src-aosp"><div class="ref">runtime · jit</div><p class="orig">JIT makes use of runtime type information, can do better inlining, and makes on stack replacement (OSR) compilation possible.</p><p>JIT'in avantajı, çalışma anındaki gerçek tip bilgisini görebilmesidir: hangi dalın sık geçildiğini, hangi nesnenin hangi tipte olduğunu bildiği için AOT'tan daha iyi inlining yapabilir. OSR (on-stack replacement) sayesinde, uzun süren bir döngünün ortasında bile metodun yorumlanan sürümünden derlenmiş sürümüne geçebilir.</p></div>
<p>Bir metod hem JIT hem AOT koduna sahip olabilir (örneğin tekrarlı de-optimization'lar yüzünden); bu durumda hangisinin kullanılacağı bellidir.</p>
<div class="manpage src-aosp"><div class="ref">runtime · jit</div><p class="orig">If both JIT and AOT code exists (e.g. due to repeated de-optimizations), the JITed code is preferred.</p><p>JIT kodu çalışma anındaki bilgiyle üretildiği için AOT koduna tercih edilir — AOT daha önce, daha az bilgiyle derlenmiştir.</p></div>

<h3>2. Profile-guided compilation</h3>
<p>ART, her uygulamanın gerçekte hangi metodları sık çalıştırdığını bir <strong>profile</strong> dosyasında biriktirir. Bu profil, neyi AOT ile derlemeye değeceğini belirler: tüm uygulamayı derlemek yerine yalnızca gerçekten sıcak olan kısımları derler. Böylece hem disk hem derleme süresi hem de bellek tasarruf edilir.</p>
<div class="manpage src-aosp"><div class="ref">runtime · profile-guided</div><p class="orig">The JIT profile data is dumped to a file in a system directory that only the application can access.</p><p>JIT çalışırken hangi metodların sıcak olduğunu kaydeder ve bu profil verisini yalnızca o uygulamanın erişebildiği bir dizine yazar — profil, uygulamanın gerçek kullanım desenini temsil eder.</p></div>
<div class="manpage src-aosp"><div class="ref">runtime · profile-guided</div><p class="orig">The AOT compilation (dex2oat) daemon parses that file to drive its compilation.</p><p>Cihaz boştayken (veya şarjdayken) bir dex2oat daemon'ı bu profili okur ve yalnızca profildeki sıcak metodları AOT ile derler. Play ayrıca <strong>baseline profile</strong>'ları uygulamayla birlikte dağıtır, böylece ilk açılıştan itibaren kritik yollar derlenmiş olur.</p></div>

<h3>3. dex2oat ve derleme filtreleri (compilation filters)</h3>
<p>Asıl AOT derleyicisi cihaz üstünde çalışan <code>dex2oat</code>'tır. Ne kadarının derleneceğini bir <strong>compilation filter</strong> belirler: <code>verify</code> (sadece doğrula, derleme yok), <code>speed-profile</code> (profildeki sıcak metodları derle — varsayılan), <code>speed</code> (her şeyi derle), <code>space</code> (yer için). Böylece aynı araç, cihaza ve duruma göre hız/boyut dengesini ayarlar.</p>
<div class="manpage src-aosp"><div class="ref">runtime · dex2oat</div><p class="orig">At install time, ART compiles apps using the on-device dex2oat tool.</p><p>Dalvik'ten farklı olarak ART, derlemeyi cihazın kendisinde yapar; bu sayede üretilen kod tam o cihazın işlemcisine göre optimize edilir.</p></div>
<div class="manpage src-aosp"><div class="ref">runtime · dex2oat</div><p class="orig">This utility accepts DEX files as input and generates a compiled app executable for the target device.</p><p>dex2oat girdi olarak DEX dosyalarını alır ve hedef cihaz için derlenmiş bir çalıştırılabilir üretir — çıktı aşağıdaki OAT/VDEX/ART dosyalarıdır.</p></div>

<h3>4. OAT, VDEX, ODEX ve ART dosyaları</h3>
<p>dex2oat'ın ürettiği artefaktlar farklı şeyler tutar; bir uygulamanın başlangıç hızı büyük ölçüde bunların hazır olup olmamasına bağlıdır.</p>
<div class="deflist">
<div><dt>.oat</dt><dd>dex2oat'ın ürettiği native kod. Aslında özel bir ELF dosyasıdır; AOT ile derlenmiş metodların makine kodunu barındırır.</dd></div>
<div><dt>.vdex</dt><dd>Doğrulanmış (verified) ve hızlı okunur hale getirilmiş DEX. Doğrulama sonucunu saklar, böylece sonraki açılışlarda yeniden doğrulamaya gerek kalmaz.</dd></div>
<div><dt>.odex</dt><dd>Optimize edilmiş DEX; pratikte OAT çıktısının bir uygulama/paket için paketlenmiş biçimi (kurulumda /data'da oluşur).</dd></div>
<div><dt>.art</dt><dd>Heap image: önceden başlatılmış (pre-initialized) sınıf ve nesnelerin bellek anlık görüntüsü. Açılışta doğrudan belleğe eşlenir, böylece uygulama sık kullanılan nesneleri sıfırdan kurmaz.</dd></div>
</div>

<h3>5. Garbage collection</h3>
<p>ART'ın çöp toplayıcısı, managed heap'teki artık erişilemeyen nesneleri geri kazanır. Mobilde kritik olan, bunu yaparken uygulamayı mümkün olduğunca az durdurmaktır (düşük pause). Modern ART, çoğunlukla eşzamanlı (mostly concurrent) ve copying bir GC kullanır.</p>
<div class="manpage src-aosp"><div class="ref">runtime · gc</div><p class="orig">Concurrent copying to reduce background memory usage and fragmentation.</p><p>Concurrent copying GC, nesneleri çalışırken taşıyarak hem fragmentation'ı azaltır hem de arka plan bellek kullanımını düşürür — uygulama çoğunlukla durmaz.</p></div>
<div class="manpage src-aosp"><div class="ref">runtime · gc</div><p class="orig">The length of the GC pause is independent of the heap size.</p><p>Kritik tasarım hedefi: GC duraklamasının (pause) süresi heap büyüklüğünden bağımsızdır. Büyük heap'li uygulamalar bile kısa, öngörülebilir takılmalar yaşar — bu, akıcı bir arayüz için şarttır.</p></div>`
  },
