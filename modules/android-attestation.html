  deepDive: {
    heading: "Derinlemesine: güven zinciri nasıl kurulur ve korunur?",
    html: `<p class="lead">Bir cihazın "bütün ve güvenilir" olduğunu iddia etmesi için, açılışın ilk anından uygulama verisine kadar her katmanın bir öncekine dayanması gerekir. Bu bölüm o zinciri — Verified Boot'tan dm-verity'nin hash tree'sine ve key attestation'a — ayrıntısıyla anlatır.</p>

<h3>1. Verified Boot ve chain of trust</h3>
<p>Android Verified Boot (AVB), açılışı bir güven zincirine (chain of trust) dönüştürür: donanıma gömülü, değiştirilemez bir root of trust'tan başlar ve her aşama bir sonrakini çalıştırmadan önce imzasını doğrular. Bir aşama bozulmuşsa zincir orada kopar. İmza bilgileri <code>vbmeta</code> bölümünde tutulur; bu bölümün kendisi de üst aşama tarafından doğrulanır.</p>
<div class="manpage src-aosp"><div class="ref">verified boot · chain of trust</div><p class="orig">It establishes a full chain of trust, starting from a hardware-protected root of trust to the bootloader.</p><p>Zincirin kökü yazılım değil donanımdır — bu yüzden saldırgan en alttan başlayamaz. Root of trust cihaz üretiminde yazılır ve sonradan değiştirilemez.</p></div>
<div class="manpage src-aosp"><div class="ref">verified boot · her aşama</div><p class="orig">During device boot up, each stage verifies the integrity and authenticity of the next stage before handing over execution.</p><p>Her aşama (bootloader → boot → system) kontrolü devretmeden önce bir sonrakinin hem bütünlüğünü (değişmemiş mi) hem de kimliğini (doğru anahtarla imzalı mı) doğrular.</p></div>

<h3>2. Rollback protection</h3>
<p>Bir saldırgan, yamalı yeni sürüm yerine açığı hâlâ açık olan eski ama geçerli imzalı bir sürümü yüklemeye çalışabilir (downgrade). AVB bunu rollback index ile engeller: her sürümün bir rollback numarası vardır ve cihaz, gördüğü en yüksek numarayı güvenli depolamada tutar; daha düşük numaralı bir image reddedilir.</p>
<div class="manpage src-aosp"><div class="ref">verified boot · rollback</div><p class="orig">Rollback protection helps to prevent a possible exploit from becoming persistent.</p><p>Amaç exploit'in kalıcılaşmasını önlemek: saldırgan açığı olan eski sürüme geri dönemezse, yama uygulandıktan sonra o yol kapanır.</p></div>

<h3>3. dm-verity ve hash tree</h3>
<p>Verified Boot imzayı bir kez açılışta doğrular; ama <code>/system</code> gibi bölümler gigabaytlarca sürer ve çalışma boyunca okunur. dm-verity bunu blok bazlı ve tembel (lazy) doğrular: her 4K blok için bir SHA-256 hash tutulur, bu hash'ler bir ağaçta (hash tree) saklanır ve yaprak hash'lerden tek bir kök hash'e (root hash) çıkılır. Yalnızca root hash'in güvenilir olması, tüm bölümü doğrulamak için yeterlidir.</p>
<div class="manpage src-aosp"><div class="ref">dm-verity · hash tree</div><p class="orig">Because the hash values are stored in a tree of pages, only the top-level "root" hash must be trusted to verify the rest of the tree.</p><p>Bu yapı, Merkle tree olarak da bilinir: bir blok değişirse onun yaprak hash'i, o da üst düğümler ve sonunda root hash değişir — tek bir baytlık değişiklik bile yakalanır.</p></div>
<div class="manpage src-aosp"><div class="ref">dm-verity · doğrulama</div><p class="orig">Instead, dm-verity verifies blocks individually and only when each one is accessed.</p><p>Tüm bölüm açılışta taranmaz; her blok yalnızca okunduğu anda hash'lenip ağaçta yukarı doğru doğrulanır. Doğrulama başarısızsa çekirdek o blok için bir I/O hatası üretir — sistem bölümü bozulmuş gibi davranır.</p></div>

<h3>4. Forward error correction ve fs-verity</h3>
<p>Disk yıpranması gibi kasıtsız bozulmalar da dm-verity'yi tetikleyebilir. Forward error correction (FEC), bu tür küçük hataları onarıp cihazın gereksiz yere açılmaz hale gelmesini önler.</p>
<p>fs-verity ise aynı hash tree fikrini dosya bazında uygular: tek tek dosyaların (örneğin kurulu APK'ların) salt okunur bütünlüğünü garanti eder — dosya açıldıktan sonra değiştirilemez.</p>
<div class="manpage src-aosp"><div class="ref">dm-verity · FEC</div><p class="orig">Android 7.0 and higher improves dm-verity robustness with forward error correction (FEC).</p><p>FEC sayesinde cihaz, birkaç bozuk bloğu kurtarabilir; böylece gerçek bir saldırı ile normal disk aşınması ayrışır.</p></div>

<h3>5. Verified boot state: kullanıcıya iletilen bütünlük</h3>
<p>Cihaz, açılış bütünlüğünü bir renk durumuyla (verified boot state) kullanıcıya ve uygulamalara bildirir. Bu durum, key attestation sertifikasına da gömülür.</p>
<div class="deflist">
<div><dt>GREEN</dt><dd>Bootloader kilitli ve tüm zincir üretici anahtarıyla doğrulandı. Tam güven.</dd></div>
<div><dt>YELLOW</dt><dd>Bootloader kilitli ama kullanıcının kendi anahtarı (custom root of trust) kullanılıyor; anahtar parmak izi gösterilir.</dd></div>
<div><dt>ORANGE</dt><dd>Bootloader kilidi açık (unlocked); doğrulama yapılmıyor. Kullanıcı bilerek bu duruma geçmiştir.</dd></div>
<div><dt>RED</dt><dd>Doğrulama başarısız: image bozuk veya kurcalanmış. Cihaz normal açılmaz.</dd></div>
</div>

<h3>6. Key attestation ve Play Integrity</h3>
<p>Yukarıdaki her şey cihazın kendi içindedir; peki bir sunucu, karşısındaki cihazın gerçekten kilitli ve bütün olduğuna nasıl güvenir? Key attestation ile: donanımdaki anahtar, cihazın durumunu (kilit durumu, verified boot state, OS sürümü) içeren bir sertifika zinciri imzalar. Bu zincirin kökü Google'ın attestation root'una kadar gider, dolayısıyla taklit edilemez (bir uygulama bu bilgiyi yalan söyleyemez). Play Integrity API, uygulama geliştiricilerine bu donanım-destekli kararı sunan üst düzey arayüzdür.</p>`
  },

    html: '<p class="prose">Bütünlük tek bir mekanizma değil, üst üste binen katmanlardır; her biri farklı bir kapsamı korur:</p>' +
      '<div class="tbl-wrap"><table class="bugs"><thead><tr><th>Katman</th><th>Neyi doğrular</th><th>Mekanizma</th></tr></thead><tbody>' +

      '</tbody></table></div>' +
      '<p class="prose" style="margin-top:14px">Bu, açılış modülündeki (Modül 3) güven zincirinin güvenlik tarafıdır ve kökünü TrustZone/donanım güvenlik modülünden (Modül 16) alır: attestation kanıtını imzalayan anahtar güvenli dünyada durur. Üçü birlikte, "cihaz açıldığından beri hiç değiştirilmedi" iddiasını donanıma kadar izlenebilir kılar.</p>' +
      '<p class="prose">Saldırgan açısından bu, kalıcılığı (persistence) çok zorlaştırır: sistem bölümüne arka kapı eklemek dm-verity\'yi, açılışı değiştirmek AVB\'yi bozar; ikisi de attestation\'da görünür. Bu yüzden modern saldırılar kalıcı değişiklik yerine bellekte kalan (in-memory) tekniklere ya da bootloader kilidini açtırmaya yönelir — ki bu da attestation\'da "unlocked" olarak raporlanır.</p>'
