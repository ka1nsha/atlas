  deepDive: {
    heading: "Derinlemesine: Binder nasıl tek kopyayla çalışır?",
    html: `<p class="lead">Binder, Android'in merkezi sinir sistemidir: uygulamalar ile system_server, servisler ve HAL'ler arasındaki neredeyse tüm iletişim onun üzerinden akar. Yüzeyde basit bir uzak çağrı (RPC) gibi görünür, ama altında bir character device, tek-kopya (one-copy) bir bellek hilesi, bir reference counting sistemi ve kernel tarafından zorlanan bir güvenlik modeli vardır.</p>

<h3>1. Binder sürücüsü ve tek-kopya (one-copy) transfer</h3>
<p>Binder, çekirdekte bir character device'tır: <code>/dev/binder</code>. Her process bu aygıtı açar, bir bölge <code>mmap</code> eder ve tüm iletişimi tek bir <code>ioctl(BINDER_WRITE_READ)</code> çağrısıyla yürütür — tek ioctl hem yazar hem okur. Asıl ustalık veri kopyalama sayısındadır. Klasik IPC (pipe, socket) bir transfer için en az iki kopya yapar: gönderenin buffer'ından kernel buffer'ına, oradan da alıcının buffer'ına. Binder <strong>tek kopya</strong> yapar: binder driver, veriyi doğrudan alıcı process'in önceden <code>mmap</code> ettiği buffer'a yazar. Gönderen ile alıcı o belleği paylaştığı için ikinci kopya hiç olmaz.</p>
<div class="manpage src-aosp"><div class="ref">binder · scatter-gather</div><p class="orig">Android 8 uses scatter-gather optimization to reduce the number of copies from 3 to 1.</p><p>Modern Binder, scatter-gather optimizasyonuyla veriyi orijinal bellek düzeninde bırakıp kopya sayısını daha da düşürür — veri Parcel'a tek tek serialize edilmek yerine olduğu yerden alıcının buffer'ına taşınır.</p></div>
<div class="manpage src-aosp"><div class="ref">binder · copies</div><p class="orig">In previous releases of Android, every piece of data in a binder call was copied three times:</p><p>Eski sürümlerde bir binder çağrısındaki her veri parçası üç kez kopyalanırdı; tek-kopya mimarisi bunu bire indirerek IPC'yi mobil cihaz için yeterince ucuz hale getirdi. Bu, Android'in "her şey bir servis çağrısı" modelini mümkün kılan şeydir.</p></div>

<h3>2. Transaction ve Parcel (marshalling)</h3>
<p>Bir Binder çağrısının temel birimi bir <strong>transaction</strong>'dır. Çağıran taraf argümanları bir <strong>Parcel</strong>'a yazar; bu işleme marshalling denir. Parcel genel amaçlı bir serialization mekanizması değildir — yalnızca IPC için, hız ve binder nesnelerini taşıyabilmek için optimize edilmiş bir container'dır. Bir Parcel ham verinin yanı sıra binder reference'ları (başka process'lerdeki nesnelere işaretçiler) ve hatta file descriptor'ları taşıyabilir; kernel bunları transfer sırasında çevirir.</p>
<div class="deflist">
<div><dt>transaction</dt><dd>Tek bir çağrı birimi: hedef, metot kodu ve Parcel'lanmış argümanlar. Senkron (yanıt beklenir) veya oneway (ateşle-unut) olabilir.</dd></div>
<div><dt>Parcel</dt><dd>Argümanların düz bir byte dizisine yazıldığı container. Yalnızca IPC için; diske yazmak veya kalıcı saklama için uygun değildir.</dd></div>
<div><dt>marshalling</dt><dd>Yapılandırılmış nesneleri Parcel'a yazıp (writeInt, writeString, writeStrongBinder…) karşı tarafta geri okuma (unmarshalling). AIDL bu kodu otomatik üretir.</dd></div>
</div>

<h3>3. Reference (handle) ve nesne ömrü</h3>
<p>Bir process, başka bir process'teki bir binder nesnesini doğrudan tutamaz; onun yerine bir <strong>handle</strong> (sürücünün verdiği bir tamsayı) tutar. Sürücü, hangi process'in hangi nesneye kaç referansı olduğunu reference counting ile izler. Nesne hiç referansı kalmayınca serbest bırakılır. Çağıran taraf, sahibi process çökerse haberdar olmak için bir <strong>death notification</strong> (link-to-death) kaydedebilir — dağıtık sistemlerde "karşı taraf öldü" durumunu ele almanın temel yoludur.</p>
<div class="deflist">
<div><dt>handle</dt><dd>Bir process'in uzak binder nesnesine yerel referansı (tamsayı). Process'e özgüdür; aynı nesne iki process'te farklı handle'lara sahip olabilir (file descriptor gibi).</dd></div>
<div><dt>strong / weak ref</dt><dd>Strong reference nesneyi canlı tutar; weak reference tutmaz ama nesne hâlâ yaşıyor mu diye sorar. Sürücü ikisini de sayar.</dd></div>
<div><dt>death notification</dt><dd>Sahibi process ölünce kaydedilen callback tetiklenir. Örn. bir servis çökerse, ona bağlı uygulamalar bunu öğrenir.</dd></div>
</div>

<h3>4. Thread pool</h3>
<p>Her process, gelen transaction'ları işlemek için bir <strong>binder thread pool</strong> açar (varsayılan üst sınır genelde 15 thread). Gelen bir çağrı bu havuzdaki boş bir thread'de çalışır; böylece bir servis aynı anda birden çok istemciye hizmet verebilir ve uzun süren bir çağrı diğerlerini bloklamaz. İç içe çağrılarda (A → B → A) sürücü, yanıtı mümkünse aynı thread'e yönlendirerek gereksiz thread tüketimini önler.</p>

<h3>5. Service Manager (context manager, handle 0)</h3>
<p>Servisler isimle bir yere kaydolmalı ki istemciler onları bulabilsin. Bu yer <strong>Service Manager</strong>'dır ve Binder dünyasında özel bir yeri vardır: o, context manager'dır ve her zaman <code>handle 0</code> ile erişilir. Bu, bootstrap problemini çözer — bir istemci henüz hiçbir handle'ı yokken bile handle 0'a mesaj yollayıp "bana com.ornek.servis'in handle'ını ver" diyebilir.</p>
<div class="manpage src-aosp"><div class="ref">binder · context manager</div><p class="orig">Each binder context has its own device node and its own context (service) manager.</p><p>Her binder context'inin kendi device node'u ve kendi context (service) manager'ı vardır. Framework ve vendor süreçleri bu yüzden ayrı binder aygıtları (<code>/dev/binder</code>, <code>/dev/vndbinder</code>, <code>/dev/hwbinder</code>) kullanır — izolasyon ve güvenlik için.</p></div>

<h3>6. Güvenlik: caller identity</h3>
<p>Binder'ın en güçlü güvenlik özelliği şudur: her transaction'a gönderenin <strong>UID ve PID</strong>'sini <em>kernel</em> ekler, çağıran taraf değil. Bu yüzden bir servis, <code>getCallingUid()</code> / <code>getCallingPid()</code> ile isteği kimin yaptığını güvenilir biçimde öğrenir; istemci bu bilgiyi taklit edemez (spoofing imkansız), çünkü onu uygulama değil sürücü koyar. Android'in izin modeli ve çoğu yetki kontrolü bu garantinin üstüne kuruludur. (Ofansif tarafta <em>confused deputy</em> saldırıları tam da bu caller identity'nin yanlış kullanıldığı yerleri hedefler — bkz. sandbox kaçışı modülü.)</p>`
  },
