    html: `<p class="lead">Bionic yalnızca "küçük bir libc" değildir: Android'in C library'si, math library'si ve dynamic linker'ı tek bir bütün olarak buradadır. Bir uygulamanın doğumundan (linker'ın .so'ları yüklemesi) ölümüne (crash'in tombstone'a dönüşmesi) kadar her aşama Bionic'ten geçer. Bu bölüm AOSP belgelerine dayanır.</p>

<h3>1. Bionic tam olarak nedir?</h3>
<p>Bionic üç parçayı tek repoda birleştirir: standart C library (<code>libc.so</code>), math library (<code>libm.so</code>) ve dynamic linker (<code>linker64</code>). glibc'de bu işler ayrı projelerdir; Android hepsini birlikte, mobil için optimize ederek yazdı.</p>
<div class="manpage src-aosp"><div class="ref">bionic · readme</div><p class="orig">bionic is Android's C library, math library, and dynamic linker.</p><p>Yani linker ayrı bir araç değil, Bionic'in bir parçasıdır. Bu bütünlük, Android'in libc + linker davranışını tek elden kontrol etmesini sağlar (güvenlik sertleştirmeleri, namespace izolasyonu, property erişimi gibi Android'e özgü eklentiler buraya girer).</p></div>

<h3>2. Dynamic linker: linker64 ve namespace'ler</h3>
<p>Bir uygulama başladığında ilk çalışan Bionic değil, <code>linker64</code>'tür: bağımlı <code>.so</code> kütüphanelerini (ELF'in <code>DT_NEEDED</code> girdileri) bulur, belleğe yükler, sembolleri çözer (symbol resolution) ve sonra uygulamanın <code>main</code>'ine geçer. glibc'nin <code>ld.so</code>'suyla uyumlu değildir; glibc binary'leri bu yüzden Android'de doğrudan çalışmaz.</p>
<div class="manpage src-aosp"><div class="ref">bionic · dynamic linker</div><p class="orig">It's responsible for loading the ELF executable into memory and resolving references to symbols.</p><p>Linker, çalıştırılabilir dosyayı ve bağımlı kütüphaneleri belleğe eşler, sonra sembol referanslarını gerçek adreslere bağlar. Android'in ayırt edici parçası ise <strong>linker namespace</strong>'leridir: system, vendor ve uygulama kütüphaneleri ayrı namespace'lerde tutulur, böylece bir uygulama sistem iç kütüphanelerine (private libraries) doğrudan link olamaz — bu hem kararlılık hem güvenlik sınırıdır.</p></div>
<div class="deflist">
<div><dt>DT_NEEDED</dt><dd>ELF'in dynamic section'ındaki "bu binary şu .so'lara ihtiyaç duyar" girdileri; linker bunları takip ederek bağımlılık ağacını yükler.</dd></div>
<div><dt>symbol resolution</dt><dd>Bir fonksiyon/değişken adının hangi kütüphanedeki hangi adrese karşılık geldiğinin bulunması. Lazy (ilk çağrıda) veya immediate olabilir.</dd></div>
<div><dt>linker namespace</dt><dd>Kütüphanelerin görünürlük sınırı. Uygulamalar yalnızca public NDK kütüphanelerini görür; sistem private library'leri ayrı namespace'tedir.</dd></div>
</div>

<h3>3. Allocator: jemalloc'tan Scudo'ya</h3>
<p>Bionic'in <code>malloc</code>/<code>free</code> uygulaması zamanla değişti: önce <strong>jemalloc</strong>, sonra güvenlik için <strong>Scudo</strong> varsayılan oldu. Scudo bir <em>hardened allocator</em>'dır: heap metadata'sını ve chunk yerleşimini, yaygın bellek güvenliği ihlallerini sömürmeyi zorlaştıracak şekilde tasarlar.</p>
<div class="manpage src-aosp"><div class="ref">scudo · security</div><p class="orig">designed to be resilient against heap-related vulnerabilities</p><p>Scudo; heap overflow, use-after-free ve double-free gibi hatalara karşı dirençli olacak şekilde tasarlanmıştır. Bu hataları tamamen önlemez ama sömürülmelerini pahalı/güvenilmez kılar — yani bir bug'ı doğrudan exploit'e çevirmeyi zorlaştırır. (Ofansif izlekteki UAF modülüyle doğrudan ilişkilidir.)</p></div>

<h3>4. Native crash: debuggerd ve tombstone</h3>
<p>Bir native süreç <code>SIGSEGV</code>/<code>SIGABRT</code> gibi ölümcül bir signal aldığında, Bionic'in kurduğu handler devreye girer ve çökmeyi <strong>debuggerd</strong>'ye devreder. Çöken süreci kendi içinden ayıklamak güvenilmez olduğu için kanıt toplama ayrı bir süreçte yapılır; sonuç bir <strong>tombstone</strong> dosyasıdır.</p>
<div class="manpage src-aosp"><div class="ref">debuggerd · tombstone</div><p class="orig">The register dump shows the content of the CPU registers at the time the signal was received.</p><p>Tombstone, çökme anının fotoğrafıdır: signal numarası ve fault address, tüm CPU register'ları, çöken thread'in backtrace'i ve bellek haritası. Geliştirici bu dosyayla çökmeyi tam olarak hangi fonksiyonun hangi satırında olduğuna, yani kök nedene bağlar.</p></div>
<div class="manpage src-aosp"><div class="ref">debuggerd · tombstone</div><p class="orig">The tombstone contains the same information as the crash dump, plus a few extras.</p><p>Tombstone, logcat'e düşen kısa crash dump'ın genişletilmiş halidir — daha fazla bağlam (bellek içerikleri, tüm thread'ler, açık dosyalar) içerir ve <code>/data/tombstones/</code> altında saklanır.</p></div>

<h3>5. Android'e özgü sertleştirmeler</h3>
<p>Bionic, glibc'de olmayan bellek/kaynak güvenliği araçları taşır. Bunlar üretimde düşük maliyetle çalışıp hataları erkenden yakalamayı hedefler.</p>
<div class="deflist">
<div><dt>fdsan</dt><dd>File descriptor sahipliğini izler; bir fd yanlış sahibi tarafından kapatılırsa (double-close / use-after-close) süreci anında durdurur.</dd></div>
<div><dt>GWP-ASan</dt><dd>Düşük örnekleme oranıyla çalışan hafif bir sampling allocator; heap overflow ve use-after-free'yi üretimde, az maliyetle yakalamaya çalışır.</dd></div>
<div><dt>MTE (destekli cihazlarda)</dt><dd>ARM Memory Tagging ile her allocation'a bir tag verilir; yanlış tag'li erişim donanımca yakalanır. Bionic bunu allocator düzeyinde kullanır.</dd></div>
</div>`
