  deepDive: {
    heading: "Derinlemesine: güçten system_server'a",
    html: `<p class="lead">Bir Android cihazının açılışı, güç düğmesinden ana ekrana kadar birbirine güvenen bir dizi aşamadır: her aşama bir sonrakini doğrular ve başlatır. Bu zincirin omurgası Boot ROM → bootloader → kernel → init'tir; init de Android'e özgü .rc dili, property service ve zygote ile sistemi ayağa kaldırır.</p>

<h3>1. Boot ROM ve bootloader</h3>
<p>İlk kod, SoC'nin içine kalıcı olarak gömülü, değiştirilemez Boot ROM'dur; o da vendor'a ait bootloader'ı yükler. Bootloader donanıma özgüdür ve kernel'i çalıştırmadan önce bütünlüğü doğrulamakla yükümlüdür — Verified Boot'un ilk halkası burada başlar.</p>
<div class="manpage src-aosp"><div class="ref">aosp · bootloader</div><p class="orig">A bootloader is a vendor-proprietary image responsible for bringing up the kernel on a device.</p><p>Bootloader vendor'a aittir, mainline AOSP'nin parçası değildir; bu yüzden her SoC üreticisinin kendi bootloader'ı olur. Görevi kernel'i belleğe getirip ona kontrolü devretmektir.</p></div>
<div class="manpage src-aosp"><div class="ref">aosp · verified boot</div><p class="orig">The bootloader also verifies the integrity of the boot and recovery partitions before moving execution to the kernel.</p><p>Her aşama bir sonrakini imzayla doğrular (chain of trust). boot, dtbo, init_boot ve recovery partition'ları kontrol edilir; A/B kullanılıyorsa aktif slot seçilir. Doğrulama başarısızsa cihaz uyarı verir veya açılmaz.</p></div>
<p>Bootloader kilitli (locked) durumda yalnızca imzalı image'ları çalıştırır; <code>fastboot flashing unlock</code> ile açmak kullanıcı verisini siler ve güven durumunu düşürür. Bu, rooting ve custom ROM'un giriş kapısıdır (Modül 19).</p>

<h3>2. Kernel ve initramfs</h3>
<p>Bootloader kernel'i yükler. Kernel sıkıştırılmış, kendini açan bir binary'dir; ramdisk'ler + bootconfig ise initramfs'i oluşturur.</p>
<div class="manpage src-aosp"><div class="ref">aosp · kernel load</div><p class="orig">Load the kernel into memory as a self-executable compressed binary.</p><p>Kernel belleğe sıkıştırılmış olarak yüklenir ve kendini açar. initramfs, kök dosya sistemi mount edilmeden önceki erken userspace ortamını sağlar — asıl partition'ları bağlayacak araçlar buradadır.</p></div>
<p>Kernel command line dört kaynaktan birleşir: bootloader parametreleri, device tree'nin <code>chosen/bootargs</code> düğümü, defconfig'in <code>CONFIG_CMDLINE</code>'ı ve <code>boot.img</code> komut satırı. Android 12'den itibaren <code>androidboot.*</code> parametreleri bootconfig ile taşınabilir.</p>

<h3>3. init: first stage ve second stage</h3>
<p>Kernel, kullanıcı alanındaki ilk process olan init'i PID 1 olarak çalıştırır. init iki aşamada koşar:</p>
<div class="deflist">
<div><dt>first stage init</dt><dd>Ramdisk içinde çalışır; temel dosya sistemlerini (/dev, /proc, /sys) mount eder, SELinux politikasını yükler ve ikinci aşamaya geçiş için asıl system/vendor partition'larını hazırlar.</dd></div>
<div><dt>SELinux yükleme</dt><dd>Politika henüz bellekte değilken bir an için permissive olunur; politika yüklenip <code>setcon</code> ile init kendi domain'ine geçtikten sonra enforcing moda geçilir.</dd></div>
<div><dt>second stage init</dt><dd>Asıl init; <code>/system/etc/init</code> ve <code>/vendor/etc/init</code> altındaki <code>.rc</code> dosyalarını ayrıştırır ve servisleri başlatır.</dd></div>
</div>

<h3>4. .rc dili: action, trigger, service</h3>
<p>init'in davranışı <code>.rc</code> dosyalarıyla tanımlanır. Bu, Android'e özgü basit bir deklaratif dildir; iki temel yapısı vardır: belirli bir trigger'da çalışan command dizileri (action) ve arka planda yönetilen process'ler (service).</p>
<div class="deflist">
<div><dt>on early-init</dt><dd>En erken action grubu; SELinux ve temel kernel ayarları için.</dd></div>
<div><dt>on init</dt><dd>Dosya sistemi ve dizinlerin kurulması; property tabanlı trigger'lardan önce.</dd></div>
<div><dt>on boot / on property:...</dt><dd>Donanım hazır olunca veya bir property belirli bir değere gelince tetiklenen action'lar.</dd></div>
<div><dt>service</dt><dd>Uzun ömürlü bir process tanımı: binary yolu, kullanıcı/grup (UID/GID), SELinux domain, oneshot/restart davranışı. servicemanager, zygote ve surfaceflinger birer service'tir.</dd></div>
</div>
<p>init ayrıca servisleri izler: bir service ölürse <code>restart</code> politikasına göre yeniden başlatır; <code>critical</code> işaretli bir service tekrar tekrar ölerse cihazı recovery'e düşürür.</p>

<h3>5. Property service: sistemin paylaşılan durumu</h3>
<p>Property service, init tarafından yönetilen anahtar-değer deposudur; tüm sistemin paylaştığı küçük bir yapılandırma ve durum alanıdır. Değerler paylaşımlı bellekte tutulur, <code>getprop</code>/<code>setprop</code> ile okunup yazılır ve her yazma SELinux ile denetlenir — hangi process'in hangi property'yi değiştirebileceği politikayla sınırlıdır.</p>
<div class="deflist">
<div><dt>ro.*</dt><dd>Read-only; bir kez (çoğunlukla açılışta) ayarlanır, sonra değişmez. Örn. <code>ro.build.version.sdk</code>.</dd></div>
<div><dt>persist.*</dt><dd>Yeniden başlatmalar arasında kalıcıdır; <code>/data</code> altında saklanır.</dd></div>
<div><dt>sys.* / ctl.*</dt><dd>Çalışma zamanı durumu ve servis kontrolü; <code>ctl.start</code>/<code>ctl.stop</code> ile init'e service başlatma/durdurma komutu verilir.</dd></div>
</div>

<h3>6. Başlatma sırası ve sistemin doğuşu</h3>
<p>second stage init, trigger'lar ilerledikçe temel daemon'ları başlatır: servicemanager (Binder'ın isim sunucusu) önce gelmelidir, çünkü sonraki her şey Binder üzerinden konuşur. Ardından zygote başlar (Modül 4) ve zygote system_server'ı fork eder — ActivityManager, PackageManager gibi onlarca sistem servisi system_server içinde yaşar. system_server hazır olunca launcher başlatılır ve kullanıcı ana ekranı görür. Bu zincirin tamamı, bootloader'da başlayan Verified Boot güvenine dayanır: güven kökünden (hardware root of trust) ana ekrana kadar her halka bir öncekini doğrular.</p>
<p>AOSP kaynağı init için <a href="https://cs.android.com/android/platform/superproject/main/+/main:system/core/init/README.md" target="_blank" rel="noopener">system/core/init/README.md</a>, bootloader için <a href="https://source.android.com/docs/core/architecture/bootloader" target="_blank" rel="noopener">source.android.com/docs/core/architecture/bootloader</a> altındadır.</p>`
  },
