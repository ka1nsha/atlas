  deepDive: {
    heading: 'Derinlemesine: anahtarlar nerede, veri nasıl korunur?',
    html: `<p class="lead">Android'in şifreleme güvenliği tek bir ilkeye dayanır: hassas sır (anahtar, parola doğrulaması) normal dünyadan — yani Android'in, uygulamaların ve hatta çekirdeğin görebildiği yerden — uzak tutulur. Bu bölüm Keystore, Gatekeeper ve file-based encryption'ın bu ilkeyi nasıl uyguladığını AOSP belgelerine dayanarak açar.</p>

<h3>1. Hardware-backed Keystore: anahtarı kullan ama görme</h3>
<p>Keystore, uygulamaların kriptografik anahtarlar üretip kullanmasını sağlar; ama asıl numara, anahtarın uygulamanın (hatta Android'in) eline hiç geçmemesidir. Anahtar, TEE veya StrongBox içinde üretilir ve orada kalır. Uygulamaya verilen şey bir <strong>keyblob</strong>'tur: anahtarın yalnızca o güvenli donanımın çözebileceği şifreli bir sarmalı.</p>
<div class="manpage src-aosp"><div class="ref">keystore · key blobs</div><p class="orig">encrypted so Keystore can store them but not use or reveal them.</p><p>Yani Keystore keyblob'u saklar ama içindeki ham anahtarı ne kullanabilir ne de açığa çıkarabilir. Gerçek kriptografik işlem (imzalama, şifreleme) için keyblob güvenli donanıma gönderilir; iş orada yapılır, sonuç geri döner. Uygulama "bununla imzala" der, anahtarı asla görmez.</p></div>
<div class="manpage src-aosp"><div class="ref">keystore · trusted boundary</div><p class="orig">HAL implementations don't perform any sensitive operations in user space, or even in kernel space.</p><p>Hassas işlemler user space'te — hatta kernel space'te — yapılmaz; tamamı güvenli dünyaya devredilir. Bu, Android çekirdeği tamamen ele geçirilse bile saldırganın ham anahtarları çıkaramaması demektir: güven sınırı çekirdeğin de üstündedir.</p></div>
<h4>Key attestation</h4>
<p>Bir anahtarın gerçekten güvenli donanımda üretildiğini uzaktan kanıtlamak gerekir (örn. banka uygulaması). Key attestation bunu yapar:</p>
<div class="manpage src-aosp"><div class="ref">keystore · attestation</div><p class="orig">provides public key certificates that contain a detailed description of the key</p><p>Donanım, anahtarı ve özelliklerini (nerede üretildi, dışa çıkarılabilir mi, hangi koşullarda kullanılabilir) tanımlayan, üretici köküne zincirlenmiş bir sertifika verir. Sunucu bu zinciri doğrulayınca anahtarın StrongBox/TEE'de olduğundan emin olur. StrongBox ise ayrı bir güvenlik yongasıdır: AOSP onu "device-unique attestation in StrongBox" olarak ayrı bir yetenek sayar.</p></div>

<h3>2. Gatekeeper: parolayı doğrula, kaba kuvveti yavaşlat</h3>
<p>Parola/PIN doğrulaması Android'de olsaydı, cihazı ele geçiren biri belleği okuyup sınırsız deneme yapabilirdi. Bunun yerine Gatekeeper, doğrulamayı güvenli dünyada (TEE) yapar ve iki şeyi garanti eder: (1) ham parola doğrulayıcısı güvenli dünyadan çıkmaz; (2) yanlış denemelere <strong>throttling</strong> (artan gecikme) uygular. Birkaç yanlış denemeden sonra her deneme saniyelerce — sonra dakikalarca — bekletilir, böylece 6 haneli bir PIN bile kaba kuvvetle pratikte kırılamaz. Deneme sayacının kendisi, saldırganın sıfırlayamaması için güvenli donanımda (bazı cihazlarda ayrı Weaver yongasında) tutulur.</p>

<h3>3. File-based encryption (FBE): tek anahtar değil, çok anahtar</h3>
<p>Eski tam disk şifrelemesi (full-disk encryption) tüm /data'yı tek anahtarla şifreliyordu; bu, "her şey ya kilitli ya açık" demekti ve Direct Boot gibi özellikleri imkânsız kılıyordu. FBE farklıdır:</p>
<div class="manpage src-aosp"><div class="ref">fbe · per-file keys</div><p class="orig">File-based encryption allows different files to be encrypted with different keys that can be unlocked independently.</p><p>Farklı dosyalar farklı anahtarlarla şifrelenir ve bu anahtarlar birbirinden bağımsız açılabilir. Böylece cihaz, bazı verileri (telefon, alarm) kilit açılmadan kullanılabilir tutarken en hassas verileri parolaya kilitli tutabilir.</p></div>
<h4>İki şifreleme sınıfı: CE vs DE</h4>
<div class="deflist">
<div><dt>Credential Encrypted (CE)</dt><dd>Varsayılan konum. Yalnızca kullanıcı cihazı en az bir kez kilit açtıktan sonra erişilebilir — en hassas veri buradadır (mesajlar, fotoğraflar, uygulama verisi).</dd></div>
<div><dt>Device Encrypted (DE)</dt><dd>Direct Boot sırasında, kullanıcı kilit açmadan önce erişilebilir. Alarm, erişilebilirlik hizmetleri, gelen çağrı gibi temel işlevler buraya yazar.</dd></div>
</div>
<div class="manpage src-aosp"><div class="ref">fbe · credential encrypted</div><p class="orig">Credential Encrypted (CE) storage, which is the default storage location and only available after the user has unlocked the device.</p><p>CE deposu varsayılandır ve ancak kullanıcı kilidi açtıktan sonra erişilir olur. Bu yüzden telefonu yeniden başlattığında ilk kilit açışından önce bazı uygulamalar "veriniz henüz hazır değil" davranışı gösterir: CE anahtarları henüz türetilmemiştir. İlk kilit açış, CE sınıf anahtarını parolaya bağlar.</p></div>

<h3>4. Metadata encryption: boşluğu kapatmak</h3>
<p>FBE dosya içeriklerini ve adlarını şifreler, ama dizin yapısı, dosya boyutları, varlık/yokluk gibi metadata'nın bir kısmı kilit açılmadan görünür olabilir. Metadata encryption bu boşluğu kapatır:</p>
<div class="manpage src-aosp"><div class="ref">fbe · metadata encryption</div><p class="orig">these directories aren't truly unencrypted but rather are protected by the metadata encryption key</p><p>Görünüşte "şifresiz" olan bu dizinler aslında ayrı bir metadata encryption key ile korunur; bu anahtar donanım köküne bağlıdır ve açılışta kullanılabilir. Böylece disk fiziksel olarak sökülse bile dosya sistemi yapısı okunamaz. FBE (içerik, kullanıcıya bağlı) + metadata encryption (yapı, cihaza bağlı) birlikte tam kapsama verir.</p></div>

<h3>5. Zincirin özü: bildiğin + sahip olduğun</h3>
<p>Tüm sistem tek bir denklemde toplanır: şifre çözme anahtarı, <strong>kullanıcının bildiği</strong> (parola/PIN) ile <strong>cihazın sahip olduğu</strong> (donanım kök anahtarı, dışa çıkarılamaz) birleşiminden türetilir. İkisinden biri eksikse anahtar üretilemez — ne parolasız başka bir cihazda, ne de doğru cihazda parolasız. Modern Android'de bu türetme "synthetic password" denen bir ara katmanla yapılır: parola doğrudan anahtarı açmaz, önce Gatekeeper token'ına, o da donanım köküyle gerçek anahtara bağlanır; böylece kullanıcı parolasını değiştirdiğinde tüm dosyaların yeniden şifrelenmesi gerekmez. TrustZone modülündeki iki-dünya sınırı, burada tüm veri gizliliğinin dayandığı temeldir.</p>`
