  deepDive: {
    heading: "Derinlemesine: DEX neden kompakt ve register-based?",
    html: `<p class="lead">DEX, Java'nın .class dosyalarının yerini alan, mobil için tasarlanmış kompakt bir bytecode formatıdır. Önce Dalvik için doğdu, bugün ART tarafından çalıştırılır. Tasarımın iki büyük fikri var: tüm sınıfların paylaştığı tek bir tablo havuzu (küçük dosya) ve stack-based değil register-based bir virtual machine (hızlı yorumlama).</p>

<h3>1. DEX dosya yapısı ve paylaşılan tablolar</h3>
<p>Bir .dex dosyası tek bir header ile başlar, ardından türe göre gruplanmış kimlik tabloları (id lists) gelir: <code>string_ids</code>, <code>type_ids</code>, <code>proto_ids</code>, <code>field_ids</code>, <code>method_ids</code>, <code>class_defs</code> ve asıl gövdenin durduğu <code>data</code>. JVM'de her .class dosyası kendi constant pool'unu taşır; DEX ise tüm sınıfların string, type ve method referanslarını TEK bir havuzda toplar. Aynı string yüzlerce sınıfta geçse bile yalnızca bir kez saklanır — bu yüzden DEX, aynı kodun .jar halinden belirgin biçimde küçüktür.</p>
<div class="deflist">
<div><dt>header</dt><dd>magic, checksum (adler32), her tablonun boyutu ve offset'i; dosya bütünlüğü ve navigasyon için.</dd></div>
<div><dt>string_ids</dt><dd>Tüm string'lerin paylaşılan havuzu — sınıf adları, metot adları, sabitler. Tekilleştirilmiş (deduplicated).</dd></div>
<div><dt>type_ids / method_ids</dt><dd>Tip ve method referansları; dosyada tanımlı olsun olmasın, atıf yapılan her şey burada indekslenir.</dd></div>
<div><dt>class_defs</dt><dd>Sınıf tanımları; kod gövdeleri (code_item) data bölümündeki offset'lere işaret eder.</dd></div>
<div><dt>map_list</dt><dd>Dosyanın tüm içeriğinin sıralı haritası; her item offset'e göre sıralı ve çakışmaz.</dd></div>
</div>
<div class="manpage src-aosp"><div class="ref">dex-format · container</div><p class="orig">This allows dex files to share data, such as strings, between them.</p><p>DEX'in tasarım amacı yerden tasarruf: ortak veriler (özellikle string'ler) tek bir yerde paylaşılır, her sınıf kendi kopyasını taşımaz. Yeni container format (version 41) birden çok mantıksal DEX'i tek fiziksel dosyada birleştirip bu paylaşımı dosyalar arasına da taşır.</p></div>

<h3>2. Register-based virtual machine vs stack-based JVM</h3>
<p>JVM stack-based'tir: işlemler bir operand stack üzerinde push/pop ile yürür (<code>iload</code>, <code>iadd</code>, <code>istore</code>). Dalvik/ART ise register-based'tir: her method'a oluşturulurken sabit sayıda sanal register (v0, v1, …) ayrılır ve instruction'lar doğrudan register'lar üzerinde çalışır (<code>add-int v0, v1, v2</code>). Sonuç: aynı iş daha az instruction ile yapılır — ara değerleri stack'e taşıyıp geri alma trafiği yoktur. Bu, instruction başına yorumlayıcı döngüsünü azaltır, mobil CPU'da avantajdır.</p>
<div class="manpage src-aosp"><div class="ref">dalvik-bytecode · model</div><p class="orig">The machine is register-based, and frames are fixed in size upon creation.</p><p>Makine register-based'tir ve her çağrı çerçevesi (frame) oluşturulurken boyutu sabitlenir — method'un kaç register kullanacağı derleme anında bellidir, çalışırken büyümez. 64-bit değerler bitişik register çiftlerinde (vN, vN+1) tutulur; instance method'lar ilk argüman olarak <code>this</code> alır.</p></div>

<h3>3. .class → .dex: d8 ve desugaring</h3>
<p>Derleme zinciri şöyledir: <code>javac</code>/<code>kotlinc</code> önce .class (JVM bytecode) üretir, sonra <strong>d8</strong> (eski adıyla dx) bunları tek bir classes.dex'e çevirir. d8 ayrıca <strong>desugaring</strong> yapar: yeni dil özelliklerini (lambda, interface default method, try-with-resources) eski Android sürümlerinde de çalışacak bytecode'a indirger. <strong>R8</strong> ise d8'in üstüne shrink + optimize + obfuscate ekler (ProGuard'ın yerini aldı): kullanılmayan kodu atar, metot adlarını kısaltır.</p>

<h3>4. 64K method reference limiti ve multidex</h3>
<p>Her method reference, instruction'larda 16-bit bir index ile adreslenir. Bu yüzden tek bir DEX en fazla 65.536 (64K) method reference tutabilir. Kritik ayrıntı: sınır, uygulamanın TANIMLADIĞI method sayısı değil, REFERANS ettiği (kendi kodu + tüm kütüphaneler) method sayısıdır — bu yüzden büyük bağımlılık ağaçları hızla sınıra dayanır. Çözüm multidex (classes.dex, classes2.dex, …) veya ART'ın birden çok DEX'i birleştirmesidir.</p>
<div class="manpage src-aosp"><div class="ref">dex-format · method_ids</div><p class="orig">These are identifiers for all methods referred to by this file, whether defined in the file or not.</p><p>method_ids tablosu, dosyada tanımlı olsun olmasın atıf yapılan TÜM method'ları indeksler. 64K sınırı tam da bu tablonun büyüklüğüdür; bir kütüphaneyi çağırmak bile o kütüphanenin method'larını bu tabloya ekler.</p></div>

<h3>5. Bytecode formatı</h3>
<p>Instruction stream 16-bit birimlerden oluşur; literal veriler instruction akışının içine gömülüdür. Argümanlar <strong>dest-then-source</strong> sırasıyla yazılır — yani hedef register önce gelir (<code>move v0, v1</code>: v1'den v0'a). Bu düzen, register-based tasarımın okunmasını ve yorumlanmasını düzenli kılar.</p>
<div class="manpage src-aosp"><div class="ref">dalvik-bytecode · format</div><p class="orig">The storage unit in the instruction stream is a 16-bit unsigned quantity.</p><p>Instruction stream'in depolama birimi 16-bit'lik bir değerdir; instruction'lar bu birimlerin katları halinde kodlanır. Argüman sırası dest-then-source'tur, bu da register makinesinin tutarlı bir biçimde çözümlenmesini sağlar.</p></div>`
