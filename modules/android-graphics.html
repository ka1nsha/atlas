  deepDive: {
    heading: "Derinlemesine: dokunmadan piksele",
    html: `<p class="lead">Ekrana dokunup bir tepki görene kadar iki ayrı pipeline çalışır: giriş olayını içeri taşıyan <strong>input pipeline</strong> ve kareyi ekrana basan <strong>graphics pipeline</strong>. İkisini VSYNC aynı ritme sokar. Bu bölüm her iki hattın bileşenlerini ve aralarındaki BufferQueue mekanizmasını ayrıntılandırır.</p>

<h3>1. Input pipeline: dokunmanın yolu</h3>
<p>Bir dokunma önce kernel'de bir input event olur: dokunmatik denetleyici kesme üretir, driver olayı <code>/dev/input/*</code> üzerinden evdev protokolüyle sunar. Native katmanda <strong>EventHub</strong> tüm input device'ları <code>epoll</code> ile dinler, ham olayları <strong>InputReader</strong>'a verir; InputReader bunları işler (koordinat dönüşümü, gesture) ve <strong>InputDispatcher</strong>'a aktarır. InputDispatcher doğru pencereyi (focused window) bulup olayı o uygulamanın main thread'indeki input channel'ına (bir socket çifti) yollar. Uygulama olayı event loop'unda (Looper) alır.</p>
<div class="deflist">
<div><dt>evdev</dt><dd>Kernel input subsystem; dokunma donanımını <code>/dev/input/*</code> olaylarına çevirir.</dd></div>
<div><dt>EventHub</dt><dd>Tüm input device'ları açar ve epoll ile dinler; ham olay akışının native giriş noktası.</dd></div>
<div><dt>InputReader</dt><dd>Ham olayları işler: koordinat eşleme, pointer/gesture durumu, batching.</dd></div>
<div><dt>InputDispatcher</dt><dd>Olayı focused window'a bir input channel üzerinden iletir; ANR için dispatch zaman aşımını izler.</dd></div>
</div>
<p>Olaylar tek tek değil, VSYNC ile hizalı biçimde <strong>batch</strong> edilir: InputReader olayları biriktirir, Choreographer frame başına bir kez teslim eder. Bu, dokunma örnekleme hızı (ör. 120&nbsp;Hz) ile ekran yenileme hızını uyumlar ve gereksiz uyandırmayı önler.</p>

<h3>2. BufferQueue: tüm grafiğin tutkalı</h3>
<p>Graphics pipeline'ın merkezinde <strong>BufferQueue</strong> vardır: bir producer'ın ürettiği grafik buffer'larını bir consumer'a aktaran, buffer havuzu + kuyruk yapısı. Uygulama (producer) çizer, SurfaceFlinger (consumer) ekranda birleştirir. Buffer'lar kopyalanmaz; sahiplik (ownership) taraflar arasında devreder — producer <code>dequeue</code> → çiz → <code>queue</code>, consumer <code>acquire</code> → kullan → <code>release</code>.</p>
<div class="manpage src-aosp"><div class="ref">graphics · bufferqueue</div><p class="orig">BufferQueue is a data structure that combines a buffer pool with a queue. BufferQueues provide the glue between the Android graphics components.</p><p>BufferQueue, buffer havuzu ile bir kuyruğu birleştiren veri yapısıdır ve Android grafik bileşenleri arasındaki tutkaldır. Üretici ile tüketiciyi gevşek bağlar: ikisi farklı hızlarda çalışabilir.</p></div>
<div class="manpage src-aosp"><div class="ref">graphics · producer / consumer</div><p class="orig">BufferQueue connects something that generates buffers of graphical data (the producer) ... something that accepts the data for display or further processing (the consumer).</p><p>Producer grafik buffer üretir (uygulamanın çizimi), consumer onu tüketir (genellikle SurfaceFlinger). Bir surface bir buffer queue üretir; bu kuyruk çoğunlukla SurfaceFlinger tarafından tüketilir.</p></div>

<h3>3. Surface ve Gralloc</h3>
<p>Bir <strong>Surface</strong>, ekrana composite edilecek bir bellek bloğunu temsil eder; platformdaki her pencere bir surface ile desteklenir. Surface'in buffer'ları için fiziksel bellek <strong>Gralloc</strong> (graphics memory allocator) tarafından ayrılır — bu bellek çoğu zaman GPU ve display controller'ın birlikte erişebileceği özel bir bölgeden gelir (ör. DMA-BUF), böylece kopyasız (zero-copy) paylaşım mümkün olur.</p>
<div class="manpage src-aosp"><div class="ref">graphics · surface &amp; gralloc</div><p class="orig">A surface represents a block of memory that gets composited to the screen. The graphics memory allocator (Gralloc) is needed to allocate memory requested by image producers.</p><p>Surface, ekrana composite edilen bir bellek bloğudur; her pencere bir surface ile desteklenir. Gralloc, image producer'ların istediği grafik belleğini ayırır — paylaşımlı ve donanıma uygun biçimde.</p></div>

<h3>4. SurfaceFlinger ve Hardware Composer</h3>
<p>Ekranın içeriğini değiştirebilen tek servis <strong>SurfaceFlinger</strong>'dır. Birden çok kaynaktan (uygulama pencereleri, status bar, navigation bar) gelen buffer'ları alır, <strong>compositing</strong> ile tek bir kareye birleştirir ve display'e gönderir. Bu birleştirmeyi GPU ile yapabilir; ama daha verimli yol <strong>Hardware Composer (HWC)</strong> HAL'idir: display donanımı bazı katmanları <strong>overlay</strong> olarak doğrudan birleştirebiliyorsa, SurfaceFlinger işi HWC'ye devreder ve GPU boşa harcanmaz (daha az güç, daha az ısı).</p>
<div class="manpage src-aosp"><div class="ref">graphics · surfaceflinger</div><p class="orig">SurfaceFlinger accepts buffers of data from multiple sources, composites them, and sends them to the display.</p><p>SurfaceFlinger birden çok kaynaktan buffer alır, bunları composite eder ve display'e yollar. Uygulama kendi penceresini çizer; pencereleri tek karede birleştiren SurfaceFlinger'dır.</p></div>
<div class="manpage src-aosp"><div class="ref">graphics · hardware composer</div><p class="orig">The Hardware Composer HAL (HWC) determines the most efficient way to composite buffers with the available hardware.</p><p>HWC, mevcut donanımla buffer'ları birleştirmenin en verimli yolunu belirler. Katmanları donanım overlay olarak birleştirebiliyorsa GPU devreye hiç girmez.</p></div>

<h3>5. VSYNC, Choreographer ve buffering</h3>
<p>Display sabit bir hızda yenilenir (60/90/120&nbsp;Hz). <strong>VSYNC</strong> sinyali bu yenileme anını işaretler; <strong>Choreographer</strong> uygulamanın çizimini, input teslimini ve SurfaceFlinger'ın compositing'ini bu sinyale hizalar. Böylece yarım çizilmiş kare ekrana düşmez (tearing önlenir). <strong>Double buffering</strong>: biri gösterilirken diğerine çizilir. <strong>Triple buffering</strong>: GPU bir kareyi geç bitirirse boşa kalan frame'i doldurmak için üçüncü bir buffer devreye girer — jank azalır ama bir frame'lik latency ekler.</p>
<div class="deflist">
<div><dt>VSYNC</dt><dd>Display'in yenileme anını işaretleyen sinyal; tüm grafik ritmi buna bağlanır.</dd></div>
<div><dt>Choreographer</dt><dd>Frame callback'lerini VSYNC'e hizalar (input, animasyon, çizim aynı frame'de).</dd></div>
<div><dt>double buffering</dt><dd>İki buffer: biri gösterimde, diğeri çizimde; tearing'i önler.</dd></div>
<div><dt>triple buffering</dt><dd>Üçüncü buffer GPU gecikmesini tolere eder; jank düşer, latency artar.</dd></div>
</div>
<p>İki pipeline burada buluşur: dokunma (input) ile ona verilen görsel tepki (graphics) arasındaki toplam gecikmeye <strong>touch latency</strong> denir ve VSYNC hizalaması, batching ve buffer sayısı bu gecikmeyi doğrudan belirler.</p>`
