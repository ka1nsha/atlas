    heading: "Derinlemesine: HAL ve Treble nasıl çalışır?",
    html: `<p class="lead">HAL, Android framework'ü ile donanım sürücüleri arasına standart bir arayüz koyar; Treble bu arayüzü bir process sınırına taşıyarak system ve vendor kodunu birbirinden ayırır. Bu ayrım, Android güncellemelerinin neden vendor kodunu değiştirmeden gelebildiğinin anahtarıdır.</p>

<h3>1. HAL nedir?</h3>
<p>Her SoC ve telefon üreticisinin donanımı farklıdır. Framework'ün her kamera veya sensör için ayrı kod taşıması mümkün değil; bunun yerine framework standart bir arayüz tanımlar, vendor o arayüzü kendi donanımına göre doldurur. İşte bu arayüz katmanı HAL'dir.</p>
<div class="manpage src-aosp"><div class="ref">hal · definition</div><p class="orig">A hardware abstraction layer (HAL) is type of abstraction layer with a standard interface for hardware vendors to implement.</p><p>Framework HAL arayüzünü sabit tutar; vendor arkasındaki gerçek sürücüyü istediği gibi yazar. Framework donanımın ne olduğunu değil, hangi arayüzü konuştuğunu bilir.</p></div>

<h3>2. Pre-Treble vs Treble (binderized HAL)</h3>
<p>Treble öncesinde (Android 7 ve öncesi) HAL'ler framework process'inin içinde yüklenen <code>.so</code> paylaşımlı kütüphanelerdi: framework ile vendor kodu aynı process'te, aynı bellekte çalışırdı. Bu, her OS güncellemesinde vendor kodunun da yeniden derlenmesini gerektiriyordu — güncellemelerin yıllarca gecikmesinin baş nedeni. Treble (Android 8) ile HAL'ler ayrı bir vendor process'ine taşındı ve framework onlarla Binder üzerinden konuşur hale geldi.</p>
<div class="manpage src-aosp"><div class="ref">hal · binderized</div><p class="orig">A HAL that communicates with other processes using binder inter-process communication (IPC) calls.</p><p>Binderized HAL ayrı bir process'te çalışır; framework ona Binder ile mesaj yollar. Böylece framework (system) ve HAL (vendor) birbirinden bağımsız derlenip güncellenebilir — Project Treble'ın özü budur.</p></div>
<div class="deflist">
<div><dt>pre-Treble</dt><dd>HAL = framework process'i içinde yüklenen <code>.so</code>; system ve vendor aynı process, aynı derleme. OS güncellemesi vendor kodunu da bağlar.</dd></div>
<div><dt>Treble (binderized)</dt><dd>HAL = ayrı vendor process; framework Binder ile konuşur. system ve vendor ayrı derlenir, ayrı güncellenir.</dd></div>
</div>

<h3>3. HIDL'den AIDL'ye: arayüz tanım dilleri</h3>
<p>Treble HAL arayüzlerini tarif etmek için önce HIDL (HAL Interface Definition Language) kullanıldı. Android 13'ten itibaren HIDL deprecate edildi; yeni HAL'ler framework'ün zaten kullandığı AIDL ile yazılıyor. Böylece framework ve HAL tek bir interface dili (AIDL) altında birleşti; ayrı bir HAL dili taşıma yükü kalktı.</p>
<div class="manpage src-aosp"><div class="ref">hal · aidl</div><p class="orig">Instead of HIDL, you should use Android Interface Definition Language (AIDL) for HALs.</p><p>AIDL hem uygulama-içi IPC hem HAL arayüzleri için ortak dildir; stub (server) ve proxy (client) kodunu otomatik üretir, versiyonlamayı yönetir.</p></div>
<div class="deflist">
<div><dt>HIDL</dt><dd>Treble'ın ilk HAL dili (Android 8–12). Kendi <code>.hal</code> dosyaları, hwservicemanager ile servis kaydı. Android 13'te deprecate.</dd></div>
<div><dt>AIDL for HALs</dt><dd>Yeni standart. Framework ile aynı dil; stable AIDL ile versiyonlanır, servismanager üzerinden yayınlanır.</dd></div>
</div>

<h3>4. hwservicemanager ve system/vendor ayrımı</h3>
<p>HIDL HAL'leri <code>hwservicemanager</code> adlı ayrı bir service manager üzerinden bulunurken (normal servisler servicemanager kullanır), AIDL HAL'leri doğrudan servicemanager'a taşındı. Fiziksel ayrım bölümlerde de görünür: framework <code>/system</code>'de, vendor kodu (HAL'ler, sürücüler, firmware) <code>/vendor</code> bölümündedir. Bu ayrım sayesinde Google bir Android sürümü yayınladığında, telefon üreticisi yalnızca <code>/system</code>'i güncelleyip <code>/vendor</code>'a dokunmayabilir.</p>

<h3>5. VINTF ve uyumluluk (compatibility)</h3>
<p>system ve vendor ayrı ayrı güncellenebiliyorsa, ikisinin birbiriyle uyumlu olduğundan emin olmak gerekir. Bunu VINTF (Vendor Interface) halleder: her taraf hangi HAL arayüzlerini sunduğunu/beklediğini bir manifest ve compatibility matrix ile bildirir; sistem açılışta ve OTA sırasında bunları karşılaştırır, uyumsuzsa güncelleme/başlatma durur.</p>
<div class="manpage src-aosp"><div class="ref">vintf · object</div><p class="orig">A VINTF object gathers some of the information it needs directly from the device.</p><p>VINTF, cihazdaki vendor manifest'i ve framework compatibility matrix'i çalışma anında toplayıp eşleştirir.</p></div>
<div class="manpage src-aosp"><div class="ref">vintf · ota</div><p class="orig">must be reconciled at OTA time to ensure a device can get framework updates.</p><p>Bir OTA güncellemesi uygulanmadan önce framework ile vendor arayüzlerinin uyumu doğrulanır; uyumsuzsa cihaz o güncellemeyi alamaz. GSI (Generic System Image) testleri de bu uyumu doğrulamak için saf bir AOSP system imajını vendor üzerinde çalıştırır.</p></div>`
