    html: `<p class="lead">Android'in loglama sistemi masaüstü Linux'un syslog'undan tamamen farklıdır: merkezde logd daemon'ı ve bir dizi circular buffer vardır. Bir log satırı, üretildiği andan logcat'te görünene kadar liblog, bir socket ve bir ring buffer'dan geçer.</p>

<h3>1. logd ve circular buffer'lar</h3>
<p>Loglar diske değil, bellekte tutulan sabit boyutlu circular buffer'lara yazılır ve bu buffer'ları logd adlı sistem process'i yönetir. Buffer dolunca en eski satırlar düşer (eviction) — yani log geçmişi sınırlıdır, kalıcı değildir. Loglar kategoriye göre ayrı buffer'lara gider.</p>
<div class="manpage src-docs"><div class="ref">logcat · buffers</div><p class="orig">The Android logging system is a set of structured circular buffers maintained by the system process logd.</p><p>Sistemin kalbi logd'dir; her buffer yapısal (structured) ve dairesel (circular) bir kuyruktur ve diske değil belleğe yazar. Bu yüzden logcat anlık bir pencere gösterir, tam bir tarih değil.</p></div>
<div class="deflist">
<div><dt>main</dt><dd>Uygulama logları (Log.d/i/w/e). Varsayılan buffer.</dd></div>
<div><dt>system</dt><dd>Android OS / framework mesajları.</dd></div>
<div><dt>crash</dt><dd>Çökme (crash) logları — ayrı tutulur ki kaybolmasın.</dd></div>
<div><dt>radio</dt><dd>Telefon/radyo (RIL) mesajları.</dd></div>
<div><dt>events</dt><dd>İkili sistem olayları (binary event); event.logtags ile çözülür.</dd></div>
</div>
<div class="manpage src-docs"><div class="ref">logcat · -b</div><p class="orig">To see additional log messages, run the logcat command with the -b option to request viewing of an alternate circular buffer.</p><p>logcat varsayılan olarak main, system ve crash'i birlikte gösterir; radio veya events gibi diğer buffer'ları görmek için <code>logcat -b radio</code> şeklinde -b ile seçersin.</p></div>

<h3>2. liblog ve yazma yolu</h3>
<p>Bir uygulama <code>Log.d()</code> çağırdığında, çağrı liblog üzerinden bir socket ile logd'ye iletilir ve log satırı ilgili buffer'a eklenir. Native kod <code>__android_log_print</code>, Java tarafı <code>android.util.Log</code> kullanır — ikisi de aynı liblog'a iner, yani format ve buffer seçimi tek yerden yönetilir.</p>
<div class="manpage src-aosp"><div class="ref">logging · liblog</div><p class="orig">Android uses the liblog library for general system logging.</p><p>Tüm log üreticileri (Java framework, native kod, kernel köprüsü) tek bir ortak kütüphaneden, liblog'dan geçer. Bu, Android'i bir dosyaya append eden klasik syslog'dan ayıran temel tasarım kararıdır.</p></div>

<h3>3. Priority ve tag ile filtreleme</h3>
<p>Her log satırının bir priority seviyesi ve bir tag'i vardır. Priority sıralaması düşükten yükseğe: V (Verbose), D (Debug), I (Info), W (Warn), E (Error), F (Fatal). logcat'te <code>ActivityManager:I *:S</code> gibi tag:priority filtreleriyle gürültüyü kısarsın — buradaki <code>*:S</code> "diğer her şeyi sustur (Silent)" demektir.</p>
<div class="deflist">
<div><dt>V / D</dt><dd>Verbose / Debug — geliştirme sırasında; release build'de genelde kapalı.</dd></div>
<div><dt>I</dt><dd>Info — normal çalışma bilgisi.</dd></div>
<div><dt>W / E</dt><dd>Warn / Error — beklenmeyen ama kurtarılabilir / gerçek hata.</dd></div>
<div><dt>F</dt><dd>Fatal — ölümcül; genelde bir çökme (crash) eşlik eder.</dd></div>
</div>

<h3>4. statsd ve metrikler</h3>
<p>Log satırları insan okuması içindir; sistem geneli ölçümler için <strong>statsd</strong> kullanılır. statsd, atom adı verilen yapısal olayları toplar — pushed atom olay olduğu anda gönderilir, pulled atom'u ise statsd periyodik olarak çeker. Bir config'e göre bunları birleştirir ve metrik üretir; pil, performans ve kullanım telemetrisi bunun üstüne kuruludur. Ham log'un aksine statsd verisi yapısaldır ve toplu analiz için uygundur.</p>

<h3>5. Sistem izleme: atrace, Perfetto, eBPF</h3>
<p>Tek tek log satırlarının ötesinde, zaman içindeki davranışı görmek için tracing araçları vardır. atrace/ftrace, kernel ve framework olaylarını bir zaman çizelgesine yazar; Perfetto bunları toplayıp görselleştirir (CPU, scheduling, binder transaction'ları, frame kaçakları/jank). Android ayrıca ağ ve I/O sayaçları için eBPF kullanır; ptrace tabanlı araçlar (debuggerd, strace) tek bir process'i yakından izler. Loglama "ne oldu"yu, tracing ise "ne zaman ve ne kadar sürdü"yü yanıtlar.</p>`
