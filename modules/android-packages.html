    heading: "Derinlemesine: APK imzalama ve kurulum güvenliği",
    html: `<p class="lead">Paket yönetiminin kalbinde tek bir soru vardır: bu kodun gerçekten iddia ettiği kişiden geldiğine ve kurulumdan sonra değişmediğine nasıl güveniriz? Yanıt, APK signature scheme'lerinin evrimi ve installd'in en az ayrıcalık (least privilege) ilkesidir. Bu bölüm AOSP belgelerine dayanır.</p>

<h3>1. APK: imzalı bir ZIP arşivi</h3>
<p>Bir <strong>APK</strong> standart bir ZIP arşividir; <code>unzip</code> ile açılır. Özel olan, içeriği ve ona eklenen imzadır. Başlıca entry'ler:</p>
<div class="deflist">
<div><dt>AndroidManifest.xml</dt><dd>Binary XML olarak derlenmiş manifest: package name, istenen permission'lar, component'ler (activity/service/receiver/provider), target SDK.</dd></div>
<div><dt>classes.dex</dt><dd>Derlenmiş DEX bytecode (bkz. DEX modülü). Büyük uygulamalarda classes2.dex, classes3.dex (multidex).</dd></div>
<div><dt>resources.arsc</dt><dd>Derlenmiş kaynak tablosu (string, layout, drawable referansları); <code>res/</code> ham kaynakları tutar.</dd></div>
<div><dt>lib/&lt;abi&gt;/</dt><dd>Mimariye özel native kütüphaneler (örn. <code>arm64-v8a/*.so</code>).</dd></div>
<div><dt>META-INF/ + APK Signing Block</dt><dd>v1 imzası <code>META-INF/</code> içindedir; v2+ imzası ZIP ile central directory arasına eklenen APK Signing Block'ta durur.</dd></div>
</div>

<h3>2. İmza şemaları: v1'den v4'e evrim</h3>
<p>İmza doğrulama (signature verification) Android güvenliğinin temel taşıdır ve dört kuşaktan geçti. Her kuşak bir öncekinin zayıflığını kapatır.</p>
<div class="manpage src-aosp"><div class="ref">APK Signing · v1 (JAR signing)</div><p class="orig">v1 signatures don't protect some parts of the APK, such as ZIP metadata.</p><p>Orijinal şema, imzalı JAR'a dayanır: her entry tek tek hash'lenir. Zayıflığı, ZIP metadata gibi bazı kısımları korumaması ve doğrulama için her entry'nin ayrı ayrı açılıp hash'lenmesidir.</p></div>
<div class="manpage src-aosp"><div class="ref">APK Signing · v1 maliyeti</div><p class="orig">the APK verifier must uncompress all compressed entries, consuming more time and memory.</p><p>v1 doğrulaması pahalıdır çünkü verifier tüm sıkıştırılmış entry'leri açmak zorundadır — hem yavaş hem bellek yoğun.</p></div>
<div class="manpage src-aosp"><div class="ref">APK Signing · v2 (Android 7.0+)</div><p class="orig">The contents of the APK are hashed and signed, then the resulting APK signing block is inserted into the APK.</p><p>v2, tüm dosyayı tek bir blob olarak hash'leyip imzalar ve sonucu APK Signing Block'a koyar. Böylece <strong>whole-file hash</strong> elde edilir; doğrulama çok daha hızlıdır çünkü entry'leri tek tek açmaya gerek kalmaz.</p></div>
<div class="manpage src-aosp"><div class="ref">APK Signing · v3 (Android 9)</div><p class="orig">v2 scheme was updated to v3 in Android 9 to include additional information in the signing block</p><p>v3, v2'nin doğrulama yöntemini korur ama signing block'a ek bilgi ekler — başlıca <strong>key rotation</strong>: bir uygulamanın imza anahtarını, eski anahtarın yenisini onayladığı bir zincirle güvenli şekilde değiştirebilmesi. v4 ise (Android 11) incremental installation için dosyanın tamamı inmeden doğrulamaya izin veren ayrı bir imza üretir.</p></div>
<div class="deflist">
<div><dt>v1 (JAR)</dt><dd>Entry bazlı; ZIP metadata korunmaz; yavaş. Tek başına artık yetersiz.</dd></div>
<div><dt>v2 (Signing Block)</dt><dd>Whole-file hash; hızlı; dosyadaki her değişikliği yakalar.</dd></div>
<div><dt>v3 (key rotation)</dt><dd>v2 + imza anahtarını zincirle değiştirebilme.</dd></div>
<div><dt>v4 (incremental)</dt><dd>Parça parça (streaming) kurulumda doğrulama.</dd></div>
</div>

<h3>3. Bütünlük garantisi: tek bir bayt bile</h3>
<p>v2+ şemasının gücü, korumasının kapsamındadır. İmza bloğu dışındaki herhangi bir değişiklik — kodda, kaynakta, hatta ZIP metadata'sında — imzayı geçersiz kılar.</p>
<div class="manpage src-aosp"><div class="ref">APK Signing · integrity</div><p class="orig">Any modification to the APK, including ZIP metadata modifications, invalidates the APK signature.</p><p>Bu yüzden bir saldırgan imzalı bir APK'yi açıp içine kod ekleyemez: imza tutmaz. Ayrıca v2+ imzası "soyulmuş" (stripped) bir APK de reddedilir — yani eski v1 doğrulamasına düşürme (downgrade) denemesi engellenir.</p></div>

<h3>4. Kurulum akışı ve en az ayrıcalık</h3>
<p>Kurulumun üç aktörü vardır ve ayrıcalık dağılımı bilinçlidir. Kullanıcı-alanındaki <code>PackageInstaller</code> yalnızca onay akışını yürütür. Ayrıcalıklı <strong>PackageManagerService (PMS)</strong> kararı verir: imzayı doğrular, manifest'i ayrıştırır, UID atar, permission'ları kaydeder. Ama PMS dosya sistemine <strong>dokunmaz</strong>; bunu ayrı bir root'a yakın daemon olan <code>installd</code>'e devreder. Bu ayrım, PMS'teki bir hatanın doğrudan dosya sistemi yazmasına dönüşmesini engeller (least privilege).</p>
<div class="deflist">
<div><dt>PackageInstaller</dt><dd>Kullanıcı onayı + install session. En az ayrıcalıklı katman.</dd></div>
<div><dt>PackageManagerService</dt><dd>İmza doğrulama, manifest parse, UID atama, permission kaydı. Karar verici.</dd></div>
<div><dt>installd</dt><dd>Veri dizinlerini doğru UID/izinle oluşturur, dex2oat çalıştırır. Dosyaya dokunan tek bileşen.</dd></div>
</div>

<h3>5. İzinler: install-time vs runtime</h3>
<p>Manifest'teki her <code>uses-permission</code> iki sınıftan birine düşer. <strong>Install-time permission</strong>'lar (normal/signature) kurulumda otomatik verilir; signature permission'lar yalnızca aynı anahtarla imzalı uygulamalara. <strong>Runtime permission</strong>'lar (dangerous — kamera, konum, kişiler) Android 6.0'dan beri çalışma anında kullanıcıya sorulur ve istenildiği an geri alınabilir. Bu, "kurulumda hepsini kabul et" modelinin terk edilmesidir.</p>

<h3>6. Güncelleme güvenliği: key continuity</h3>
<p>Bir güncelleme kurulurken PMS, yeni APK'nin imza sertifikasının mevcut sürümle eşleştiğini kontrol eder (<strong>key continuity</strong>). Eşleşmezse güncelleme reddedilir — böylece başka biri senin <code>com.ornek.app</code>'inin üzerine kötü amaçlı bir sürüm kuramaz. Ayrıca <strong>rollback protection</strong>, bilinen güvenlik açığı olan eski bir sürüme düşürmeyi engeller (v3'te sürüm damgası signing block'tadır).</p>`
  },
