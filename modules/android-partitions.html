  deepDive: {
    heading: "Derinlemesine: bölümler, slot'lar ve modüler güncelleme",
    html: `<p class="lead">Bir Android cihazının depolaması, her biri belirli bir işe sahip partition'lara bölünür. Ama modern Android, bu statik düzeni A/B slot'lar, dynamic partitions ve APEX ile esnek, güvenli güncellenebilir bir sisteme dönüştürdü. Bu bölüm, bir OTA'nın cihazı neden bozmadan güncelleyebildiğini anlatır.</p>

<h3>1. Klasik partition düzeni</h3>
<p>Depolama, her biri ham blok aralığı olan partition'lara ayrılır. Framework bunları isimle görür (by-name). Temel partition'lar ve işleri:</p>
<div class="deflist">
<div><dt>boot</dt><dd>Kernel + ramdisk (generic ramdisk ve vendor_boot modern cihazlarda ayrışır). Cihazın ilk çalışan yazılımının taşıyıcısı.</dd></div>
<div><dt>system / vendor</dt><dd>Android OS ve vendor (SoC/OEM) katmanı. Read-only mount edilir; çalışırken değiştirilemez, bu bütünlüğün temelidir.</dd></div>
<div><dt>userdata</dt><dd>/data — kullanıcının her şeyi. Tek read-write partition; factory reset bunu siler. File-based encryption burada uygulanır.</dd></div>
<div><dt>vbmeta</dt><dd>Verified Boot metadata: diğer partition'ların imza/hash bilgisi. Güven zincirinin kökü buraya bağlanır.</dd></div>
<div><dt>metadata / misc</dt><dd>Şifreleme anahtar sarmalayıcıları, bootloader mesaj alanı (bootloader ile OS arasında küçük durum).</dd></div>
</div>

<h3>2. A/B (seamless) updates</h3>
<p>Eski cihazlar güncellemeyi ayrı bir recovery partition'da, cihaz kapalıyken uygulardı — uzun ve riskliydi. A/B bunu değiştirir: system/vendor/boot gibi kritik partition'lardan iki kopya (slot A ve slot B) tutulur. Biri aktif çalışırken, update_engine güncellemeyi pasif slot'a arka planda yazar. Yeniden başlatmada bootloader aktif slot'u değiştirir; yeni sistem açılmazsa eskisine geri döner (rollback). Kullanıcı neredeyse hiç beklemez.</p>
<div class="manpage src-aosp"><div class="ref">A/B · slots</div><p class="orig">A/B system updates use two sets of partitions referred to as slots (normally slot A and slot B).</p><p>Kritik partition'ların iki kopyası (slot) tutulur; sistem her zaman "current slot"tan çalışır, güncelleme diğerine yazılır.</p></div>
<div class="manpage src-aosp"><div class="ref">A/B · arka plan yazımı</div><p class="orig">update_engine will update the raw blocks on the currently unused partition as it streams the update package.</p><p>Cihaz normal çalışırken update_engine, kullanılmayan slot'un ham bloklarını güncelleme paketini akıtarak yazar — kullanıcı bu sırada cihazı kullanmaya devam eder.</p></div>
<div class="manpage src-aosp"><div class="ref">A/B · rollback</div><p class="orig">The bootloader will fallback to the old OS if the new OS fails to boot, so no work is required from the client.</p><p>Yeni slot açılmazsa bootloader eski slot'a döner; bu yüzden başarısız bir güncelleme cihazı tuğlalaştırmaz (brick). Maliyeti: system/vendor iki kez yer kaplar.</p></div>

<h3>3. Dynamic partitions ve super</h3>
<p>Statik partition düzeninin sorunu: her partition'a, gelecekteki güncellemeler büyüyebilir diye boş alan ayrılması gerekirdi — bu alan israfıydı. Dynamic partitions bunu çözer: fiziksel partition'lar yerine, tek bir büyük super partition içinde userspace'te boyutlandırılan sub-partition'lar (system, vendor, product…) tutulur. OTA sırasında bunlar yeniden boyutlandırılabilir; alan slot'lar arasında paylaşılır.</p>
<div class="manpage src-aosp"><div class="ref">dynamic · tanım</div><p class="orig">Dynamic partitions are a userspace partitioning system for Android.</p><p>Partition tablosu kernel/bootloader yerine userspace'te (dm-linear ile) kurulur; bu, cihazı yeniden flash'lamadan partition oluşturup boyutlandırmayı mümkün kılar.</p></div>
<div class="manpage src-aosp"><div class="ref">dynamic · super</div><p class="orig">Instead, the device allocates a super partition, and sub-partitions can be sized dynamically within it.</p><p>Tek bir super partition içinde sub-partition'lar dinamik boyutlanır. Böylece bir image, gelecekteki büyüme için boş yer rezerve etmek zorunda kalmaz.</p></div>

<h3>4. APEX: modüler sistem bileşenleri</h3>
<p>Tüm bir OTA indirmeden tek bir sistem bileşenini (örn. bir kripto kütüphanesi, bir runtime modülü) güncellemek için APEX vardır (Project Mainline). APEX bir APK gibi paketlenir ve imzalanır ama sistem bileşenleri içindir; açılışta erken, mount edilerek devreye girer. Böylece Google, OEM OTA'sını beklemeden güvenlik düzeltmelerini Play üzerinden dağıtabilir.</p>

<h3>5. Dosya sistemleri ve bütünlük</h3>
<p>Partition'ların üstüne farklı dosya sistemleri oturur, her biri amacına göre seçilir:</p>
<div class="deflist">
<div><dt>ext4</dt><dd>Genel amaçlı, olgun. Uzun süre /system ve /data için varsayılandı.</dd></div>
<div><dt>f2fs</dt><dd>Flash-friendly: NAND flash'ın yazma davranışına göre tasarlanmış. Birçok cihazda /data için tercih edilir.</dd></div>
<div><dt>EROFS</dt><dd>Read-only, sıkıştırmalı. /system gibi değişmeyen partition'larda yer kazandırır; A/B'nin iki-kopya maliyetini hafifletir.</dd></div>
<div><dt>dm-verity</dt><dd>Read-only partition'ları blok blok bir hash tree (Merkle tree) ile doğrular; değiştirilmiş bir blok okunduğunda yakalanır.</dd></div>
<div><dt>dm-linear</dt><dd>Dynamic partition'ların mantıksal sub-partition'larını super partition içindeki fiziksel aralıklara eşler.</dd></div>
</div>
<p>Bu katmanlar birlikte çalışır: bir OTA super içindeki sub-partition'ı pasif slot'a dynamic olarak yazar, dm-verity hash'lerini günceller, vbmeta imzalar — ve bir sonraki açılışta Verified Boot tüm zinciri doğrular (bkz. Bütünlük ve attestation modülü).</p>`
  },
