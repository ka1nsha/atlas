    heading: "Derinlemesine: suspend, wakelock ve Doze",
    html: `<p class="lead">Android'in pil ömrü tek bir agresif fikre dayanır: iş yapılmadığı an bütün sistemi durdur (opportunistic suspend). Wakelock bu kurala konan bir vetodur; Doze ve App Standby ise bu vetoyu kötüye kullanan uygulamaları sistem düzeyinde dizginler. Bu bölüm bu üç mekanizmanın nasıl birlikte çalıştığını AOSP belgelerine dayanarak açar.</p>

<h3>1. Opportunistic suspend: çekirdek gerçeği</h3>
<p>Masaüstü Linux'ta suspend kullanıcının tetiklediği bir olaydır. Android ise <strong>autosleep</strong> (opportunistic suspend) kullanır: çekirdek sürekli "şu an uyuyabilir miyim?" diye kontrol eder ve hiçbir wakelock tutulmuyorsa sistemi otomatik olarak suspend-to-RAM durumuna sokar. Bir wakelock, çekirdeğin <code>/sys/power/wakeup_count</code> üzerinden gördüğü aktif bir wakeup source'tur; sayı sıfırdan büyük olduğu sürece suspend ertelenir. Uygulama tarafındaki <code>PowerManager.WakeLock</code>, bu kernel mekanizmasının üst katmandaki yüzüdür.</p>
<div class="manpage src-aosp"><div class="ref">power · wakelock</div><p class="orig">Resource consumption is associated with the application using the resource.</p><p>AOSP güç çerçevesi, bir wakelock'un pil maliyetini onu tutan uygulamaya fatura eder — bu yüzden <code>dumpsys batterystats</code> hangi uygulamanın sistemi ne kadar uyanık tuttuğunu uid bazında gösterebilir.</p></div>

<h3>2. Wakelock türleri</h3>
<p>Modern Android'de uygulamaların doğrudan kullanması önerilen tek tür <code>PARTIAL_WAKE_LOCK</code>'tur; ekranla ilgili türler deprecated edilmiştir (bunun yerine <code>FLAG_KEEP_SCREEN_ON</code> veya window flag'leri kullanılır).</p>
<div class="deflist">
<div><dt>PARTIAL_WAKE_LOCK</dt><dd>CPU uyanık kalır; ekran ve klavye ışığı kapalı olabilir. Ekran kapalıyken sessizce pil tüketebildiği için en çok suistimal edilen türdür.</dd></div>
<div><dt>SCREEN_DIM / SCREEN_BRIGHT</dt><dd>Ekranı (dim veya tam parlak) açık tutar. <strong>Deprecated</strong> — artık window flag'leri tercih edilir.</dd></div>
<div><dt>FULL_WAKE_LOCK</dt><dd>Ekran + klavye tam açık. <strong>Deprecated</strong>; güç açısından savurgan.</dd></div>
<div><dt>wakeup source</dt><dd>Wakelock'un kernel karşılığı. Mainline Linux'a Android'in katkısıdır: hangi kaynakların sistemi uyanık tuttuğu <code>/sys/kernel/debug/wakeup_sources</code>'ta görünür.</dd></div>
</div>

<h3>3. Doze: derin boşta kısıtlama</h3>
<p>Kullanıcı cihaza bir süre dokunmaz ve ekran kapalı/şarjsızsa sistem Doze'a girer. Doze, tek tek uygulamaları değil tüm cihazı kısıtlar.</p>
<div class="manpage src-docs"><div class="ref">doze · tanım</div><p class="orig">In Doze mode, the system attempts to conserve battery by restricting apps' access to network and CPU-intensive services.</p><p>Doze, cihaz uzun süre hareketsizken ağ ve CPU-yoğun servislere erişimi kısar; wakelock tutsa bile uygulama çoğu zaman çalışamaz.</p></div>
<div class="manpage src-docs"><div class="ref">doze · kısıtlamalar</div><p class="orig">Suspends network access. Ignores wake locks. Doesn't let JobScheduler run.</p><p>Doze derinleştikçe üç şey birden olur: ağ askıya alınır, <strong>wakelock'lar görmezden gelinir</strong> (kötü davranan uygulama bile dizginlenir) ve JobScheduler/WorkManager işleri ertelenir.</p></div>
<div class="manpage src-docs"><div class="ref">doze · maintenance window</div><p class="orig">During this maintenance window, the system runs all pending syncs, jobs, and alarms, and lets apps access the network.</p><p>Doze sürekli değildir: periyodik "maintenance window"larda sistem bekleyen tüm sync/job/alarm'ları toplu çalıştırır ve ağı kısa süre açar. Pencereler arası aralık zamanla uzar, böylece gece boyunca tüketim düşer.</p></div>

<h3>4. App Standby ve standby bucket'ları</h3>
<p>Doze tüm cihaz boştayken devreye girer; App Standby ise cihaz kullanılırken bile <em>tek tek</em> az kullanılan uygulamaları kısıtlar. Sistem her uygulamayı kullanım sıklığına göre bir bucket'a koyar; bucket ne kadar "soğuk"sa job/alarm/ağ o kadar seyrek.</p>
<div class="deflist">
<div><dt>active</dt><dd>Uygulama şu an kullanılıyor. Hiçbir kısıtlama yok.</dd></div>
<div><dt>working set</dt><dd>Sık kullanılıyor. Hafif kısıtlama.</dd></div>
<div><dt>frequent</dt><dd>Düzenli ama her gün değil. Job/alarm'lar daha seyrek.</dd></div>
<div><dt>rare</dt><dd>Nadiren kullanılıyor. Ağ, job ve alarm'lar belirgin biçimde sınırlı.</dd></div>
<div><dt>restricted</dt><dd>Çok fazla kaynak tüketen veya hiç kullanılmayan uygulamalar. En katı kısıtlama.</dd></div>
</div>
<div class="manpage src-docs"><div class="ref">app standby · tanım</div><p class="orig">App Standby lets the system determine that an app is idle when the user isn't actively using it.</p><p>App Standby, kullanıcının aktif kullanmadığı bir uygulamayı "idle" sayar ve onu daha soğuk bir bucket'a indirir; böylece arka plandaki az kullanılan uygulamalar pili yemez.</p></div>

<h3>5. Thermal yönetimi</h3>
<p>Güç yalnızca bir "uyu/uyan" meselesi değildir; cihaz ısındıkça ayrı bir denge devreye girer. Thermal HAL, sıcaklık sensörlerini (skin temperature dahil) okur ve eşikler aşılınca cooling device'ları tetikler: CPU/GPU frekansı düşürülür (thermal throttling), gerekirse çekirdekler kapatılır. Amaç donanımı güvenli sıcaklıkta tutarken performansı olabildiğince korumaktır — bu yüzden yoğun oyunda cihaz bir süre sonra yavaşlar.</p>
<ul>
<li><strong>thermal throttling</strong> — sıcaklık eşiği aşılınca frekansın kademeli düşürülmesi.</li>
<li><strong>cooling device</strong> — çekirdeğin soğutma için kısabileceği bir bileşen (CPU cluster, GPU, modem).</li>
<li><strong>skin temperature</strong> — cihazın dış yüzey sıcaklığı; kullanıcı güvenliği için ayrı bir eşik.</li>
</ul>`
