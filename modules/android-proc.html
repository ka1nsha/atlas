  deepDive: {
    heading: "Derinlemesine: bir uygulamanın gerçek bellek ayak izi",
    html: `<p class="lead">Android bir uygulamayı özel bir şey sanmak kolaydır, ama kernel için o sadece bir Linux process'tir: kendi UID'si vardır, <code>/proc/&lt;pid&gt;</code> altında görünür ve aynı araçlarla incelenir. İşin inceliği bellekte: Zygote'tan gelen paylaşım yüzünden "bu uygulama ne kadar RAM kullanıyor?" sorusunun tek bir doğru cevabı yoktur. PSS tam da bu yüzden icat edilmiştir.</p>

<h3>1. Uygulama = process</h3>
<p>Her uygulama kendi UID'siyle (örn. <code>u0_a234</code>) çalışan bir process'tir; sandbox'ı bu UID kurar. <code>/proc/&lt;pid&gt;/status</code> UID'yi, thread sayısını ve <code>VmRSS</code>'i; <code>/proc/&lt;pid&gt;/maps</code> tüm memory mapping'leri (kod, native kütüphaneler <code>.so</code>, heap, stack) gösterir. Yani bir uygulamayı incelemek için özel Android aracı şart değil — Linux process araçları birebir geçerlidir.</p>

<h3>2. Dört ölçü: VSS, RSS, PSS, USS</h3>
<p>Bellek kullanımı tek sayı değildir çünkü sayfalar paylaşılabilir ve diske yazılı (file-backed) olabilir. Dört ayrı soruya dört ayrı cevap:</p>
<div class="deflist">
<div><dt>VSS</dt><dd>Virtual set size: process'in ayırdığı tüm virtual address space. Çoğu fiziksel belleğe hiç dokunmaz (reserve edilmiş ama kullanılmamış). Neredeyse hiç işe yaramaz, yanıltıcıdır.</dd></div>
<div><dt>RSS</dt><dd>Resident set size: o an RAM'de olan sayfalar — ama shared pages'in TAMAMI bu process'e sayılır. İki uygulama aynı framework'ü paylaşsa bile her ikisinin RSS'i framework'ün tamamını içerir, yani toplam şişer.</dd></div>
<div><dt>PSS</dt><dd>Proportional set size: private sayfalar tam, shared sayfalar paylaşan process sayısına bölünerek sayılır. Framework'ü 10 uygulama paylaşıyorsa, her birine framework'ün 1/10'u yazılır. Tüm process'lerin PSS'i toplanınca gerçek fiziksel kullanıma yaklaşır.</dd></div>
<div><dt>USS</dt><dd>Unique set size: yalnızca bu process'e özel (private) sayfalar. "Bu uygulamayı kapatırsam ne kadar RAM geri gelir?" sorusunun cevabı budur.</dd></div>
</div>
<div class="manpage"><div class="ref">5 proc_pid_smaps</div><p class="orig">Rss: the amount of the mapping that is currently resident in RAM.
Pss: the process's proportional share of this mapping.</p><p>Kernel bu ayrımı <code>/proc/&lt;pid&gt;/smaps</code> dosyasında her mapping için ayrı ayrı verir; <code>Shared_Clean/Dirty</code> ve <code>Private_Clean/Dirty</code> satırları RSS'in paylaşımlı mı özel mi olduğunu söyler.</p></div>

<h3>3. PSS neden Android'de kritik?</h3>
<p>Çünkü Android bellek paylaşımını uç noktaya taşır: her uygulama Zygote'tan fork edilir ve framework kodu/kaynakları copy-on-write ile paylaşılır. RSS'e göre bakarsan her uygulama framework'ün tamamını "kullanıyor" görünür; oysa o RAM tek kez vardır. PSS, bu paylaşımı oransal dağıtarak dürüst bir fiziksel ayak izi (footprint) verir.</p>
<div class="manpage src-docs"><div class="ref">android · memory</div><p class="orig">Android computes a value called the Proportional Set Size (PSS), which accounts for both dirty and clean pages that are shared with other processes—but only in an amount that's proportional to how many apps share that RAM.</p><p>Resmi tanım bunu net söylüyor: PSS, paylaşılan RAM'i kaç uygulamanın paylaştığına oranla sayar. Doküman ayrıca "bu toplam, sistemin senin fiziksel bellek ayak izin olarak gördüğü değerdir" der.</p></div>
<div class="manpage src-docs"><div class="ref">android · zygote</div><p class="orig">This approach allows most of the RAM pages allocated for framework code and resources to be shared across all app processes.</p><p>Yani PSS olmadan toplam bellek yanlış hesaplanır: aynı framework sayfaları onlarca process'te tekrar tekrar sayılırdı.</p></div>

<h3>4. clean vs dirty: neyin geri alınabileceği</h3>
<p>Bir sayfanın <strong>dirty</strong> (değiştirilmiş) mı <strong>clean</strong> (diskten okunan, değişmemiş) mı olduğu, baskı altında ne olacağını belirler. Clean file-backed sayfalar (kod, <code>.so</code>) gerektiğinde RAM'den atılıp sonra diskten tekrar okunabilir — ucuzdur. Dirty sayfalar (heap, değiştirilmiş veri) atılamaz; ancak swap varsa sıkıştırılır/yazılır. Bu yüzden uygulamanın dirty private belleği (USS'in çekirdeği) sistemin üzerindeki asıl yüktür.</p>

<h3>5. smaps_rollup, lmkd ve oom_score_adj</h3>
<p>Her mapping'i tek tek toplamak yerine <code>/proc/&lt;pid&gt;/smaps_rollup</code> tüm process için tek seferde PSS/RSS/USS verir — <code>dumpsys meminfo</code> bunu kullanır. Bellek azaldığında <strong>lmkd</strong> (Low Memory Killer Daemon) devreye girer: her process'in <code>/proc/&lt;pid&gt;/oom_score_adj</code> değerine bakar (foreground uygulama düşük, arka plan/boş process yüksek skor) ve en harcanabilir olanı öldürür. PSS ve oom_score_adj birlikte, Android'in sınırlı RAM'de hangi uygulamayı hayatta tutacağına nasıl karar verdiğini anlatır.</p>`
  },
