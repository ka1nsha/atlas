    html: `<p class="lead">Rooting tek bir işlem değil, bir takaslar zinciridir: her adım bir güç kapısı açarken bir güvenlik garantisini düşürür. Bunu anlamak için önce Android'in tehdit modelini, sonra meşru ve saldırgan yolların nasıl aynı yetkiye farklı bedellerle ulaştığını görmek gerekir. Bu bölüm kavramsaldır; belirli bir cihaza yönelik exploit içermez.</p>

<h3>1. Android security model: katmanlı güven</h3>
<p>Android'in <strong>threat model</strong>'i, farklı aktörlere farklı güven seviyeleri atar. Kritik varsayım şudur: kullanıcı cihazın sahibidir ama <strong>uygulamalara güvenilmez</strong>, ve normal çalışmada hiçbir kullanıcı kodu root (UID 0) olamaz. Rooting tam da bu en dıştaki sınırı kaldırır.</p>
<div class="deflist">
<div><dt>trusted (güvenilir)</dt><dd>Hardware root of trust, bootloader, kernel — açılışta imzayla doğrulanır; tabanı donanımdadır.</dd></div>
<div><dt>partially trusted</dt><dd>System partition, system_server, privileged apps — imzalı ama daha geniş yüzey.</dd></div>
<div><dt>untrusted (güvenilmez)</dt><dd>Kullanıcı uygulamaları — her biri kendi UID sandbox'ında, SELinux domain'inde; root'a erişemez.</dd></div>
</div>
<p>Root yetkisi normalde yalnızca birkaç sistem sürecine aittir. "Rooting", bu yetkiyi untrusted katmana — yani keyfi koda — vermektir. Bu yüzden rooting her şeyden önce bir <strong>tehdit modeli ihlalidir</strong>, bir özellik değil.</p>

<h3>2. OEM unlock: meşru ama bedelli kapı</h3>
<p>Android açık bir ekosistem olduğu için <strong>meşru bir kapı</strong> sunar: cihaz sahibi, Geliştirici Seçenekleri'nde "OEM unlocking"i açıp <code>fastboot flashing unlock</code> ile <strong>bootloader unlock</strong> yapabilir. Bu kasıtlı bir tasarımdır — ama iki ağır bedeli vardır.</p>
<p>Birincisi: kilidi açmak cihazın <strong>tüm kullanıcı verisini siler (wipe)</strong>. Bu bir güvenlik önlemidir — biri çalınan bir telefonun kilidini açıp verine erişemesin diye.</p>
<div class="manpage src-aosp"><div class="ref">AOSP · verified boot · ORANGE</div><p class="orig">The bootloader is unlocked and software integrity cannot be guaranteed. Any data stored on the device might be available to attackers.</p><p>İkincisi: kilit açık kaldığı sürece cihaz <strong>ORANGE</strong> durumuna düşer. Yazılım bütünlüğü (software integrity) artık garanti edilemez; bu durum attestation'da görünür ve gizlenemez.</p></div>
<p>Önemli ayrım: kilidi açmak henüz root <em>vermez</em>; yalnızca cihazı değiştirmeye izin verir. Root ayrı bir adımdır.</p>

<h3>3. Systemless root: /system'e dokunmadan</h3>
<p>Root'u elde etmenin modern yolu <strong>systemless root</strong>'tur (ör. Magisk): değişiklik <code>/system</code> partition'ına değil, <strong>boot image</strong>'a yapılır. Boot imajına küçük bir başlatma kodu eklenir; açılışta bir <code>su</code> daemon kurulur ve bir uygulama root isteyince kullanıcıya izin sorulur.</p>
<p>Neden /system yerine boot? Çünkü <strong>/system dm-verity ile korunur</strong> (Modül 18): her blok bir hash tree ile doğrulanır, oraya yazılan tek bir bayt bile okuma anında yakalanır. Boot imajına yama bu blok-düzeyi denetimi atlar — ama boot imajı da Android Verified Boot (AVB) kapsamındadır, bu yüzden değişiklik yine de bütünlük zincirini kırar. systemless yaklaşım, izi en aza indirip bazı root-gizleme (ör. DenyList) tekniklerini mümkün kılar; ama donanım-destekli attestation'ı tam gizleyemez.</p>

<h3>4. Bütünlük garantisiyle çatışma</h3>
<p>Rooting'in kaçınılmaz sonucu, cihazın "ben kilitli ve bütünüm" diyememesidir. Android Verified Boot, açılışın her aşamasını bir sonraki için doğrulayan bir güven zinciri kurar:</p>
<div class="manpage src-aosp"><div class="ref">AOSP · verified boot</div><p class="orig">It establishes a full chain of trust, starting from a hardware-protected root of trust to the bootloader,</p><p>Zincir donanımdaki bir kökten başlar; her halka bir sonrakini imzayla doğrular. Bootloader unlock veya boot yaması bu zinciri kırar ve durum (GREEN → ORANGE) donanım köküne bağlı olarak imzalanır — yani yalan söylenemez.</p></div>
<p>Bu yüzden <strong>Play Integrity</strong> ve banka/DRM uygulamaları, cihazın bütünlüğünü donanım-destekli kanıttan okuyup root'lu cihazda çalışmayı reddedebilir. Root gücü ile "güvenilir cihaz" rozetini aynı anda tutamazsın; bu kasıtlı bir takastır.</p>
<div class="manpage src-aosp"><div class="ref">AOSP · rollback protection</div><p class="orig">Rollback protection helps to prevent a possible exploit from becoming persistent</p><p>Verified Boot ayrıca <strong>rollback protection</strong> içerir: eski, zafiyetli bir sürüme geri dönüş engellenir — böylece yamalanmış bir açık tekrar açılıp kalıcı hale getirilemez.</p></div>

<h3>5. Meşru root vs zafiyet-tabanlı root</h3>
<p>İki yol aynı yetkiye (root) ulaşır ama taban taban farklıdır:</p>
<div class="deflist">
<div><dt>meşru (OEM unlock)</dt><dd>Görünür ve rızalı. Cihaz sahibi kilidi bilerek açar; veri silinir, attestation ORANGE'a düşer. İzler açıkça bırakılır.</dd></div>
<div><dt>zafiyet-tabanlı</dt><dd>Gizli ve izinsiz. Kilit açılmadan, bir kernel/bootloader vulnerability kötüye kullanılarak root alınır; amaç iz bırakmamak ve attestation'ı atlatmaktır. Asıl tehdit budur.</dd></div>
</div>
<p>Bu, Android ile iOS'un felsefe farkını da açıklar: Android <em>meşru</em> bir kilit açma kapısı sunar (açık ekosistem; bedeli attestation düşüşü), iOS sunmaz — bu yüzden oradaki her root bir jailbreak, yani bir zafiyet zinciridir (Ofansif Modül 9). Savunmacı için ders: root tespiti donanım-destekli attestation'a dayanmalı; <code>su</code> ikilisini aramak gibi kaba sinyaller kolayca atlatılır.</p>`
