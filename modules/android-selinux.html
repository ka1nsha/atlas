  deepDive: {
    heading: "Derinlemesine: iki katmanlı sandbox",
    html: `<p class="lead">Android'in güvenlik modeli tek bir duvara değil, üst üste binen katmanlara dayanır. Bir uygulama bir kaynağa erişmek istediğinde önce <strong>DAC</strong> (klasik UID izinleri), sonra <strong>MAC</strong> (SELinux) ve gerektiğinde <strong>seccomp</strong> filtresinden geçer. Üçü de AND ile çalışır: herhangi biri "hayır" derse erişim reddedilir. Bu, defense in depth ilkesidir.</p>

<h3>1. DAC: her uygulama kendi UID'sinde</h3>
<p>Android'in en temel sandbox'ı aslında standart Linux izinleridir. Kurulumda her uygulamaya benzersiz bir UID atanır ve uygulama kendi process'inde, kendi UID'siyle çalışır. Bir uygulama başka bir uygulamanın <code>/data/data</code> dizinini okuyamaz, çünkü file ownership ve permission bits buna izin vermez — bu DAC (Discretionary Access Control).</p>
<div class="manpage src-aosp"><div class="ref">app sandbox · uid</div><p class="orig">Android assigns a unique user ID (UID) to each Android app and runs it in its own process.</p><p>Her uygulama ayrı bir UID ve ayrı bir process alır; böylece iki uygulama varsayılan olarak birbirinin belleğine veya özel dosyalarına erişemez.</p></div>
<div class="manpage src-aosp"><div class="ref">app sandbox · kernel</div><p class="orig">The kernel enforces security between apps and the system at the process level.</p><p>Sandbox bir kütüphane kuralı değil, kernel'de zorlanır — yani uygulama kodu ne yaparsa yapsın bu sınırı aşamaz.</p></div>
<p>UID'ler sabit aralıklara (AID ranges) bölünmüştür:</p>
<div class="deflist">
<div><dt>system (1000)</dt><dd>system_server ve ayrıcalıklı sistem bileşenleri.</dd></div>
<div><dt>radio (1001)</dt><dd>Telefon / RIL yığını.</dd></div>
<div><dt>app (10000+)</dt><dd>Normal uygulamalar; her biri 10000'den başlayan benzersiz bir UID alır.</dd></div>
<div><dt>isolated (99000+)</dt><dd>isolatedProcess servisleri — neredeyse hiçbir yetkisi olmayan aşırı kısıtlı UID'ler (ör. tarayıcı render process'i).</dd></div>
</div>
<p>Tarihsel bir not: <code>sharedUserId</code> ile iki uygulamanın aynı UID'yi paylaşması mümkündü, ama bu sandbox'ı zayıflattığı için kullanımdan kaldırıldı (deprecated).</p>

<h3>2. MAC: SELinux type enforcement</h3>
<p>DAC güçlüdür ama bir zaafı vardır: kaynağın sahibi izinleri gevşetebilir ve root (UID 0) çoğu DAC kontrolünü aşar. SELinux bu boşluğu kapatır: root bile olsan, policy'nin izin vermediği şeyi yapamazsın. Buna MAC (Mandatory Access Control) denir.</p>
<div class="manpage src-aosp"><div class="ref">selinux · mac</div><p class="orig">Android uses Security-Enhanced Linux (SELinux) to enforce mandatory access control (MAC) over all processes.</p><p>SELinux tüm process'lerin ne yapabileceğini merkezi bir policy ile belirler; sistem bileşenleri ve root bile bu kuralların dışına çıkamaz.</p></div>
<p>SELinux'un çalışma birimi <strong>type enforcement</strong>'tır. Her karar dört parçadan oluşur:</p>
<div class="deflist">
<div><dt>domain</dt><dd>Eylemi yapan process'in tipi (subject), ör. <code>untrusted_app</code>.</dd></div>
<div><dt>type</dt><dd>Erişilen nesnenin tipi (object), ör. <code>app_data_file</code>.</dd></div>
<div><dt>class</dt><dd>Nesnenin türü, ör. <code>file</code>, <code>dir</code>, <code>socket</code>.</dd></div>
<div><dt>permission</dt><dd>İstenen eylem, ör. <code>read</code>, <code>write</code>, <code>open</code>.</dd></div>
</div>
<p>Policy yalnızca açıkça izin verilen (domain, type, class, permission) dörtlülerine izin verir; geri kalan her şey reddedilir.</p>
<div class="manpage src-aosp"><div class="ref">selinux · default deny</div><p class="orig">SELinux operates on the principle of default denial: Anything not explicitly allowed is denied.</p><p>Varsayılan reddet (default deny): bir kural açıkça "allow" demiyorsa eylem reddedilir. Bu yüzden yeni bir özellik eklemek çoğu zaman yeni SELinux kuralları yazmayı gerektirir.</p></div>
<p><code>neverallow</code> kuralları bunun tersidir: derleme zamanında belirli izinlerin ASLA verilemeyeceğini garanti eder — güvenlik invariant'larını korur. Çalışma anında engellenen her erişim <code>avc: denied</code> olarak loglanır; bu loglar hem hata ayıklamanın hem de saldırı tespitinin temelidir.</p>
<div class="manpage src-aosp"><div class="ref">selinux · permissive</div><p class="orig">Permissive mode, in which permission denials are logged but not enforced.</p><p>İki mod vardır: <strong>enforcing</strong> (ihlal reddedilir) ve <strong>permissive</strong> (ihlal yalnızca loglanır, engellenmez). Geliştirme sırasında permissive kullanılıp loglardan eksik kurallar bulunur; üretimde her zaman enforcing'dir.</p></div>

<h3>3. seccomp: syscall allowlist</h3>
<p>Üçüncü katman seccomp-BPF'tir. Zygote her uygulamaya bir syscall allowlist uygular: uygulama yalnızca Android'in beklediği system call'ları çağırabilir. Listede olmayan bir çağrı denenirse process öldürülür (SIGSYS). Bu, kernel attack surface'ini daraltır — bir uygulama, istismar etmeye çalışacağı egzotik syscall'lara zaten erişemez.</p>

<h3>4. Katmanlar birlikte: hepsi "evet" demeli</h3>
<p>Bir uygulama bir dosyayı açmak istediğinde karar zinciri şudur: önce DAC (UID ve permission bits uygun mu?), sonra MAC (SELinux policy domain→type erişimine izin veriyor mu?), sonra seccomp (kullanılan syscall allowlist'te mi?). <strong>Üçü de izin vermek zorundadır.</strong> Bir saldırgan birini aşsa bile diğerleri ayakta kalır. Bu yüzden Android'de bir privilege escalation genellikle tek bir bug değil, birden çok katmanı aşan bir zincir gerektirir.</p>`

      '<div class="tbl-wrap"><table class="bugs"><thead><tr><th>Katman</th><th>Kontrol</th><th>Örnek</th></tr></thead><tbody>' +
