    heading: "Derinlemesine: system_server ve servis mimarisi",
    html: `<p class="lead">Android'de "sistem" dediğimiz şeyin büyük kısmı tek bir process'te yaşar: system_server. Onlarca system service aynı process içinde ayrı thread'ler olarak çalışır; uygulamalar bu servislere doğrudan değil, Service Manager üzerinden bulup Binder ile ulaşır. Bu tasarım, hem izolasyonu hem de merkezi yönetimi aynı anda sağlar.</p>

<h3>1. system_server: tek process, onlarca servis</h3>
<p>Zygote açılışta özel bir çocuk olarak system_server'ı fork eder. Bu process, Android framework'ünün kalbidir: uygulamaların kullandığı neredeyse tüm system service'ler burada birer thread olarak koşar. Böylece servisler belleği ve ART runtime'ını paylaşır, aralarındaki çağrılar ucuzdur. Bedeli ise kırılganlıktır: system_server çökerse, ona bağlı tüm UI ve servisler düşer ve sistem (çekirdeği yeniden başlatmadan) "soft reboot" yaşar.</p>
<div class="manpage src-aosp"><div class="ref">android · architecture</div><p class="orig">System services are modular, focused components such as system_server, SurfaceFlinger, and MediaService.</p><p>system service'ler ayrı ayrı, odaklı bileşenlerdir. Hepsi system_server içinde değildir — SurfaceFlinger ve MediaService gibi bazıları ayrı native process'lerde koşar; ama ActivityManager, PackageManager gibi framework servisleri system_server'da toplanır.</p></div>
<div class="deflist">
<div><dt>ActivityManagerService</dt><dd>Activity/task yaşam döngüsü, process önceliği (oom_score_adj), uygulama başlatma. Kısaca AMS.</dd></div>
<div><dt>PackageManagerService</dt><dd>Kurulu paketler, izinler, imza doğrulama, bileşen çözümleme. Kısaca PMS.</dd></div>
<div><dt>WindowManagerService</dt><dd>Pencereler, z-order, girdi yönlendirme, SurfaceFlinger ile koordinasyon. Kısaca WMS.</dd></div>
<div><dt>PowerManagerService</dt><dd>Wakelock'lar, ekran durumu, suspend/resume kararları.</dd></div>
</div>

<h3>2. Service Manager: isimden handle'a</h3>
<p>Bir servisin bulunabilmesi için önce kaydolması gerekir. Service Manager, bu kayıt defterini tutan özel bir süreçtir ve Binder dünyasında bilinen <code>handle 0</code> numarasına sahiptir — yani bir istemci henüz hiçbir handle'ı yokken bile ona ulaşabilir (bootstrap problemi çözülür). Servis <code>addService(name, binder)</code> ile kaydolur; istemci <code>getService(name)</code> ile ismi bir Binder handle'ına çözer. Veri Service Manager üzerinden akmaz; o yalnızca isim → handle eşlemesini verir, sonra istemci doğrudan servisle konuşur.</p>
<p>Kritik güvenlik noktası: <code>addService</code> yalnızca ayrıcalıklı (system UID) süreçlere açıktır. Rastgele bir uygulama kendini "activity" adıyla kaydedip araya giremez; bu service spoofing engeli, Binder'ın taşıdığı güvenilir caller UID sayesinde kernel düzeyinde zorlanır.</p>

<h3>3. getSystemService çağrı deseni</h3>
<p>Bir uygulama <code>getSystemService(ACTIVITY_SERVICE)</code> çağırdığında, elindeki şey aslında AMS'in uzaktaki nesnesini temsil eden bir binder proxy'dir (BinderProxy). Proxy üzerindeki her metot çağrısı bir Binder transaction'ına dönüşür: argümanlar Parcel'a yazılır, <code>ioctl(BINDER_WRITE_READ)</code> ile system_server'a gider, oradaki servis thread'i metodu çalıştırır ve yanıt geri döner. Uygulama, çağrının başka bir process'te çalıştığını çoğu zaman hiç fark etmez — bu şeffaflık (location transparency) framework'ün temel tasarımıdır.</p>
<div class="manpage src-aosp"><div class="ref">android · architecture</div><p class="orig">Functionality exposed by Android framework API communicates with system services to access the underlying hardware.</p><p>Framework API'sinin sunduğu işlevsellik, altta yatan donanıma erişmek için system service'lerle konuşur. Yani uygulama → framework API → (Binder) → system service → HAL → sürücü zinciri her sistem işleminin arkasındadır.</p></div>

<h3>4. Binder thread pool ve servis yaşam döngüsü</h3>
<p>system_server, gelen transaction'ları işlemek için bir binder thread pool tutar (varsayılan üst sınır genelde 16 thread). Yüksek yük altında birden çok istemci farklı servislere paralel çağrı yapabilir. Ama aynı process'te olduklarından, bir servisteki uzun süren veya kilitlenen bir çağrı diğer servisleri de etkileyebilir — bu yüzden framework kodunda Binder thread'inde uzun iş yapmaktan kaçınılır. "Watchdog" mekanizması system_server bir süre yanıt vermezse onu bilerek öldürür, çünkü donmuş bir system_server kullanılamaz bir cihaz demektir; öldürülünce yeniden başlar ve sistem toparlanır.</p>`
  },
