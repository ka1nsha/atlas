    heading: "Derinlemesine: tek CPU, iki dünya",
    html: `<p class="lead">Android'in en hassas sırları — disk şifreleme anahtarları, parmak izi şablonları, ödeme anahtarları — normal işletim sisteminin hiç göremeyeceği bir yerde tutulur. Bunu mümkün kılan, ARM TrustZone'un tek bir fiziksel CPU'yu iki ayrı yürütme ortamına (normal world ve secure world) bölmesidir. Çekirdek tamamen ele geçirilse bile, saldırgan secure world'deki ham anahtarlara dokunamaz.</p>

<h3>1. Normal world ve secure world</h3>
<p>TrustZone, bir donanım özelliğidir: CPU her an ya normal world'de ya da secure world'dedir ve bunu bir donanım biti (NS — Non-Secure bit) belirler. İki dünyanın ayrı belleği, ayrı cache etiketleri ve ayrı peripheral erişim izinleri vardır. Normal world'de koca Android yığını (Linux kernel + framework + uygulamalar) çalışır; secure world'de ise küçük, güvenilir bir TEE OS çalışır. Donanım, normal world'ün secure world belleğini okumasını fiziksel olarak engeller — bu bir yazılım kuralı değil, silikon seviyesinde bir sınırdır.</p>
<div class="deflist">
<div><dt>normal world</dt><dd>Android'in tamamı burada: Linux kernel (EL1), uygulamalar (EL0). Büyük saldırı yüzeyi, düşük güven.</dd></div>
<div><dt>secure world</dt><dd>TEE OS ve trusted application'lar. Küçük kod tabanı, yüksek güven; sırların tutulduğu yer.</dd></div>
<div><dt>secure monitor</dt><dd>EL3'te çalışır; iki dünya arasındaki tek geçiş kapısıdır, context'i kaydedip değiştirir.</dd></div>
</div>
<div class="manpage src-aosp"><div class="ref">trusty · overview</div><p class="orig">On ARM systems, Trusty uses ARM's TrustZone to virtualize the main processor and create a secure TEE.</p><p>ARM'de secure world ayrı bir yonga değildir — aynı ana işlemci, TrustZone ile sanallaştırılıp ikiye bölünür. Böylece pahalı bir ikinci CPU olmadan donanım izolasyonu sağlanır.</p></div>

<h3>2. Dünyalar arası geçiş: SMC ve secure monitor</h3>
<p>Normal world bir güvenli işleme ihtiyaç duyduğunda (örneğin "şu veriyi anahtarla imzala"), doğrudan secure world'e atlayamaz. Bunun yerine bir <code>SMC</code> (Secure Monitor Call) komutu çalıştırır. Bu komut CPU'yu EL3'teki secure monitor'a sokar; monitor normal world'ün register/context'ini kaydeder, secure world'e geçer ve ilgili trusted application'ı çağırır. İş bitince kontrol aynı yoldan normal world'e döner. Bu geçiş, iki işletim sistemi arasındaki tek köprüdür ve her adımı donanım tarafından denetlenir — kavramsal olarak Linux'taki syscall sınırının bir benzeri, ama iki ayrı OS arasında.</p>

<h3>3. TEE OS ve trusted application'lar</h3>
<p>Secure world'de çalışan küçük işletim sistemine TEE OS denir. Üreticiye göre değişir: Qualcomm'da QSEE, Google Pixel'de Trusty, Samsung'da TEEGRIS. Üstünde çalışan güvenli uygulamalara trusted application (TA) denir — anahtar yönetimi, parmak izi eşleştirme, DRM gibi işler burada yapılır. TA'lar birbirinden de izole çalışır; biri çökerse diğerleri etkilenmez.</p>
<div class="manpage src-aosp"><div class="ref">trusty · isolation</div><p class="orig">At run time, Trusty apps run as isolated processes in unprivileged mode under the Trusty kernel.</p><p>TA'lar secure world içinde bile ayrıcalıksız (unprivileged) ve izole process'ler olarak koşar. Yani bir TA'nın ele geçirilmesi, otomatik olarak tüm secure world'ün ele geçirilmesi anlamına gelmez.</p></div>
<div class="manpage src-aosp"><div class="ref">trusty · third-party</div><p class="orig">Third-party app development isn't supported in Trusty.</p><p>Secure world'e üçüncü taraf uygulama kabul edilmez; saldırı yüzeyini küçük tutmak için yalnızca üreticinin imzaladığı TA'lar yüklenir.</p></div>

<h3>4. Ham anahtar normal world'e asla çıkmaz</h3>
<p>Modelin özü şudur: normal world bir anahtarı doğrudan görmez; yalnızca secure world'den bir tanıtıcı (key handle / key blob) ve işlemin sonucunu alır. Örneğin Keystore bir anahtar üretildiğinde, anahtar secure world'de kalır ve dışarıya şifreli bir blob olarak verilir. "Bu veriyi imzala" isteği secure world'e gider, imza geri döner — ham anahtar bitleri hiçbir zaman Linux belleğine düşmez.</p>
<div class="manpage src-aosp"><div class="ref">trusty · delegation</div><p class="orig">Software running on the main processor delegates any operations that require use of secret data to the TEE processor.</p><p>Sır gerektiren her işlem secure world'e devredilir (delegation). Normal world yalnızca "yap" der ve sonucu alır; sırrın kendisini hiç tutmaz.</p></div>

<h3>5. Hardware root of trust ve ayrı güvenlik yonggaları</h3>
<p>TrustZone yazılımsal izolasyonun donanıma dayanmasını sağlar, ama güvenin bir başlangıç noktası olmalı: hardware root of trust. Bu genelde yonga içine kalıcı olarak yazılmış (fused) bir anahtardır ve boot zincirinin ilk halkasını imzalar (Verified Boot buna dayanır). Bazı cihazlar bir adım daha ileri gider: TrustZone'dan da ayrı, fiziksel olarak bağımsız bir güvenlik yongası kullanır — Google'ın Titan M'i, Qualcomm'un SPU'su gibi. Ana CPU tamamen ele geçirilse bile bu ayrı silikon kendi sırlarını korur; StrongBox Keymaster bu ayrı yonga üstünde çalışır.</p>
<div class="deflist">
<div><dt>TEE (TrustZone)</dt><dd>Ana CPU içinde secure world. Keymaster/Gatekeeper burada; hızlı ama ana işlemciyle aynı silikonda.</dd></div>
<div><dt>StrongBox</dt><dd>Ayrı, sertifikalı güvenlik yongası (Titan M, SPU). Fiziksel saldırılara karşı daha dayanıklı.</dd></div>
<div><dt>root of trust</dt><dd>Yongaya kalıcı yazılmış anahtar; tüm güven zincirinin başladığı değiştirilemez nokta.</dd></div>
</div>
<p>Bu katmanlar birlikte, parmak izi doğrulamanın, kilit ekranı parolasının ve ödeme anahtarlarının — Android çökse veya root edilse bile — korunmasını sağlar.</p>`
