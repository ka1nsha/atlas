<h3>1. Neden preload? Soğuk başlatmanın maliyeti</h3>
<p>Bir Android uygulaması bir ART runtime'ı, binlerce framework class'ını ve ortak resource'ları (drawable, string, tema) ister. Bunları her uygulama için ayrı ayrı yüklemek hem yavaş (disk + class linking + JIT) hem savurgan (her süreçte aynı kopya) olurdu. Çözüm: açılışta bir kez Zygote başlatılır ve bu pahalı şeyler onun address space'ine önceden yüklenir (preload).</p>
<div class="manpage src-aosp"><div class="ref">AOSP · runtime/zygote</div><p class="orig">The init daemon spawns the Zygote process when the Android OS is initialized.</p><p>Zygote'u init daemon başlatır (Android açılış modülüne bağ: init, PID 1). Yani Zygote, kullanıcı daha hiçbir uygulama açmadan, sistem hazır olurken ayağa kalkar ve preload'u o anda yapar.</p></div>
<div class="deflist">
<div><dt>ART runtime</dt><dd>Managed runtime'ın kendisi; interpreter, JIT, garbage collector. Bir kez kurulur.</dd></div>
<div><dt>framework classes</dt><dd>android.* ve java.* sınıflarının büyük kısmı; preloaded-classes listesinden yüklenir, verify + initialize edilir.</dd></div>
<div><dt>resources</dt><dd>Ortak sistem drawable'ları, renkler, temalar — framework-res.apk'ten.</dd></div>
</div>

<h3>2. fork ve copy-on-write: paylaşımın mekaniği</h3>
<p>Yeni bir uygulama gerektiğinde Zygote <code>fork()</code> edilir. Linux fork modülünde gördüğümüz copy-on-write burada devreye girer: önceden yüklenen o dev memory image kopyalanmaz; parent (Zygote) ile child (uygulama) aynı fiziksel sayfaları read-only olarak paylaşır. Uygulama yalnızca <em>değiştirdiği</em> (yazdığı) sayfalar için yeni fiziksel bellek harcar. Framework kodu çalışırken çoğunlukla okunduğundan, onlarca uygulama aynı framework sayfalarını fiziksel olarak paylaşmaya devam eder — bu, Android'in sınırlı RAM'de çok sayıda uygulama tutabilmesinin temel nedenidir (Android /proc modülündeki PSS metriği bu paylaşımı ölçer).</p>

<h3>3. specialize: Zygote kopyasından uygulamaya</h3>
<p>fork'tan hemen sonra child hâlâ Zygote'un yüksek ayrıcalıklarına sahiptir. specialize adımı onu kum havuzundaki bir uygulamaya indirger.</p>
<div class="manpage src-aosp"><div class="ref">AOSP · runtime/zygote</div><p class="orig">The Zygote forks the process and changes the PID, cgroup, and other information.</p><p>fork'tan sonra Zygote; PID'i, cgroup'u ve "diğer bilgileri" ayarlar. Bu "diğer bilgiler" güvenliğin kalbidir:</p></div>
<div class="deflist">
<div><dt>setuid / setgid</dt><dd>Uygulamaya özel UID/GID'ye düşülür (per-app sandbox). Artık root değil, o uygulamanın kullanıcısıdır.</dd></div>
<div><dt>SELinux context</dt><dd>Süreç untrusted_app gibi bir domain'e geçer; MAC politikası onu kısıtlar.</dd></div>
<div><dt>seccomp</dt><dd>İzin verilen system call kümesini daraltan bir BPF filtresi kurulur.</dd></div>
<div><dt>capabilities</dt><dd>Zygote'un sahip olduğu Linux capability'ler düşürülür; uygulama minimumla çalışır.</dd></div>
</div>
<p>Bu sıra önemlidir: önce ayrıcalıklar düşürülür, sonra uygulama kodu çalıştırılır — böylece uygulama hiçbir an Zygote ayrıcalıklarıyla kendi kodunu çalıştıramaz.</p>

<h3>4. Zygote socket protokolü</h3>
<p>Uygulama başlatma kararını system_server (ActivityManager) verir, ama fork'u Zygote yapar. system_server, Zygote'a bir Unix domain socket üzerinden komut yollar: hangi UID, hangi SELinux context, hangi ana sınıf (android.app.ActivityThread), hangi ABI. Zygote bu komutu okur, forkAndSpecialize'ı çağırır ve yeni PID'i geri bildirir. Yani "kim başlatılacak" kararı ile "nasıl doğurulacak" mekanizması ayrı süreçlerdedir.</p>

<h3>5. USAP: ön-fork edilmiş havuz</h3>
<p>fork + specialize bile ölçülebilir bir gecikmedir. Android bunu da gizlemek için isteği beklemeden önceden fork edilmiş, henüz specialize edilmemiş süreçlerden bir havuz tutabilir.</p>
<div class="manpage src-aosp"><div class="ref">AOSP · runtime/zygote</div><p class="orig">When this feature is enabled, each Zygote maintains a pool of forked processes</p><p>USAP (Unspecialized App Process Pool) açıkken, her Zygote önceden fork edilmiş süreçlerden bir havuz tutar. İstek geldiğinde yalnızca specialize adımı kalır; fork'un maliyeti zaten ödenmiştir, uygulama daha hızlı açılır.</p></div>

<h3>6. 64/32-bit Zygote ve bir güvenlik gerilimi</h3>
<p>Hem 64-bit hem 32-bit uygulamaları desteklemek için iki ayrı Zygote (zygote64 ve zygote) çalışır; her uygulama ABI'sine uygun olandan doğar. Güvenlik tarafında ince bir gerilim vardır: tüm uygulamalar aynı Zygote'tan fork edildiği için, fork anındaki memory layout (ve dolayısıyla ASLR yerleşimi) büyük ölçüde ortaktır. Bu, bir uygulamada sızan bir adresin başka bir uygulamada da geçerli olma riskini doğurur. Android bunu, specialize sırasında bazı bölgeleri yeniden rastgeleleştirerek ve exec-tabanlı spawning seçenekleriyle hafifletir.</p>`
