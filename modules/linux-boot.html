    heading: "Derinlemesine: boot zinciri ve kernel command line",
    html: `<p class="lead">Boot, her halkanın bir sonrakini belleğe yükleyip kontrolü devrettiği bir güven ve yetenek zinciridir. "Nasıl oluyor da çekirdek daha hiçbir sürücü yokken diski okuyup init'i çalıştırıyor?" sorusunun yanıtı bu bölümde. Anlatı büyük ölçüde boot(7) ve bootparam(7) man sayfalarına dayanır.</p>

<h3>1. Zincirin tamamı: firmware → OS loader → kernel → init</h3>
<p>Her aşama belleğe daha fazla kod getirir ve bir sonrakine atlar. En altta donanım/ROM, en üstte ilk user space süreci (PID 1) vardır.</p>
<div class="deflist">
<div><dt>firmware / ROM</dt><dd>Güç açılınca kontrol, ROM'daki (genelde PROM/UEFI) sabit bir programa verilir; donanımı sınar ve boot loader'ı belleğe alır.</dd></div>
<div><dt>boot loader</dt><dd>Tek işi çekirdeği (kernel image) bir aygıtta bulup belleğe yükleyip çalıştırmaktır. GRUB ayrıca initramfs'i yükler ve kernel command line'ı geçirir.</dd></div>
<div><dt>kernel</dt><dd>Kendini açar (decompress), alt sistemleri kurar, bir root filesystem'i <code>/</code> yoluna mount eder ve ilk user space sürecini yaratır.</dd></div>
<div><dt>init (PID 1)</dt><dd>İlk user space sürecidir; PID'i 1'dir. Servisleri başlatır ve fork modülündeki süreç ağacının kökü olur.</dd></div>
</div>
<div class="manpage"><div class="ref">7 boot · DESCRIPTION</div><p class="orig">After power-on or hard reset, control is given to a program stored in read-only memory (normally PROM).</p><p>Boot, yazılımdan önce donanımla başlar: CPU, ROM'daki sabit bir adresten çalışmaya başlar. Bu kod diski veya ağı okuyup boot loader'ı belleğe getirir — henüz ne çekirdek ne de işletim sistemi vardır.</p></div>
<div class="manpage"><div class="ref">7 boot · DESCRIPTION</div><p class="orig">Only then does the kernel create the initial user-space process, which is given the number 1 as its PID (process ID).</p><p>Çekirdek, root filesystem'i <code>/</code>'a mount ettikten <em>sonra</em> ilk user space sürecini yaratır ve ona PID 1 verir. Bu sıralama önemlidir: PID 1 çalışabilmek için bir kök dosya sistemine ihtiyaç duyar.</p></div>

<h3>2. initramfs: tavuk-yumurta problemi</h3>
<p>Gerçek kök dosya sistemi şifreli bir LVM/RAID birimin üzerinde olabilir. Ama o birimi açacak sürücü ve araçlar da kök dosya sistemindedir — yani çekirdeğin diski okuyabilmek için zaten diski okumuş olması gerekir. Bu döngüyü <strong>initramfs</strong> kırar.</p>
<p>initramfs, boot loader'ın çekirdekle birlikte belleğe yüklediği, sıkıştırılmış bir <code>cpio</code> arşividir. Çekirdek onu bellekte geçici bir root filesystem (tmpfs) olarak açar ve içindeki <code>/init</code>'i çalıştırır. Bu erken user space'in görevi: gerçek diski görünür kılacak kernel module'leri yüklemek, şifreli/LVM birimi açmak, ardından gerçek kökü mount edip <code>pivot_root</code> (veya <code>switch_root</code>) ile köke taşınmak. Bu noktada initramfs'in tuttuğu bellek geri verilir.</p>

<h3>3. Kernel command line: çekirdeğe ve init'e ayar geçirmek</h3>
<p>Boot loader çekirdeğe tek bir metin satırı geçirir: kernel command line. Bu satır hem çekirdeği ayarlar hem de çekirdeğin tanımadığı parçaları init'e ve ortama (environment) devreder. Çalışan bir sistemde onu <code>/proc/cmdline</code>'dan okuyabilirsin.</p>
<div class="manpage"><div class="ref">7 bootparam · DESCRIPTION</div><p class="orig">The Linux kernel accepts certain 'command-line options' or 'boot time parameters' at the moment it is started.</p><p>Komut satırı, açılış anında davranışı belirler: hangi kök aygıt (<code>root=</code>), kök salt okunur mu (<code>ro</code>), log seviyesi, sürücü parametreleri… Derlenmiş çekirdeği değiştirmeden sistemi ayarlamanın yoludur.</p></div>
<div class="manpage"><div class="ref">7 bootparam · init=</div><p class="orig">This sets the initial command to be executed by the kernel. ... then interpreted as an environment variable to be set.</p><p>Çözümleme sırası şöyledir: çekirdek bir argümanı tanırsa kendi ayarına uygular; <code>foo=bar</code> biçiminde tanımadıklarını bir environment variable olarak ayarlar; geri kalan her şeyi PID 1'e argüman olarak geçirir. <code>init=/bin/sh</code> vererek kurtarma kabuğu açmak bu mekanizmanın ünlü kullanımıdır.</p></div>
<div class="deflist">
<div><dt>root=</dt><dd>Gerçek kök dosya sisteminin bulunduğu aygıt (örn. <code>root=/dev/sda2</code> veya <code>root=UUID=...</code>).</dd></div>
<div><dt>ro / rw</dt><dd>Kök başta read-only mount edilir (fsck güvenliği için), sonra read-write'a geçirilir.</dd></div>
<div><dt>init=</dt><dd>PID 1 olarak çalıştırılacak programı değiştirir; kurtarma için <code>init=/bin/sh</code>.</dd></div>
<div><dt>quiet / loglevel=</dt><dd>Açılışta çekirdek log çıktısının ayrıntı düzeyini ayarlar.</dd></div>
</div>

<h3>4. start_kernel'den init'e: çekirdek ilk süreci nasıl bulur</h3>
<p>Mimariye özel erken assembly kodundan sonra çekirdeğin ilk C fonksiyonu <code>start_kernel()</code>'dir. Alt sistemleri (memory management, scheduler, interrupts) kurduktan sonra <code>kernel_init</code> yoluna girer ve <code>run_init_process()</code> ile ilk user space programını <code>execve</code> eder. Çekirdek init'i sırayla arar: önce command line'daki <code>init=</code>, yoksa <code>/sbin/init</code>, <code>/etc/init</code>, <code>/bin/init</code>, <code>/bin/sh</code>. Hiçbiri bulunamazsa ünlü <em>"No working init found"</em> kernel panic'i oluşur — çünkü PID 1 olmadan sistem anlamsızdır.</p>

<h3>5. PID 1 olarak systemd: paralel başlatma</h3>
<p>Çoğu modern dağıtımda <code>/sbin/init</code> aslında systemd'ye bir symlink'tir. Eski SysV init servisleri sıralı ve script'lerle başlatırken, systemd servisleri <strong>unit</strong> dosyalarıyla tanımlar ve bağımlılık grafiğine göre <strong>paralel</strong> başlatır; bir servis gerçekten gerekene kadar ertelenebilir (socket/D-Bus activation). Hedef durumlar <strong>target</strong> olarak ifade edilir (örn. <code>multi-user.target</code>, <code>graphical.target</code>).</p>
<div class="manpage src-docs"><div class="ref">systemd · bootup(7)</div><p>systemd, PID 1 olarak kernel'in başlattığı ilk süreçtir; <code>initrd</code> aşamasından <code>basic.target</code> ve nihai hedefe kadar olan başlatma sırasını bağımlılıklarla yönetir. Aşamaları ve süreleri <code>systemd-analyze</code> ve <code>systemd-analyze blame</code> ile ölçebilirsin. Ayrıntı: freedesktop.org systemd <code>bootup(7)</code> belgesi.</p></div>`
  },
