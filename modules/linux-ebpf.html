  deepDive: {
    heading: "Derinlemesine: güvenli çekirdek programları",
    html: `<p class="lead">eBPF, çekirdeği yeniden derlemeden veya bir kernel module yüklemeden onun içinde küçük programlar çalıştırmanı sağlar — observability, ağ ve güvenlik için devrim niteliğinde. Sırrı, bir verifier'ın her programı çalıştırmadan önce güvenli olduğunu <strong>kanıtlamasıdır</strong>. Bu bölüm bpf(2) man sayfasına dayanır.</p>

<h3>1. bpf() syscall: program çekirdeğe nasıl girer?</h3>
<p>Her şey tek bir multiplexer syscall üzerinden döner: bpf(). İlk argüman olan <code>cmd</code> hangi işlemin yapılacağını belirler — <code>BPF_PROG_LOAD</code> bytecode'u yükler, <code>BPF_MAP_CREATE</code> ve <code>BPF_MAP_LOOKUP_ELEM</code> map'leri yönetir.</p>
<div class="manpage"><div class="ref">2 bpf · DESCRIPTION</div><p class="orig">The bpf() system call performs a range of operations related to extended Berkeley Packet Filters.</p><p>Tek bir syscall; program yükleme, map yönetimi ve attach işlemlerinin tümünü üstlenir. Yüklenen program, <strong>çalışana kadar güvenli</strong> olan bir komut kümesidir: "Each eBPF program is a set of instructions that is safe to run until its completion."</p></div>

<h3>2. Verifier: neden bu kadar kısıtlı?</h3>
<p>Kullanıcı alanından gelen kod çekirdekte, çekirdek ayrıcalığıyla çalışacaksa, çökmemesi veya güvenliği delmemesi mutlak zorunluluktur. Bunu bir in-kernel verifier sağlar: programı yüklemeden önce tüm olası yürütme yollarını statik olarak simüle eder.</p>
<div class="manpage"><div class="ref">2 bpf · DESCRIPTION</div><p class="orig">An in-kernel verifier statically determines that the eBPF program terminates and is safe to execute.</p><p>Verifier iki şeyi kanıtlamak zorundadır: program <strong>sonlanır</strong> (sınırsız loop olamaz — bu yüzden klasik eBPF'te geriye atlama yasaktı; modern çekirdeklerde bounded loop izinlidir) ve her bellek erişimi <strong>sınır içindedir</strong>. Kanıtlanamazsa program <code>-EINVAL</code> ile reddedilir.</p></div>
<p>İlke şudur: "güvenli olduğu kanıtlanamayan reddedilir". Bu yüzden aslında güvenli olan bazı programlar bile, verifier onları analiz edemediği için reddedilebilir — eBPF yazmanın en sinir bozucu ama en koruyucu yanı budur.</p>

<h3>3. JIT: bytecode'dan native koda</h3>
<p>Doğrulanan program yorumlanmaz; performans için mimariye özel makine koduna çevrilir.</p>
<div class="manpage"><div class="ref">2 bpf · NOTES</div><p class="orig">The kernel contains a just-in-time (JIT) compiler that translates eBPF bytecode into native machine code</p><p>JIT compilation sayesinde bir eBPF programı, elle yazılmış bir çekirdek fonksiyonuna yakın hızda koşar; bu yüzden yüksek hacimli ağ (XDP) veya izleme yollarında bile maliyeti kabul edilebilir kalır.</p></div>

<h3>4. Program türleri: nereye bağlanır?</h3>
<p>Bir eBPF programının <strong>type</strong>'ı, hangi olaya attach edilebileceğini ve hangi helper fonksiyonlarına erişebileceğini belirler:</p>
<div class="deflist">
<div><dt>kprobe / kretprobe</dt><dd>Herhangi bir çekirdek fonksiyonunun giriş veya çıkışına bağlanır. Dinamik, ama fonksiyon adına/ABI'sine bağımlı.</dd></div>
<div><dt>tracepoint</dt><dd>Çekirdeğe önceden yerleştirilmiş kararlı izleme noktaları; kprobe'dan daha stabildir.</dd></div>
<div><dt>uprobe</dt><dd>Kullanıcı alanı programlarının fonksiyonlarına bağlanır.</dd></div>
<div><dt>XDP</dt><dd>Ağ sürücüsünün en erken noktasında paket işler — DDoS filtreleme, load balancing.</dd></div>
<div><dt>tc</dt><dd>Traffic control katmanında paket sınıflandırma ve şekillendirme.</dd></div>
<div><dt>LSM</dt><dd>Linux Security Module kancalarına bağlanır — eBPF ile dinamik güvenlik politikası.</dd></div>
</div>

<h3>5. Maps: user space ile kernel arasında köprü</h3>
<p>Bir eBPF programı izole çalışır; sonuçları dışarı taşımanın veya yapılandırma almanın yolu map'lerdir.</p>
<div class="manpage"><div class="ref">2 bpf · DESCRIPTION</div><p class="orig">They allow sharing of data between eBPF kernel programs, and also between kernel and user-space applications.</p><p>Program bir olayda map'e sayaç/kayıt yazar; user space aynı map'i okur. Çekirdekten veri çıkarmanın asıl mekanizması budur.</p></div>
<div class="deflist">
<div><dt>hash / array</dt><dd>Anahtar-değer veya indeksli depolama; sayaçlar ve yapılandırma için.</dd></div>
<div><dt>per-CPU</dt><dd>Her CPU'ya ayrı kopya — kilit (lock) olmadan yüksek hızlı sayım.</dd></div>
<div><dt>ring buffer</dt><dd>Çekirdekten user space'e verimli olay akışı (perf buffer'ın modern halefi).</dd></div>
</div>

<h3>6. Araçlar ve güvenlik</h3>
<p>Ham bytecode yazmak zordur; pratikte <strong>bcc</strong>, <strong>bpftrace</strong> ve <strong>libbpf</strong> kullanılır. Modern yaklaşım CO-RE'dir (Compile Once – Run Everywhere): program bir kez derlenir, çekirdeğin BTF tip bilgisi sayesinde farklı kernel sürümlerinde yeniden derlenmeden çalışır. Ayrıntı için <a href="https://ebpf.io/" target="_blank" rel="noopener">ebpf.io</a>.</p>
<p>Güvenlik tarafında: eBPF güçlü olduğu için bir attack surface de oluşturur — geçmişte verifier hataları ayrıcalık yükseltmeye yol açtı. Bu yüzden ayrıcalıksız (unprivileged) eBPF çoğu dağıtımda kapalıdır (<code>/proc/sys/kernel/unprivileged_bpf_disabled</code>); program yüklemek genellikle <code>CAP_BPF</code> veya <code>CAP_SYS_ADMIN</code> gerektirir.</p>`
  },

      '<li><div class="rail"><i></i><u></u></div><div class="body"><span class="fn">tracepoint / kprobe bağlama</span><span class="where">kernel/trace</span><p>Program ilgili olay noktasına takılır; olay her gerçekleştiğinde çalışır ve haritaya yazar.</p></div></li>' +
