  deepDive: {
    heading: "Derinlemesine: execve() ne yapar?",
    html: `<p class="lead">execve() bir "program başlat" çağrısı değil, bir "kendini başka programa dönüştür" çağrısıdır. Aynı süreç devam eder — PID bile değişmez — ama içindeki program tamamen değişir. Bu bölüm execve(2) ve ELF yapısına dayanır; detaylar hem performans hem güvenlik açısından kritiktir.</p>

<h3>1. "Başlatmaz, değiştirir"</h3>
<p>execve mevcut process image'i siler ve yerine yeni bir program koyar. Çağıran kod artık bellekte olmadığı için, başarılı bir execve'den geri dönüş yoktur: execve'den sonraki satır yalnızca hata durumunda çalışır.</p>
<div class="manpage"><div class="ref">2 execve · DESCRIPTION</div><p class="orig">This causes the program that is currently being run by the calling process to be replaced with a new program</p><p>Çalışan program, çağıran sürecin içinde yeni bir programla değiştirilir. Süreç aynı kalır (aynı PID, aynı parent), yalnızca içeriği — kod, veri, stack — yenisiyle değişir.</p></div>
<div class="manpage"><div class="ref">2 execve · RETURN VALUE</div><p class="orig">On success, execve() does not return, on error -1 is returned, and errno is set to indicate the error.</p><p>Başarıda geri dönüş yoktur (eski kod gitti). Hata olursa -1 döner ve errno ayarlanır; bu yüzden kodda <code>execve(...); perror("exec");</code> deseni görülür — ikinci satır sadece exec başarısız olursa çalışır.</p></div>

<h3>2. ELF nasıl belleğe yerleşir?</h3>
<p>Bir executable, başında bir header, ardından program header tablosu olan bir ELF dosyasıdır. Program header'lar çekirdeğe "şu baytları şu adrese, şu izinlerle eşle" talimatını verir. Önemli program header türleri:</p>
<div class="deflist">
<div><dt>PT_LOAD</dt><dd>Belleğe yüklenecek bir segment. Tipik olarak biri kod (text, R+X), biri veri (data, R+W). Çekirdek her birini <code>mmap</code> ile dosyadan eşler.</dd></div>
<div><dt>PT_INTERP</dt><dd>Dinamik bağlı binary'lerde kullanılacak interpreter'ın (dynamic linker, ör. <code>/lib64/ld-linux-x86-64.so.2</code>) yolu.</dd></div>
<div><dt>PT_DYNAMIC</dt><dd>Dynamic linker'ın ihtiyaç duyduğu bilgiler: hangi shared object'ler gerekli, sembol tabloları, relocation bilgileri.</dd></div>
<div><dt>PT_GNU_STACK</dt><dd>Stack'in çalıştırılabilir olup olmayacağını belirler (NX koruması; genelde çalıştırılamaz).</dd></div>
</div>
<div class="manpage"><div class="ref">2 execve · INTERPRETER</div><p class="orig">the interpreter named in the PT_INTERP segment is used to load the needed shared objects.</p><p>Dinamik bağlı bir programda çekirdek önce PT_INTERP'te adı geçen dynamic linker'ı yükler ve kontrolü ona verir. Dynamic linker gerekli shared object'leri (ör. <code>libc.so</code>) belleğe getirir, sembolleri çözer, sonra asıl programın entry point'ine atlar. Statik bağlı binary'lerde PT_INTERP yoktur; çekirdek doğrudan programa atlar.</p></div>
<p>Dosya ELF değil de <code>#!</code> ile başlayan bir script ise, çekirdek ilk satırdaki interpreter'ı (ör. <code>/bin/sh</code>) çalıştırır ve script'i ona argüman olarak verir.</p>

<h3>3. execve boyunca ne korunur, ne sıfırlanır?</h3>
<p>fork'un aksine execve bellek içeriğini tutmaz; ama sürece ait bazı öznitelikler korunur. Bunu bilmek "exec'ten sonra bu değer neden hâlâ duruyor / neden sıfırlandı?" sorusunu yanıtlar.</p>
<h4>Korunanlar</h4>
<div class="deflist">
<div><dt>PID / PPID</dt><dd>Süreç kimliği değişmez; aynı süreçtir.</dd></div>
<div><dt>open file descriptors</dt><dd>Varsayılan olarak açık kalır — bu yüzden shell, exec'ten önce kurduğu redirection'ların yeni programda da geçerli olmasını sağlayabilir.</dd></div>
<div><dt>real UID / GID</dt><dd>Gerçek kullanıcı ve grup kimlikleri ile supplementary group'lar değişmez. (effective UID, set-user-ID binary ise değişebilir — aşağıda.)</dd></div>
<div><dt>çalışma dizini, umask, rlimit</dt><dd>Devralınır.</dd></div>
</div>
<div class="manpage"><div class="ref">2 execve · FILE DESCRIPTORS</div><p class="orig">By default, file descriptors remain open across an execve(). File descriptors that are marked close-on-exec are closed.</p><p>File descriptor'lar varsayılan olarak exec boyunca açık kalır. Bir fd'ye <code>FD_CLOEXEC</code> bayrağı konmuşsa (ör. <code>open(..., O_CLOEXEC)</code>), exec anında otomatik kapatılır. Bu, bir programın hassas dosya tanıtıcılarını exec ettiği alt programa sızdırmamasının standart yoludur — güvenlik açısından önemli bir detay.</p></div>
<h4>Sıfırlananlar</h4>
<div class="deflist">
<div><dt>signal dispositions</dt><dd>Yakalanan (caught) sinyallerin handler'ları default davranışa döner — yeni programın eski programın handler'larını miras almaması için.</dd></div>
<div><dt>memory mappings</dt><dd>Eski tüm eşlemeler (kod, heap, mmap bölgeleri) kaldırılır; yeni program temiz bir address space ile başlar.</dd></div>
<div><dt>exit handlers</dt><dd><code>atexit()</code> ile kayıtlı fonksiyonlar korunmaz.</dd></div>
</div>
<div class="manpage"><div class="ref">2 execve · SIGNALS</div><p class="orig">The dispositions of any signals that are being caught are reset to the default</p><p>Eski programda bir handler'a bağlanmış sinyaller, exec sonrası default davranışına döner. Yok sayılan (ignored, SIG_IGN) sinyaller ise genelde yok sayılmaya devam eder.</p></div>

<h3>4. Stack ve auxiliary vector (auxv)</h3>
<p>Çekirdek yeni programa atlamadan önce yeni bir stack kurar ve en üste sırayla <code>argv</code>, <code>envp</code> ve <strong>auxiliary vector</strong>'ü (auxv) yerleştirir. auxv, çekirdeğin dynamic linker'a bıraktığı anahtar-değer notlarıdır: <code>AT_PHDR</code> (program header'ların adresi), <code>AT_ENTRY</code> (asıl entry point), <code>AT_RANDOM</code> (stack canary / ASLR için 16 rastgele bayt), <code>AT_PAGESZ</code> (sayfa boyutu) gibi. Dynamic linker bunları okuyarak işini yapar. (<code>LD_SHOW_AUXV=1 ./prog</code> ile görülebilir.)</p>

<h3>5. Güvenlik: exec bir ayrıcalık sınırıdır</h3>
<p>execve, ayrıcalıkların değişebildiği noktadır. Dosyada set-user-ID biti varsa (<code>chmod u+s</code>), execve sonrası effective UID dosyanın sahibine yükselir — <code>passwd</code> komutunun normal kullanıcıyken parola dosyasına yazabilmesinin yolu budur. Bu yüzden çekirdek exec anında birçok şeyi sıfırlar ve kontrol eder; exec sınırı, saldırı yüzeyinin yoğunlaştığı yerlerden biridir.</p>

<h3>Başlıca hata kodları (errno)</h3>
<ul>
<li><code>ENOENT</code> — dosya, script veya ELF interpreter bulunamadı.</li>
<li><code>ENOEXEC</code> — dosya tanınan bir formatta değil, yanlış mimari için veya bozuk.</li>
<li><code>EACCES</code> — dosyada (veya interpreter'ında) execute izni yok, ya da dosya sistemi <code>noexec</code>.</li>
<li><code>E2BIG</code> — argv ve envp'nin toplam boyutu limiti aşıyor.</li>
<li><code>ETXTBSY</code> — dosya bir süreç tarafından yazmak için açık; çalıştırılamaz.</li>
<li><code>ELOOP</code> — yolu çözerken çok fazla symbolic link var.</li>
</ul>`
  },
