  deepDive: {
    heading: "Derinlemesine: diskte bir dosya nasıl durur?",
    html: `<p class="lead">ext4, bir dosyanın adından içeriğine ulaşmayı birkaç katmanlı bir yapıyla çözer. Bu bölüm diskteki asıl yerleşimi ayrıntılandırır: block group'lar, inode, extent tree ve journaling. Kaynak: Linux kernel ext4 belgeleri.</p>

<h3>1. Disk nasıl bölünür: block group'lar</h3>
<p>Bir ext4 bölümü eşit boyutlu <strong>block group</strong>'lara ayrılır. Her grup hem veriyi hem de o veriyi yöneten metadata'yı bir arada tutar; böylece ilişkili bloklar diskte yakın durur ve seek azalır. Modern ext4'te <code>flex_bg</code> özelliği birkaç grubun metadata'sını tek yerde toplayarak bunu iyileştirir.</p>
<div class="deflist">
<div><dt>superblock</dt><dd>Dosya sisteminin genel bilgisi: toplam inode/block sayısı, block boyutu, feature flag'ler. Grup 0'da asıl kopya, bazı gruplarda yedekleri bulunur.</dd></div>
<div><dt>group descriptor</dt><dd>Her grubun bitmap ve inode table'ının yerini gösteren tablo.</dd></div>
<div><dt>block bitmap</dt><dd>Gruptaki her data block'un boş mu dolu mu olduğunu tutan 1 bit/block harita.</dd></div>
<div><dt>inode bitmap</dt><dd>Gruptaki inode slot'larının boş/dolu haritası.</dd></div>
<div><dt>inode table</dt><dd>Gruba ait inode'ların asıl dizisi; her inode sabit boyutludur (genelde 256 bayt).</dd></div>
<div><dt>data blocks</dt><dd>Dosyaların gerçek içeriğinin durduğu bloklar.</dd></div>
</div>

<h3>2. inode: dosyanın kimliği</h3>
<p>Bir <strong>inode</strong>, dosyanın adını DEĞİL geri kalan her şeyini tutar: izinler, sahiplik, boyut, timestamp'ler ve verinin nerede olduğu. Ad, directory entry'de tutulur ve bir inode numarasına işaret eder — bu yüzden aynı inode'a birden çok ad (hard link) bağlanabilir.</p>
<div class="deflist">
<div><dt>i_mode</dt><dd>Dosya türü (regular/dir/symlink...) ve izin bitleri.</dd></div>
<div><dt>i_uid / i_gid</dt><dd>Sahip user ve group.</dd></div>
<div><dt>i_size</dt><dd>Dosya boyutu (bayt).</dd></div>
<div><dt>timestamps</dt><dd>atime, ctime, mtime ve ext4'te crtime (oluşturma). ext4 nanosaniye çözünürlük ekler.</dd></div>
<div><dt>i_block[15]</dt><dd>ext2/3'te blok işaretçileri dizisiydi; ext4'te bu 60 baytlık alan extent tree'nin kökünü tutar.</dd></div>
</div>

<h3>3. extent tree: ext4'ün ext2/3'ten en büyük farkı</h3>
<p>ext2/3 büyük dosyaları <strong>indirect block</strong> zinciriyle haritalardı: her blok tek tek işaretlenirdi, bu da büyük dosyalarda hem yavaş hem yer israfıydı. ext4 yerine <strong>extent</strong> kullanır — "şu mantıksal bloktan başlayan şu kadar bitişik blok, şu fiziksel adreste" diyen tek bir kayıt. Bitişik büyük bir dosya, binlerce işaretçi yerine tek bir extent'le haritalanabilir.</p>
<div class="deflist">
<div><dt>ext4_extent_header</dt><dd>Her düğümün başı: eh_magic (0xF30A), eh_entries, eh_max, eh_depth (0 = leaf).</dd></div>
<div><dt>ext4_extent (leaf)</dt><dd>Bitişik bir blok aralığını eşler: mantıksal başlangıç, uzunluk (en çok 32768 block), fiziksel başlangıç.</dd></div>
<div><dt>ext4_extent_idx (internal)</dt><dd>Dosya parçalandıkça ağaç derinleşir; bu düğüm bir sonraki seviyeye işaret eder.</dd></div>
</div>

<h3>4. Directory: linear vs htree</h3>
<p>Küçük dizinler, directory entry'lerin basit bir listesidir (<code>ext4_dir_entry_2</code>): her girdi bir ad + inode numarası tutar. Dizin büyüdükçe doğrusal arama yavaşlar; bu yüzden <code>dir_index</code> özelliğiyle ext4 bir <strong>htree</strong> (hashed B-tree) kurar: adın hash'i üzerinden indeksli, neredeyse sabit zamanlı arama. htree kullanıcıya hâlâ sıradan bir dizin gibi görünür.</p>

<h3>5. journaling: çökmeye karşı tutarlılık (jbd2)</h3>
<p>Bir yazma işlemi birden çok bloğu (bitmap, inode, data) güncellediğinden, tam ortasında elektrik kesilirse dosya sistemi tutarsız kalır. ext4 bunu <strong>journaling</strong> ile çözer: değişiklikler önce bir journal alanına yazılır, oraya tam işlendikten (commit) sonra asıl yerlerine uygulanır (checkpoint). Çökme sonrası açılışta journal tekrar oynatılır (replay); bu yüzden ext4 bölümleri tam fsck gerektirmeden hızlı kurtarılır.</p>
<div class="deflist">
<div><dt>journal mode</dt><dd>Hem metadata hem data journal'a yazılır — en güvenli, en yavaş.</dd></div>
<div><dt>ordered mode</dt><dd>Varsayılan. Yalnızca metadata journal'a yazılır; ama data, metadata commit'inden ÖNCE diske yazılır, böylece bir inode'a çöp/eski data bağlanmaz.</dd></div>
<div><dt>writeback mode</dt><dd>Yalnızca metadata journal'a; data'nın sırası garanti edilmez — en hızlı, en riskli.</dd></div>
</div>
<p>jbd2 (journaling block device), bu mekanizmayı sağlayan ayrı çekirdek katmanıdır ve başka dosya sistemlerince de kullanılabilir.</p>

<h3>6. delayed allocation: yazarken değil, boşaltırken yerleştir</h3>
<p>ext4, bir yazma geldiğinde block'u hemen ayırmaz; veriyi bir süre page cache'te tutar ve asıl writeback anında tüm parçayı birden görerek <strong>bitişik</strong> yerleştirmeye çalışır. Buna <strong>delayed allocation</strong> (delalloc) denir; fragmentation'ı azaltır ama çökme anında henüz yazılmamış veriyi riske atabilir.</p>

<p style="font-size:14px;color:var(--muted)">Kaynak: <a href="https://docs.kernel.org/filesystems/ext4/" target="_blank" rel="noopener">Linux kernel — ext4 Data Structures and Algorithms</a>.</p>`
  },
