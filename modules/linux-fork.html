  deepDive: {
    heading: "Derinlemesine: fork() ne yapar, ne yapmaz?",
    html: `<p class="lead">fork() çağrısı yüzeyde basit görünür — "süreci kopyala" — ama ayrıntılar bir güvenlik araştırmacısı veya sistem programcısı için kritiktir. Neyin gerçekten kopyalandığı, neyin paylaşıldığı ve neyin sıfırlandığı, bir sürü ince hatanın ve tasarım kararının kaynağıdır. Bu bölüm man sayfalarına dayanır.</p>

<h3>1. Tam olarak ne kopyalanır, ne kopyalanmaz?</h3>
<p>Child process, parent'ın neredeyse birebir bir kopyasıdır; POSIX buna "duplicate" der. Ama bazı şeyler kasıtlı olarak kopyalanmaz veya sıfırlanır. Bunu bilmek, "neden child'da bu değer farklı?" sorusunu önceden yanıtlar.</p>
<h4>Child'a geçenler (kopyalanır)</h4>
<div class="deflist">
<div><dt>address space</dt><dd>Text, data, heap ve stack — hepsi copy-on-write ile. Mantıksal olarak kopya, fiziksel olarak paylaşımlı.</dd></div>
<div><dt>file descriptors</dt><dd>fd table kopyalanır. <strong>Ama</strong> altındaki open file description paylaşılır — yani file offset ortaktır (aşağıda).</dd></div>
<div><dt>signal handlers</dt><dd>Kurulu handler ayarları (dispositions) ve signal mask (blocked mask) devralınır.</dd></div>
<div><dt>environment & kimlik</dt><dd>Environment variables, working directory, root directory, umask, nice değeri, resource limits (rlimit).</dd></div>
</div>
<h4>Child'da farklı veya sıfırlanan</h4>
<div class="deflist">
<div><dt>PID / PPID</dt><dd>Child yeni bir PID alır; PPID'si parent'ın PID'sidir. <code>getpid()</code> ve <code>getppid()</code> farklı döner.</dd></div>
<div><dt>pending signals</dt><dd>Parent'ta pending olan signal set child'da <strong>boşaltılır</strong> — child temiz bir signal state ile başlar.</dd></div>
<div><dt>timers</dt><dd><code>alarm()</code>, <code>setitimer()</code> ile kurulan timer'lar miras alınmaz; CPU time counter'ları sıfırlanır.</dd></div>
<div><dt>record locks</dt><dd>Record locks (<code>fcntl</code>) child'a geçmez.</dd></div>
<div><dt>threads</dt><dd>Multi-threaded bir süreçte <strong>yalnızca fork()'u çağıran thread</strong> child'da var olur. Diğer thread'ler child'da yoktur — bu, bir lock tutan thread varken fork etmenin neden tehlikeli olduğunu açıklar.</dd></div>
</div>
<div class="manpage"><div class="ref">2 fork · NOTES</div><p class="orig">The child process is created with a single thread — the one that called fork().</p><p>Child, yalnızca fork()'u çağıran tek bir thread ile yaratılır. Bu yüzden multi-threaded programlarda fork sonrası genellikle hemen <code>exec()</code> çağrılır: başka bir thread bir mutex tutarken fork edilirse, o lock child'da sonsuza dek kilitli kalabilir, çünkü onu açacak thread child'da hiç yoktur.</p></div>

<h3>2. Dönüş değeri ve hatalar</h3>
<p>fork()'un en tuhaf yanı, bir çağrının iki değer döndürmesidir. man sayfası bunu net anlatır:</p>
<div class="manpage"><div class="ref">2 fork · RETURN VALUE</div><p class="orig">On success, the PID of the child process is returned in the parent, and 0 is returned in the child. On failure, -1 is returned in the parent, no child process is created, and errno is set to indicate the error.</p><p>Başarıda: parent'a child'ın PID'si, child'a 0 döner. Başarısızlıkta: parent'a -1 döner, <strong>hiç child yaratılmaz</strong> ve <code>errno</code> ayarlanır. Child 0 aldığı için kendi PID'sini bilmez; onu <code>getpid()</code> ile öğrenir.</p></div>
<p>İki error code'u bilmek gerekir:</p>
<ul>
<li><code>EAGAIN</code>: Process sayısı sınırına (<code>RLIMIT_NPROC</code>) veya sistem genelinde PID/bellek sınırına ulaşıldı. Bir "fork bombası" sistemi tam da bu limite dayayarak çökertir; bu yüzden <code>RLIMIT_NPROC</code> ve cgroup <code>pids.max</code> bir savunma hattıdır.</li>
<li><code>ENOMEM</code>: Çekirdek yeni <code>task_struct</code> veya page table'lar için bellek ayıramadı.</li>
</ul>

<h3>3. Paylaşılan offset: fork'un en çok şaşırtan yanı</h3>
<p>fd table kopyalanır ama altındaki <strong>open file description paylaşılır</strong>. Yani parent ve child aynı file offset'i paylaşır: biri yazarsa offset ikisi için birden ilerler. Bu bir kaza değil, tasarımdır — shell'in output redirection'ı (<code>&gt;&gt;</code> append kipi) ve bir dosyaya birlikte yazan süreçler bu sayede düzgün çalışır.</p>
<div class="manpage"><div class="ref">2 open · open file description</div><p>Her <code>open()</code> çağrısı çekirdekte bir open file description yaratır; file offset ve status flag'leri burada tutulur. fork() ile fd table çoğaltılır ama her iki taraftaki fd'ler <strong>aynı</strong> open file description'ı gösterir. <code>dup()</code> ve <code>dup2()</code> da aynı description'ı paylaştırır — stdout'u bir dosyaya yönlendirmek tam olarak budur.</p></div>

<h3>4. Copy-on-write: ucuz çatallanma, gizli maliyet</h3>
<p>Modern Linux'ta fork() belleği kopyalamaz; yalnızca page table'ı kopyalar ve yazılabilir sayfaları iki tarafta read-only işaretler. Böylece 4 GB belleği olan bir süreç bile milisaniyenin altında çatallanır. Maliyet yazmaya kadar ertelenir: ilk yazmada CPU bir page fault üretir, çekirdek o sayfayı kopyalar (<code>do_wp_page</code>). Yani <strong>fork ucuz, ama fork sonrası yoğun yazan bir child pahalıdır</strong> — her dokunduğu sayfa kopyalanır.</p>
<p>Bu yüzden yalnızca başka bir program çalıştırmak için fork edeceksen, <code>posix_spawn()</code> veya fork hemen ardından <code>exec()</code> tercih edilir: exec zaten tüm address space'i atacağı için CoW kopyalamaları bile gereksizdir. Büyük süreçlerde <code>vfork()</code> bu yüzden vardı (child, exec'e kadar parent'ın address space'ini ödünç alır).</p>

<h3>5. Child'ı toplamak: zombie, wait() ve yeniden evlat edinme</h3>
<p>Child bittiğinde çekirdek belleğini bırakır ama exit status'ü tutar; bu durumu parent <code>wait()</code>/<code>waitpid()</code> ile okuyana kadar child "zombie" (Z) olarak process table'da kalır. Zombie bellek tüketmez ama bir PID işgal eder — binlerce zombie PID tükenmesine yol açabilir.</p>
<div class="manpage"><div class="ref">2 wait · DESCRIPTION</div><p>wait() ve waitpid(), state'i değişen bir child'ı bekler ve exit status'ü geri verir; bu, zombie'yi process table'dan siler (reap). Dönen status, <code>WIFEXITED()</code>, <code>WEXITSTATUS()</code>, <code>WIFSIGNALED()</code> makroları ile çözülür: child normal mi çıktı, hangi kodla, yoksa bir signal ile mi öldürüldü.</p></div>
<p>Parent, child'dan önce ölürse child orphan kalır ve <code>init</code> (PID 1) ya da kayıtlı bir "subreaper" tarafından evlat edinilir; onu o toplar. Child bittiğinde çekirdek parent'a <code>SIGCHLD</code> gönderir — event-driven sunucular child'ları bu signal'in handler'ında toplar, böylece ana döngü bloklanmaz.</p>`
