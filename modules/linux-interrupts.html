    heading: "Derinlemesine: kesmenin yolu ve işin bölünmesi",
    html: `<p class="lead">Bir interrupt yüzeyde basit görünür — "donanım dikkat istiyor" — ama altında interrupt controller'dan IDT'ye, interrupt context'in katı kurallarından bottom half mekanizmalarına uzanan bir mimari yatar. Bu bölüm neden işin ikiye bölündüğünü ve bir aygıt sürücüsünün bu yapıya nasıl bağlandığını ayrıntılandırır.</p>

<h3>1. Hattan handler'a: IRQ nasıl bir fonksiyona dönüşür?</h3>
<p>Bir aygıt dikkat istediğinde iki yoldan biriyle sinyal verir. Klasik yol bir fiziksel <strong>IRQ line</strong>'dır: aygıt bir hattı tetikler, hat bir <strong>interrupt controller</strong>'a (eski PIC, modern sistemlerde APIC / IO-APIC) gider, o da CPU'ya hangi kesmenin geldiğini bildirir. Modern PCIe aygıtları ise ayrı bir hat yerine <strong>MSI / MSI-X</strong> (Message Signaled Interrupt) kullanır: kesmeyi belleğe özel bir yazma işlemiyle, "mesaj" olarak gönderir — bu daha fazla kesme vektörü ve daha az hat çakışması demektir.</p>
<p>CPU bir kesme aldığında, o an çalışan kodu durdurur ve <strong>IDT</strong> (Interrupt Descriptor Table) üzerinden ilgili <strong>interrupt vector</strong>'e karşılık gelen giriş noktasına atlar. Çekirdek buradan kayıtlı <strong>interrupt handler</strong>'ı (sürücünün <code>request_irq</code> ile verdiği fonksiyon) çağırır. Tüm bu süre boyunca çalışan kod <strong>interrupt context</strong>'tedir.</p>

<h3>2. Interrupt context: uyuyamaz, bloklayamaz</h3>
<p>Interrupt handler bir <strong>process context</strong>'te değil, <strong>interrupt context</strong>'te çalışır ve bu temel bir kısıttır. Interrupt context'in arkasında bir <code>task_struct</code> yoktur, yani uykuya geçirilip sonra uyandırılacak bir süreç yoktur. Bu yüzden handler içinde <strong>asla</strong> uyunamaz, bloklayan bir işlem (örneğin uzun bir kilit beklemesi veya kullanıcı belleğine erişim) yapılamaz. Ayrıca top half genellikle kesmeler kapalıyken çalışır: handler uzarsa diğer kesmeler ve tüm sistem gecikir. İşte işin ikiye bölünmesinin asıl nedeni budur.</p>

<h3>3. Top half ve bottom half</h3>
<p>Çözüm, işi ikiye ayırmaktır. <strong>Top half</strong> (hardirq) yalnızca ertelenemeyecek, en acil işi yapar: veriyi donanımdan al, denetleyiciyi onayla, geri kalanı için bir bottom half planla ve hızlıca çık. <strong>Bottom half</strong> ise ağır işi, kesmeler yeniden açıkken ve sistem daha rahatken yapar. Linux'ta bottom half için üç mekanizma vardır ve aralarındaki fark, nerede çalıştıkları ve uyuyup uyuyamadıklarıdır:</p>
<div class="deflist">
<div><dt>softirq</dt><dd>Çekirdeğin kendi, statik tanımlı, yüksek başarımlı bottom half'leri (ağ için NET_RX/NET_TX, blok, timer). Aynı softirq birden çok CPU'da paralel çalışabilir, bu yüzden kendi kilitlemesini kendi yapar. Interrupt context'tedir, uyuyamaz.</dd></div>
<div><dt>tasklet</dt><dd>softirq üstüne kurulu, sürücüler için kolay arayüz. Aynı tasklet aynı anda yalnızca bir CPU'da çalışır (serileştirilmiştir), bu yüzden sürücü yazarı için daha basittir. Interrupt context'tedir, uyuyamaz.</dd></div>
<div><dt>workqueue</dt><dd>Bir kernel thread'inde, yani <strong>process context</strong>'te çalışır — tek fark budur ama kritiktir: workqueue <strong>uyuyabilir</strong>, bloklayan işlem yapabilir, kilit bekleyebilir. Uyuması gereken ertelenmiş iş buraya gider.</dd></div>
</div>
<p>Yük çok yükseldiğinde softirq'ler bir kesme işleyicisinin dönüşünde hemen işlenmek yerine <code>ksoftirqd</code> adlı, her CPU için bir tane olan çekirdek thread'ine devredilir; böylece softirq seli, normal süreçleri tamamen aç bırakmaz.</p>

<h3>4. Shared IRQ, threaded IRQ ve affinity</h3>
<p>Birden çok aygıt tek bir IRQ line'ı paylaşabilir (<strong>shared IRQ</strong>): kesme gelince çekirdek o hatta kayıtlı tüm handler'ları sırayla çağırır, her handler "bu benim mi?" diye bakıp değilse <code>IRQ_NONE</code> döner. Gerçek zamanlı ve karmaşık sürücüler için çekirdek <strong>threaded IRQ</strong> da sunar (<code>request_threaded_irq</code>): top half minimum işi yapar, asıl işleyici ayrı bir çekirdek thread'inde, process context'te çalışır — yani uyuyabilir.</p>
<p>Çok çekirdekli sistemlerde her kesmenin hangi CPU'da işleneceği <strong>IRQ affinity</strong> ile ayarlanır: <code>/proc/irq/&lt;n&gt;/smp_affinity</code> bir CPU maskesi tutar. Ağ kartları gibi yoğun kesme üreten aygıtların yükünü CPU'lara dağıtmak (veya tek CPU'ya sabitlemek) performans ayarının önemli bir parçasıdır.</p>

<h3>5. Character device: kesmeden kullanıcıya</h3>
<p>Bottom half tuşu input alt sistemine ilettikten sonra, o veri sonunda bir aygıt dosyası üzerinden uygulamaya ulaşır. Bir <strong>character device</strong>, aygıtı /dev altında bir dosya gibi sunar; üzerindeki <code>open/read/write</code> çağrıları, sürücünün kaydettiği <strong>file_operations</strong> yapısındaki fonksiyonlara eşlenir. Aygıtı <strong>major number</strong> (hangi sürücü) ve <strong>minor number</strong> (o sürücünün hangi örneği) tanımlar; sürücü kendini çekirdeğe bir <code>cdev</code> olarak kaydeder.</p>
<p>Bütün bu makineyi dışarıdan iki dosyayla gözlemleyebilirsin. <code>/proc/interrupts</code>, her kesme kaynağının her CPU'da kaç kez tetiklendiğini sayar:</p>
<div class="manpage"><div class="ref">5 proc_interrupts · DESCRIPTION</div><p class="orig">This is used to record the number of interrupts per CPU per IO device.</p><p>Her satır bir kesme kaynağı, her sütun bir CPU'dur; hücredeki sayı o kaynağın o CPU'da kaç kez tetiklendiğidir. Bir aygıtın gerçekten çalışıp çalışmadığını veya kesme yükünün CPU'lara nasıl dağıldığını buradan anlarsın.</p></div>
<p>Benzer şekilde <code>/proc/softirqs</code> bottom half işinin türe göre dağılımını (TIMER, NET_RX, RCU...) gösterir; ağ yoğun bir sistemde NET_RX'in neden tavan yaptığını buradan görürsün.</p>`
