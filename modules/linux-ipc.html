    html: `<p class="lead">IPC (interprocess communication) yöntemleri aynı soruyu farklı maliyetlerle çözer: iki process arasında veri nasıl taşınır? Seçim, verinin kaç kez kopyalandığına, iletişimin tek yönlü mü çift yönlü mü olduğuna ve senkronizasyon gerekip gerekmediğine bağlıdır. Bu bölüm man sayfalarına dayanır.</p>

<h3>1. Pipe: tek yönlü kanal</h3>
<p>Anonymous pipe, iki process arasında (genelde parent–child) tek yönlü bir bayt akışı sağlar. Veri bir kernel buffer'da tutulur: yazan uca yazılır, okuyan uçtan okunur. Çift yönlü iletişim için iki ayrı pipe gerekir.</p>
<div class="manpage"><div class="ref">7 pipe · DESCRIPTION</div><p class="orig">Pipes and FIFOs (also known as named pipes) provide a unidirectional interprocess communication channel.</p><p>pipe ve FIFO, tek yönlü (unidirectional) bir IPC kanalı sağlar; tek bir pipe ile veri yalnızca bir yöne akar.</p></div>
<p>Küçük yazmalar <strong>atomic</strong>tir: <code>PIPE_BUF</code> baytından (Linux'ta 4096) küçük bir <code>write</code>, araya başka bir yazanın verisi karışmadan tek parça olarak yazılır. Bu, birden çok process aynı pipe'a yazarken satırların birbirine karışmamasını sağlar.</p>
<div class="manpage"><div class="ref">7 pipe · PIPE_BUF</div><p class="orig">POSIX.1 says that writes of less than PIPE_BUF bytes must be atomic:</p><p>PIPE_BUF'tan küçük yazmalar atomic olmak zorundadır; bundan büyük yazmalar parçalanabilir ve araya başka verinin girmesine izin verebilir.</p></div>
<p>Okuyan uç kapanmışsa yazan process'e <code>SIGPIPE</code> gönderilir; process bu sinyali yok sayıyorsa <code>write</code> çağrısı <code>EPIPE</code> ile başarısız olur. Boş bir pipe'tan okuma veri gelene kadar bloklanır; dolu bir pipe'a yazma yer açılana kadar bloklanır (blocking mode).</p>
<div class="manpage"><div class="ref">7 pipe · DESCRIPTION</div><p class="orig">If the calling process is ignoring this signal, then write(2) fails with the error EPIPE.</p><p>Kabuğun "Broken pipe" mesajı tam da budur: okuyucu kalmayınca gelen SIGPIPE ya da EPIPE.</p></div>

<h3>2. Named pipe (FIFO)</h3>
<p>FIFO, pipe'ın dosya sistemi üzerinde isimlendirilmiş hâlidir (<code>mkfifo</code>). Akraba olmayan (unrelated) process'ler onu bir yol adıyla açıp aynı kanalı paylaşabilir; anonymous pipe'ın aksine ortak bir ata (parent) gerekmez.</p>

<h3>3. Unix domain socket: çift yönlü ve daha güçlü</h3>
<p>Unix domain socket (AF_UNIX), aynı makinedeki process'ler arasında çift yönlü, güvenilir iletişim sağlar. Ağ soketlerinin aksine TCP/IP yığınına girmez; doğrudan çekirdek içinde çalışır, bu yüzden hızlıdır.</p>
<div class="manpage"><div class="ref">7 unix · DESCRIPTION</div><p class="orig">...is used to communicate between processes on the same machine efficiently.</p><p>AF_UNIX, aynı makinedeki process'ler arasında verimli iletişim için kullanılır.</p></div>
<p>Üç soket türü vardır:</p>
<div class="deflist">
<div><dt>SOCK_STREAM</dt><dd>Akış yönelimli (stream-oriented) bayt akışı; TCP benzeri.</dd></div>
<div><dt>SOCK_DGRAM</dt><dd>Datagram yönelimli; mesaj sınırlarını korur.</dd></div>
<div><dt>SOCK_SEQPACKET</dt><dd>Sıralı paket; bağlantı yönelimli ve mesaj sınırlarını koruyan.</dd></div>
</div>
<p>Unix domain socket'in en güçlü özelliği <strong>fd passing</strong>: bir process, açık bir file descriptor'ı <code>SCM_RIGHTS</code> ancillary mesajıyla başka bir process'e gönderebilir. Karşı taraf aynı kaynağa erişen yeni bir file descriptor alır. Bu, ayrıcalıklı bir process'in açtığı bir kaynağı sandbox'lı bir process'e devretmesini sağlar ve tam da bu yüzden güvenlik açısından önemli bir yüzeydir.</p>
<div class="manpage"><div class="ref">7 unix · ANCILLARY MESSAGES</div><p class="orig">Send or receive a set of open file descriptors from another process.</p><p>Açık file descriptor'ları başka bir process'e gönder veya ondan al. Taşınan şey bir sayı değil, çekirdekteki open file description'a bir referanstır.</p></div>

<h3>4. Shared memory: en hızlı, senkronizasyon sizde</h3>
<p>Shared memory, iki process'in aynı fiziksel belleği kendi address space'lerine eşlemesidir (POSIX: <code>shm_open</code> + <code>mmap</code>; System V: <code>shmget</code>). Veri hiç kopyalanmaz: bir process yazar, diğeri aynı anda görür. Bu onu en hızlı IPC yapar; ama çekirdek araya girmediği için race condition'ları önlemek — semaphore, mutex ya da futex ile — sizin sorumluluğunuzdadır.</p>

<h3>5. Hangisi ne zaman?</h3>
<div class="deflist">
<div><dt>pipe / FIFO</dt><dd>Basit, tek yönlü akış. Veri iki kez kopyalanır (yazan → kernel buffer → okuyan).</dd></div>
<div><dt>Unix socket</dt><dd>Çift yönlü, mesaj sınırlı, fd passing destekli. İki kopya ama en esnek.</dd></div>
<div><dt>shared memory</dt><dd>Sıfır kopya, en hızlı. Senkronizasyon elle. Büyük veri için ideal.</dd></div>
</div>

<h3>6. Android ve macOS'ta karşılığı</h3>
<p>Aynı problem her platformda çözülür ama farklı soyutlamalarla. Android'in <strong>Binder</strong>'ı tek kopyalı (one-copy) bir IPC sağlar ve nesne referansı taşıyabilir; macOS/iOS'un <strong>Mach port</strong>'ları mesaj kuyruklarına dayalı, yetki (capability) tabanlı bir model sunar. Üçü de aynı çekirdek sorusunu — "veriyi ve erişim hakkını güvenle nasıl taşırım?" — kendi tasarım felsefesiyle yanıtlar.</p>`
