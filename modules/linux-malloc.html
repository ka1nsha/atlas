  deepDive: {
    heading: "Derinlemesine: malloc belleği nasıl yönetir?",
    html: `<p class="lead">malloc() tek satırlık bir çağrı gibi görünür ama altında küçük bir bellek yönetim sistemi çalışır: çekirdekten toptan alınan belleği parçalara böler, geri gelenleri listeler, yeniden kullanır. Bu bölüm bu sistemin iç yapısını ve glibc'nin tasarım kararlarını man sayfalarına dayanarak açar.</p>

<h3>1. İki bellek kaynağı: brk ve mmap</h3>
<p>Çekirdeğin bir process'in heap'i hakkında bildiği tek şey onun üst sınırıdır: <strong>program break</strong>. brk ve sbrk bu sınırı hareket ettirir.</p>
<div class="manpage"><div class="ref">2 brk · DESCRIPTION</div><p class="orig">brk() and sbrk() change the location of the program break, which defines the end of the process's data segment. Increasing the program break has the effect of allocating memory to the process; decreasing the break deallocates memory.</p><p>Yani heap "büyütmek" demek, program break'i yukarı itmek demektir. glibc küçük istekleri karşılamak için bunu kullanır: bir kez büyük bir blok alır, sonra o bloğu kendi içinde dağıtır. Çekirdeğe her malloc'ta gitmek yavaş olurdu.</p></div>
<p>Büyük istekler farklı ele alınır. Belirli bir eşiği aşan tahsisler heap'e sığdırılmaya çalışılmaz; doğrudan çekirdekten ayrı bir bölge istenir.</p>
<div class="manpage"><div class="ref">3 malloc · NOTES</div><p class="orig">When allocating blocks of memory larger than MMAP_THRESHOLD bytes, the glibc malloc() implementation allocates the memory as a private anonymous mapping using mmap(2). MMAP_THRESHOLD is 128 kB by default, but is adjustable using mallopt(3).</p><p>Bu yüzden lab'daki 200 KB'lık istek <code>0x7f…</code> aralığına (mmap bölgesi) düştü, heap'teki (<code>0x55…</code>) küçük yongaların yanına değil. mmap ile alınan bir blok free edildiğinde doğrudan işletim sistemine geri verilir; heap gibi elde tutulmaz. Eşik sabit değildir: glibc, serbest bırakılan büyük blokların boyutuna göre eşiği dinamik ayarlar (free olan 200 KB'lık bir blok görürse eşiği ona yaklaştırır).</p></div>

<h3>2. Bir chunk neye benzer?</h3>
<p>malloc'un dağıttığı her parçaya <strong>chunk</strong> denir. Döndürülen işaretçinin hemen öncesinde, malloc'un kendi muhasebesi için kullandığı bir başlık (header) vardır. İstediğin 40 bayt bu yüzden bellekte 48 bayt yer kaplar: header + hizalama (alignment, 64-bit'te 16 bayt katı).</p>
<div class="deflist">
<div><dt>size</dt><dd>Chunk'ın toplam boyutu. Boyut her zaman 16'nın katı olduğu için alttaki 3 bit boşta kalır ve bayrak (flag) olarak kullanılır.</dd></div>
<div><dt>PREV_INUSE</dt><dd>En düşük bit. Bir önceki (fiziksel olarak bitişik) chunk kullanımdaysa 1. Komşu free chunk'ları birleştirmek (coalescing) için okunur.</dd></div>
<div><dt>IS_MMAPPED</dt><dd>Bu chunk brk heap'inden değil, ayrı bir mmap bölgesinden geldiyse 1. free() buna bakıp munmap çağırır.</dd></div>
<div><dt>NON_MAIN_ARENA</dt><dd>Chunk main arena dışında, bir thread arena'sında ayrıldıysa 1.</dd></div>
<div><dt>prev_size / fd / bk</dt><dd>Chunk free olduğunda gövdesi boştur; glibc burayı listeleme için kullanır: fd/bk komşu free chunk'lara işaret eder. Yani kullanıcı verisiyle metadata aynı baytları farklı zamanlarda paylaşır — bu, heap exploit'lerinin kavramsal olarak hedef aldığı yerdir.</dd></div>
</div>

<h3>3. free olan chunk nereye gider? (bin'ler)</h3>
<p>free() belleği hemen OS'a vermez; chunk'ı boyutuna ve durumuna göre bir listeye (bin) koyar. Bir sonraki malloc önce bu listelere bakar, uygun olanı bulursa çekirdeğe hiç gitmez. glibc'de birkaç bin türü vardır:</p>
<div class="deflist">
<div><dt>tcache</dt><dd>Her thread'e özel (per-thread) hızlı önbellek. Küçük boyutlar için ilk bakılan yerdir; kilit (lock) gerektirmez, bu yüzden en hızlısıdır. Lab'da c == a olmasının sebebi budur.</dd></div>
<div><dt>fast bin</dt><dd>Küçük chunk'lar için tekli bağlı liste. Hız için coalescing yapılmaz; LIFO çalışır.</dd></div>
<div><dt>unsorted bin</dt><dd>free edilen chunk'ların geçici olarak düştüğü tek liste. Sonraki malloc burayı tarayıp chunk'ları small/large bin'lere dağıtır.</dd></div>
<div><dt>small / large bin</dt><dd>Sabit boyutlu (small) ve boyut aralıklı, sıralı (large) listeler. Büyük, uzun ömürlü bloklar buraya oturur; coalescing burada yapılır.</dd></div>
</div>
<p>Bu katmanlı yapı bir denge kurar: tcache/fast bin hızı, small/large bin ise <strong>fragmentation</strong>'ı (bellek parçalanmasını) azaltmayı hedefler. Kötü senaryo: çok sayıda farklı boyutta tahsis/serbest bırakma, aralarda kullanılamayan küçük boşluklar bırakır ve heap kullanılmayan belleğe rağmen büyümek zorunda kalır.</p>

<h3>4. Arena'lar ve çok-thread'li programlar</h3>
<p>Tek bir heap'i birden çok thread aynı anda kullanırsa, her malloc/free bir kilit (lock) için yarışır ve bu bir darboğaz olur. glibc bunu <strong>arena</strong>'larla çözer: main arena'ya ek olarak, iş yükü arttıkça thread'ler için ayrı arena'lar açılır (her biri kendi bin'leri ve kilidiyle). Böylece farklı thread'ler çoğu zaman farklı arena'larda, birbirini beklemeden çalışır. Arena sayısı <code>MALLOC_ARENA_MAX</code> ortam değişkeniyle sınırlanabilir (çekirdek sayısının katı kadar varsayılan üst sınır vardır).</p>

<h3>5. Kolay unutulan davranışlar</h3>
<div class="manpage"><div class="ref">3 malloc · DESCRIPTION</div><p class="orig">The memory is not initialized. ... If size is 0, then malloc() returns a unique pointer value that can later be successfully passed to free().</p><p>İki ince nokta: (1) malloc dönen bellek <strong>sıfırlanmaz</strong> — eski veriyi (çöp) içerir. Sıfır gerekiyorsa <code>calloc</code> kullan. (2) <code>malloc(0)</code> NULL dönmek zorunda değildir; free edilebilir geçerli bir işaretçi dönebilir. "malloc NULL döndürdü mü?" kontrolünü boyut 0 için yazarken bu tuzağa dikkat.</p></div>
<div class="manpage"><div class="ref">3 free · DESCRIPTION</div><p class="orig">If p is NULL, no operation is performed.</p><p><code>free(NULL)</code> güvenlidir, hiçbir şey yapmaz — bu yüzden hata yollarında NULL kontrolü yapmadan free çağırmak yaygın ve doğru bir kalıptır. Buna karşılık aynı işaretçiyi iki kez free etmek (double-free) tanımsız davranıştır ve bin listelerini bozar.</p></div>

<h3>6. Güvenlik tarafı (kavramsal)</h3>
<p>Dikkat ettiysen chunk header'ı ve free chunk'ların fd/bk işaretçileri, kullanıcı verisiyle aynı bellekte, hemen bitişik durur. Bir heap taşması (overflow) bir sonraki chunk'ın header'ına taşarsa, ya da bir use-after-free bir free chunk'ın fd işaretçisini değiştirirse, saldırgan allocator'ın muhasebesini yanıltabilir. Bu modül mekanizmayı anlatır; sömürü tekniklerinin kendisi Ofansif izlekte, kavramsal düzeyde ele alınır.</p>`
  },
