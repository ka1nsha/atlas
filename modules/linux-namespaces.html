  deepDive: {
    heading: "Derinlemesine: namespaces ve cgroups",
    html: `<p class="lead">Bir container sihir değildir; iki çekirdek mekanizmasının birleşimidir. Namespaces bir sürecin <strong>ne gördüğünü</strong> izole eder, cgroups ise bir sürecin <strong>ne kadar kaynak kullanabileceğini</strong> sınırlar. Docker, Podman ve systemd-nspawn hepsi bu ikisini (artı seccomp ve capabilities) birbirine dokur. Bu bölüm man sayfalarına dayanır.</p>

<h3>1. Namespace nedir?</h3>
<p>Bir namespace, küresel bir sistem kaynağını (process ID'ler, ağ arayüzleri, mount listesi gibi) sarıp, o namespace içindeki süreçlere kaynağın kendilerine ait izole bir kopyası gibi gösterir. Dışarıdaki süreçler bu kopyayı göremez; içerideki süreçler de kendi kopyalarından başkasını göremez.</p>
<div class="manpage"><div class="ref">7 namespaces · DESCRIPTION</div><p class="orig">A namespace wraps a global system resource in an abstraction that makes it appear to the processes within the namespace that they have their own isolated instance of the global resource.</p><p>İzolasyonun özü budur: kaynak aslında tektir (örneğin tek bir kernel), ama her namespace ona kendi penceresinden bakar. PID namespace içindeki bir süreç kendini PID 1 sanabilir, oysa host'ta PID\'si 4120\'dir.</p></div>

<h3>2. Sekiz namespace türü</h3>
<p>Her namespace türü tek bir kaynak sınıfını izole eder. Bir container tipik olarak bunların çoğunu birden açar.</p>
<div class="deflist">
<div><dt>mnt (CLONE_NEWNS)</dt><dd>Mount point\'leri izole eder: sürecin gördüğü dosya sistemi yerleşimi. Container\'ın kendi root filesystem\'i buradan gelir. En eski namespace (2002).</dd></div>
<div><dt>pid (CLONE_NEWPID)</dt><dd>Process ID numaralandırmasını izole eder. İçerideki ilk süreç PID 1 olur ve reaper görevi görür; namespace\'in PID 1\'i ölünce tüm namespace çöker.</dd></div>
<div><dt>net (CLONE_NEWNET)</dt><dd>Network interface\'leri, protocol stack\'leri, routing table\'ları ve port\'ları izole eder. Her container kendi loopback\'ine ve kendi 80 portuna sahip olabilir.</dd></div>
<div><dt>ipc (CLONE_NEWIPC)</dt><dd>System V IPC nesnelerini ve POSIX message queue\'ları izole eder.</dd></div>
<div><dt>uts (CLONE_NEWUTS)</dt><dd>Hostname ve NIS domain adını izole eder. Container\'ın kendi hostname\'i bu sayede olur.</dd></div>
<div><dt>user (CLONE_NEWUSER)</dt><dd>User ID ve group ID map\'lerini izole eder. Rootless container\'ların anahtarı (aşağıda).</dd></div>
<div><dt>cgroup (CLONE_NEWCGROUP)</dt><dd>Sürecin gördüğü cgroup root dizinini izole eder; container içinden host\'un cgroup yapısı görünmez.</dd></div>
<div><dt>time (CLONE_NEWTIME)</dt><dd>Boot ve monotonic clock offset\'lerini izole eder (en yeni namespace, 5.6).</dd></div>
</div>

<h3>3. User namespace: rootless container\'ın anahtarı</h3>
<p>User namespace en güçlü ve en tehlikeli olanıdır. İçinde bir süreç root (UID 0) olabilirken, bu UID host\'ta sıradan bir unprivileged kullanıcıya map\'lenir. Böylece ayrıcalık gerektirmeden container kurulabilir (rootless). Mapping <code>/proc/pid/uid_map</code> ve <code>gid_map</code> dosyalarıyla tanımlanır: "container içindeki UID 0, host\'taki UID 100000\'e karşılık gelir" gibi. Diğer namespace türlerini açmak normalde CAP_SYS_ADMIN ister; user namespace bu capability\'yi namespace içinde verdiği için, unprivileged kullanıcılar user namespace üzerinden ötekileri de açabilir — bu hem büyük bir esneklik hem de tekrar eden bir attack surface\'tir.</p>

<h3>4. Namespace yaşam döngüsü</h3>
<p>Üç system call namespace\'lerle çalışır. Bir namespace, ona ait süreç veya bind-mount/açık fd kalmayınca yok olur.</p>
<div class="deflist">
<div><dt>clone(CLONE_NEW*)</dt><dd>Yeni süreci yeni namespace(ler)de başlatır.</dd></div>
<div><dt>unshare()</dt><dd>Çağıran süreci, mevcut namespace\'inden yeni bir namespace\'e taşır (yeni süreç yaratmadan).</dd></div>
<div><dt>setns()</dt><dd>Çağıran süreci, var olan bir namespace\'e katar (örneğin <code>nsenter</code> aracı bunu kullanır).</dd></div>
</div>
<div class="manpage"><div class="ref">7 namespaces · setns</div><p class="orig">The setns(2) system call allows the calling process to join an existing namespace.</p><p>Bir sürecin hangi namespace\'lerde olduğu <code>/proc/pid/ns/</code> altında birer symlink olarak görünür; bu symlink\'in inode numarası namespace\'in kimliğidir. İki sürecin aynı namespace\'te olup olmadığını bu numaraları karşılaştırarak anlarsın.</p></div>

<h3>5. cgroups: izolasyon değil, limit</h3>
<p>Namespace neyi gördüğünü ayarlar; cgroup ne kadar tükettiğini sınırlar. İkisi bağımsızdır ama container\'da birlikte kullanılır.</p>
<div class="manpage"><div class="ref">7 cgroups · DESCRIPTION</div><p class="orig">Control groups, usually referred to as cgroups, are a Linux kernel feature which allow processes to be organized into hierarchical groups whose usage of various types of resources can then be limited and monitored.</p><p>Süreçler bir ağaç halinde gruplanır; her gruba CPU, bellek, I/O gibi kaynaklar için limit konabilir ve kullanım ölçülebilir. OOM değil de limit dolunca throttling veya öldürme devreye girer.</p></div>
<p>Kaynakları yöneten çekirdek bileşenlerine <strong>controller</strong> denir.</p>
<div class="manpage"><div class="ref">7 cgroups · CONTROLLERS</div><p class="orig">Subsystems are sometimes also known as resource controllers (or simply, controllers).</p><p>Başlıca controller\'lar: <code>cpu</code> (CPU zamanı payı/limiti), <code>memory</code> (bellek limiti ve baskı), <code>io</code> (disk bant genişliği), <code>pids</code> (süreç sayısı — fork bombalarına karşı). Her controller cgroup dizinindeki dosyalar üzerinden ayarlanır.</p></div>
<div class="manpage"><div class="ref">7 cgroups · CGROUPS V2</div><p class="orig">In cgroups v2, all mounted controllers reside in a single unified hierarchy.</p><p>v1\'de her controller\'ın ayrı bir hiyerarşisi olabiliyordu ve bu karmaşaya yol açıyordu. v2 hepsini tek bir birleşik ağaçta toplar; modern sistemler (systemd dahil) v2 kullanır.</p></div>

<h3>6. delegation ve container denklemi</h3>
<p>cgroup ağacının bir alt dalının yönetimini ayrıcalıksız bir kullanıcıya devretmek mümkündür; buna delegation denir ve v2 bunu güvenli bir şekilde tasarımdan destekler.</p>
<div class="manpage"><div class="ref">7 cgroups · DELEGATION</div><p class="orig">Cgroups v2 supports delegation with containment by explicit design.</p><p>Böylece bir container runtime, kendi alt ağacını yönetebilir ama host\'un geri kalanını etkileyemez. Özet denklem: <strong>container = namespaces (izolasyon) + cgroups (limit) + seccomp (syscall filtresi) + capabilities (ayrıcalık kısıtı)</strong>. Dördü birden olmadan izolasyon eksiktir.</p></div>`
  },
