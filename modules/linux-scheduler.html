  deepDive: {
    heading: "Derinlemesine: scheduler nasıl karar verir?",
    html: `<p class="lead">Scheduler, çalışmaya hazır onlarca thread arasından her an birini seçmek zorundadır. Bu seçim hem adalet (fairness), hem düşük gecikme (latency), hem de verim (throughput) arasında bir dengedir. Linux bunu farklı scheduling class'lar ve 2024'te CFS'in yerini alan EEVDF algoritmasıyla çözer. Bu bölüm man sayfalarına dayanır.</p>

<h3>1. Scheduling class'lar: her thread aynı kurala tabi değil</h3>
<p>Her thread bir scheduling policy'ye bağlıdır. Real-time policy'ler (FIFO, RR) her zaman normal policy'lerin önüne geçer; yani tek bir SCHED_FIFO thread'i, ne kadar nice olursa olsun tüm normal thread'leri aç bırakabilir.</p>
<div class="manpage"><div class="ref">7 sched · DESCRIPTION</div><p class="orig">The scheduler is the kernel component that decides which runnable thread will be executed by the CPU next.</p><p>Scheduler, bir sonraki CPU'yu hangi runnable thread'in alacağına karar veren çekirdek bileşenidir. Hangi thread'in "hazır" olduğu, hangi policy'de olduğu ve önceliği bu kararı belirler.</p></div>
<div class="deflist">
<div><dt>SCHED_OTHER</dt><dd>Varsayılan zaman paylaşımlı (time-sharing) policy; kaynakta adı SCHED_NORMAL. Tüm sıradan uygulamalar burada. nice değeriyle ayarlanır, EEVDF yönetir.</dd></div>
<div><dt>SCHED_FIFO</dt><dd>Static priority'li, time slice'sız real-time policy. Bir kez CPU'yu alınca kendi bırakana veya daha yüksek priority'li biri gelene kadar koşar.</dd></div>
<div><dt>SCHED_RR</dt><dd>FIFO'nun round-robin hâli: aynı priority'deki thread'ler sırayla bir time quantum kadar koşar.</dd></div>
<div><dt>SCHED_BATCH</dt><dd>CPU-yoğun toplu işler için; scheduler thread'i hep CPU-intensive sayar, interaktif olmadığını varsayar.</dd></div>
<div><dt>SCHED_IDLE</dt><dd>Son derece düşük öncelik; yalnızca sistem tamamen boştayken koşacak işler için.</dd></div>
<div><dt>SCHED_DEADLINE</dt><dd>EDF tabanlı; her işe (runtime, deadline, period) verilir. Diğer hepsinden yüksek önceliklidir, gerçek zamanlı garantiler içindir.</dd></div>
</div>
<div class="manpage"><div class="ref">7 sched · SCHED_FIFO</div><p class="orig">SCHED_FIFO is a simple scheduling algorithm without time slicing.</p><p>SCHED_FIFO time slice kullanmaz: thread CPU'yu bırakana, uyumaya geçene veya daha yüksek priority'li bir thread hazır olana kadar koşar. Bu yüzden yanlış kullanılan bir real-time thread sistemi kilitleyebilir.</p></div>

<h3>2. nice ve weight: adaletin ağırlığı</h3>
<p>Normal thread'lerde öncelik, nice değeriyle ifade edilir. nice doğrudan bir pay değil, bir <em>weight</em>'e çevrilir; CPU payı thread'in weight'inin toplam weight'e oranıdır. Her nice adımı payı yaklaşık %10 oynatır.</p>
<div class="manpage"><div class="ref">2 nice · DESCRIPTION</div><p class="orig">nice() adds inc to the nice value for the calling thread. The range of the nice value is +19 (low priority) to -20 (high priority).</p><p>nice() çağıran thread'in nice değerine <code>inc</code> ekler. Aralık +19 (düşük öncelik) ile -20 (yüksek öncelik) arasındadır. Negatif değer vermek (daha yüksek öncelik) ayrıcalık ister (CAP_SYS_NICE).</p></div>

<h3>3. CFS'ten EEVDF'e: vruntime, lag ve virtual deadline</h3>
<p>Yıllarca normal thread'leri CFS yönetti: her thread'in bir <strong>vruntime</strong>'ı (weight'e göre ölçeklenmiş, "ne kadar koştu") vardı ve scheduler hep en düşük vruntime'lı thread'i seçerdi — böylece herkes adil pay alırdı. Linux 6.6 (2023–2024) bunu <strong>EEVDF</strong> (Earliest Eligible Virtual Deadline First) ile değiştirdi.</p>
<p>EEVDF iki kavram ekler: <strong>lag</strong> (bir thread hak ettiği paydan ne kadar geride/ileride) ve her thread'e bir <strong>virtual deadline</strong>. Scheduler, lag'i pozitif olan (yani hak ettiğinden az almış, "eligible") thread'ler arasından virtual deadline'ı en erken olanı seçer. Bu, gecikmeye duyarlı (latency-sensitive) kısa işlerin uzun CPU-yoğun işlerin önüne daha öngörülebilir biçimde geçmesini sağlar.</p>

<h3>4. Preemption: thread'in CPU'su ne zaman elinden alınır?</h3>
<p>Bir thread CPU'yu iki şekilde bırakır. <strong>Voluntary</strong>: kendisi bloklanır (I/O bekler, uyur, kilit bekler). <strong>Involuntary (preemption)</strong>: scheduler onu zorla durdurur — ya time slice'ı bitmiştir, ya daha uygun bir thread hazır olmuştur. Her scheduler tick'inde (<code>CONFIG_HZ</code>, tipik 250/1000 Hz) çekirdek yeniden değerlendirme yapar.</p>
<p>Modern çekirdek "fully preemptible" olabilir: yalnızca user space değil, çekirdek kodunun kendisi de (bazı kritik bölümler hariç) preempt edilebilir — bu düşük gecikme için önemlidir.</p>

<h3>5. Real-time ve priority tersliği</h3>
<p>Real-time policy'lerde static priority 1–99 arasıdır ve mutlaktır: yüksek priority düşüğü tamamen aç bırakabilir.</p>
<div class="manpage"><div class="ref">7 sched · SCHED_DEADLINE</div><p class="orig">SCHED_DEADLINE threads are the highest priority (user controllable) threads in the system; if any SCHED_DEADLINE thread is runnable, it will preempt any thread scheduled under one of the other policies.</p><p>SCHED_DEADLINE thread'leri sistemdeki en yüksek öncelikli (kullanıcı denetimli) thread'lerdir; biri hazırsa diğer tüm policy'lerin önüne geçer. Bu güç, yanlış kullanımda sistemin geri kalanını aç bırakma riski taşır — bu yüzden çekirdek bir "RT throttling" sınırı uygular.</p></div>
<p>Buradaki klasik tuzak <em>priority inversion</em>: düşük priority'li bir thread bir kilidi tutarken, yüksek priority'li bir thread o kilidi bekler ve orta priority'li thread'ler ikisini de geçer. Çözüm priority inheritance'tır (kilidi tutan geçici olarak yükseltilir).</p>

<h3>6. Çok çekirdek: per-CPU run queue ve load balancing</h3>
<p>Her CPU'nun kendi run queue'su vardır (kilit çekişmesini azaltmak için). Bu yüzden ikinci bir sorun doğar: bir CPU dolarken diğeri boş kalabilir. <strong>Load balancing</strong>, çekirdeğin thread'leri periyodik olarak CPU'lar arasında taşıyarak yükü dengelemesidir. Taşıma ucuz değildir (cache sıcaklığı kaybolur), bu yüzden çekirdek <em>CPU affinity</em>'ye (<code>taskset</code>, <code>sched_setaffinity</code>) ve NUMA yerelliğine saygı gösterir.</p>`
