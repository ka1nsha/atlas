    html: `<p class="lead">Sinyaller yüzeyde basittir — "sürece bir numara yolla" — ama disposition, mask, pending ve async-signal-safety ayrıntıları hem günlük hataların hem de çekirdek tasarımının kalbindedir. Bu bölüm <code>signal(7)</code> ve <code>signal-safety(7)</code> man sayfalarına dayanır.</p>

<h3>1. Standard ve real-time signals</h3>
<p>İki tür signal vardır. <strong>Standard signals</strong> (1–31) kuyruklanmaz: bir signal blocked iken aynısından birçoğu gelirse, pending kümesinde yalnızca <em>bir</em> tane kalır; gerisi kaybolur. <strong>Real-time signals</strong> (SIGRTMIN–SIGRTMAX) ise kuyruklanabilir ve gönderim sırasına göre teslim edilir.</p>
<div class="manpage"><div class="ref">7 signal · real-time</div><p class="orig">Multiple instances of real-time signals can be queued.</p><p>1000 bağlantı 1000 standard signal yollarsa çoğu birleşip tek pending'e düşer; bu yüzden olay sayımı için standard signals güvenilir değildir. Real-time signals her örneği korur ve <code>sigqueue(3)</code> ile yanında bir değer bile taşıyabilir.</p></div>

<h3>2. Disposition ve default action</h3>
<p>Her süreç, her signal için bir <strong>disposition</strong> tutar: ya default action, ya ignore, ya da bir signal handler. Handler kurulmazsa çekirdek o signal'in default action'ını uygular. Default action'lar beş gruptur:</p>
<div class="deflist">
<div><dt>Term</dt><dd>Süreç sonlandırılır (SIGINT, SIGTERM, SIGHUP, SIGPIPE).</dd></div>
<div><dt>Core</dt><dd>Süreç sonlandırılır ve core dump alınır (SIGSEGV, SIGQUIT, SIGABRT).</dd></div>
<div><dt>Ign</dt><dd>Signal yok sayılır (SIGCHLD default'u).</dd></div>
<div><dt>Stop</dt><dd>Süreç askıya alınır/durdurulur (SIGSTOP, SIGTSTP, Ctrl-Z).</dd></div>
<div><dt>Cont</dt><dd>Durmuş süreç devam ettirilir (SIGCONT).</dd></div>
</div>

<h3>3. Pending signals ve signal mask</h3>
<p>Bir signal, üretildiği andan teslim edildiği ana kadar <strong>pending</strong> sayılır. Süreç bir <strong>signal mask</strong> ile belirli signalleri <strong>blocked</strong> yapabilir; blocked bir signal üretilse bile teslim edilmez, mask kalkana dek pending kalır. Bu, critical section'ları kesintiden korumanın yoludur.</p>
<div class="manpage"><div class="ref">7 signal · mask</div><p class="orig">A signal may be blocked, which means that it will not be delivered until it is later unblocked.</p><p>Mask thread başınadır: her thread kendi blocked kümesine sahiptir (<code>pthread_sigmask</code>, tek-thread'de <code>sigprocmask</code>). fork() ile doğan çocuk <strong>boş bir pending kümesiyle</strong> başlar; mask ise miras alınır ve execve() boyunca korunur.</p></div>
<p><code>/proc/PID/status</code> içindeki <code>SigPnd</code> (pending) ve <code>SigBlk</code> (blocked) satırları bu kümeleri bitmask olarak gösterir; bit 2 (değer 0x2) SIGINT demektir.</p>

<h3>4. SIGKILL ve SIGSTOP: durdurulamayanlar</h3>
<div class="manpage"><div class="ref">7 signal · SIGKILL / SIGSTOP</div><p class="orig">The signals SIGKILL and SIGSTOP cannot be caught, blocked, or ignored.</p><p>Bu iki signal için ne handler kurulabilir, ne mask'lenebilir, ne ignore edilebilir — çekirdek onları her zaman uygular. <code>kill -9</code> (SIGKILL) takılan bir süreci bu yüzden kesin öldürür; süreç kendini koruyamaz. SIGSTOP da süreci koşulsuz durdurur.</p></div>

<h3>5. async-signal-safe: handler içinde ne çağrılabilir?</h3>
<p>Signal asenkron gelir: handler, programı herhangi bir noktada — ör. <code>malloc</code> bir iç kilidi tutarken — kesebilir. Handler o anda aynı <code>malloc</code>'u çağırırsa kilit zaten tutulduğundan deadlock ya da heap bozulması olur. Bu yüzden handler yalnızca <strong>async-signal-safe</strong> fonksiyonlar çağırmalıdır.</p>
<div class="manpage"><div class="ref">7 signal-safety · definition</div><p class="orig">An async-signal-safe function is one that can be safely called from within a signal handler.</p><p>Bir fonksiyon async-signal-safe'tir, çünkü ya <strong>reentrant</strong>'tır ya da signal'lere karşı atomiktir. POSIX güvenli olanların listesini verir: örneğin <code>write(2)</code>, <code>read(2)</code>, <code>_exit(2)</code>, <code>kill(2)</code>, <code>sigprocmask(2)</code> güvenlidir. <code>printf</code> ve <code>malloc</code> güvenli DEĞİLDİR.</p></div>
<p>Pratikte handler en aza indirilir: çoğu zaman yalnızca bir <code>volatile sig_atomic_t</code> bayrağı yazılır, asıl iş ana döngüde yapılır.</p>

<h3>6. sigaction vs signal: neden sigaction?</h3>
<p>Eski <code>signal()</code> çağrısının davranışı sistemler arasında tutarsızdır (bazılarında handler bir kez çalışıp default'a döner). <code>sigaction()</code> taşınabilir ve daha fazla kontrol sunar: <code>SA_RESTART</code> bayrağı, bir handler yüzünden yarıda kesilen yavaş sistem çağrılarını (ör. <code>read</code>) otomatik yeniden başlatır; aksi halde çağrı <code>EINTR</code> ile döner ve bunu elle ele almak gerekir. Bu yüzden yeni kodda her zaman <code>sigaction</code> tercih edilir.</p>`
