  deepDive: {
    heading: 'Derinlemesine: çekirdeğin kilit araç kutusu',
    html: `<p class="lead">Tek bir "kilit" yoktur. Linux kernel'i, kritik bölümün ne kadar sürdüğüne, çağrının interrupt context'inde mi process context'inde mi olduğuna ve okuma/yazma oranına göre bir dizi senkronizasyon primitifi sunar. Yanlış seçim ya performansı öldürür ya da sistemi kilitler (deadlock). Bu bölüm kernel.org kilitleme belgelerine dayanır.</p>

<h3>1. Neden kilit? Critical section ve race condition</h3>
<p>Birden çok CPU aynı veriye dokunduğunda, <code>counter++</code> gibi "basit" bir işlem bile bölünebilir (load/add/store) ve araya başka bir CPU girerse güncelleme kaybolur. Aynı paylaşılan veriye erişen kod bölgesine <strong>critical section</strong> denir; amaç aynı anda yalnızca bir thread-of-control'ün orada olmasını garanti etmektir.</p>
<div class="manpage src-docs"><div class="ref">docs · locking/spinlocks</div><p class="orig">the spinlock itself will guarantee the global lock, so it will guarantee that there is only one thread-of-control within the region(s) protected by that lock.</p><p>Bir kilidin tek işi budur: koruduğu bölge(ler)e aynı anda tek bir yürütme akışının girmesini sağlamak. Geri kalan her şey (dönerek mi beklesin, uyusun mu, okuyucuya izin versin mi) bu temel garantinin üzerine kurulan mühendislik tercihleridir.</p></div>

<h3>2. Atomic operations ve memory ordering</h3>
<p>En hafif araç, hiç kilit kullanmamaktır: tek bir değişkeni bölünmez (atomic) bir komutla güncellemek. <code>atomic_t</code> ve <code>atomic_inc()</code>/<code>cmpxchg()</code> gibi işlemler donanımın atomik komutlarına çevrilir; counter örneğindeki üç adımı tek, bölünmez adıma indirir.</p>
<p>Ama atomiklik tek sorun değildir: modern CPU ve derleyiciler, sıralı görünen bellek işlemlerini performans için <strong>yeniden sıralayabilir</strong> (reordering). Bir thread'in yazdıklarının başka bir thread'ce doğru sırada görülmesini garanti etmek için <strong>memory barrier</strong> (bellek bariyeri) gerekir.</p>
<div class="deflist">
<div><dt>atomic_t / cmpxchg</dt><dd>Tek değişken üzerinde bölünmez oku-değiştir-yaz. Sayaç, bayrak, referans sayımı için kilitten ucuzdur.</dd></div>
<div><dt>smp_mb() / smp_rmb() / smp_wmb()</dt><dd>Full / read / write memory barrier. İşlemlerin bariyerin iki yanında yeniden sıralanmasını engeller.</dd></div>
<div><dt>READ_ONCE / WRITE_ONCE</dt><dd>Derleyicinin erişimi önbelleğe almasını/bölmesini engeller; lockless desenlerin yapı taşı.</dd></div>
</div>

<h3>3. Spinlock: dönerek bekleyen kilit</h3>
<p>En temel kilit <strong>spinlock</strong>'tur. Kilit meşgulse bekleyen CPU uyumaz; bir döngüde dönerek (busy-wait) kilidin boşalmasını bekler. Uyumadığı için interrupt context'inde bile kullanılabilir; ama CPU harcadığı için yalnızca <strong>çok kısa</strong> kritik bölümler için uygundur.</p>
<div class="manpage src-docs"><div class="ref">docs · locking/spinlocks</div><p class="orig">the most basic primitive for locking ... are most easily added to places that are completely independent of other code.</p><p>Spinlock'un demiri budur. Kritik bölümde uyku-tetikleyen (blocking) hiçbir işlem yapılamaz: spinlock tutarken bir mutex almak ya da kullanıcı belleğine kopyalamak gibi uyuyabilecek bir iş yapmak ölümcüldür.</p></div>
<p>Bir spinlock'u hem process context hem de interrupt handler kullanıyorsa, interrupt'ların araya girip deadlock yaratmaması için interrupt'ları yerel olarak kapatan varyant gerekir:</p>
<div class="manpage src-docs"><div class="ref">docs · locking/spinlocks · irqsave</div><p class="orig">It will disable interrupts _locally_, but the spinlock itself will guarantee the global lock ... The above is always safe.</p><p><code>spin_lock_irqsave()</code> yerel CPU'da interrupt'ları kapatıp kilidi alır, <code>spin_unlock_irqrestore()</code> eski durumu geri yükler. Kilit yalnızca process context'ten kullanılıyorsa sade <code>spin_lock()</code> yeter.</p></div>
<div class="deflist">
<div><dt>ticket spinlock</dt><dd>Her bekleyen bir "sıra numarası" alır; kilit sırayla verilir. Açlığı (starvation) önler, adalet getirir.</dd></div>
<div><dt>qspinlock (queued)</dt><dd>Modern Linux'un varsayılanı. Bekleyenler CPU-yerel bir kuyrukta beklediği için çok çekirdekli sistemlerde cache-line çekişmesini azaltır.</dd></div>
</div>

<h3>4. Uyuyan kilitler: semaphore ve mutex</h3>
<p>Kritik bölüm uzunsa ya da içinde uyku gerekiyorsa, dönerek beklemek israftır. O zaman bekleyen thread'i uyutan <strong>sleeping lock</strong>'lar kullanılır. Bunlar yalnızca process context'te geçerlidir — interrupt context uyuyamaz.</p>
<div class="manpage src-docs"><div class="ref">docs · locking/mutex-design</div><p class="orig">Mutexes are sleeping locks which behave similarly to binary semaphores ... Only one task can hold the mutex at a time ... Only the owner can unlock the mutex.</p><p>Mutex, sahiplik (ownership) kavramı olan uyuyan bir kilittir: kimse onu tutarken başka bir task bekler (uyur), ve yalnızca kilidi alan task onu bırakabilir. Bu sahiplik kuralı, semaphore'dan en büyük farkıdır ve lockdep gibi doğrulayıcıların hataları yakalamasını sağlar.</p></div>
<div class="manpage src-docs"><div class="ref">docs · locking/mutex-design · kısıtlar</div><p class="orig">Mutexes may not be used in hardware or software interrupt contexts such as tasklets and timers.</p><p>Bu yüzden bir timer callback'inde ya da IRQ handler'da mutex alınamaz; orada ya spinlock ya da hiç uyumayan bir mekanizma gerekir. Mutex ayrıca performans için bir "spin optimizasyonu" içerir: sahip başka bir CPU'da çalışıyorsa, kısa bir süre uyumadan dönebilir (hybrid davranış).</p></div>
<div class="deflist">
<div><dt>semaphore</dt><dd>Sayaçlı uyuyan kilit. N eşzamanlı erişime izin verebilir (counting semaphore). Sahiplik kavramı yoktur; bir task alıp başka bir task bırakabilir.</dd></div>
<div><dt>mutex</dt><dd>Tek sahipli ikili kilit. Daha basit arayüz, sahiplik doğrulaması, interrupt'ta kullanılamaz. Kernel'in tercih ettiği genel amaçlı kilit.</dd></div>
<div><dt>rw_semaphore</dt><dd>Okuyucu/yazıcı uyuyan kilit: birden çok okuyucu aynı anda girebilir, yazıcı tek başına. Okuma çoğunlukta ama RCU fazla karmaşıksa uygundur.</dd></div>
</div>

<h3>5. seqlock ve RCU: okuyucu-ağırlıklı dünyalar</h3>
<p>Okumaların ezici çoğunlukta, yazmaların nadir olduğu veriler için okuyucuyu hiç kilitletmemek en büyük kazançtır. İki klasik yaklaşım: <strong>seqlock</strong> ve <strong>RCU</strong>.</p>
<p><strong>seqlock</strong> bir sıra sayacı (sequence counter) kullanır: yazıcı sayacı artırır, okuyucu okumadan önce ve sonra sayaca bakar; sayac değişmişse (yazıcı araya girmişse) okumayı tekrarlar. Okuyucu kilit almaz ama tutarsız gördüğünde yeniden dener; bu yüzden yan etkisiz, kısa okumalar için uygundur.</p>
<div class="manpage src-docs"><div class="ref">docs · RCU/whatisRCU</div><p class="orig">The basic idea behind RCU is to split updates into "removal" and "reclamation" phases ... The ability to wait until all readers are done allows RCU readers to use much lighter-weight synchronization.</p><p>RCU'da okuyucular <code>rcu_read_lock()</code> ile işaretlenir ama bu neredeyse bedavadır (çoğu yapılandırmada hiçbir atomik işlem/ bariyer yoktur). Yazıcı veriyi <em>yerinde değiştirmez</em>: yeni bir kopya hazırlar, işaretçiyi atomik olarak yeni kopyaya çevirir (removal), eski kopyayı ancak tüm mevcut okuyucular bitince serbest bırakır (reclamation).</p></div>
<div class="manpage src-docs"><div class="ref">docs · RCU/whatisRCU · grace period</div><p class="orig">[synchronize_rcu blocks] until all pre-existing RCU read-side critical sections on all CPUs have completed ... RCU is optimized for read-mostly situations.</p><p>Eski kopyanın güvenle silinebileceği "tüm eski okuyucular bitti" anına <strong>grace period</strong> denir. Okuyucu bir eski kopyayı okurken yazıcı yeni kopyayı yayınlamış olabilir; ikisi bir süre yan yana yaşar. Bu yüzden RCU, okuma çok / yazma az olan (dizin, routing table, config) veriler için idealdir.</p></div>

<h3>6. Hangisini ne zaman? ve lockdep</h3>
<p>Doğru primitif üç soruyla seçilir: (a) kritik bölümde uyku gerekir mi? (b) interrupt context'te mi çağrılıyor? (c) okuma/yazma oranı nedir?</p>
<div class="deflist">
<div><dt>çok kısa, interrupt context olası</dt><dd>spinlock (gerekirse irqsave). Uyku yasak.</dd></div>
<div><dt>uzun / uyku gerekli, process context</dt><dd>mutex (genel), semaphore (sayaçlı erişim).</dd></div>
<div><dt>okuma ağırlıklı, yazma nadir</dt><dd>RCU (en hafif okuyucu) ya da rw_semaphore / seqlock.</dd></div>
<div><dt>tek değişken sayaç/bayrak</dt><dd>atomic_t — kilit bile gerekmez.</dd></div>
</div>
<p>Birden çok kilit kullanıldığında en büyük tehlike <strong>deadlock</strong>'tur: iki CPU kilitleri ters sırayla alırsa birbirini sonsuza kadar bekler. Linux bunu <strong>lockdep</strong> (lock dependency validator) ile yakalar: çalışma anında kilit alım sıralarını izler, tehlikeli bir sıralama (lock ordering) gördüğünde henüz deadlock olmadan uyarır. Kural basittir: kilitleri her yerde aynı sırayla al.</p>`
  },
