  deepDive: {
    heading: "Derinlemesine: bir syscall'ın anatomisi",
    html: `<p class="lead">Bir system call yüzeyde sıradan bir fonksiyon çağrısı gibi görünür, ama altında CPU'nun ayrıcalık seviyesini değiştiren, donanım destekli bir mekanizma yatar. Register sözleşmesinden errno'ya, vDSO'dan ABI kararlılığına kadar ayrıntılar hem performans hem güvenlik için belirleyicidir. Bu bölüm man sayfalarına dayanır.</p>

<h3>1. İki dünya: user space ve kernel space</h3>
<p>CPU, kodu farklı privilege level'larda (x86-64'te "ring") çalıştırır. Uygulamalar ring 3'te (user mode) koşar: donanıma, fiziksel belleğe, başka process'lerin adres uzayına doğrudan erişemezler. Yalnızca kernel'in çalıştığı ring 0'da (kernel mode) bu işlemler yapılabilir. System call, bu iki dünya arasındaki tek denetimli kapıdır — ve denetimli olması şart, çünkü user space'e güvenilmez.</p>
<div class="manpage"><div class="ref">2 syscalls · DESCRIPTION</div><p class="orig">The system call is the fundamental interface between an application and the Linux kernel.</p><p>Bir uygulamanın kernel'le konuşabildiği <strong>tek</strong> temel arayüz budur. <code>printf</code>, <code>malloc</code>, <code>fopen</code> gibi her şey eninde sonunda bir veya birden çok system call'a iner.</p></div>

<h3>2. Calling convention: argümanlar register'larda</h3>
<p>System call'ın argümanları stack'e değil, önceden belirlenmiş register'lara konur. x86-64'te sözleşme şöyledir:</p>
<div class="deflist">
<div><dt>%rax</dt><dd>Çağrıdan önce: syscall number. Çağrıdan sonra: return value. Aynı register iki rolü üstlenir.</dd></div>
<div><dt>%rdi</dt><dd>1. argüman.</dd></div>
<div><dt>%rsi</dt><dd>2. argüman.</dd></div>
<div><dt>%rdx</dt><dd>3. argüman.</dd></div>
<div><dt>%r10</dt><dd>4. argüman. <strong>Dikkat:</strong> sıradan fonksiyon ABI'sinde 4. argüman %rcx'tir; ama <code>syscall</code> komutu dönüş adresini %rcx'e sakladığı için, system call ABI 4. argümanı %r10'a kaydırır.</dd></div>
<div><dt>%r8</dt><dd>5. argüman.</dd></div>
<div><dt>%r9</dt><dd>6. argüman.</dd></div>
</div>
<div class="manpage"><div class="ref">2 syscall · DESCRIPTION</div><p class="orig">syscall() is a small library function that invokes the system call whose assembly language interface has the specified number with the specified arguments.</p><p>man sayfası her mimari için ayrı bir tablo verir; x86-64 satırı yukarıdaki register'ları listeler. Başka bir mimaride (örn. ARM64) sözleşme tamamen farklıdır — bu yüzden ham syscall kodu taşınabilir değildir.</p></div>

<h3>3. Dönüş değeri ve errno</h3>
<p>Kernel, sonucu %rax'e koyar. Başarıda bu bir pozitif değer veya 0'dır; hatada ise negatif bir errno kodudur. glibc wrapper'ı bu negatif değeri yakalar, işaretini çevirip global <code>errno</code> değişkenine yazar ve çağırana -1 döndürür.</p>
<div class="manpage"><div class="ref">2 syscall · RETURN VALUE</div><p class="orig">A -1 return value indicates an error, and an error number is stored in errno.</p><p>Gördüğün <code>-1</code> ve <code>errno</code>, kernel'in değil glibc'nin ürettiği soyutlamadır. Kernel düzeyinde dönen değer doğrudan <code>-EBADF</code>, <code>-EFAULT</code> gibi negatif sayılardır; glibc bunları <code>[-4095, -1]</code> aralığında görüp hata olarak yorumlar. Ham syscall yazarken bu çeviri olmaz: errno'yu kendin kontrol etmen gerekir.</p></div>

<h3>4. vDSO: kernel'e girmeden çalışan syscall'lar</h3>
<p>Her system call bir mode geçişi gerektirir ve bu geçiş ucuz değildir. <code>gettimeofday</code> veya <code>clock_gettime</code> gibi sık çağrılan, sadece okuma yapan bazı çağrılar için kernel bir hile kullanır: vDSO (virtual Dynamic Shared Object). Kernel, bu fonksiyonların kodunu ve verisini her process'in adres uzayına salt okunur olarak eşler; böylece çağrı ring 0'a hiç geçmeden, sıradan bir fonksiyon çağrısı hızında tamamlanır. <code>ldd</code> ile herhangi bir programda <code>linux-vdso.so.1</code>'i görebilirsin — diskte olmayan, kernel'in enjekte ettiği bir kütüphanedir.</p>

<h3>5. Syscall numaraları ve ABI kararlılığı</h3>
<p>System call numaraları bir dizinin (sys_call_table) index'leridir ve mimariye özgüdür: x86-64'te write = 1 iken 32-bit x86'da farklıdır. Bu numaralar bir kez atandıktan sonra pratikte <strong>asla değişmez ve yeniden kullanılmaz</strong> — çünkü eski binary'ler ham numaralarla derlenmiş olabilir; numarayı değiştirmek onları bozardı. Bu, kernel'in en katı uyumluluk sözüdür (ABI stability).</p>
<div class="manpage"><div class="ref">2 syscalls · DESCRIPTION</div><p class="orig">The slot for phys(2) is in use since Linux 2.1.116 for umount(2).</p><p>Terk edilmiş bir çağrının (phys) numara "slot"unun yıllar sonra başka bir çağrıya (umount) verilmesi, numaraların bir tablo index'i olduğunu ve boş yere harcanmadığını gösterir. Numaralar <code>/usr/include/asm/unistd.h</code>'de <code>__NR_write</code> gibi sabitlerle tanımlıdır.</p></div>

<h3>6. seccomp: hangi syscall'lara izin var?</h3>
<p>System call sınırı aynı zamanda bir güvenlik kapısıdır. seccomp (secure computing mode), bir process'in yapabileceği system call'ları bir BPF filtresiyle kısıtlar: izin verilmeyen bir çağrı denendiğinde process öldürülür veya çağrı reddedilir. Container'lar, tarayıcı sandbox'ları ve systemd servisleri saldırı yüzeyini daraltmak için bunu yoğun kullanır — bir process yalnızca ihtiyaç duyduğu birkaç çağrıya izinliyse, bir açık bulunsa bile kernel'e verebileceği zarar sınırlıdır. Bir process'in seccomp durumunu <code>/proc/&lt;pid&gt;/status</code> dosyasındaki <code>Seccomp:</code> satırından görebilirsin.</p>`
  },
