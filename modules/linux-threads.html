  deepDive: {
    heading: "Derinlemesine: thread'ler ve futex nasıl çalışır?",
    html: `<p class="lead">Bir thread, fork() ile doğan ayrı bir process'in tersidir: belleği kopyalamak yerine paylaşır. Bu paylaşımın ne olduğu, kernel'in thread'leri nasıl gördüğü ve bir mutex kilidinin çoğu zaman kernel'e hiç inmeden nasıl çalıştığı, eşzamanlı programlamanın temelidir. Bu bölüm man sayfalarına dayanır.</p>

<h3>1. Bir thread neyi paylaşır, neyi paylaşmaz?</h3>
<p>Aynı process içindeki thread'ler aynı programı çalıştırır ve çoğu kaynağı ortak kullanır; ama her birinin kendine ait olan bazı şeyleri de vardır. Bir thread'de yapılan değişikliğin neden diğerinde de göründüğünü (ya da görünmediğini) bu ayrım belirler.</p>
<div class="deflist">
<div><dt>global memory</dt><dd>Data ve heap segment'leri tüm thread'lerce paylaşılır — bir thread'in yazdığı global değişkeni diğeri görür. Senkronizasyon ihtiyacı buradan doğar.</dd></div>
<div><dt>stack</dt><dd>Her thread'in kendi stack'i vardır; yerel (automatic) değişkenler thread'e özeldir.</dd></div>
<div><dt>file descriptors</dt><dd>Açık file descriptor'lar paylaşılır — bir thread'in açtığı dosyayı diğeri aynı fd ile kullanır.</dd></div>
<div><dt>signal handlers</dt><dd>Signal disposition'ları process genelindedir; ama her thread'in kendi signal mask'i olabilir.</dd></div>
<div><dt>PID / cwd / umask</dt><dd>Process ID, working directory, umask, user/group ID'leri paylaşılır.</dd></div>
</div>
<div class="manpage"><div class="ref">7 pthreads · THREADS</div><p class="orig">These threads share the same global memory (data and heap segments), but each thread has its own stack (automatic variables).</p><p>İşte fork ile en temel fark: fork bir process'i kopyalar (ayrı address space); thread ise aynı address space'i paylaşır. Paylaşılan heap'e iki thread aynı anda yazarsa veri yarışı (race condition) olur — kilit bu yüzden gerekir.</p></div>

<h3>2. 1:1 model: her thread bir kernel task'ı</h3>
<p>Linux'ta thread kütüphanesi NPTL (Native POSIX Thread Library), 1:1 modeli uygular: her kullanıcı-seviyesi thread, kernel'in ayrı bir scheduling entity'sine (task) karşılık gelir. Yani kernel thread'leri doğrudan zamanlar; ayrı bir kullanıcı-alanı zamanlayıcısı yoktur.</p>
<div class="manpage"><div class="ref">7 pthreads · LINUX IMPLEMENTATIONS</div><p class="orig">Both of these are so-called 1:1 implementations, meaning that each thread maps to a kernel scheduling entity.</p><p>Bunun sonucu: bir process içinde N thread varsa, kernel'de N task görünür. Bu task'lar bir <strong>thread group</strong> oluşturur. Thread group'un ortak bir PID'si (tgid) vardır ama her thread'in kendine özgü bir TID'si (thread ID) vardır.</p></div>
<div class="manpage"><div class="ref">7 pthreads · NPTL</div><p class="orig">all members of a thread group share the same PID.</p><p><code>getpid()</code> tüm thread'lerde aynı değeri (process ID) döndürür; <code>gettid()</code> ise o thread'e özgü TID'yi verir. <code>ps -T</code> veya <code>/proc/&lt;pid&gt;/task/</code> ile bir process'in thread'lerini TID'leriyle görebilirsin.</p></div>

<h3>3. clone() ile bir thread nasıl doğar?</h3>
<p>fork() ile thread yaratma arasındaki tek fark, altta yatan <code>clone()</code> çağrısına verilen flag'lerdir. fork hiçbir şey paylaşmaz; thread ise aşağıdaki flag'lerle neredeyse her şeyi paylaşır:</p>
<div class="deflist">
<div><dt>CLONE_VM</dt><dd>Address space paylaşılır (bellek kopyalanmaz). Thread'i thread yapan asıl flag budur.</dd></div>
<div><dt>CLONE_FILES</dt><dd>File descriptor tablosu paylaşılır.</dd></div>
<div><dt>CLONE_FS</dt><dd>Working directory, root directory, umask paylaşılır.</dd></div>
<div><dt>CLONE_SIGHAND</dt><dd>Signal handler tablosu paylaşılır.</dd></div>
<div><dt>CLONE_THREAD</dt><dd>Yeni task aynı thread group'a (aynı PID) konur.</dd></div>
<div><dt>CLONE_SETTLS</dt><dd>Thread-local storage (TLS) için ayrı bir alan kurulur.</dd></div>
</div>
<p>fork() bu flag'lerin hiçbirini kullanmaz (yalnızca SIGCHLD); bu yüzden fork modülündeki copy-on-write devreye girer. Thread'de kopyalama yoktur — bu hem hızlıdır hem de senkronizasyon sorumluluğunu programcıya yükler.</p>

<h3>4. futex: kilidin ucuz yolu</h3>
<p>Bir mutex kilidi her seferinde kernel'e inseydi, kilitleme çok yavaş olurdu. Linux'un çözümü <strong>futex</strong> (fast user-space mutex): kilit çekişmesiz (uncontended) olduğunda — yani kimse beklemiyorsa — kilit tamamen user space'te, atomic bir komutla alınır; kernel hiç devreye girmez.</p>
<div class="manpage"><div class="ref">2 futex · DESCRIPTION</div><p class="orig">In the uncontended case, a thread can access or modify the lock state with atomic instructions. (Such instructions are performed entirely in user mode, and the kernel maintains no information about the lock state.)</p><p>Yani bir mutex'i alıp bırakmanın tipik (çekişmesiz) yolu bir CAS (compare-and-swap) komutudur; syscall yoktur, bağlam değişimi (context switch) yoktur. futex yalnızca <strong>contention</strong> (çekişme) olduğunda, yani bir thread meşgul bir kilidi beklemek zorunda kaldığında kernel'e iner.</p></div>
<div class="manpage"><div class="ref">2 futex · DESCRIPTION</div><p class="orig">The futex() system call provides a method for waiting until a certain condition becomes true. It is typically used as a blocking construct in the context of shared-memory synchronization.</p><p>Çekişme olduğunda thread <code>FUTEX_WAIT</code> ile kendini kernel'de uyutur (meşgul beklemez, CPU harcamaz); kilidi bırakan thread ise bekleyen varsa <code>FUTEX_WAKE</code> ile onu uyandırır. Kernel'e iniş yalnızca bu "nadir" durumda olur.</p></div>

<h3>5. Üstüne kurulanlar ve fork farkı</h3>
<p>pthread mutex, condition variable, semaphore ve read-write lock — hepsi futex üstüne kuruludur; "hızlı yol user space, yavaş yol kernel" deseni aynıdır. Bir condition variable'ın <code>pthread_cond_wait</code>'i de bir futex üzerinde uyur.</p>
<p>Özet fark: <strong>fork kopyalar, thread paylaşır.</strong> fork güvenlidir ama izolasyon ister (process'ler birbirinin belleğini göremez); thread hızlıdır ve veri paylaşımı kolaydır ama her paylaşılan veri için senkronizasyon (mutex/atomic) sorumluluğu programcıdadır. Yanlış kilitleme → race condition, deadlock; eksik kilitleme → bozuk veri.</p>`
