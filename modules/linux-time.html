  deepDive: {
    heading: "Derinlemesine: sayaçtan saate, tick\'ten timer\'a",
    html: `<p class="lead">Çekirdeğin zaman altyapısı iki soruya cevap verir: "şu an ne zaman?" (timekeeping) ve "N sonra beni uyandır" (timer). İlki clocksource\'tan okunur, ikincisi clockevents donanımıyla kurulur. Araya jiffies, tickless çekirdek ve vDSO hızlandırması girer. Bu bölüm bu katmanları ayrıntılandırır.</p>

<h3>1. jiffies ve HZ: en kaba zaman birimi</h3>
<p>Tarihsel olarak çekirdek zamanı <strong>jiffies</strong> ile sayar: periyodik bir timer interrupt (tick) her geldiğinde artan global bir sayaç. Tick frekansı derleme zamanı sabiti <strong>HZ</strong> ile belirlenir (tipik olarak 100, 250 veya 1000) — yani <code>HZ=1000</code> ise her jiffy 1 ms\'tir. jiffies kaba ama ucuzdur; zaman aşımı gibi milisaniye hassasiyeti yeten işler için hâlâ kullanılır.</p>
<div class="manpage"><div class="ref">docs · linux-insides · jiffies</div><p class="orig">[jiffies] holds the number of ticks that have occurred since the system booted.</p><p>jiffies açılıştan beri geçen tick sayısıdır. Gerçek saniyeye çevirmek için HZ\'e bölersin: <code>saniye = jiffies / HZ</code>. Düşük çözünürlüğü (bir tick\'ten ince ölçemez) yüzünden modern kod hassas iş için hrtimer\'a geçmiştir.</p></div>

<h3>2. clocksource: "şu an"ın okunduğu yer</h3>
<p>Hassas ve geri gitmeyen zaman jiffies\'ten değil, bir <strong>clocksource</strong>\'tan gelir. Clocksource, serbest akan bir donanım sayacının çekirdek soyutlamasıdır; çekirdek birden çok aday arasından (TSC, HPET, ACPI PM timer...) en iyi çözünürlüklü ve kararlı olanı seçer. x86\'da genellikle <strong>TSC</strong> (Time Stamp Counter) kazanır çünkü en hızlı okunandır.</p>
<div class="manpage"><div class="ref">docs · linux-insides · clocksource</div><p class="orig">[A clocksource is a] hardware abstraction for a free-running counter.</p><p>Clocksource yalnızca "sayaç şu an kaçta?" sorusunu cevaplar — kesme üretmez. Çekirdek bu ham sayacı bir çarpan/kaydırma (mult/shift) ile nanosaniyeye çevirir. Hangi clocksource\'un seçildiğini <code>/sys/devices/system/clocksource/.../current_clocksource</code>\'tan görebilirsin.</p></div>

<h3>3. İki zaman tabanı: MONOTONIC ve REALTIME</h3>
<p>Aynı clocksource\'tan çekirdek birkaç mantıksal saat türetir. İkisi en kritiktir ve farkları süre ölçümünde hayatidir:</p>
<div class="deflist">
<div><dt>CLOCK_MONOTONIC</dt><dd>Açılıştan beri tek yönlü ilerler; ayarlanamaz, geri gitmez. İki olay arası <strong>süreyi</strong> ölçmek için tek doğru seçenektir.</dd></div>
<div><dt>CLOCK_REALTIME</dt><dd>Takvim/duvar saati. NTP düzeltmesi veya leap second ile ileri/geri <strong>sıçrayabilir</strong>. Zaman damgası, dosya tarihi, "saat kaç?" için uygundur; süre ölçümü için değil.</dd></div>
<div><dt>CLOCK_BOOTTIME</dt><dd>Monotonic gibidir ama suspend (uyku) süresini de sayar — cihaz uyurken geçen süreyi de kapsaması gerektiğinde kullanılır.</dd></div>
</div>
<p>man sayfası bu farkı tam olarak şöyle tanımlar:</p>
<div class="manpage"><div class="ref">2 clock_gettime · DESCRIPTION</div><p class="orig">CLOCK_REALTIME: A settable system-wide clock that measures real (i.e., wall-clock) time.</p><p>"Settable" (ayarlanabilir) kelimesi kritik: bu saat dışarıdan değiştirilebildiği için ölçüm sırasında sıçrayabilir.</p></div>
<div class="manpage"><div class="ref">2 clock_gettime · DESCRIPTION</div><p class="orig">CLOCK_MONOTONIC: A nonsettable system-wide clock that represents monotonic time since—as described by POSIX—"some unspecified point in the past".</p><p>"Nonsettable" ve "monotonic": ayarlanamaz ve geri gitmez. Başlangıç noktasının "belirsiz bir an" olması önemli değildir çünkü sen yalnızca <em>fark</em>ı (iki okuma arası) kullanırsın.</p></div>
<p>Çekirdek içi kod için önerilen erişimci <code>ktime_get()</code>\'tir (monotonic):</p>
<div class="manpage"><div class="ref">docs · core-api · timekeeping</div><p class="orig">Starts at system boot time but stops during suspend.</p><p>ktime_get() güvenilir zaman damgası ve kısa aralık ölçümü için önerilir. Çekirdek dokümanı realtime tabanlı erişimciler için şu uyarıyı yapar: leap second güncellemesi yüzünden "geriye sıçrayabilir", bu yüzden iç ölçümlerde kaçınılmalıdır.</p></div>

<h3>4. clockevents, timer wheel ve hrtimer</h3>
<p>Okuma tarafı clocksource ise, <strong>uyandırma</strong> tarafı <strong>clockevents</strong>\'tir: "N nanosaniye sonra bir kesme üret" diyebilen programlanabilir donanım. Timer\'lar bunun üstüne iki farklı yapıyla kurulur:</p>
<div class="deflist">
<div><dt>timer wheel (timer_list)</dt><dd>Klasik, düşük çözünürlüklü (jiffy tabanlı) timer\'lar. Zaman aşımları gibi "yaklaşık" hassasiyet yeten işler için; O(1) ekleme sağlayan "tekerlek" veri yapısında tutulur.</dd></div>
<div><dt>hrtimer</dt><dd>Yüksek çözünürlüklü (high-resolution) timer\'lar. Nanosaniye hassasiyeti; bir <strong>red-black tree</strong>\'de süresine göre sıralı tutulur, en yakın süre dolanı clockevents donanımına programlanır. nanosleep, POSIX timer\'lar ve gerçek zamanlı iş bunu kullanır.</dd></div>
</div>
<p>Lab\'daki <code>nanosleep</code> işte bir hrtimer kurar: red-black tree\'ye bir düğüm girer, en yakın süre clockevents\'e yüklenir, kesme gelince timer ateşler ve süreç uyandırılır.</p>

<h3>5. Tickless çekirdek (NO_HZ) ve vDSO</h3>
<p>Eskiden çekirdek HZ frekansında <em>sürekli</em> tick kesmesi alırdı — CPU boştayken bile. Bu güç israfıdır. <strong>Dyntick / NO_HZ</strong> (tickless) bunu düzeltir: CPU boştaysa veya tek bir görev çalışıyorsa periyodik tick durdurulur, bir sonraki gerçek iş (en yakın timer) için tek bir clockevents kesmesi programlanır. <strong>Tick broadcast</strong>, derin uyku modunda kendi timer\'ı duran CPU\'ları başka bir CPU\'nun uyandırması için kullanılır.</p>
<p>Diğer yönde bir hız sorunu daha vardır: <code>clock_gettime</code> çok sık çağrılır ve her seferinde tam bir syscall (user→kernel geçişi) pahalıdır. Çözüm <strong>vDSO</strong>\'dur: çekirdek, saat verisini kullanıcı alanına eşlenmiş bir sayfaya yazar; <code>clock_gettime</code> bu sayfadan okuyarak çoğu zaman <em>hiç</em> çekirdeğe girmeden cevap verir. Bu yüzden milyonlarca <code>clock_gettime</code> çağrısı bile ucuzdur.</p>

<h3>6. Uykunun hangi saatle ölçüldüğü</h3>
<p>nanosleep\'in kendisi de bu ayrımın içindedir. man sayfası davranışı net verir:</p>
<div class="manpage"><div class="ref">2 nanosleep · DESCRIPTION</div><p class="orig">nanosleep() suspends the execution of the calling thread until either at least the time specified in *duration has elapsed…</p><p>"at least" (en az): nanosleep istenen süreden <em>erken</em> dönmez ama zamanlayıcı gecikmesi yüzünden biraz geç dönebilir. Linux bu süreyi CLOCK_MONOTONIC ile ölçer — yani duvar saati ayarlansa bile uyku bundan etkilenmez. Hassas aralıklı uyku için <code>clock_nanosleep</code> ile saat ve mutlak zaman da seçilebilir.</p></div>`
  },

        shells: [{ label: 'terminal', copy: 'cat /sys/devices/system/clocksource/clocksource0/current_clocksource; cat /sys/devices/system/clocksource/clocksource0/available_clocksource', pre: '<span class="c">$</span> cat .../current_clocksource\ntsc\n<span class="c">$</span> cat .../available_clocksource\ntsc hpet acpi_pm\n<span class="c"># çekirdek en hızlı/kararlı olanı (tsc) seçmiş</span>' }] },
