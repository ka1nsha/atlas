  deepDive: {
    heading: "Derinlemesine: fd, open file description ve VFS",
    html: `<p class="lead">Bir dosyayı açmak basit görünür — <code>open()</code> bir sayı döndürür — ama bu sayının arkasında üç katmanlı bir yapı ve VFS (Virtual File System) soyutlaması vardır. Aynı inode'a iki farklı isimden erişmek, iki file descriptor'ın offset'i paylaşması, bir pathname'in adım adım çözülmesi: hepsi bu katmanlardan doğar. Bu bölüm man sayfalarına dayanır.</p>

<h3>1. Üç katman: fd → open file description → inode</h3>
<p>Bir <code>open()</code> çağrısı üç ayrı seviyede iz bırakır. En üstte, her sürecin kendi <strong>file descriptor table</strong>'ı vardır; döndürülen file descriptor bu tabloya bir index'tir.</p>
<div class="manpage"><div class="ref">2 open · RETURN VALUE</div><p class="orig">On success, open(), openat(), and creat() return the new file descriptor (a nonnegative integer).</p><p>Dönen file descriptor, o süreçte <strong>açık olmayan en küçük numaralı</strong> fd'dir. Bu yüzden stdout (1) kapatılırsa, sonraki open() 1'i geri alabilir — shell'deki output redirection'ın temeli tam olarak budur.</p></div>
<p>Ortada, sistem genelinde bir <strong>open file description</strong> tablosu vardır: file offset ve file status flag'leri (O_APPEND, O_NONBLOCK...) burada tutulur. En altta ise <strong>inode</strong>: dosyanın diskteki kimliği ve üst verisi — sahibi, izinleri, boyutu, veri bloklarının yeri. Birden çok file descriptor aynı open file description'ı, birden çok open file description aynı inode'u gösterebilir.</p>

<h3>2. VFS nesneleri: her dosya sistemi aynı arayüz</h3>
<p>VFS, ext4, tmpfs, NFS, procfs gibi çok farklı dosya sistemlerini tek bir nesne kümesiyle sunar. Çekirdek hep bu nesnelerle konuşur; her dosya sistemi bu arayüzü kendi yöntemleriyle (function pointer'larla) doldurur.</p>
<div class="deflist">
<div><dt>file</dt><dd>Açık bir dosyayı temsil eder — open file description'ın çekirdekteki karşılığı. <code>f_pos</code> (offset) ve <code>f_flags</code> burada tutulur.</dd></div>
<div><dt>dentry</dt><dd>Bir pathname bileşenini (ör. "etc") inode'una bağlar. Dizin ağacını gezmenin hızlandırıcısıdır; isim burada yaşar.</dd></div>
<div><dt>inode</dt><dd>Dosyanın kendisi: tür, izinler, sahip, boyut, zaman damgaları, veri bloklarının haritası. İsim <strong>içermez</strong> — isim dentry'dedir.</dd></div>
<div><dt>superblock</dt><dd>Bağlı (mounted) bir dosya sisteminin tamamını temsil eder: tür, blok boyutu, kök inode.</dd></div>
</div>
<p>İsim ile inode'un ayrı tutulması <strong>hard link</strong>'i mümkün kılar: iki farklı dentry (iki isim) aynı inode'u gösterir. Bir dosyayı silmek aslında inode'un link count'unu azaltır; sayaç sıfıra inince veri serbest kalır. Bu yüzden açık tutulan bir dosya "silinse" bile, son file descriptor kapanana kadar yaşamaya devam eder.</p>

<h3>3. Path resolution: isimden inode'a</h3>
<p>Çekirdek bir pathname'i (ör. <code>/home/deniz/not.txt</code>) bileşen bileşen çözer. Nereden başlayacağı yolun türüne bağlıdır.</p>
<div class="manpage"><div class="ref">7 path_resolution · WALK</div><p class="orig">... the starting lookup directory is the root directory of the calling process ... this component is looked up in the current lookup directory.</p><p>Mutlak (absolute) yollar sürecin root directory'sinden, göreli (relative) yollar current working directory'den başlar. Her bileşen o anki "lookup directory" içinde aranır; bir dizinse içine inilir. Bu yüzden yoldaki <strong>her ara dizinde</strong> arama (execute) izni gerekir — yalnızca hedef dosyada değil.</p></div>
<p>Bu yürüyüşü hızlandıran şey <strong>dentry cache</strong>'tir: sık erişilen isim→inode eşlemeleri bellekte tutulur, böylece her <code>open()</code> diske gitmez. Mount point'ler de burada devreye girer: bir dizin başka bir dosya sisteminin kök inode'una bağlanmışsa, yürüyüş sorunsuzca o dosya sistemine geçer.</p>

<h3>4. fd paylaşımı: offset'i kim paylaşır?</h3>
<p>Aynı dosyayı iki kez <code>open()</code> edersen iki ayrı open file description oluşur ve offset'leri bağımsızdır. Ama <code>dup()</code> ve <code>fork()</code> farklıdır:</p>
<div class="manpage"><div class="ref">2 open · NOTES</div><p class="orig">... the duplicate refers to the same open file description as the original file descriptor ... the two file descriptors consequently share the file offset and file status flags.</p><p><code>dup2(3, 1)</code> ile stdout'u bir dosyaya yönlendirirsen 1 ve 3 aynı open file description'ı paylaşır: birine yazmak diğerinin offset'ini de ilerletir.</p></div>
<div class="manpage"><div class="ref">2 open · NOTES</div><p class="orig">... a child process created via fork(2) inherits duplicates of its parent's file descriptors, and those duplicates refer to the same open file descriptions.</p><p>Bu yüzden parent ve child aynı log dosyasına yazarken satırlar üst üste binmez — ortak offset sayesinde sırayla ilerler.</p></div>
<p>Bu paylaşımı istemediğin durumlar da var: exec() sonrası bir fd'nin otomatik kapanmasını istersen <strong>O_CLOEXEC</strong> (close-on-exec) kullanırsın.</p>
<div class="manpage"><div class="ref">2 open · O_CLOEXEC</div><p class="orig">Enable the close-on-exec flag for the new file descriptor.</p><p>Varsayılan olarak file descriptor'lar exec() boyunca açık kalır; O_CLOEXEC bunu değiştirir ve descriptor'ı yeni programa sızdırmaz. Güvenlik açısından önemlidir — ayrıcalıklı bir fd'nin çalıştırılan child programa geçmesini engeller.</p></div>

<h3>5. "Her şey bir dosyadır"</h3>
<p>VFS'in asıl gücü, aynı fd arayüzünün (read / write / close) yalnızca gerçek dosyalar için değil; pipe, socket, terminal, <code>/proc</code> ve <code>/sys</code> girdileri, hatta <code>eventfd</code> / <code>signalfd</code> gibi çekirdek nesneleri için de çalışmasıdır. Bu yüzden <code>strace</code> çıktısında her şey birkaç ortak syscall'a (read, write, close) iner — Unix'in birleştirici fikri tam olarak budur.</p>`
