    heading: "Derinlemesine: sayfa tablosunun içinde ne var?",
    html: `<p class="lead">Dört seviyeli yürüyüş hikâyenin iskeleti; asıl ayrıntı, her page table entry içindeki bitlerde, TLB'nin davranışında ve page fault'un nasıl çözüldüğünde. Bu bölüm bu katmanı açar.</p>

<h3>1. Neden 48-bit? Canonical address</h3>
<p>x86-64 donanımı 64-bit yazmaç kullanır ama bugünkü işlemciler adresin yalnızca alt 48 bitini çevirir (yeni nesil 5-seviyeli sayfalamayla 57 bit). Geri kalan üst bitler, 47. bitin kopyası olmak zorundadır; buna <strong>canonical address</strong> denir. Kurala uymayan bir adres (non-canonical) donanım tarafından anında reddedilir. Bu yüzden kullanıcı alanı adresleri <code>0x0000…</code> ile, çekirdek adresleri <code>0xffff…</code> ile başlar: iki uç, 48-bit penceresinin iki yakasıdır.</p>

<h3>2. Page table entry (PTE) içindeki bitler</h3>
<p>Yürüyüşün son girişi yalnızca bir çerçeve numarası taşımaz; her seviyedeki giriş, fiziksel adresin üst bitleriyle birlikte bir dizi kontrol biti tutar. En kritik olanlar:</p>
<div class="deflist">
<div><dt>Present (P)</dt><dd>Sayfa bellekte mi? 0 ise erişim bir page fault üretir. Swap'e alınmış veya henüz hiç ayrılmamış (demand paging) sayfalar present=0'dır.</dd></div>
<div><dt>Read/Write (R/W)</dt><dd>1 ise yazılabilir, 0 ise salt okunur. copy-on-write tam olarak burada kurulur: paylaşılan sayfa iki tarafta da R/W=0 yapılır.</dd></div>
<div><dt>User/Supervisor (U/S)</dt><dd>1 ise kullanıcı alanı erişebilir, 0 ise yalnızca çekirdek. Kullanıcı kodunun çekirdek belleğine erişememesi bu bitle zorlanır.</dd></div>
<div><dt>Accessed (A)</dt><dd>Donanım sayfaya her erişimde 1 yapar. Çekirdek bununla "hangi sayfalar sık kullanılıyor"u ölçer (page reclaim / LRU).</dd></div>
<div><dt>Dirty (D)</dt><dd>Donanım sayfaya her yazmada 1 yapar. Çekirdek, diske geri yazması (writeback) gereken sayfaları bununla ayırır.</dd></div>
<div><dt>NX (No-eXecute)</dt><dd>1 ise sayfadaki veri CPU tarafından komut olarak çalıştırılamaz. Veri alanlarında kod çalıştırmayı (shellcode enjeksiyonu) engelleyen donanım korumasının temeli budur.</dd></div>
</div>

<h3>3. TLB ve TLB shootdown</h3>
<p>Tek bir çeviri için dört tablo okumak pahalıdır, bu yüzden MMU son çevirileri <strong>TLB</strong> (translation lookaside buffer) içinde önbellekler. Sorun şu: çekirdek bir sayfa tablosu girişini değiştirince (ör. sayfayı serbest bırakınca), diğer CPU çekirdeklerinin TLB'sinde o çevirinin eski kopyası kalmış olabilir. Çekirdek, bu bayat girişleri temizlemek için diğer çekirdeklere bir inter-processor interrupt (IPI) gönderir; bu işleme <strong>TLB shootdown</strong> denir ve çok çekirdekli sistemlerde ölçülebilir bir maliyettir.</p>

<h3>4. Page fault: minor, major ve demand paging</h3>
<p>present=0 bir sayfaya erişim her zaman bir hata değildir; çoğu zaman planlı bir mekanizmadır. Çekirdek sayfaları ihtiyaç anına kadar gerçekten ayırmaz — buna <strong>demand paging</strong> denir. İki tür page fault vardır:</p>
<ul>
<li><strong>Minor fault:</strong> Sayfa aslında bellekte (ör. başka bir süreç zaten yüklemiş, ya da yeni bir zero page) ama bu sürecin sayfa tablosunda henüz eşleme yok. Disk erişimi gerekmez, ucuzdur.</li>
<li><strong>Major fault:</strong> Sayfa diskte (swap'te veya henüz okunmamış bir dosyada). Çekirdek diskten okumak zorundadır; milisaniyeler sürer, pahalıdır.</li>
</ul>
<div class="manpage"><div class="ref">2 mmap · MAP_PRIVATE</div><p class="orig">Create a private copy-on-write mapping. Updates to the mapping are not visible to other processes mapping the same file.</p><p><code>mmap(MAP_PRIVATE)</code> bir dosyayı copy-on-write olarak eşler: okuma paylaşılır, ilk yazma o sayfayı özel bir kopyaya çevirir. Program yükleyici bir çalıştırılabiliri ve kütüphaneleri tam olarak böyle eşler — bu yüzden yüzlerce süreç aynı <code>libc</code> kodunu tek bir fiziksel kopyada paylaşır.</p></div>
<div class="manpage"><div class="ref">2 mmap · ERRORS</div><p class="orig">ENOMEM: No memory is available.
EINVAL: We don't like addr, length, or offset (e.g., they are too large, or not aligned on a page boundary).</p><p>Eşlemeler sayfa sınırına (4 KB) hizalı olmak zorundadır; hizasız bir <code>addr</code> veya <code>length</code> EINVAL verir. Geçersiz bir adrese erişim ise çeviride present=0 bulur ve man sayfasının dediği gibi "subsequent references to these pages will generate SIGSEGV" — yani süreç öldürülür.</p></div>

<h3>5. Huge pages: tabloyu kısaltmak</h3>
<p>4 KB'lık sayfalar, büyük bellek kullanan programlarda çok sayıda PTE ve sık TLB ıskası demektir. Çözüm <strong>huge page</strong>: bir PD girişi doğrudan 2 MB'lık, bir PDPT girişi ise 1 GB'lık bir çerçeveye işaret edebilir; alttaki tablo seviyeleri atlanır. Daha az tablo, daha az TLB girişi, daha hızlı çeviri — veritabanları ve sanal makineler bunu sıkça kullanır. Bedeli iç parçalanmadır (internal fragmentation): yarım dolu bir 2 MB sayfa 2 MB yer tutar.</p>

<h3>6. /proc/pid/maps ile kendi uzayını okumak</h3>
<p>Bir sürecin sanal adres uzayının haritası <code>/proc/pid/maps</code> dosyasındadır; her satır bir bölge (virtual memory area, VMA) anlatır.</p>
<div class="manpage"><div class="ref">5 proc_pid_maps · perms</div><p class="orig">r = read, w = write, x = execute, s = shared, p = private (copy on write)</p><p>Her satırdaki izin alanı bir bölgenin karakterini gösterir: <code>r-xp</code> = okunur, çalıştırılır, özel (tipik olarak kod); <code>rw-p</code> = okunur, yazılır, özel (veri ve heap). Buradaki <code>p</code>, man sayfasının dediği gibi doğrudan copy-on-write anlamına gelir — yani PTE'deki R/W=0 kurgusunun kullanıcıya görünen yüzü.</p></div>
<p>inode alanının 0 olması, bölgenin bir dosyaya değil anonim belleğe (heap, stack, BSS) karşılık geldiğini söyler. <code>/proc/pid/pagemap</code> ise bir adım öteye gider ve her sanal sayfanın hangi fiziksel çerçeveye (page frame number, PFN) düştüğünü verir — çeviriyi gerçek sayılarla görmek için.</p>

<h3>7. Overcommit: söz vermek, tutmamak</h3>
<p>Demand paging'in doğal sonucu: çekirdek, aslında var olandan daha çok bellek "sözü" verebilir, çünkü çoğu süreç ayırdığı belleğin hepsine dokunmaz. Buna <strong>overcommit</strong> denir (<code>/proc/sys/vm/overcommit_memory</code> ile ayarlanır). Riski şudur: tüm süreçler aynı anda sözlerini bozup belleğe dokunursa fiziksel bellek tükenir ve çekirdek <strong>OOM killer</strong>'ı devreye sokup bir süreci öldürmek zorunda kalır.</p>`
  },
