  deepDive: {
    heading: "Derinlemesine: imzayı kim zorlar?",
    html: `<p class="lead">Kod imzalama bir binary'nin bütünlüğünü <em>tanımlar</em>, ama onu çalışma anında <strong>zorlayan</strong> ayrı bir mekanizma gerekir: AMFI (AppleMobileFileIntegrity). AMFI, macOS/iOS'un "yalnızca Apple'ın ya da yetkili bir geliştiricinin imzaladığı kod çalışabilir" kuralını çekirdekte uygulatan parçadır. Bu bölüm Apple Platform Security belgelerine ve Levin'in OS Internals Cilt III'üne dayanır.</p>

<h3>1. İki parça: AMFI.kext ve amfid</h3>
<p>AMFI tek bir bileşen değil, çekirdek ile kullanıcı alanına yayılmış bir çifttir. Ağır, güvenlik-kritik karar (bir sayfanın çalıştırılabilir olup olamayacağı) çekirdekte verilir; pahalı ama nadir olan iş (bir imzanın sertifika zinciriyle kriptografik doğrulanması) kullanıcı alanındaki bir yardımcıya devredilir.</p>
<div class="deflist">
<div><dt>AMFI.kext</dt><dd>Çekirdekteki politika modülü. MACF hook'larında devreye girer, trust cache'e bakar, kararı uygular (gerekirse process'i öldürür).</dd></div>
<div><dt>amfid</dt><dd>Kullanıcı alanı daemon'ı. Trust cache'te bulunmayan bir binary'nin code signature'ını sertifika zinciriyle doğrular ve sonucu çekirdeğe bildirir.</dd></div>
</div>

<h3>2. MACF hook'ları: nerede devreye girer</h3>
<p>AMFI, çekirdeğin MACF (Mandatory Access Control Framework) politika motoruna kaydolur. Kritik iki nokta vardır: (1) <code>execve</code> — bir binary çalıştırılmak istendiğinde; (2) bellek koruması değişimi — bir sayfa sonradan çalıştırılabilir (executable) yapılmak istendiğinde. İkincisi W^X'in (write XOR execute) özüdür: AMFI, imzasız bir belleğin çalıştırılmasını da engeller; böylece "önce yaz, sonra çalıştır" tarzı kod enjeksiyonu kapanır. Bu yüzden iOS'ta JIT bile ancak özel bir entitlement ile mümkündür.</p>

<h3>3. Trust cache: hız ve güvenlik aynı anda</h3>
<p>Sistemdeki her Apple binary'si için her açılışta sertifika zinciri doğrulamak hem yavaş hem gereksizdir. Çözüm trust cache'tir: Apple'ın önceden onayladığı binary'lerin <strong>cdhash</strong> (code directory hash) listesi. Bir binary çalışırken code directory'si hash'lenir; hash listede varsa imza ayrıca doğrulanmadan güvenilir kabul edilir.</p>
<div class="manpage src-apple"><div class="ref">Platform Security · Trust caches</div><p class="orig">A trusted record of all the Mach-O binaries that are assembled into the signed system volume.</p><p>Statik trust cache, imzalı sistem birimine (signed system volume) dahil edilen tüm Mach-O binary'lerinin güvenilir bir kaydıdır — yani sistemle gelen onaylı çalıştırılabilirlerin listesi.</p></div>
<div class="manpage src-apple"><div class="ref">Platform Security · Trust caches</div><p class="orig">Each Mach-O is represented by a code directory hash.</p><p>Her Mach-O, bir code directory hash (cdhash) ile temsil edilir. Bu hash'ler trust cache'e sıralı olarak yazılır; çalışma anında binary'nin cdhash'i bu listede hızlıca aranır.</p></div>
<div class="manpage src-apple"><div class="ref">Platform Security · Trust caches</div><p class="orig">the executable mappings created for the binary will be granted platform privileges.</p><p>cdhash trust cache'te bulunursa, binary için oluşturulan executable mapping'lere platform ayrıcalıkları verilir — ek imza doğrulaması yapılmadan. Match yoksa karar amfid'e düşer.</p></div>

<h3>4. amfid: trust cache dışındaki kod</h3>
<p>Üçüncü taraf bir uygulama trust cache'te yoktur. Bu durumda AMFI.kext, binary'nin cdhash'ini amfid'e sorar; amfid imzayı ve sertifika zincirini doğrular (macOS'ta ayrıca notarization kontrolü), geçerliyse cdhash'i çekirdeğe onaylar. Geçersizse çekirdek process'i <code>SIGKILL</code> ile öldürür — root olsa bile. Tarihsel olarak amfid, saldırganların "imzasız kodu imzalıymış gibi göstertmeye" çalıştığı bir hedef olmuştur; bu yüzden amfid ↔ kernel arası iletişim sıkılaştırılmıştır (kavramsal).</p>

<h3>5. Provisioning profile ve entitlements</h3>
<p>iOS'ta trust cache'te olmayan geliştirici uygulamalarına izin, provisioning profile ile verilir: hangi cihazların, hangi App ID'nin, hangi entitlement'larla kodu çalıştırabileceğini Apple'ın imzaladığı bir belge. Entitlement'lar imzanın içine gömülüdür ve bir process'in neye yetkili olduğunu (örn. belirli bir sandbox istisnası) belirler; AMFI bu yetkilerin imzayla tutarlı olmasını da denetler.</p>
<div class="deflist">
<div><dt>provisioning profile</dt><dd>Apple imzalı; hangi cihaz + App ID + entitlement kombinasyonunun çalışabileceğini belirten belge (çoğunlukla iOS).</dd></div>
<div><dt>entitlement</dt><dd>İmzaya gömülü yetki anahtarları; process'in ayrıcalıklarını (sandbox istisnaları, donanım erişimi) tanımlar.</dd></div>
</div>

<h3>6. SIP ile ilişki ve bütünlük zinciri</h3>
<p>AMFI tek başına çalışmaz: secure boot zinciri çekirdeğin ve AMFI.kext'in kendisinin bütün olduğunu garanti eder; signed system volume sistem dosyalarının değişmediğini; SIP (System Integrity Protection) ise root'un bile AMFI/çekirdek yapılarını kurcalamasını engeller. Böylece "yalnızca güvenilir kod çalışır" güvencesi, donanım kök güveninden (hardware root of trust) çalışan process'e kadar kesintisiz bir zincir oluşturur. Bu zincirin bir halkasını kırmak, iOS güvenlik araştırmasının (jailbreak) tarihsel hedefidir — mekanizma için ofansif izleğe bakın.</p>`
