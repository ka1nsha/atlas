  deepDive: {
    heading: "Derinlemesine: EL, PAC, PAN ve MTE donanımda nasıl çalışır?",
    html: `<p class="lead">Apple Silicon'un güvenliği büyük ölçüde ARM64 mimarisinin kendisine gömülüdür: ayrıcalık exception level'larla katmanlanır, işaretçiler pointer authentication ile imzalanır, kernel ile user bellek sınırı PAN ile donanımda zorlanır ve bellek hataları memory tagging ile daha oluşurken yakalanır. Bu bölüm Apple'ın pointer authentication belgesine ve ARM mimari referansına dayanır; alıntılar İngilizce verildiği gibi bırakılmıştır.</p>

<h3>1. Exception level'lar: ayrıcalığın katmanları</h3>
<p>ARM64'te çalışma, dört <strong>exception level</strong>'a (EL) bölünür. Her seviye bir altındakinden daha ayrıcalıklıdır ve kendi stack pointer'ına, sistem register'larına ve adres çevirisine sahiptir:</p>
<div class="deflist">
<div><dt>EL0</dt><dd>User mode. Uygulama kodu burada çalışır; doğrudan donanıma veya kernel belleğine erişemez. x86'daki ring 3 karşılığı.</dd></div>
<div><dt>EL1</dt><dd>Kernel mode. XNU kernel'i burada çalışır. Bir system call, EL0'dan EL1'e kontrollü bir geçiştir (<code>svc</code> komutu).</dd></div>
<div><dt>EL2</dt><dd>Hypervisor. Apple Silicon'da kernel'in bütünlüğünü korumak için kullanılır: kernel (EL1) bile kendi sayfa tablosu izinlerini keyfî değiştiremez, çünkü daha ayrıcalıklı bir katman onu kısıtlar.</dd></div>
<div><dt>EL3</dt><dd>Secure monitor. En ayrıcalıklı katman; secure/non-secure dünya geçişlerini yönetir. Apple'ın güven kökü (boot ROM, SEP ile birlikte) bu seviyenin altında konumlanır.</dd></div>
</div>
<p>Bu katmanlı yapı ofansif açıdan kritiktir: bir EL0 exploit'i ancak bir sonraki sınırı (EL0→EL1) aşabilirse kernel'i ele geçirir; EL1 ele geçse bile EL2/EL3 bazı garantileri (örn. sayfa izinleri, PPL) ayakta tutmaya devam eder. Savunma, her sınırı ayrı bir çitle donanımda zorlar.</p>

<h3>2. İstisna işleme: vector table ve bağlam register'ları</h3>
<p>Bir system call, interrupt ya da hata (fault) olduğunda CPU bir <strong>exception</strong> alır ve çalışmayı o anki EL'den (ya da bir üst EL'e geçerek) <strong>exception vector table</strong>'daki ilgili girişe dallandırır. Vektör tablosunun adresi <code>VBAR_ELn</code> register'ında durur. Exception alındığında donanım üç register doldurur:</p>
<div class="deflist">
<div><dt>ESR_ELn</dt><dd>Exception Syndrome Register. İstisnanın <em>nedenini</em> kodlar: hangi sınıf (system call, data abort, instruction abort, PAC failure…) ve ayrıntıları.</dd></div>
<div><dt>ELR_ELn</dt><dd>Exception Link Register. İstisnadan dönülecek adres — yani kesilen komutun konumu. <code>eret</code> buraya döner.</dd></div>
<div><dt>SPSR_ELn</dt><dd>Saved Program Status Register. İstisna anındaki işlemci durumu (bayraklar, önceki EL, interrupt maskeleri) burada saklanır ve dönüşte geri yüklenir.</dd></div>
</div>
<p>Bir translation fault — örneğin geçersiz bir işaretçiye erişim — tam olarak bu yolla bir data abort'a dönüşür; ESR nedeni taşır, kernel handler'ı devreye girer ve çoğu durumda süreç öldürülür. PAC'ın bir saldırıyı çökerttiği an da budur: bozuk işaretçiye erişim bir fault üretir.</p>

<h3>3. Donanım page table ve bellek izinleri</h3>
<p>Her EL'in kendi adres çevirisi vardır; sanal adresten fiziksele çeviri çok seviyeli page table'larla yapılır ve çeviri register'ları (<code>TTBR0_EL1</code> user alanı, <code>TTBR1_EL1</code> kernel alanı) tabanları tutar. Her page table girişi yalnızca eşlemeyi değil, <strong>izinleri</strong> de taşır: okunabilir mi, yazılabilir mi, çalıştırılabilir mi (XN — execute-never), hangi EL'den erişilebilir. W^X (bir sayfa aynı anda hem yazılabilir hem çalıştırılabilir olamaz) bu izin bitleriyle donanımda zorlanır. Apple Silicon'da bu izinleri kernel'in bile keyfî gevşetememesi, PPL ve EL2 gibi katmanların işidir (ileri modüllerin konusu).</p>

<h3>4. PAN — Privileged Access Never</h3>
<p>Klasik bir kernel exploit kalıbı, kernel'i (EL1) saldırganın kontrol ettiği user (EL0) belleğine yönlendirmektir (x86 dünyasındaki ret2usr'ın akrabası). <strong>PAN</strong> bunu donanımda keser: PAN biti etkinken, EL1 kodu EL0'a ait sayfalara doğrudan erişmeye kalkarsa bir fault alır. Kernel'in user belleğiyle alışverişi, ancak izinin açıkça verildiği kontrollü kopyalama yollarından (örn. <code>copyin</code>/<code>copyout</code>) geçmek zorunda kalır. Böylece "kernel yanlışlıkla saldırgan verisini çalıştırır/okur" sınıfı büyük ölçüde kapanır. PAN, ARMv8.1 ile gelir ve x86'daki SMAP'in karşılığıdır.</p>

<h3>5. PAC — Pointer Authentication Code</h3>
<p>Pointer authentication, bir işaretçiye kriptografik bir imza ekler ve kullanılmadan önce bu imzayı doğrular. İmza, işaretçinin sanal adres için kullanılmayan üst bitlerine sığar — yani ayrı bir yer gerekmez.</p>
<div class="manpage src-apple"><div class="ref">pointer authentication</div><p class="orig">Pointer authentication works by offering a special CPU instruction to add a cryptographic signature — or PAC — to unused high-order bits of a pointer before storing the pointer. Another instruction removes and authenticates the signature after reading the pointer back from memory.</p><p>İmza, işaretçi belleğe yazılmadan önce <code>pacia</code> gibi bir komutla eklenir; geri okunduğunda <code>autia</code> gibi bir komutla doğrulanıp sökülür. Yazma ile okuma arasında işaretçi değiştirilmişse imza artık tutmaz.</p></div>
<p>Doğrulama başarısız olduğunda CPU işaretçiyi sessizce "düzeltmez"; bilinçli olarak geçersiz kılar:</p>
<div class="manpage src-apple"><div class="ref">pointer authentication</div><p class="orig">Any change to the stored value between the write and the read invalidates the signature. The CPU interprets authentication failure as memory corruption and sets a high-order bit in the pointer, making the pointer invalid and causing the app to crash.</p><p>Saldırgan dönüş adresini değiştirse bile geçerli imzayı üretemediği için doğrulama tutmaz; işaretçi geçersizleşir ve kullanıldığında süreç çöker. ROP/JOP zincirleri tam burada kırılır.</p></div>

<h3>6. PAC anahtarları ve bağlam (diversification)</h3>
<p>İmza yalnızca adresin değil; bir <strong>key</strong>'in ve isteğe bağlı bir <em>salt</em>/bağlam değerinin de fonksiyonudur. Anahtar CPU'da tutulur ve user alanına açılmaz; bu yüzden saldırgan, anahtarı bilmeden geçerli bir imza <em>hesaplayamaz</em>. Apple, bağlamı işaretçi türüne göre çeşitlendirir (diversification) — böylece bir bağlamda geçerli bir imzalı işaretçi başka bir bağlama kopyalanamaz:</p>
<div class="manpage src-apple"><div class="ref">pointer authentication</div><p class="orig">Return addresses are signed with a key that’s unique per process, using a salt derived from the stack pointer.
Function pointers are signed with a key that’s fixed across all processes, allowing sharing of library code between processes.
Virtual method table entries are signed with a key that’s shared across all apps, using a salt derived from the method signature.</p><p>Return address'ler sürece özel bir anahtar ve stack pointer'dan türetilmiş bir salt ile; function pointer'lar paylaşılabilir kütüphane kodu için süreçler arası sabit bir anahtarla; C++ vtable girişleri ise method signature'dan türetilmiş bir salt ile imzalanır. Böylece bir slot'tan çalınan imzalı işaretçi başka bir slot'ta işe yaramaz.</p></div>
<p>Apple bu şemayı donanımda daha da sertleştirmeye devam eder; yeni nesillerde return address korumasını güçlendiren bir eklenti (PAuth_LR) <em>"closes off additional classes of return-oriented programming (ROP) attacks that reuse existing stack frames"</em> — yani var olan stack frame'leri yeniden kullanan ROP sınıflarını da kapatır.</p>

<h3>7. MTE ve BTI: hatayı ve dallanmayı hedefleyen katmanlar</h3>
<p>PAC kontrol akışını, PAN kernel/user sınırını korur; son iki donanım katmanı farklı aşamaları hedefler:</p>
<div class="deflist">
<div><dt>MTE</dt><dd>Memory Tagging Extension (ARMv8.5). Bellek küçük granüllere bölünür ve her allocation'a 4-bitlik bir <em>tag</em> verilir; işaretçinin üst bitlerinde de aynı tag taşınır. Her erişimde donanım işaretçinin tag'i ile belleğin tag'ini karşılaştırır. Uyuşmazsa bir tag check fault doğar. <strong>use-after-free</strong> (bellek free'de yeniden etiketlenir) ve <strong>buffer overflow</strong> (komşu allocation farklı tag taşır) gibi hatalar böylece daha oluşurken yakalanır — merdivenin ilk basamağı hedeflenir.</dd></div>
<div><dt>BTI</dt><dd>Branch Target Identification (ARMv8.5). Dolaylı dallar (indirect branch) yalnızca açıkça işaretlenmiş hedeflere (<code>bti</code> landing pad) atlayabilir. Rastgele bir komut ortasına sıçrayarak gadget zinciri kurmayı (özellikle JOP) zorlaştırır — PAC'ı tamamlayan bir control-flow integrity katmanıdır.</dd></div>
</div>
<p class="prose"><em>Not:</em> MTE/BTI'nin verbatim mimari tanımları ARM Architecture Reference Manual'da yer alır; burada mekanizma Apple Platform Security ve ARM belgelerinden <strong>özetlenmiştir</strong>, birebir alıntı verilmemiştir.</p>

<h3>8. Ofansif korumalar modülüyle bağ</h3>
<p>Ofansif izlekteki <strong>korumalar</strong> modülü (Modül 4) bu katmanları sömürü boru hattının üstüne yerleştirir: NX/ASLR/canary/RELRO büyük ölçüde yazılım korumalarıydı; burada gördüğün PAC, PAN, MTE ve BTI ise aynı basamakları <em>silikonun içinde</em> savunur. Donanımda zorlanan bir koruma, bir yazılım kontrolünden çok daha zor aşılır — ama hiçbiri mutlak değildir: bir signing gadget PAC'ı, olasılıksal bir tag çarpışması MTE'yi aşındırabilir. Katmanlar bu yüzden birlikte durur.</p>`
  },
