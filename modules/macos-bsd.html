  deepDive: {
    heading: "Derinlemesine: BSD katmanı ve dual identity",
    html: `<p class="lead">XNU'nun BSD katmanı, Mach'ın soğuk capability dünyasının üstüne tanıdık bir POSIX yüzü giydirir. Ama bu yüzün ardında her process aslında iki kimliğe sahiptir: üstte bir BSD proc struct, altta bir Mach task. Bu ikiliği görmeden macOS'ta "neden fork değil posix_spawn?" gibi soruların yanıtı anlaşılmaz. Bu bölüm Apple man sayfalarına ve Levin'in OS Internals serisine dayanır.</p>

<h3>1. İki kimlik: proc struct ve Mach task</h3>
<p>macOS'ta bir process tek bir yapı değildir. BSD katmanı POSIX dünyasının beklediği <code>proc</code> struct'ı sağlar; altta ise gerçek kaynakları tutan bir Mach <code>task</code> vardır. İkisi birbirine bağlıdır (<code>proc</code> içinden <code>task_t</code>'ye ulaşılır) ve biri olmadan diğeri yaşayamaz.</p>
<div class="deflist">
<div><dt>BSD proc struct</dt><dd>POSIX yüzü: PID, PPID, uid/gid, file descriptor table, signal state, process group ve session. <code>ps</code>, <code>ptrace</code> ve çoğu POSIX API bu kimliği görür.</dd></div>
<div><dt>Mach task</dt><dd>Gerçek kaynaklar: address space (<code>vm_map</code>), thread'ler, port name space ve tüm IPC. Scheduling bile thread düzeyinde Mach tarafında yapılır — BSD process scheduling yapmaz.</dd></div>
</div>
<p>Bu yüzden bir process'i "öldürmek" hem <code>proc</code>'u hem task'ı yıkar; bir Mach port sızıntısı veya thread sorunu POSIX araçlarına görünmezken Mach API'leriyle (<code>task_info</code>) ortaya çıkar.</p>

<h3>2. Process creation: neden fork değil posix_spawn?</h3>
<p>BSD katmanı klasik <code>fork</code>/<code>vfork</code>'u sunar, ama Apple kendi platformunda neredeyse her yerde <code>posix_spawn</code>'ı tercih eder. Nedenini anlamak için fork'un macOS'ta ne kadar tehlikeli olduğunu görmek gerekir.</p>
<div class="manpage src-apple"><div class="ref">posix_spawn · DESCRIPTION</div><p class="orig">The posix_spawn() function creates a new process from the executable file specified by path.</p><p>posix_spawn(), belirtilen <code>path</code>'teki executable dosyadan yeni bir process yaratır — yani fork ve exec'i tek bir atomik adımda yapar; arada "ebeveynin kopyası" ara durumu hiç oluşmaz.</p></div>
<p>macOS'ta <code>fork</code> yalnızca çağıran thread'i kopyalar; ama bir process'in Mach port rights'ı, dispatch queue'ları, çalışan diğer thread'leri ve pek çok kaynağı child'a tutarlı biçimde miras geçmez. Dahası, fork ile exec arasında yalnızca async-signal-safe fonksiyonlar çağrılabilir — oysa <code>malloc</code> ya da Objective-C runtime gibi şeyler güvenli değildir ve child'da kilitlenmeye (deadlock) yol açabilir. posix_spawn bu tehlikeli pencereyi tümüyle ortadan kaldırır.</p>
<div class="manpage src-apple"><div class="ref">posix_spawn · ERRORS</div><p class="orig">Additionally, they may fail for any of the reasons listed in fork(2) or exec(3).</p><p>Man sayfasının kendisi posix_spawn'ı kavramsal olarak fork + exec birleşimi olarak tanımlar: bu yüzden her iki çağrının da hatalarını döndürebilir. Apple'ın <code>posix_spawn</code>'a eklediği bayraklar (örn. <code>POSIX_SPAWN_SETEXEC</code>) ile davranış ince ayarlanır.</p></div>

<h3>3. Mach-O yükleme: exec yolunun sonu</h3>
<p>exec veya posix_spawn'ın sonunda kernel, hedef programı belleğe yerleştirmelidir. Bu iş BSD'nin exec yolundan (<code>execve</code> → image activator) Mach'ın <code>load_machfile</code>'ına iner: Mach-O segment'leri address space'e map edilir, <code>LC_LOAD_DYLINKER</code> ile dyld başlar ve kontrol entry point'e geçer. Böylece BSD "programı çalıştır" der, ama gerçek yükleme Mach ve dyld tarafında olur (bkz. Mach-O ve dyld modülleri).</p>

<h3>4. BSD signals ve Mach exceptions</h3>
<p>BSD, tanıdık POSIX signal'lerini (<code>SIGSEGV</code>, <code>SIGTERM</code>, <code>SIGCHLD</code>...) sunar; ama bunların altında Mach exception mekanizması yatar. Bir donanım hatası (örn. geçersiz bellek erişimi) önce bir <strong>Mach exception</strong> olarak ilgili exception port'a gönderilir. Bu exception bir handler tarafından yakalanmazsa, BSD katmanı onu bir POSIX signal'e çevirir ve process'e teslim eder.</p>
<p>Bu katmanlı yapı neden önemli? Çünkü bir debugger (lldb) process'in <strong>exception port</strong>'unu ele geçirerek hatayı POSIX signal'e dönüşmeden önce yakalar. Bu yüzden macOS'ta gerçek debugging, BSD <code>ptrace</code>'ten çok Mach exception port'ları ve task port üzerine kuruludur.</p>

<h3>5. Process inceleme ve yetki</h3>
<div class="deflist">
<div><dt>proc_info</dt><dd>Process hakkında bilgi sorgulayan syscall; <code>ps</code>, <code>lsof</code>, Activity Monitor bunu kullanır. Belirli process'in file descriptor'larını, bölgelerini, thread'lerini verir.</dd></div>
<div><dt>ptrace</dt><dd>macOS'ta sınırlıdır; <code>PT_DENY_ATTACH</code> ile uygulamalar debugger'ı reddedebilir (anti-debug). Ciddi debugging task port + Mach exception ile yapılır.</dd></div>
<div><dt>kauth</dt><dd>Kernel authorization — dosya ve process erişim kararlarına kancalar koyan KPI; MACF (Mandatory Access Control) politikalarının bir atası.</dd></div>
<div><dt>pthread workqueue</dt><dd>BSD/pthread katmanının kernel destekli thread havuzu; GCD (dispatch) bunun üstüne kuruludur (bkz. GCD modülü).</dd></div>
</div>
<p>Özetle BSD katmanı "Unix gibi görünür", ama her POSIX kavramının altında bir Mach karşılığı vardır: proc ↔ task, POSIX signal ↔ Mach exception, fork ↔ posix_spawn. İkisini birlikte okumak macOS internals'ın anahtarıdır (Linux fork modülü ve Mach port modülüyle karşılaştır).</p>`
  },
