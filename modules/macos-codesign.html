  deepDive: {
    heading: "Derinlemesine: imza nasıl mühürlenir ve zorlanır?",
    html: `<p class="lead">Code signing, macOS ve iOS'ta kodun kimliğini ve bütünlüğünü garanti eden mekanizmadır: bir binary'nin her bellek sayfası hash'lenir, bir sertifikayla imzalanır ve çekirdek bu hash'leri çalışma anında, sayfa belleğe girerken doğrular. Değiştirilmiş tek bir byte bile yakalanır. Bu bölüm codesign man page'ine ve Apple'ın code signing belgelerine dayanır.</p>

<h3>1. İmza nerede durur: LC_CODE_SIGNATURE</h3>
<p>İmza, Mach-O'nun içine gömülüdür. <strong>LC_CODE_SIGNATURE</strong> load command'i, <code>__LINKEDIT</code> segmentinin sonundaki bir imza blob'unu işaret eder. Bu blob aslında bir <strong>SuperBlob</strong>'dur: içinde Code Directory, entitlements, requirements ve CMS sertifika zinciri gibi birden çok alt blob'u slot'larda taşır.</p>
<div class="manpage src-apple"><div class="ref">codesign</div><p class="orig">codesign — Create, check, and display code signatures</p><p>codesign imzayı üretir, doğrular ve içeriğini gösterir. Doğrulama, mühürlenmiş (sealed) bileşenlerin hiç değişmediğini — <em>all sealed components are unaltered</em> — teyit eder.</p></div>

<h3>2. Code Directory: imzanın kalbi</h3>
<p>İmzanın merkezinde <strong>Code Directory</strong> vardır. Binary sayfalara (page) bölünür ve her sayfanın hash'i burada bir <em>code slot</em>'ta tutulur. Ayrıca entitlements, requirements gibi parçaların hash'leri de <em>special slot</em>'larda durur. Tüm bu yapının hash'i <strong>cdhash</strong>'tir — bir binary'nin tek cümlelik kimliği; sistem güven kararlarını bu değere bağlar.</p>
<div class="deflist">
<div><dt>code slots</dt><dd>Her kod sayfasının (genelde 4 KB) ayrı hash'i. Böylece sadece dosya başı değil, her sayfa ayrı ayrı doğrulanabilir.</dd></div>
<div><dt>special slots</dt><dd>Negatif indeksli slot'lar: Info.plist, requirements, resource directory, entitlements hash'leri.</dd></div>
<div><dt>cdhash</dt><dd>Code Directory'nin kendi hash'i; binary'nin özeti. Trust cache ve AMFI bu değerle çalışır.</dd></div>
<div><dt>hashType / pageSize</dt><dd>Hangi hash algoritması (SHA-256) ve sayfa boyutu kullanıldığı.</dd></div>
</div>

<h3>3. Entitlements: ne yapabileceğini belirler</h3>
<p><strong>Entitlements</strong>, bir programa verilen yetkilerin (örn. belirli bir servise erişim, sandbox istisnaları) bir plist olarak imzaya gömülmüş halidir. İmzaya mühürlendiği için değiştirilemez; çekirdek ve servisler bir işleme izin verirken bu yetkilere bakar.</p>
<div class="manpage src-apple"><div class="ref">codesign</div><p class="orig">embed its contents in the signature as entitlement data</p><p>İmzalama sırasında entitlement verisi imzanın içine gömülür. Böylece bir programın yetkileri, kodunun bütünlüğüyle aynı imza altında korunur — yetkileri taklit etmek (spoof) imzayı kırmayı gerektirir.</p></div>

<h3>4. Requirements: kimin imzaladığını kısıtlar</h3>
<p><strong>Requirement</strong>, bir kodun yalnızca bütün olmasını değil, <em>belirli bir kimlik tarafından</em> imzalanmış olmasını da şart koşan bir ifadedir. Örneğin "bu eklenti yalnızca ana uygulamayla ayni Team ID tarafından imzalanmışsa yüklensin". Doğrulama, kodun kendi bütünlük kontrolünün ötesinde bu şartı da denetler.</p>
<div class="manpage src-apple"><div class="ref">codesign</div><p class="orig">the code requirement specified</p><p>Doğrulama, belirtilen code requirement'a göre yapılır: bir uygulama, kabul edeceği imzalayanları requirement ile tarif eder; böylece sahte ama "geçerli imzalı" bir binary reddedilir.</p></div>

<h3>5. Certificate chain: güven nereden gelir</h3>
<p>İmza bir CMS yapısıdır ve bir <strong>certificate chain</strong> taşır: geliştirici sertifikası → ara Apple sertifikaları → Apple root. Sistem bu zinciri güvenilir bir köke kadar doğrular. İki uç vardır: kimlikle imzalama (bir sertifikaya bağlı) ve <em>ad-hoc</em> imza (sertifika yok, yalnızca cdhash üretilir — iOS'ta sistem binary'leri sıkça böyledir ve güven trust cache'ten gelir).</p>

<h3>6. Çalışma anında zorlama</h3>
<p>İmza statik bir etiket değildir; çekirdek onu <em>çalışırken</em> zorlar. Bir kod sayfası ilk kez belleğe getirilirken (page fault), çekirdek o sayfanın hash'ini Code Directory'deki değerle karşılaştırır (<code>cs_validate_page</code>). Uymazsa süreç anında öldürülür. Yani bir binary belleğe yüklendikten sonra bile değiştirilemez.</p>
<div class="deflist">
<div><dt>notarization</dt><dd>macOS: Apple'ın binary'yi zararlı yazılım için taradığı ek onay. Sonuç bir "ticket" olarak dosyaya iliştirilir (stapling); Gatekeeper bunu kontrol eder.</dd></div>
<div><dt>hardened runtime</dt><dd>Ek korumalar: imzasız kod enjeksiyonunu, DYLD_INSERT_LIBRARIES'i ve bellek koruma zayıflatmalarını engeller. Notarization için gereklidir.</dd></div>
</div>
<p>İmzayı <strong>kimin zorladığı</strong> ayrı bir modülün konusudur: çekirdekteki AMFI (AppleMobileFileIntegrity) ve kullanıcı alanındaki amfid, Code Directory doğrulamasını ve trust cache kontrolünü yapar — bkz. bir sonraki modül.</p>`
