  deepDive: {
    heading: "Derinlemesine: dyld bir programı nasıl çalışır hale getirir?",
    html: `<p class="lead">Mach-O dosyası diske yazıldığında henüz çalışmaya hazır değildir: bağımlı kütüphaneleri eksiktir, adresleri ASLR yüzünden sabit değildir ve symbol'leri çözülmemiştir. Bu boşluğu dynamic linker (dyld) doldurur. Modern macOS/iOS'ta dyld, başlatma hızının ve çalışma-anı güvenliğinin merkezindedir.</p>

<h3>1. dyld devralır</h3>
<p>Kernel, execve sırasında Mach-O'yu belleğe map eder ama doğrudan programın entry point'ine atlamaz. Mach-O'daki <code>LC_LOAD_DYLINKER</code> load command bir dynamic linker yolu tutar (<code>/usr/lib/dyld</code>); kernel önce onu yükler ve kontrolü ona verir. dyld'nin modern uygulaması (dyld4) programı çalıştırılabilir hale getirmek için gereken tüm adımları kendi user space'inde yürütür.</p>

<h3>2. Bağımlı dylib'lerin yüklenmesi ve aranması</h3>
<p>Her Mach-O, ihtiyaç duyduğu kütüphaneleri <code>LC_LOAD_DYLIB</code> load command'leriyle listeler. dyld bu dependency graph'ı rekürsif olarak gezer ve her dylib'i yükler. Arama yolları sabit değildir; değişkenlerle ifade edilir:</p>
<div class="deflist">
<div><dt>@executable_path</dt><dd>Ana çalıştırılabilir dosyanın bulunduğu dizin. App bundle'ları için idealdir.</dd></div>
<div><dt>@loader_path</dt><dd>O an yükleyen Mach-O'nun (plugin veya framework) dizini. İç içe bileşenlerde kullanılır.</dd></div>
<div><dt>@rpath</dt><dd>Çalıştırılabilir dosyanın tanımladığı bir dizi arama yolu (<code>LC_RPATH</code>). En esnek ve en yaygın olanı.</dd></div>
</div>

<h3>3. Rebase ve bind: adresleri yerine oturtmak</h3>
<p>ASLR gereği, bir image her açılışta rastgele bir adrese (<strong>slide</strong>) yüklenir. Bu yüzden iki düzeltme gerekir. <strong>Rebase</strong>, image'in kendi içindeki mutlak işaretçilere slide değerini ekler. <strong>Bind</strong>, başka kütüphanelerdeki symbol'leri çözer (örn. <code>printf</code>'in gerçek adresini bulup yazar). Eskiden bu bilgi, dyld'nin yorumladığı opcode tabanlı rebase/bind tablolarında tutulurdu; modern sistemler <strong>chained fixups</strong> kullanır — düzeltmeler doğrudan verinin içinde zincirlenir, ayrı tablo gerekmez, hem daha kompakt hem daha hızlıdır.</p>
<p>Bind iki zamanlı olabilir: <strong>non-lazy binding</strong> başlangıçta hemen çözülür; <strong>lazy binding</strong> ise bir fonksiyon ilk kez çağrıldığında stub üzerinden çözülür, böylece hiç kullanılmayan symbol'ler için maliyet ödenmez.</p>

<h3>4. dyld shared cache</h3>
<p>Sistemdeki her uygulama aynı temel kütüphaneleri (libSystem, Foundation, UIKit...) yükler. Bunları her seferde ayrı ayrı yüklemek ve bind etmek savurganlıktır. Çözüm <strong>dyld shared cache</strong>'tir: tüm sistem dylib'leri tek bir büyük dosyada, önceden birbirine linklenmiş (rebase/bind yapılmış) halde birleştirilir. Bir uygulama açıldığında bu dev image doğrudan map edilir — kütüphaneler neredeyse bedava gelir ve read-only kısımları tüm process'ler arasında fiziksel olarak paylaşılır. iOS'ta sistem dylib'lerinin tekil dosyaları artık diskte bulunmaz; yalnızca cache içinde yaşarlar.</p>
<div class="manpage src-apple"><div class="ref">dyld · DYLD_SHARED_CACHE_DIR</div><p class="orig">This is a directory containing dyld shared cache files.</p><p>Shared cache dosyaları diskte ayrı bir dizinde tutulur; dyld açılışta uygun cache'i seçip adres uzayına map eder.</p></div>

<h3>5. Interposing ve DYLD_INSERT_LIBRARIES</h3>
<p>dyld, bir fonksiyon çağrısını başka bir uygulamaya yönlendirmeye izin verir: bir kütüphane, var olan bir symbol'ün yerine kendi uygulamasını koyabilir (<strong>interposing</strong>). En bilinen yolu <code>DYLD_INSERT_LIBRARIES</code> ortam değişkenidir — program kendi kütüphanelerini yüklemeden önce belirtilen kütüphaneler yüklenir.</p>
<div class="manpage src-apple"><div class="ref">dyld · DYLD_INSERT_LIBRARIES</div><p class="orig">This is a colon separated list of additional dynamic libraries to load before the ones specified in the program.</p><p>Bu mekanizma hata ayıklama ve profilleme için güçlüdür ama aynı zamanda bir saldırı yüzeyidir. Bu yüzden <strong>SIP</strong> altında ve <strong>hardened runtime</strong> ile imzalanmış süreçlerde (ve setuid ikililerde) dyld bu değişkeni yok sayar — imzalı kodun davranışı dışarıdan değiştirilemez.</p></div>

<h3>6. Linux ld.so ile karşılaştırma</h3>
<p>İki sistem aynı problemi çözer ama farklı tercihlerle:</p>
<div class="deflist">
<div><dt>shared cache</dt><dd>macOS/iOS'ta tüm sistem kütüphaneleri tek önbellekte önceden linklidir; Linux'ta her .so ayrı yüklenir (ldconfig yalnızca bir arama önbelleği tutar).</dd></div>
<div><dt>arama yolu</dt><dd>macOS @rpath/@loader_path tabanlıdır; Linux RPATH/RUNPATH + LD_LIBRARY_PATH + /etc/ld.so.conf kullanır.</dd></div>
<div><dt>enjeksiyon</dt><dd>DYLD_INSERT_LIBRARIES ≈ LD_PRELOAD; ikisi de imzalı/setuid süreçlerde kısıtlanır.</dd></div>
<div><dt>namespace</dt><dd>macOS two-level namespace kullanır (symbol'ün hangi kütüphaneden geldiği kaydedilir); Linux flat namespace'e yakındır.</dd></div>
</div>`
