  deepDive: {
    heading: "Derinlemesine: resmi bir denetim noktası nasıl çalışır?",
    html: '<p class="lead">EndpointSecurity, "güvenlik aracı çekirdeği izlesin ama çekirdeğe kod koymasın" problemine Apple\'ın cevabıdır. İstemci modelinden olay yapısına, entitlement kapısından deadline mekaniğine kadar ayrıntılar, bir EDR\'nin ne görebileceğini ve neyi durdurabileceğini belirler. Bu bölüm Apple\'ın EndpointSecurity belgelerine dayanır.</p>' +

      '<h3>1. ES nedir ve neden kext\'in yerini aldı</h3>' +
      '<p>EndpointSecurity, sistem olaylarını izlemek için tasarlanmış bir <strong>C API</strong>\'dir. İstemci (client) kullanıcı-alanında, bir <strong>System Extension</strong> içinde çalışır — yani çekirdeğin içinde değil. Bu, eski <strong>kernel extension</strong> (kext) tabanlı EDR\'lere göre temel bir güvenlik kazanımıdır: bir güvenlik ürünündeki hata artık tüm çekirdeği değil, yalıtılmış bir uzantıyı etkiler ve saldırı yüzeyi çok daralır. Modern macOS üçüncü-taraf kext\'leri büyük ölçüde emekliye ayırmıştır; ES ve DriverKit/SystemExtensions bunun ikamesidir.</p>' +
      '<div class="manpage src-apple"><div class="ref">Endpoint Security · Overview</div><p class="orig">Endpoint Security is a C API for monitoring system events for potentially malicious activity. You can write your client in any language that supports native calls. Your client registers with Endpoint Security to authorize pending events, or receive notifications of events that already occurred. These events include process executions, mounting file systems, forking processes, and raising signals.</p><p>İki yetenek tek cümlede: istemci ya <strong>askıdaki olayları yetkilendirir</strong> (authorize pending events) ya da <strong>olmuş olayların bildirimini alır</strong> (notifications of events that already occurred). Olaylar süreç çalıştırma, dosya sistemi bağlama, süreç çatallama ve sinyal gönderme gibi güvenlik açısından kritik eylemleri kapsar.</p></div>' +

      '<h3>2. İstemci, mesaj ve olay türleri</h3>' +
      '<p>Merkezde iki tip vardır. <strong>es_client_t</strong>, istemcinin durumunu tutan opak bir tiptir; <code>es_new_client()</code> ile oluşturulur ve her olayda çağrılacak bir handler bloğu alır. <strong>es_message_t</strong> ise tek bir olayı tanımlayan yapıdır: olay türü, olayı doğuran süreç, zamanlama ve (AUTH için) bir son tarih (deadline), ve olaya özgü veriyi tutan bir union. İstemci <code>es_subscribe()</code> ile yalnızca ilgilendiği olay türlerine abone olur; gerisi hiç gelmez.</p>' +
      '<div class="manpage src-apple"><div class="ref">docs · es_client_t / es_message_t</div><p class="orig">Client — An opaque type that maintains Endpoint Security client state. Message — A type used by Endpoint Security to notify your client when a monitored action occurs.</p><p>İstemci durumu opak bir handle ardında saklanır (içine doğrudan dokunulmaz); mesaj ise izlenen bir eylem gerçekleştiğinde istemciye iletilen olay kaydıdır. Her olay türünün kendi veri alanları vardır (ör. exec için hedef yürütülebilir, open için vnode).</p></div>' +

      '<h3>3. NOTIFY ve AUTH: görmek ile durdurmak</h3>' +
      '<p>Her olay türünün iki biçimi olabilir. <strong>NOTIFY</strong> olayları (ör. <code>ES_EVENT_TYPE_NOTIFY_OPEN</code>) bilgilendiricidir: eylem zaten olmuştur, istemci yalnızca haberdar edilir ve engelleyemez — davranışsal tespitin ve telemetrinin temeli budur. <strong>AUTH</strong> olayları (ör. <code>ES_EVENT_TYPE_AUTH_EXEC</code>) ise karar gerektirir: eylem çekirdekte askıdadır ve istemci <code>es_respond_auth_result()</code>\'u <code>ES_AUTH_RESULT_ALLOW</code> veya <code>ES_AUTH_RESULT_DENY</code> ile çağırana kadar bekler. Bir EDR\'nin "önleme" gücü yalnızca AUTH olaylarında vardır.</p>' +
      '<div class="deflist">' +
      '<div><dt>NOTIFY</dt><dd>Eylem oldu; istemci haber alır, engelleyemez. Telemetri ve tespit için.</dd></div>' +
      '<div><dt>AUTH</dt><dd>Eylem askıda; istemci ALLOW/DENY kararı verene kadar bekler. Önleme için.</dd></div>' +
      '<div><dt>es_respond_auth_result</dt><dd>AUTH olayına kararı bildiren çağrı (ALLOW veya DENY).</dd></div>' +
      '<div><dt>es_subscribe</dt><dd>İstemcinin yalnızca ilgilendiği olay türlerine abone olmasını sağlar.</dd></div>' +
      '</div>' +

      '<h3>4. Deadline: güç ile sorumluluk</h3>' +
      '<p>AUTH olayı sistemi bekletir, bu yüzden istemci sonsuza kadar düşünemez: her AUTH olayının bir <strong>deadline</strong>\'ı vardır. İstemci zamanında yanıt vermezse ne olacağını <code>deadline miss mode</code> belirler. Varsayılan sert moddur — yavaş bir güvenlik aracı tüm sistemi kilitlemesin diye istemci sonlandırılır.</p>' +
      '<div class="manpage src-apple"><div class="ref">docs · es_deadline_miss_mode_t</div><p class="orig">ES_DEADLINE_MISS_MODE_KILL — Kill the client when it fails to respond to an auth event (default behavior). ES_DEADLINE_MISS_MODE_FAIL_CLOSED — Deny the operation when client fails to respond, but don\'t kill the client. ES_DEADLINE_MISS_MODE_FAIL_OPEN — Allow the operation when client fails to respond, but don\'t kill the client.</p><p>Üç seçenek bir tasarım gerilimini özetler: <strong>KILL</strong> (varsayılan) sistemi korur ama istemciyi feda eder; <strong>FAIL_CLOSED</strong> güvenliği seçip işlemi reddeder; <strong>FAIL_OPEN</strong> işlevselliği seçip işleme izin verir. Bir EDR tasarımcısının en temel tercihlerinden biri.</p></div>' +

      '<h3>5. Entitlement kapısı, muting ve sınırlar</h3>' +
      '<p>ES istemcisi olmak ayrıcalıklı bir yetkidir: süreç <strong>com.apple.developer.endpoint-security.client</strong> entitlement\'ına sahip olmalı, bu da Apple tarafından açıkça verilir. Böylece rastgele bir yazılım çekirdeği dinleyemez. Yük yönetimi için istemci <strong>muting</strong> kullanır — belirli süreçleri veya yolları olay akışından çıkararak hem gürültüyü hem CPU maliyetini düşürür (ör. kendi süreçlerini susturmak). Ama ES\'in temel bir sınırı vardır: o da çekirdeğin bütünlüğüne güvenir. Çekirdek tam olarak ele geçirilirse, ES\'in gördüğü akış da güvenilmez hale gelir. Bu yüzden ES tek savunma değil, katmanlı savunmanın (SIP, sandbox, kod imzalama, SPTM/TXM) bir halkasıdır — ve asıl gücü, çekirdek sağlamken kötü niyetli davranışı erken yakalamaktır.</p>',
  },

        ok: 'Doğru. ES istemcisi kullanıcı-alanında bir System Extension içinde çalışır; üründeki bir hata artık tüm çekirdeği değil yalıtılmış bir uzantıyı etkiler.', no: 'İpucu: eski yöntem çekirdeğe kod enjekte ediyordu — asıl sorun neydi?' },
      { q: 'Bir ES istemcisi bir AUTH olayına deadline içinde yanıt veremezse (varsayılan modda) ne olur?', opts: ['Sistem çöker', 'İstemci sonlandırılır (ES_DEADLINE_MISS_MODE_KILL)', 'Olay sonsuza kadar bekler'], answer: 'İstemci sonlandırılır (ES_DEADLINE_MISS_MODE_KILL)',
        ok: 'Doğru. Varsayılan sert moddur: yavaş bir güvenlik aracı tüm sistemi kilitlemesin diye istemci öldürülür. Alternatifler FAIL_CLOSED (reddet) ve FAIL_OPEN (izin ver).', no: 'İpucu: AUTH olayı sistemi bekletir — yavaş istemci sistemi dondurmamalı.' }
