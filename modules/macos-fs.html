    html: `<p class="lead">macOS/iOS depolaması iki kattan oluşur. Üstte, çekirdeğin herhangi bir dosya sistemiyle tek bir arayüzden konuşmasını sağlayan VFS; altında, SSD çağı için sıfırdan tasarlanmış copy-on-write dosya sistemi APFS. APFS\'in neredeyse tüm "sihirli" özellikleri (ucuz snapshot, anında clone, çökme koruması) tek bir tasarım kararından — nesneleri asla yerinde değiştirmemekten — doğar. Bu bölüm Apple\'ın "Apple File System Reference" belgesine ve XNU\'nun bsd/vfs kaynağına dayanır.</p>

<h3>1. VFS: vnode ve VOP soyutlaması</h3>
<p>Bir süreç <code>read()</code> çağırdığında çekirdek hangi dosya sistemine ineceğini bilmek zorunda değildir. VFS, her açık dosyayı bir <strong>vnode</strong> (virtual node) ile temsil eder; dosya üzerindeki her işlem bir <strong>VOP</strong> (vnode operation) olarak ifade edilir ve alttaki dosya sisteminin kendi fonksiyonuna yönlendirilir. Aynı <code>VNOP_READ</code> çağrısı APFS\'te bir fonksiyona, bir ağ dosya sisteminde bambaşka bir fonksiyona gider.</p>
<div class="deflist">
<div><dt>vnode</dt><dd>Açık bir dosya/dizini temsil eden çekirdek nesnesi. Dosya sistemi bağımsızdır; Linux\'taki inode önbelleğinin + dentry\'nin işlevsel karşılığı.</dd></div>
<div><dt>VOP / VNOP</dt><dd>vnode üzerindeki işlem (lookup, read, write, getattr…). VFS bunları alttaki dosya sisteminin uygulamasına bağlar.</dd></div>
<div><dt>mount</dt><dd>Bir dosya sistemi örneğinin ağaç içindeki bağlanma noktası. Her mount kendi VFS operasyon tablosunu taşır.</dd></div>
</div>
<div class="manpage"><div class="ref">4 vnode · BSD</div><p class="orig">The vnode is the focus of all file activity in UNIX. There is a unique vnode allocated for each active file, each current directory, each mounted-on file, text file, and the root.</p><p>vnode, UNIX\'te tüm dosya etkinliğinin merkezidir: aktif her dosya, her çalışma dizini ve mount noktası için bir vnode ayrılır. Çekirdeğin geri kalanı dosyayla bu soyutlama üzerinden konuşur; alttaki dosya sistemini bilmez.</p></div>

<h3>2. Container ve volume: paylaşılan boş alan</h3>
<p>APFS\'te bir disk bölümü tek bir <strong>container</strong> taşır; container boş alanı ve çökme korumasını yönetir. İçinde bir veya daha çok <strong>volume</strong> (asıl dosya sistemi) bulunur. Klasik bölümlemenin aksine, volume\'lar alanı <strong>önceden paylaştırmaz</strong>: hepsi container\'ın ortak havuzundan çeker. macOS\'ta System, Data, Preboot, Recovery ayrı volume\'lardır ama tek bir alan havuzunu paylaşır.</p>
<div class="manpage src-apple"><div class="ref">apple · APFS Reference</div><p class="orig">An Apple File System partition has a single container, which provides space management and crash protection. A container can contain multiple volumes, each of which contains a directory structure for files and folders.</p><p>Bir container alan yönetimi ve çökme korumasından sorumludur; içindeki her volume kendi dizin yapısını tutar. "Bu volume\'a kaç GB ayırayım?" sorusu ortadan kalkar çünkü boş alan ortaktır.</p></div>
<div class="manpage src-apple"><div class="ref">apple · APFS Reference</div><p class="orig">All three of these volumes share free space, meaning you don't have to decide ahead of time how to divide space between them.</p><p>Aynı container\'daki volume\'lar boş alanı paylaşır — alanı önceden bölmek gerekmez. Bir volume büyüdükçe havuzdan çeker; diğerleri daralmak zorunda kalmaz.</p></div>

<h3>3. Copy-on-write: yerinde değiştirme yok</h3>
<p>APFS\'in temel taşı: diskteki nesneler asla üzerine yazılmaz. Bir nesne (metadata ya da veri) değişince, değişmiş kopya diskte yeni bir konuma yazılır ve ona işaret eden üst nesne de — yine kopyalanarak — güncellenir. Bu zincir en tepedeki süperbloka (checkpoint) kadar çıkar. Değişiklik atomik olarak "yayınlanana" kadar eski sürüm diskte bütünüyle tutarlı durur; güç kesilse bile dosya sistemi ya eski ya yeni tutarlı hâlde kalır — bozuk bir ara durum oluşmaz.</p>
<div class="manpage src-apple"><div class="ref">apple · APFS Reference</div><p class="orig">Regardless of their storage, objects on disk are never modified in place, and modified copies of an object are always written to a new location on disk.</p><p>Nesneler diskte asla yerinde değiştirilmez; değişen kopya her zaman yeni bir konuma yazılır. ext4\'ün journaling ile sağladığı tutarlılığı APFS bu copy-on-write deseniyle, ayrı bir journal\'a ihtiyaç duymadan sağlar.</p></div>
<div class="manpage src-apple"><div class="ref">apple · APFS Reference</div><p class="orig">Within a container, the checkpoint mechanism and the copy-on-write approach to modifying objects enable crash protection.</p><p>Çökme koruması ayrı bir mekanizma değil, copy-on-write + checkpoint\'in doğal sonucudur. Yeni sürüm tam yazılmadan "geçerli" sayılmaz; yarıda kalan yazma eski tutarlı sürümü bozmaz.</p></div>

<h3>4. Snapshot ve clone: aynı mekanizmanın meyvesi</h3>
<p>Nesneler yerinde değişmediği için, bir anı "dondurmak" bedavaya yakındır. Bir <strong>snapshot</strong>, volume\'un o anki sürümüne (transaction identifier, XID) bir referans tutar; hiçbir blok kopyalanmaz. Sonradan yazılan her blok copy-on-write ile yeni yere gittiğinden, snapshot eski blokları görmeye devam eder. Benzer biçimde bir dosya <strong>clone</strong>\'u başta hiç veri kopyalamaz; yalnızca değişen kısımlar <em>delta extent</em> olarak ayrı yazılır.</p>
<div class="deflist">
<div><dt>snapshot</dt><dd>Volume\'un belirli bir andaki read-only kopyası. Maliyeti ~0; yalnızca sonradan değişen bloklar yer tutar. Time Machine yerel anlık görüntüleri bunu kullanır.</dd></div>
<div><dt>clone</dt><dd>Bir dosyanın anında kopyası; başlangıçta aynı blokları paylaşır. Değişiklikler delta extent olarak eklenir, böylece kopya yer kaplamaz.</dd></div>
<div><dt>XID (transaction id)</dt><dd>Her değişiklik sürümünü numaralar. Object map, bir nesneyi okurken istenen XID\'ye göre doğru (en yakın küçük) sürümü çözer.</dd></div>
</div>
<div class="manpage src-docs"><div class="ref">docs · APFS</div><p class="orig">APFS volumes support snapshots for creating a point-in-time, read-only instance of the file system.</p><p>Snapshot, dosya sisteminin belirli bir andaki read-only örneğidir. Değişmez olması, onu yedekleme ve geri alma için güvenli bir temel yapar — snapshot sonrası yazmalar yalnızca canlı sürümü etkiler.</p></div>
<div class="manpage src-docs"><div class="ref">docs · APFS</div><p class="orig">Changes to a cloned file are saved as delta extents, reducing storage space required for document revisions and copies.</p><p>Clone\'lanmış bir dosyadaki değişiklikler delta extent olarak saklanır; ortak bloklar tek kopya kalır. Bu yüzden büyük bir dosyayı kopyalamak anında olur ve neredeyse hiç yer tutmaz.</p></div>

<h3>5. Şifreleme ve metadata bütünlüğü</h3>
<p>APFS şifrelemeyi sonradan eklenmiş bir katman değil, doğuştan gelen bir özellik olarak taşır: volume başına ve dosya başına anahtarlar desteklenir. iOS\'ta bu, <strong>Data Protection</strong> sınıflarıyla birleşir — her dosyanın anahtarı, cihazın kilit durumuna bağlı bir anahtar hiyerarşisiyle korunur (ayrıntısı SEP modülünde). Ayrıca APFS metadata\'sı checksum\'lıdır: bozulma sessizce yayılmak yerine yakalanabilir.</p>
<div class="manpage src-docs"><div class="ref">docs · APFS</div><p class="orig">Apple File System natively supports full disk encryption</p><p>Tam disk şifreleme APFS\'in yerleşik parçasıdır. iOS\'ta dosya başına anahtarlar Data Protection ile cihazın kilidine bağlanır; macOS\'ta FileVault aynı altyapıyı kullanır.</p></div>

<h3>6. HFS+ mirası ve Linux karşılaştırması</h3>
<p>APFS\'ten önce Apple\'ın dosya sistemi HFS+\'tı: journaling, B-tree tabanlı catalog dosyası ve fork\'lar (data/resource) ile çalışırdı. HFS+ yerinde-güncelleme yapar ve tutarlılığı ayrı bir journal ile sağlardı — kavramsal olarak ext4\'e yakındır. APFS bu modeli terk edip copy-on-write\'a geçti. Linux tarafında APFS\'in en yakın akrabası, yine copy-on-write ve snapshot temelli <strong>Btrfs</strong>\'tir; ext4 ise HFS+ gibi journaling + yerinde-güncelleme kampındadır. Özetle: ext4/HFS+ "değiştir ve journal\'a yaz", APFS/Btrfs "hiç değiştirme, yeni yaz ve işaretçiyi çevir" der.</p>`
