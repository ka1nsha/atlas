  deepDive: {
    heading: "Derinlemesine: GCD gerçekte nasıl çalışır?",
    html: `<p class="lead">GCD yüzeyde "işi kuyruğa ver, gerisini sistem halleder" gibi basit görünür. Ama altında farklı dispatch queue türleri, bir öncelik/QoS modeli, klasik deadlock tuzakları ve çekirdekteki pthread workqueue yatar. Bu bölüm Apple dispatch man sayfalarına ve libdispatch'e dayanır.</p>

<h3>1. Kuyruk türleri: serial, concurrent, main</h3>
<p>Her şey bir <strong>dispatch queue</strong>'dur; blok'lar bu kuyruklara girer ve kuyruğun türü nasıl çalışacaklarını belirler.</p>
<div class="deflist">
<div><dt>serial queue</dt><dd>Blokları teker teker, bir öncekini bitirmeden sonrakine geçmeden çalıştırır. Paylaşılan veriyi lock kullanmadan korumanın temiz yolu — tek seferde tek blok dokunur.</dd></div>
<div><dt>concurrent queue</dt><dd>Birden çok bloğu havuzdaki farklı thread'lerde paralel çalıştırır. Barrier block destekler (aşağıda).</dd></div>
<div><dt>main queue</dt><dd>Uygulamanın ana thread'inde çalışan özel bir serial queue. UI'ya yalnızca buradan dokunulur. <code>dispatch_get_main_queue()</code> ile alınır.</dd></div>
<div><dt>global queue</dt><dd>Sistemin sağladığı, önceliğe/QoS'a göre ayrılmış paylaşılan concurrent queue'lar. <code>dispatch_get_global_queue()</code> ile alınır.</dd></div>
</div>
<div class="manpage src-apple"><div class="ref">dispatch · QUEUES</div><p class="orig">Dispatch queues are the basic units of organization of blocks. All blocks submitted to dispatch queues are dequeued in FIFO order.</p><p>Bloklar kuyruğa giriş sırasıyla (FIFO) alınır. "Dequeue sırası" ile "bitiş sırası" aynı şey değildir: serial queue'da ikisi de sıralıdır; concurrent queue'da bloklar sırayla başlar ama paralel çalıştığı için farklı sırada bitebilir.</p></div>
<div class="manpage src-apple"><div class="ref">dispatch_queue_create · SERIAL</div><p class="orig">Serial queues … wait for the previously dequeued block to complete before dequeuing the next block.</p><p>Serial queue bir sonraki bloğu, bir önceki bitmeden başlatmaz. Bu garanti, onu kilitsiz bir senkronizasyon aracına çevirir: bir veriye hep aynı serial queue üzerinden dokunursan, yarış durumu (race condition) oluşmaz.</p></div>

<h3>2. async vs sync ve deadlock tuzağı</h3>
<p><code>dispatch_async</code> bloğu kuyruğa koyar ve <strong>hemen döner</strong> — çağıran beklemez. <code>dispatch_sync</code> ise bloğu koyar ve <strong>bitene kadar bekler</strong>. Buradaki en klasik hata: hâlihazırda çalıştığın serial queue'ya (özellikle main queue'ya) <code>dispatch_sync</code> yapmak. Kuyruk meşgul olduğun bloğu bitirmeni bekler, sen ise sync'in dönmesini beklersin — ikisi birbirini bekler, bu bir <strong>deadlock</strong>'tır. Kural: UI thread'inde ağır iş için <code>dispatch_async(global, ...)</code>, sonucu geri vermek için <code>dispatch_async(main, ...)</code>.</p>

<h3>3. Global queue'lar, öncelik ve QoS</h3>
<p>Global concurrent queue'lar FIFO <em>bitiş</em> garantisi vermez ve bir önceliğe bağlıdır. Eski API dört <strong>priority band</strong> kullanırdı; modern API bunların yerine anlamsal <strong>QoS class</strong>'larını koyar.</p>
<div class="deflist">
<div><dt>userInteractive</dt><dd>Kullanıcının o an beklediği iş (animasyon, UI olayı). En yüksek öncelik, en kısa gecikme.</dd></div>
<div><dt>userInitiated</dt><dd>Kullanıcının başlattığı, sonucunu hemen beklediği iş (bir belgeyi açma).</dd></div>
<div><dt>utility</dt><dd>İlerleme çubuğuyla süren iş (indirme, içe aktarma). Enerji verimliliği gözetilir.</dd></div>
<div><dt>background</dt><dd>Kullanıcının farkında olmadığı iş (yedekleme, indeksleme). En düşük öncelik.</dd></div>
</div>
<div class="manpage src-apple"><div class="ref">dispatch_queue_create · GLOBAL</div><p class="orig">The global concurrent queues schedule blocks as soon as threads become available (non-FIFO completion order). … The priority … controls the scheduling priority of the threads.</p><p>Global queue'lar thread boşaldıkça blok başlatır; öncelik, o blokları çalıştıran thread'lerin zamanlama önceliğini belirler. QoS class bu önceliği anlamsal bir etikete bağlar, böylece sistem enerji ile tepkiselliği birlikte dengeler ve priority inversion'ı (düşük öncelikli bir işin yüksek öncelikliyi bekletmesi) yönetebilir.</p></div>

<h3>4. Thread pool'u kim yönetir: pthread workqueue</h3>
<p>GCD'nin asıl inceliği şudur: thread sayısını <code>libdispatch</code> kendi tutmaz. "Şu kadar çalıştırılabilir iş var" bilgisini çekirdeğe iletir; çekirdekteki <strong>pthread workqueue</strong> mekanizması CPU çekirdeği sayısına ve yüke bakarak kaç worker thread uyandıracağına karar verir. Bu yüzden her kütüphane kendi thread'lerini açmaz — sistem geneli tek bir havuz vardır. Yanlış kullanım (havuzdaki thread'leri bloklayan senkron/bekleyen işler yığmak) <strong>thread explosion</strong>'a yol açabilir: iş bitmediği için çekirdek sürekli yeni thread uyandırır.</p>
<div class="manpage src-apple"><div class="ref">dispatch · FRAMEWORK</div><p class="orig">The dispatch framework allows blocks to be scheduled for asynchronous and concurrent execution. … Several queues are created by default, and applications may create additional queues for their own use.</p><p>Çatı, blokların asenkron ve eşzamanlı çalışmasını sağlar; birkaç kuyruk varsayılan olarak hazır gelir, uygulamalar kendi kuyruklarını ekleyebilir. "Kaç thread" sorusunun cevabı uygulamada değil, bu paylaşılan altyapıdadır.</p></div>

<h3>5. Barrier, group, semaphore, source</h3>
<ul>
<li><strong>Barrier block</strong>: concurrent queue'da bir yazma bariyeri. Kendisi çalışırken kuyruktaki tüm okuma blokları durur — reader/writer kilidinin GCD karşılığı.</li>
<li><strong>Dispatch group</strong>: birden çok asenkron işi gruplayıp "hepsi bitince şunu yap" demek.</li>
<li><strong>Dispatch semaphore</strong>: sayaçlı klasik senkronizasyon; sınırlı bir kaynağa erişimi yönetmek için.</li>
<li><strong>Dispatch source</strong>: dosya tanımlayıcısı, sinyal, timer, Mach port gibi düşük seviyeli olayları bir kuyruğa bağlayıp olay-güdümlü işlemek.</li>
</ul>

<h3>6. Linux ile karşılaştırma</h3>
<p>Linux'ta sistem geneli tek bir GCD yoktur; thread pool'ları kütüphaneler (veya libdispatch'in Linux portu, swift-corelibs-libdispatch) kendi kurar. Fikir aynıdır: bir görev kuyruğu + sınırlı bir worker thread havuzu. macOS'un farkı, bunu dile (block) ve çekirdeğe (workqueue) gömülü, tüm uygulama ve sistem servisleri için ortak tek bir altyapı olarak sunmasıdır.</p>`
  },
