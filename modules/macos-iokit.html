    html: `<p class="lead">IOKit, XNU'nun sürücü dünyasıdır — ama Linux'un C sürücülerinden çok farklı bir felsefeyle: nesne yönelimli, C++ tabanlı ve çalışma anında keşfedilen bir aygıt ağacı üzerine kurulu. Bu yapı, bir USB aygıtını taktığınızda doğru sürücünün otomatik yüklenmesinden, bir user client'ın iOS exploit zincirlerinde neden sık bir saldırı yüzeyi olduğuna kadar her şeyi açıklar. Bu bölüm Apple'ın IOKit belgelerine ve Jonathan Levin'in OS Internals serisine dayanır.</p>

<h3>1. IOKit = çekirdekte C++</h3>
<p>Linux sürücüleri saf C'dir; IOKit ise kernel içinde çalışan kısıtlı bir C++ alt kümesi (Embedded C++) kullanır. Taban sınıf <code>OSObject</code>'tir ve tüm nesneler Libkern runtime'ı üzerinden reference counting (<code>retain</code>/<code>release</code>) ile yönetilir. Exception ve RTTI gibi özellikler, çok iş parçacıklı kernel için uygun olmadığından çıkarılmıştır. Ortak davranış family (IOUSBFamily, IOStorageFamily gibi) sınıflarında toplanır, böylece her sürücü sıfırdan yazılmaz.</p>
<div class="manpage src-apple"><div class="ref">iokit fundamentals · overview</div><p class="orig">It is based on an object-oriented programming model implemented in a restricted form of C++ that omits features unsuitable for use within a multithreaded kernel.</p><p>Apple'ın kendi ifadesi: çok iş parçacıklı kernel için uygun olmayan C++ özellikleri kasıtlı olarak çıkarılmıştır. Bu yüzden IOKit kodu C++ gibi görünür ama exception kullanmaz, bellek yönetimi elle (reference counting) yapılır.</p></div>

<h3>2. I/O Registry: çalışma anında aygıt ağacı</h3>
<p>I/O Registry, o anda sistemde var olan donanımı ve sürücü nesnelerini tutan canlı bir ağaçtır. Her düğüm bir <code>IORegistryEntry</code>'dir; kökte platform expert, altında bus'lar (PCI, USB), onların altında aygıtlar ve onlara bağlanan sürücüler bulunur. Bir aygıt takılıp çıktıkça ağaç değişir — bu yüzden "çalışma anında" (dynamic) denir. <code>ioreg</code> komutu bu ağacı gezer.</p>
<div class="manpage src-apple"><div class="ref">iokit fundamentals · registry</div><p class="orig">The I/O Registry, a database that tracks instantiated objects (such as driver instances) and provides information about them.</p><p>Registry statik bir liste değil, canlı bir veritabanıdır: hangi sürücünün hangi aygıta bağlı olduğunu ve aralarındaki provider/client ilişkisini anlık olarak yansıtır.</p></div>

<h3>3. Driver matching: doğru sürücüyü bulmak</h3>
<p>Bir nub (aygıtı temsil eden geçici nesne) kendini duyurduğunda, çekirdek hangi sürücünün ona uyduğunu bir <strong>matching dictionary</strong> ile arar: sürücünün Info.plist'indeki personality (örn. IOProviderClass, vendor/product ID) registry özellikleriyle karşılaştırılır. Birden çok aday varsa <code>probe()</code> çağrılır ve her sürücü bir <strong>score</strong> döndürür; en yüksek skorlu kazanır. Bu, plug-and-play'in temelidir.</p>
<div class="manpage src-apple"><div class="ref">iokit fundamentals · matching</div><p class="orig">A robust, efficient match-and-load mechanism that scales well to all bus types.</p><p>Aynı match-and-load mekanizması PCI, USB, Thunderbolt — her bus türünde çalışır. Sürücü koduna dokunmadan yeni aygıt desteği, çoğu zaman sadece bir matching dictionary eklemekle gelir.</p></div>

<h3>4. IOService yaşam döngüsü</h3>
<p>Sürücüler <code>IOService</code>'ten türer ve matching'i kazanınca belirli bir sırayla hayata geçer. Bu sıra Linux'un <code>probe()</code>/<code>remove()</code> callback'lerine benzer ama daha ayrıntılıdır:</p>
<div class="deflist">
<div><dt>init / attach</dt><dd>Nesne kurulur ve provider'ına (üstündeki nub) registry'de bağlanır.</dd></div>
<div><dt>probe</dt><dd>Sürücü donanımı yoklar ve bir match score döndürür — "bu aygıta ben ne kadar uygunum?".</dd></div>
<div><dt>start</dt><dd>Kazanan sürücü başlar: kaynakları alır, kendi nub'larını yayınlar (registerService), aygıtı kullanılabilir yapar.</dd></div>
<div><dt>stop / free</dt><dd>Aygıt gidince ters sırada sökülür; free ile reference count sıfırlanınca bellek bırakılır.</dd></div>
</div>
<p>Senkronizasyon için IOKit <strong>work loop</strong> ve <code>IOCommandGate</code> kullanır: aygıta erişim tek bir work loop thread'inde seri hale getirilir, böylece interrupt ve istemci çağrıları çakışmaz.</p>

<h3>5. User client: kullanıcı alanının çekirdeğe açılan kapısı</h3>
<p>Kullanıcı alanı bir uygulama, bir sürücüyle doğrudan konuşamaz; bunun yerine bir <code>IOUserClient</code> açar ve <code>externalMethod</code> ile sürücüye çağrı yapar (Linux'taki <code>ioctl</code>'in karşılığı). Sürücü, her user client metodu için izin verilen argümanları ve sınırları tanımlar. Bu kapı güvenlik açısından kritiktir: kullanıcı alanından gelen her girdi düşman kabul edilmeli, doğrulanmalıdır. User client metodlarındaki eksik doğrulama, kullanıcı alanından çekirdeğe ulaşan en yaygın saldırı yüzeylerinden biridir (kavramsal — ofansif izleğe bakın).</p>

<h3>6. DriverKit: sürücüler kullanıcı alanına taşınıyor</h3>
<p>Geleneksel sürücüler kernel extension (kext) olarak çekirdeğin içinde çalışır — bir kext çökerse tüm sistem çöker ve kext kod imzalama/güvenlik için ağır bir yüktür. Apple bu yüzden DriverKit'i getirdi: sürücüler artık kullanıcı alanında, izole bir süreç (dext — driver extension) olarak çalışır. Bir dext çökerse çekirdek ayakta kalır. Bu, XPC/IPC üzerinden çekirdekle konuşan, saldırı yüzeyini daralmış bir modeldir.</p>
<div class="manpage src-apple"><div class="ref">driverkit · overview</div><p class="orig">Develop device drivers that run in user space.</p><p>Tek cümlelik felsefe değişimi: sürücü artık çekirdekte değil, kullanıcı alanında. Linux da benzer bir yönde (UIO, VFIO ile bazı sürücüleri kullanıcı alanına taşıma) ilerliyor, ama DriverKit bunu tüm sürücü sınıfları için varsayılan hedef yapıyor.</p></div>`
