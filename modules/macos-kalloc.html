  deepDive: {
    heading: "Derinlemesine: XNU çekirdek heap'i ve kalloc_type savunması",
    html: `<p class="lead">Kullanıcı alanındaki malloc'un (Linux Modül 5) çekirdek karşılığı tek bir ayırıcı değil, katmanlı bir sistemdir: sabit boyutlu nesneler için zone allocator, genel amaçlı küçük tahsisler için kalloc, ve son yıllarda eklenen type-aware savunma kalloc_type. Bu bölüm bu katmanların nasıl çalıştığını ve neden bir çekirdek use-after-free'inin bu kadar değerli olduğunu, Apple'ın kendi belgelerine ve XNU kaynağına dayanarak açar.</p>

<h3>1. Zone allocator: sabit boyut kovaları</h3>
<p>XNU'nun temel çekirdek ayırıcısı <strong>zone allocator</strong>'dır (<code>osfmk/kern/zalloc.c</code>). Fikir basit: sık tahsis edilen her nesne tipi — task, thread, ipc_port, vm_map_entry — kendi <strong>zone</strong>'unda tutulur. Her zone yalnızca tek bir sabit eleman boyutuna (element size) sahiptir ve bellekten chunk'lar hâlinde sayfa (page) alır; o chunk sabit boyutlu slot'lara bölünür. Bu tasarım fragmentation'ı düşük tutar ve tahsis/serbest bırakma işlemini neredeyse sabit zamanlı yapar: serbest bir slot her zaman o zone'un freelist'inin başındadır.</p>
<div class="manpage src-apple"><div class="ref">Apple Security · XNU memory safety</div><p class="orig">The zone allocator, which serves smaller sized allocations (mostly sub-page)… The zone subsystem monitors its chunks for usage, and if a chunk is made only of free elements, then the memory, both physical and virtual, may be reclaimed.</p><p>Yani bir zone chunk'ı tamamen boşalırsa, fiziksel ve sanal bellek geri alınabilir — ama normal işleyişte serbest bir slot, aynı zone'dan gelen bir sonraki isteğe geri verilir. İşte bu "aynı zone → aynı slot geri gelir" davranışı, lab'da gördüğün use-after-free'in motorudur.</p></div>

<h3>2. kalloc: boyut sınıfına yuvarlama</h3>
<p>Her tahsisin kendi tipli zone'u yoktur. Değişken boyutlu, genel amaçlı küçük istekler için <strong>kalloc</strong> kullanılır. kalloc bir size class ailesidir: isteği en yakın üst boyut sınıfına yuvarlar ve o sınıfın zone'undan verir. Örneğin 48 baytlık bir istek <code>kalloc.64</code> zone'una düşer (lab'da gördüğün gibi). Yuvarlama mantığı, az sayıda zone ile geniş bir boyut aralığını karşılamayı sağlar; bedeli ise iç parçalanmadır (internal fragmentation — 48 bayt istedin, 64 bayt tüketti).</p>
<div class="deflist">
<div><dt>zalloc / zfree</dt><dd>En alttaki ilkel (primitive): belirli bir zone'dan tek bir sabit boyutlu eleman al / geri ver. Tüm üst ayırıcılar buna iner.</dd></div>
<div><dt>kalloc / kfree</dt><dd>Boyuta göre uygun kalloc.N zone'unu seçen genel amaçlı sarmalayıcı (wrapper). Değişken boyut burada size class'a yuvarlanır.</dd></div>
<div><dt>size class</dt><dd>Önceden tanımlı boyut kademeleri (… 32, 48, 64, 96 …). Aynı size class'a düşen farklı boyutlar aynı zone'u, dolayısıyla aynı slot havuzunu paylaşır.</dd></div>
<div><dt>freelist</dt><dd>Zone başına serbest slot listesi. kfree edilen slot listenin başına eklenir; sonraki zalloc onu geri verir. Klasik UAF'ın "yuva geri geldi" adımı tam olarak budur.</dd></div>
</div>

<h3>3. Neden çekirdek UAF'ı bu kadar değerli?</h3>
<p>Bir use-after-free'de (kavramsal olarak Ofansif Modül 2'deki kullanıcı-alanı UAF'ının aynısı) serbest bırakılmış bir nesneye sarkan işaretçi (dangling pointer) hâlâ bakar. Aynı boyut sınıfından yeni bir nesne tahsis edilirse, freelist eski slot'u yeni nesneye verir ve iki farklı tip aynı belleği paylaşır. Saldırgan yeni nesnenin içeriğini kontrol edebilirse, eski nesnenin bir function pointer'ı ya da yetki alanı artık saldırgan verisiyle doludur. Çekirdek en yüksek ayrıcalık seviyesinde çalıştığı için buradaki bir okuma/yazma primitifi, kod imzalama (code signing) ve sandbox dâhil tüm korumaları aşmaya giden yoldur. Apple bu gerçeği açıkça ifade eder:</p>
<div class="manpage src-apple"><div class="ref">Apple Security · XNU memory safety</div><p class="orig">Almost all attacks hinge at some point on establishing a type confusion… The security benefit comes from the fact that a confusion between pure data and control is almost always exploitable.</p><p>Bu cümle savunma tasarımının çıkış noktasıdır: eğer saldırganlar neredeyse her zaman bir <strong>type confusion</strong> kurmak zorundaysa, savunma da tam o adımı — "farklı tipleri aynı slot'ta çakıştırma" imkânını — ortadan kaldırmaya odaklanmalıdır.</p></div>

<h3>4. kalloc_type: derleme zamanı tür ayrımı</h3>
<p>Modern XNU'nun cevabı <strong>kalloc_type</strong>'tır. Fikir, her tahsis edilen C tipinin bir imzasını (signature) derleyicide statik olarak üretmek ve aynı imzaya sahip nesneleri ayrı zone'larda toplamaktır. Böylece A tipi ve B tipi farklı zone'lara düşer; A serbest kalsa bile B onun slot'una <em>düşemez</em>, çünkü B başka bir zone'dan gelir. Lab'ın son adımındaki "çakışma engellendi" durumu budur.</p>
<div class="manpage src-apple"><div class="ref">Apple Security · XNU memory safety</div><p class="orig">The basic idea is to use the compiler to statically generate a "signature" of each type that gets allocated.</p><p>İmza derleme zamanında bilindiği için, tür ayrımı çalışma zamanında ek bir kontrol maliyeti getirmeden sağlanır. Bu, type confusion'ı belirli bir tahsis sınıfı için yapısal olarak kapatır — saldırgan artık istediği iki tipi aynı havuzda buluşturamaz.</p></div>
<p>İkinci bir ayrım daha vardır: <strong>veri</strong> tahsisleriyle <strong>işaretçi/kontrol</strong> tahsislerini ayırmak. XNU bunun için ayrı bir "data" heap'i tanıttı:</p>
<div class="manpage src-apple"><div class="ref">Apple Security · XNU memory safety</div><p class="orig">We also added a new heap, called the "data" heap (KHEAP_DATA_BUFFERS), to hold allocations made of pure data… a new kalloc_data(...) family of calls translates to kheap_alloc(KHEAP_DATA_BUFFERS, ...).</p><p>Saf veri (örneğin bir kullanıcıdan gelen bayt tamponu) ile function pointer içeren kontrol yapıları aynı bellekte buluşamazsa, saldırganın en işlek primitifi olan "veri ↔ kontrol karışıklığı" kırılır. <code>kalloc_data</code> veri için, <code>kalloc_type</code> tipli yapılar içindir.</p></div>

<h3>5. Tamamlayıcı savunma: zone_require</h3>
<p>Tür ayrımı tahsis tarafını sertleştirir; <strong>zone_require</strong> ise kullanım tarafını denetler. Çekirdek, kritik bir nesneyi kullanmadan önce "bu işaretçi gerçekten beklediğim zone'dan mı geliyor?" diye doğrulayabilir. Saldırgan bir nesneyi yanlış tipte bir slot'a yerleştirmeye çalışırsa, bu kontrol tutarsızlığı yakalar ve sistem güvenli şekilde panic eder — sessiz bir ele geçirme yerine denetlenebilir bir çökme. zone_require, kalloc_type ile birlikte "saldırganın istediği nesneyi istediği yuvaya düşürmesi" (heap grooming) adımını iki ayrı noktadan kırar.</p>
<p>Özetle XNU heap güvenliği bir denge değil, katmanlı bir caydırma zinciridir: zone izolasyonu fragmentation'ı düşürürken tahsisi hızlandırır, kalloc_type ve kalloc_data type confusion'ı yapısal olarak zorlaştırır, zone_require de kalan kaçış yollarını çalışma zamanında yakalar. Bu modül mekanizmayı ve savunmayı anlatır; sömürü tekniklerinin kendisi Ofansif izlekte kavramsal düzeyde ele alınır.</p>`
  },
