  deepDive: {
    heading: "Derinlemesine: panic log'tan kök nedene",
    html: `<p class="lead">Bir çekirdek çöktüğünde elimizde tek bir kanıt kalır: panic log. Bir güvenlik araştırmacısının işi bu ham metni okunur hâle getirmek (symbolication), içindeki ipuçlarını bir kök neden hipotezine bağlamak ve o hipotezi canlı bir debugger ile kanıtlamaktır. Bu bölüm Apple'ın geliştirici belgelerine, Xcode araç man sayfalarına ve Antid0te'un kernel internals eğitim izleğine dayanır; panic log alanları ve adresler temsilîdir.</p>

<h3>1. Panic log anatomisi: çökmenin fotoğrafı</h3>
<p>Bir user-space process çökünce yalnızca o process ölür ve geriye bir crash report kalır; çekirdek çökünce sistem durur ve geriye bir <strong>panic log</strong> kalır. Bu log, çökme anının dondurulmuş bir fotoğrafıdır: hangi hata, nerede, hangi çağrı zinciriyle. Triage'ın tamamı bu alanları doğru okumakla başlar.</p>
<div class="deflist">
<div><dt>panic string</dt><dd>İnsan-okunur ilk satır: hata türü (örn. <code>Kernel data abort</code>, <code>page fault</code>) ve hangi CPU. İlk sınıflandırmayı buradan yaparsın.</dd></div>
<div><dt>fault address</dt><dd>Çekirdeğin erişmeye çalıştığı ve başarısız olduğu adres. Tanınır bir <strong>poison</strong> deseni (ör. <code>0xdeadbeef</code>, <code>0xdeadbeefdeadbeef</code>) use-after-free'in klasik imzasıdır — serbest bırakılan bellek bilerek bu desenle doldurulur.</dd></div>
<div><dt>backtrace</dt><dd>Çökme anındaki çağrı zinciri (call chain), ham <code>lr</code> (link register) adresleri olarak. Henüz anlamsız sayılardır; okunur hâle gelmesi için symbolication şarttır.</dd></div>
<div><dt>register state</dt><dd><code>pc</code>, <code>lr</code>, <code>x0..x30</code> ve <code>sp</code> gibi register'ların çökme anındaki değerleri. Hangi değerin kirli olduğunu (ör. serbest nesne işaretçisi <code>x0</code>'da) gösterir.</dd></div>
<div><dt>panicked task</dt><dd>Çöktüğü sırada CPU'da çalışan task/thread — hangi alt sistemin veya sürücünün (kext) sorumlu olduğuna dair ilk işaret.</dd></div>
<div><dt>kernel slide</dt><dd>KASLR'nin açılışta çekirdeği kaydırdığı offset. Log'daki runtime adresleri static adreslere geri çevirmek (symbolication) için bu slide'ı çıkarmak gerekir.</dd></div>
<div><dt>zone info</dt><dd>Hangi allocator bölgesinin (ör. <code>kalloc.64</code>) ve o bölgede serbest bir element'in mi işin içinde olduğu. UAF hipotezini doğrudan destekleyen alandır (bkz. kalloc modülü).</dd></div>
</div>

<h3>2. Symbolication: ham adresten fonksiyon adına</h3>
<p>Backtrace'teki <code>0xfffffff0…</code> adresleri tek başına okunamaz. <strong>Symbolication</strong>, önce kernel slide'ı çıkarıp runtime adresini static adrese indirger, sonra o adresi doğru sürümün sembol tablosuyla <em>fonksiyon + offset</em>'e çevirir. macOS'ta bu dönüşümü yapan temel araç <code>atos</code>'tur.</p>
<div class="manpage"><div class="ref">1 atos · DESCRIPTION</div><p class="orig">converts numeric addresses to their symbolic equivalents</p><p><code>atos</code>, sayısal adresleri sembolik karşılıklarına çevirir — yani bir backtrace adresini hangi fonksiyonun içine düştüğüne eşler. Girdi olarak ham adresleri ve doğru binary image'ı/slide'ı alır.</p></div>
<div class="manpage"><div class="ref">1 atos · output</div><p class="orig">include file name and source line number information</p><p>Debug sembolleri (dSYM) mevcutsa çıktı yalnızca fonksiyon adını değil, kaynak dosya adı ve satır numarası bilgisini de içerir. Çekirdek için bu dSYM'leri sağlayan paket <strong>KDK</strong>'dir.</p></div>
<div class="deflist">
<div><dt>KDK (Kernel Debug Kit)</dt><dd>Apple'ın belirli bir çekirdek build'i için yayımladığı, sembolize edilmiş çekirdek + dSYM paketi. Symbolication'ın anlamlı olması için KDK'nin build numarasının çöken sisteminkiyle <strong>tam eşleşmesi</strong> gerekir.</dd></div>
<div><dt>kernel slide'ı geri alma</dt><dd>runtime_addr − kernel_slide = static_addr. Log çoğu zaman slide'ı başlıkta verir; symbolication aracı static adresi KDK sembollleriyle eşler.</dd></div>
<div><dt>build eşleşmesi</dt><dd>Yanlış KDK ile yapılan symbolication sessizce <em>yanlış</em> fonksiyon adları üretir — en sinsi triage hatalarından biri. Önce build numarası doğrulanır.</dd></div>
</div>

<h3>3. Kernel debugging: iki makine (KDP) vs tek makine (GDB stub)</h3>
<p>Panic log statik bir fotoğraftır; hipotezi kanıtlamak için çökmeyi canlı bir debugger altında yeniden üretmek gerekir. Çekirdeği hata ayıklamak user-space'ten farklıdır: debugger'ın çalıştığı ortam ile hata ayıklanan çekirdek ayrı olmalıdır. Klasik yöntem iki makinedir; modern araştırma akışı bunu tek makinede bir VM ile çözer.</p>
<div class="manpage src-apple"><div class="ref">apple · Antid0te kernel internals</div><p class="orig">Built-in kernel debugging facilities and how to use them effectively</p><p>XNU, gömülü (built-in) çekirdek hata ayıklama olanakları taşır; bunları etkili kullanmak triage'ın temelidir. Klasik kurulum <strong>KDP (Kernel Debugging Protocol)</strong> üzerinden ikinci bir makineden ağ/USB ile çekirdeğe bağlanıp <code>bt</code>, bellek ve register inceleme yapmaktır.</p></div>
<div class="manpage src-apple"><div class="ref">apple · Antid0te kernel internals</div><p class="orig">Debugging via Apple Virtualization framework using a GDB stub</p><p>İkinci bir fiziksel makine gerektirmeyen modern yol: çekirdeği Apple <strong>Virtualization.framework</strong> içinde bir VM olarak çalıştırıp VM'in sunduğu <strong>GDB stub</strong>'ına lldb/gdb ile bağlanmak. Tek makinede tam çekirdek hata ayıklama sağlar.</p></div>
<div class="manpage src-docs"><div class="ref">docs · Virtualization · VZVirtualMachine</div><p class="orig">A VZVirtualMachine object emulates a complete hardware machine of the same architecture as the underlying Mac computer. Use the VM to execute a guest operating system</p><p>Virtualization.framework, altındaki Mac ile aynı mimariden (arm64) tam bir donanım makinesini emüle eder ve içinde bir guest işletim sistemi — yani hata ayıklanacak çekirdek — çalıştırır. Araştırmacı bu VM'e bir GDB stub üzerinden bağlanarak breakpoint koyar, belleği ve register'ları canlı inceler.</p></div>
<div class="deflist">
<div><dt>KDP (iki makine)</dt><dd>Debug edilen çekirdek bir makinede, lldb başka makinede; ağ (veya USB) üzerinden <code>kdp-remote</code> ile bağlanır. Donanım gerçeğine en yakın ama iki cihaz ister.</dd></div>
<div><dt>VM GDB stub (tek makine)</dt><dd>Çekirdek bir VM içinde; lldb aynı Mac'te VM'in GDB stub'ına bağlanır. Araştırma için hızlı ve ucuz; snapshot/restore ile tekrarlanabilir deney imkânı verir.</dd></div>
</div>

<h3>4. Zone/heap inceleme: zprint ve corruption tespiti</h3>
<p>UAF ve heap taşması gibi hatalarda asıl kanıt allocator'ın durumundadır. Canlı bir debugger altında zone (kalloc bölgeleri) incelenerek hangi bölgenin, hangi element'in ve hangi serbest-liste durumunun söz konusu olduğu görülür.</p>
<div class="manpage src-apple"><div class="ref">apple · Antid0te kernel internals</div><p class="orig">Kernel heap debugging and visualization techniques</p><p>Çekirdek heap'ini hata ayıklama ve görselleştirme teknikleri, bir çökmeyi belirli bir allocator bölgesine ve nesneye bağlamayı sağlar. <code>zprint</code> bölge başına eleman boyutu, kullanım ve serbest sayıları verir; bir zone'daki anormallik (beklenmedik freed element, bozuk serbest liste) corruption'ın imzasıdır.</p></div>
<div class="deflist">
<div><dt>zprint</dt><dd>Zone (kalloc) bölgelerinin durum dökümü: boyut sınıfı, toplam/kullanılan/serbest eleman sayıları. Hangi boyut sınıfında anormallik olduğunu gösterir.</dd></div>
<div><dt>zone corruption imzası</dt><dd>Serbest bir element'e yapılan yazma, bozuk bir serbest-liste işaretçisi ya da poison deseninin üzerine yazılmış olması — hepsi bellek güvenliği hatasının canlı kanıtıdır.</dd></div>
</div>

<h3>5. Panic'ten kök nedene: tekrarlanabilir triage</h3>
<p>İyi triage sezgi değil, tekrarlanabilir bir süreçtir. Aynı adımlar her çökmede uygulanır; çıktı tek bir cümleye iner: <em>hangi nesne, nerede, neden erken serbest kaldı (ya da taştı)</em>.</p>
<div class="manpage src-apple"><div class="ref">apple · Antid0te kernel internals</div><p class="orig">A repeatable approach for inspection and root cause analysis</p><p>İnceleme ve kök neden analizi için tekrarlanabilir bir yaklaşım: panic log'u oku → kritik alanları ayır → symbolicate et → ipuçlarını bir hipoteze bağla → debugger + zprint ile doğrula → raporla/düzelt. Bu disiplin, bir fuzzer'ın (bkz. fuzzing modülü) ürettiği binlerce çökmeyi "aynı bug mı, kök nedeni ne" diye eleyebilmenin tek yoludur.</p></div>
<p>Buradaki debugger refleksleri — breakpoint, backtrace, register ve bellek inceleme — user-space'teki tersine mühendislik modülünden (<code>offensive-re</code>) gelir; çekirdek triage, o becerilerin KDK + KDP/VM GDB stub ile çekirdeğe ölçeklenmiş hâlidir. Triage bir silah değil, ham bir çökmeyi ya bir güvenlik düzeltmesine ya da sorumlu bir araştırma bulgusuna dönüştüren köprüdür.</p>`
  },
