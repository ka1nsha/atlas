  deepDive: {
    heading: "Derinlemesine: iki syscall dünyası",
    html: `<p class="lead">XNU'da çekirdeğe giriş tek bir komutla (svc/syscall) olur, ama ardında iki ayrı dispatch table, iki ayrı ABI ve iki ayrı hata modeli vardır. Bu ayrım XNU'nun Mach + BSD mirasının en somut izidir ve hem performansı hem güvenlik saldırı yüzeyini (attack surface) şekillendirir. Bu bölüm XNU kaynağına ve Levin'in OS Internals serisine dayanır.</p>

<h3>1. EL0 → EL1: istisnayla geçiş</h3>
<p>Bir user space programı çekirdek belleğine veya ayrıcalıklı komutlara doğrudan erişemez; CPU donanımla iki exception level arasına bir duvar koyar. Geçiş yalnızca kontrollü bir istisna (exception) ile olur.</p>
<div class="deflist">
<div><dt>svc (ARM64)</dt><dd>"Supervisor call" komutu bir synchronous exception üretir. CPU, <code>VBAR_EL1</code>'deki exception vector'e dallanır ve EL0'dan EL1'e geçer.</dd></div>
<div><dt>syscall (x86-64)</dt><dd>Intel'de karşılığı <code>syscall</code> komutudur; <code>MSR LSTAR</code>'da kayıtlı giriş noktasına atlayarak ring 3'ten ring 0'a geçer.</dd></div>
<div><dt>sleh_synchronous</dt><dd>XNU'nun giriş noktası. Önce <code>ESR_EL1</code> (exception syndrome) ile istisnanın türünü ayırır: system call mı, page fault mı, yoksa başka bir trap mı.</dd></div>
</div>

<h3>2. BSD mi, Mach mı? İşaret yolu belirler</h3>
<p>Çekirdeğe girdikten sonra XNU, çağrı numarasının <strong>işaretine</strong> bakarak iki dünyadan birine dallanır. Bu kural rastgele değil; XNU kaynağında açıkça belgelenmiştir.</p>
<div class="manpage src-apple"><div class="ref">xnu · syscall_sw.c</div><p class="orig">Don't use numbers 0 through -9. They (along with the positive numbers) are reserved for Unix.</p><p>XNU kaynağındaki bu uyarı mimarinin kalbini özetler: pozitif numaralar (ve 0 ile -9 arası) BSD/Unix tarafına, daha negatif numaralar Mach trap'lerine ayrılmıştır. Numara aralığı, hangi dispatch table'ın kullanılacağını belirler.</p></div>
<div class="deflist">
<div><dt>BSD system call</dt><dd>Pozitif numara → <code>unix_syscall</code> → <code>sysent</code> tablosu. POSIX çağrıları burada: read, open, fork. Linux syscall yoluna en çok benzeyen kısım.</dd></div>
<div><dt>Mach trap</dt><dd>Negatif numara → <code>mach_syscall</code> → <code>mach_trap_table</code>. Mach IPC ve port işlemleri: mach_msg, task_self_trap.</dd></div>
<div><dt>machine-dependent</dt><dd>Ayrı bir aralık; platforma özel düşük seviye çağrılar (ör. thread-local storage kurulumu).</dd></div>
</div>
<div class="manpage src-apple"><div class="ref">xnu · syscall_sw.c</div><p class="orig">/* traps 100-107 reserved for IOKit */</p><p>Mach trap tablosunda bazı aralıklar belirli alt sistemlere ayrılmıştır — örneğin IOKit. Bu, trap tablosunun tek bir düz liste değil, bölümlenmiş bir ABI olduğunu gösterir.</p></div>

<h3>3. copyin / copyout: sınırı geçen bellek</h3>
<p>Bir syscall argüman olarak user space pointer'ı alır. Çekirdek bu pointer'ı <strong>asla doğrudan</strong> dereference etmez: adres geçersiz olabilir (page fault) veya kötü niyetle çekirdek adresini gösteriyor olabilir. Bunun yerine güvenli kopyalama rutinleri kullanılır.</p>
<div class="deflist">
<div><dt>copyin</dt><dd>User space'ten kernel'e güvenli kopyalar; önce adresin gerçekten user address space içinde olduğunu doğrular. ARM64'te PAN (Privileged Access Never) bu kuralı donanımla da zorlar.</dd></div>
<div><dt>copyout</dt><dd>Kernel'den user space'e sonucu yazar; yine adres doğrulamasıyla.</dd></div>
</div>
<p>Bir syscall'ın user pointer'ı doğrulamadan okuması/yazması klasik bir kernel bug sınıfıdır — bu yüzden copyin/copyout mekanizması güvenliğin temel taşıdır.</p>

<h3>4. Dönüş: errno vs kern_return_t</h3>
<p>İki dünyanın iki ayrı hata modeli de vardır:</p>
<div class="deflist">
<div><dt>errno (BSD)</dt><dd>BSD system call'lar POSIX kuralını izler: hata durumunda -1 döner ve <code>errno</code> ayarlanır (ENOENT, EACCES...). Linux'taki modelle aynı.</dd></div>
<div><dt>kern_return_t (Mach)</dt><dd>Mach rutinleri bir <code>kern_return_t</code> döndürür: <code>KERN_SUCCESS</code> (0), <code>KERN_INVALID_ARGUMENT</code>, <code>KERN_PROTECTION_FAILURE</code>... Başarı 0'dır, hata pozitif bir koddur — errno'dan farklı bir sözleşme.</dd></div>
</div>

<h3>5. Linux ile fark ve saldırı yüzeyi</h3>
<p>Linux'ta tek bir <code>sys_call_table</code> ve tek çağrı türü vardır. XNU'da iki ayrı tablo, numara işaretiyle dallanma ve makineye özel üçüncü bir yol bulunur. Güvenlik açısından bu, <strong>iki ayrı giriş = iki ayrı attack surface</strong> demektir. Özellikle port argümanı alan Mach trap'leri, bir right (yetki) doğrulama hatası doğrudan çekirdek içinde güçlü sonuçlar doğurabildiği için iOS kernel araştırmasında tekrar eden bir hedeftir. Burada yalnızca mimariyi anlatıyoruz; somut teknikler için ofansif izleğe bakın.</p>`
  },
