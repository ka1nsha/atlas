    html: `<p class="lead">Apple Silicon bir Mac veya iPhone açıldığında, hiçbir aşama bir sonrakine körü körüne güvenmez: her katman, çalıştıracağı kodun imzasını donanıma kök salmış bir güven zinciriyle (chain of trust) doğrular. XNU en sonunda devreye girer ve ilk kullanıcı process'i launchd'yi başlatır. Bu bölüm Apple Platform Security belgelerine, Apple'ın açık kaynak XNU deposuna ve Jonathan Levin'in OS Internals serisine dayanır.</p>

<h3>1. Secure boot chain: Boot ROM → iBoot → kernelcache</h3>
<p>Açılış, yonga içine kalıcı yazılmış (immutable) Boot ROM ile başlar. Bu, güvenin donanımsal köküdür (hardware root of trust): değiştirilemez, bu yüzden güvenilir kabul edilir. Her aşama bir sonrakini çalıştırmadan önce imzasını kontrol eder; doğrulama başarısız olursa cihaz recoveryOS'a düşer.</p>
<div class="manpage src-apple"><div class="ref">apple security · boot process</div><p class="orig">The chip executes code from the Boot ROM in the first step in the chain of trust.</p><p>Boot ROM, güven zincirinin ilk halkasıdır. Bir sonraki aşama olan iBoot'un imzasını doğrular ve ona atlar. Boot ROM salt okunur olduğu için yamalanamaz — <strong>checkm8</strong> gibi Boot ROM açıkları bu yüzden kalıcıdır (Apple yazılımla düzeltemez).</p></div>
<div class="manpage src-apple"><div class="ref">apple security · boot process</div><p class="orig">iBoot is also responsible for verifying the root hash for the signed system volume (SSV).</p><p>iBoot, kernelcache'i doğrulayıp belleğe yükler ve ayrıca sistem birimini (signed system volume) bütünlüğüyle doğrular — çekirdeğin mount edeceği dosya sistemi tamamen integrity-verified olmalıdır.</p></div>

<h3>2. kernelcache: önceden linklenmiş tek image</h3>
<p>Masaüstü Linux'ta çekirdek ve modüller (<code>vmlinuz</code> + <code>.ko</code>) ayrı yüklenir. Apple ise XNU'yu ve gerekli kext'leri (kernel extension) tek bir <strong>kernelcache</strong> içinde önceden birbirine linkler. Bu hem hız (açılışta linkleme yok) hem güvenlik (tek image tek imza ile doğrulanır) sağlar.</p>
<div class="deflist">
<div><dt>kernelcache</dt><dd>XNU + statik linklenmiş kext'ler, tek imzalı image. iBoot bunu bir bütün olarak doğrular.</dd></div>
<div><dt>boot-args</dt><dd>Çekirdeğe geçen parametreler (nvram'de tutulur). Üretim cihazlarında SIP ve secure boot bunları kısıtlar; <code>kcsuffix</code>, <code>-v</code> (verbose) gibi bayraklar yalnızca güvenlik düşürüldüğünde etkilidir.</dd></div>
</div>

<h3>3. XNU boot sequence: _start'tan launchd'ye</h3>
<p>Çekirdek devralınca, mimariye özel giriş noktasından başlayıp ortak başlatmaya iner ve ilk kullanıcı görevini doğurur. Linux'un <code>start_kernel → init</code> yoluyla kavramsal olarak aynıdır; isimler farklıdır.</p>
<div class="deflist">
<div><dt>_start / vstart</dt><dd>Mimariye özel giriş (osfmk/arm64). Sayfalama (paging) ve ilk stack'i kurar.</dd></div>
<div><dt>kernel_bootstrap()</dt><dd>osfmk/kern/startup.c — pmap, Mach VM, IPC (Mach port) ve scheduler başlatılır. Mach katmanı burada ayağa kalkar.</dd></div>
<div><dt>bsd_init()</dt><dd>bsd/kern/bsd_init.c — POSIX katmanı: proc 0 (kernel_task), VFS, kök dosya sistemi mount, network stack.</dd></div>
<div><dt>bsdinit_task()</dt><dd>İlk kullanıcı process'i (PID 1) olarak <strong>launchd</strong> exec edilir — Mach dünyasının "init"i.</dd></div>
</div>

<h3>4. Kernel panic: çekirdek çökerse ne olur</h3>
<p>Bir user-space process çökerse yalnızca o process ölür. Ama çekirdeğin kendisi tutarsız bir duruma düşerse (geçersiz bellek erişimi, assertion, donanım hatası) devam etmek güvenli değildir: XNU <code>panic()</code> çağırır, sistemi durdurur ve bir <strong>panic log</strong> üretir.</p>
<ul>
<li><strong>panic log</strong>: panic string, backtrace, register durumu ve panicked task — bir güvenlik araştırmacısının kök nedeni bulması için gereken bilgiler (bkz. Kernel debugging modülü).</li>
<li><strong>Jetsam/watchdog ile karışmaz</strong>: panic kernel düzeyidir; user-space'teki lmkd/Jetsam veya watchdog reboot'tan farklıdır.</li>
<li>Apple Silicon'da panic sonrası cihaz yeniden başlar; tekrarlayan panic'ler recoveryOS'a düşürür.</li>
</ul>

<h3>5. Linux boot ile karşılaştırma</h3>
<p>İki sistem de firmware → doğrulanmış yükleyici → çekirdek → PID 1 yolunu izler, ama güven modeli farklıdır: Linux'ta secure boot (UEFI) opsiyonel ve kullanıcı anahtarlarıyla esnetilebilirken, Apple Silicon'da güven zinciri donanıma kilitlidir ve üretim cihazında kapatılamaz. Linux'ta kernel + initramfs ayrı; Apple'da kernelcache tek imzalı bütündür. PID 1 Linux'ta systemd, XNU'da launchd'dir.</p>`
