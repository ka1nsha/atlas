    heading: "Derinlemesine: launchd ve on-demand servisler",
    html: `<p class="lead">launchd, macOS/iOS'ta PID 1'dir: kernel'den sonra çalışan ilk kullanıcı-alanı process'i ve diğer tüm servislerin atası. Ama klasik init'ten farkı şudur: servisleri kendisi dinler ve yalnızca gerektiğinde (on-demand) başlatır. Bu bölüm launchd.plist man sayfasına ve Levin'in OS Internals serisine dayanır.</p>

<h3>1. PID 1 ve tek merkezden yönetim</h3>
<p>Eski Unix'te init, rc betikleri çalıştırır ve gerisine karışmazdı; ayrı daemon'lar fork/exec ile kendilerini başlatırdı. launchd bunu tersine çevirir: tüm daemon ve agent'lar launchd tarafından, bildirimsel plist tanımlarına göre başlatılır, izlenir ve yeniden başlatılır. Bir servis çökerse launchd onu KeepAlive kuralına göre geri getirir.</p>
<div class="manpage src-apple"><div class="ref">launchd.plist · DESCRIPTION</div><p class="orig">This document details the parameters that can be given to an XML property list</p><p>Her job bir XML property list (plist) ile tanımlanır; launchd bu plist'teki anahtarlara bakarak job'u ne zaman ve nasıl çalıştıracağını bilir.</p></div>

<h3>2. LaunchDaemon vs LaunchAgent</h3>
<p>İkisi de plist ile tanımlanır ama farklı bağlamlarda çalışır:</p>
<div class="deflist">
<div><dt>LaunchDaemon</dt><dd>Sistem geneli, kullanıcı oturumundan bağımsız; root veya belirtilen UID ile, oturum açılmadan da çalışır. GUI'ye erişemez. <code>/Library/LaunchDaemons</code>.</dd></div>
<div><dt>LaunchAgent</dt><dd>Bir kullanıcı oturumu bağlamında, o kullanıcının haklarıyla çalışır; GUI ve kullanıcı ortamına erişebilir. <code>/Library/LaunchAgents</code>, <code>~/Library/LaunchAgents</code>.</dd></div>
</div>

<h3>3. plist: bir job'un reçetesi</h3>
<p>Job'un davranışı tamamen plist anahtarlarıyla belirlenir — kod değil, bildirimsel tanım:</p>
<div class="deflist">
<div><dt>Label</dt><dd>Job'un benzersiz kimliği (zorunlu).</dd></div>
<div><dt>ProgramArguments</dt><dd>Çalıştırılacak program ve argümanları (argument vector).</dd></div>
<div><dt>RunAtLoad</dt><dd>Job yüklenir yüklenmez bir kez başlat.</dd></div>
<div><dt>KeepAlive</dt><dd>Job'u sürekli canlı tut; çökerse yeniden başlat (koşullu da olabilir).</dd></div>
<div><dt>MachServices</dt><dd>launchd'nin bu job adına ilan edeceği (advertise) Mach servis isimleri.</dd></div>
<div><dt>Sockets</dt><dd>On-demand için launchd'nin dinleyeceği socket'ler.</dd></div>
</div>
<div class="manpage src-apple"><div class="ref">launchd.plist · LABEL</div><p class="orig">This required key uniquely identifies the job to launchd.</p><p>Label, bootstrap namespace'inde job'un adıdır; launchctl ile bu isimden yönetilir.</p></div>
<div class="manpage src-apple"><div class="ref">launchd.plist · KEEPALIVE</div><p class="orig">The value may be set to true to unconditionally keep the job alive.</p><p>Kritik servisler için koşulsuz canlı tutma; ama çoğu servis on-demand olduğundan KeepAlive yerine MachServices/Sockets tercih edilir.</p></div>

<h3>4. On-demand launching: dinlemeyi launchd yapar</h3>
<p>launchd'nin asıl gücü budur: servisi sürekli çalışır tutmak yerine, onun adına Mach port'unu veya socket'i <strong>launchd dinler</strong>. İlk istek geldiğinde job o an başlatılır ve dinleyen descriptor ona devredilir (check-in protokolü). Böylece açılışta onlarca servis boşuna çalışmaz; istek gelince milisaniyeler içinde canlanır.</p>
<div class="manpage src-apple"><div class="ref">launchd.plist · MACHSERVICES</div><p class="orig">Each key in this dictionary should be the name of a service to be advertised.</p><p>launchd bu ismi bootstrap namespace'ine kaydeder ve o porta mesaj gelene kadar job'u başlatmaz — Mach port modülündeki bootstrap_look_up tam da bu ismi çözer.</p></div>
<div class="manpage src-apple"><div class="ref">launchd.plist · SOCKETS</div><p class="orig">This optional key is used to specify launch on demand sockets</p><p>Ağ servisleri için aynı mantık: launchd socket'i dinler, bağlantı gelince job'u başlatıp socket'i ona verir (inetd'nin modern hali).</p></div>

<h3>5. bootstrap namespace ve domain'ler</h3>
<p>Mach servis isimleri bir <strong>bootstrap namespace</strong>'inde yaşar; launchd bu namespace'in sahibidir ve isimden port'a çözümlemeyi yapar (Mach dünyasının "Service Manager"ı). Modern launchd bunları domain'lere ayırır: <code>system</code> (daemon'lar), <code>user</code>/<code>login</code> (agent'lar), <code>pid</code> (tek process'e özel). Bu izolasyon, bir kullanıcının servislerinin başka kullanıcıya sızmamasını sağlar.</p>

<h3>6. launchctl ve systemd ile karşılaştırma</h3>
<p>launchctl, launchd ile konuşma aracıdır (<code>launchctl load/bootstrap/print/kickstart</code>). Linux systemd aynı fikri paylaşır — bildirimsel unit dosyaları, socket/dbus activation, bağımlılık yönetimi — ama systemd cgroup'larla sıkı kaynak kontrolü ekler; launchd ise Mach port activation ve Apple güvenlik mimarisiyle (code signing, SIP korumalı servisler) iç içedir.</p>`
  },
