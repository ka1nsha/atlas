  deepDive: {
    heading: "Derinlemesine: Mach IPC'nin capability modeli",
    html: `<p class="lead">Mach port'ları yalnızca bir mesajlaşma aracı değil; macOS/iOS'un tüm yetki (capability) modelinin temelidir. Bir task'ın neye erişebileceğini elindeki port right'lar belirler — tıpkı bir file descriptor gibi, ama çok daha güçlü, çünkü bir right mesajla başka bir task'a aktarılabilir. Bu bölüm klasik Mach man sayfalarına ve Levin'in OS Internals serisine dayanır.</p>

<h3>1. Port = kernel'de bir message queue</h3>
<p>Bir Mach port, kullanıcı alanında görünmeyen, kernel'de yaşayan bir message queue'dur. Task'lar ona yalnızca <strong>port right</strong>'lar üzerinden erişir; portun kendisine doğrudan dokunamazlar. Bu dolaylılık, güvenlik modelinin kalbidir: kernel her mesaj gönderiminde gönderenin gerçekten yetkili olup olmadığını (bir send right tutup tutmadığını) denetler.</p>
<div class="manpage src-apple"><div class="ref">mach_msg · DESCRIPTION</div><p class="orig">Ports hold a queue of messages.</p><p>Port bir mesaj kuyruğu tutar. Gönderilen mesajlar, alıcı <code>mach_msg</code>'i receive moduyla çağırana kadar bu kuyrukta bekler. Kuyruk dolarsa gönderen bloklanır veya mesajı geri alır.</p></div>

<h3>2. Port rights: yetki birimi</h3>
<p>Bir port'a ne yapabileceğini right türü belirler. Bu, Mach'ı bir capability sistemi yapan şeydir: yetki, global bir izin listesinde değil, task'ın elindeki right'larda taşınır.</p>
<div class="deflist">
<div><dt>receive right</dt><dd>Kuyruğun tek sahibi. Yalnızca <strong>bir</strong> task tutabilir; mesajları o çeker. Aktarılabilir ama kopyalanamaz — receive right'ı yollarsan sende kalmaz.</dd></div>
<div><dt>send right</dt><dd>Port'a mesaj yollama yetkisi. Çoğaltılabilir; birçok task aynı porta send right tutabilir (reference count ile sayılır).</dd></div>
<div><dt>send-once right</dt><dd>Tam olarak bir mesaj yollama hakkı; kullanınca tükenir. Genelde reply port'lar için kullanılır (RPC yanıtı).</dd></div>
<div><dt>port set</dt><dd>Birden çok receive right'ı tek bir kuyrukmuş gibi dinlemeyi sağlar (select/kqueue benzeri).</dd></div>
</div>

<h3>3. Port name space: her task kendi isimlerine sahip</h3>
<p>Bir port name, bir task'a yerel bir tamsayıdır — tıpkı file descriptor gibi. İki farklı task aynı kernel port'una tamamen farklı name'lerle bakabilir; name'in kendisi global bir kimlik değildir, task'ın IPC name space'indeki bir girdiye işaret eder. Bu yüzden bir port name'i başka bir process'e "söylemek" işe yaramaz; onun yerine right'ın kendisi mesajla aktarılır.</p>
<div class="manpage src-apple"><div class="ref">mach_port_allocate · DESCRIPTION</div><p class="orig">The mach_port_allocate function creates a new right in the specified task.</p><p>Port yaratmak aslında belirtilen task'ın name space'inde yeni bir right oluşturmaktır. <code>MACH_PORT_RIGHT_RECEIVE</code> ile çağrıldığında task yeni portun receive right'ını alır — yani kuyruğun sahibi olur.</p></div>

<h3>4. mach_msg: tek çağrı, hem gönder hem al</h3>
<p>Mach'ta tüm IPC tek bir trap üzerinden akar: <code>mach_msg</code>. Aynı çağrı, option bitlerine göre mesaj gönderir, alır veya ikisini birden yapar (RPC'de yaygın: gönder + yanıtı bekle). Mesaj "complex" olabilir — yani içinde ham veri dışında <strong>port right</strong>'lar ve <strong>out-of-line memory</strong> (büyük veri için sayfa düzeyinde eşleme) taşıyabilir.</p>
<div class="manpage src-apple"><div class="ref">mach_msg · DESCRIPTION</div><p class="orig">The mach_msg system call sends and receives Mach messages.</p><p>Tek bir system call hem gönderme hem alma yapar. Yüksek seviyeli API'ler (XPC, MIG ile üretilen stub'lar) hep bunun üstüne kuruludur; <code>mach_msg</code> XNU'da neredeyse her şeyin aktığı dar boğazdır.</p></div>

<h3>5. Right transfer: Mach'ın asıl gücü ve risk kaynağı</h3>
<p>Bir mesaj yalnızca veri değil, bir yetkiyi de taşıyabilir: gönderen, bir port right'ı mesajın içine koyar ve kernel onu alıcı task'ın name space'ine aktarır. Böylece bir servis, istemcisine yeni bir kaynağa erişim "verebilir" — capability devri budur.</p>
<div class="manpage src-apple"><div class="ref">mach_msg · DESCRIPTION</div><p class="orig">Port rights can be transferred between tasks via messages.</p><p>Right'lar mesajla task'lar arasında aktarılır. Bu güçlü model, aynı zamanda iOS güvenlik tarihinin tekrar eden bir temasıdır: bir task bir right'ı yanlışlıkla fazladan verirse veya kernel reference count'u yanlış sayarsa (örn. use-after-free benzeri port hataları), bu bir privilege escalation yoluna dönüşebilir. Tarihsel örnekler için ofansif izleğe bakın — burada yalnızca mekanizmayı anlatıyoruz.</p></div>

<h3>6. MIG ve bootstrap</h3>
<p>Ham <code>mach_msg</code> ile mesaj formatı kurmak zahmetlidir; <strong>MIG (Mach Interface Generator)</strong> bir arayüz tanımından istemci/sunucu stub kodu üretir (tıpkı Android'in AIDL'i gibi). İsim çözümleme ise <strong>bootstrap</strong> üzerinden yapılır: servisler launchd'nin bootstrap port'una isimle kaydolur, istemciler <code>bootstrap_look_up</code> ile o servisin send right'ını alır. Yani launchd, Mach dünyasının "Service Manager"ıdır.</p>`
