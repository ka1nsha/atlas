  deepDive: {
    heading: "Derinlemesine: Mach-O'nun anatomisi",
    html: `<p class="lead">Mach-O, macOS ve iOS'ta her executable, dylib ve bundle'ın dosya formatıdır. ELF'in Apple karşılığı gibi görünür ama daha fazlasını taşır: code signature, dyld bilgisi ve entitlements doğrudan dosyanın içine gömülüdür. Bu bölüm xnu kaynağındaki loader.h başlığına dayanır.</p>

<h3>1. Header: dosyanın kimliği</h3>
<p>Her Mach-O dosyası bir <strong>mach_header_64</strong> ile başlar. Çekirdek ve dyld önce bunu okur: dosya hangi mimari için, ne tür bir dosya (executable mı, dylib mi) ve kaç tane load command izliyor.</p>
<div class="deflist">
<div><dt>magic</dt><dd>MH_MAGIC_64 — dosyanın Mach-O olduğunu ve 64-bit/endianness bilgisini verir.</dd></div>
<div><dt>cputype / cpusubtype</dt><dd>Hedef mimari (x86_64, arm64, arm64e). fat binary doğru parçayı bununla seçer.</dd></div>
<div><dt>filetype</dt><dd>MH_EXECUTE (program), MH_DYLIB (kütüphane), MH_BUNDLE (plugin), MH_DSYM (semboller).</dd></div>
<div><dt>ncmds</dt><dd>Header'dan sonra gelen load command sayısı.</dd></div>
</div>
<div class="manpage src-apple"><div class="ref">xnu · loader.h</div><p class="orig">The 64-bit mach header appears at the very beginning of object files for 64-bit architectures. ... magic: mach magic number identifier ... ncmds: number of load commands</p><p>Header dosyanın en başındadır ve sabit boyutludur; bir yükleyici tek bir okumayla dosyanın ne olduğunu ve kaç load command izleyeceğini öğrenir.</p></div>

<h3>2. Load commands: dosyanın yapılacaklar listesi</h3>
<p>Header'dan hemen sonra bir load command dizisi gelir. Her biri yükleyiciye bir talimat verir: "şu segment'i belleğe şöyle eşle", "şu dylib'i yükle", "dyld'yi çalıştır", "code signature burada". Mach-O'yu ELF'ten daha zengin yapan budur — bağlama ve imza bilgisi formatın parçasıdır.</p>
<div class="deflist">
<div><dt>LC_SEGMENT_64</dt><dd>Bir segment'i (ve section'larını) dosyadan belleğe eşler.</dd></div>
<div><dt>LC_MAIN</dt><dd>Programın entry point'i (eski LC_UNIXTHREAD yerine).</dd></div>
<div><dt>LC_LOAD_DYLINKER</dt><dd>Hangi dynamic linker'ın (/usr/lib/dyld) devralacağını söyler.</dd></div>
<div><dt>LC_LOAD_DYLIB</dt><dd>Bağımlı bir dylib — her biri için bir tane.</dd></div>
<div><dt>LC_CODE_SIGNATURE</dt><dd>__LINKEDIT içindeki code signature bloğunu işaret eder.</dd></div>
<div><dt>LC_DYLD_INFO / LC_DYLD_CHAINED_FIXUPS</dt><dd>dyld için rebase/bind bilgisi (ASLR kaydırması ve sembol bağlama).</dd></div>
</div>
<div class="manpage src-apple"><div class="ref">xnu · loader.h</div><p class="orig">The load commands directly follow the mach_header. ... All load commands must have as their first two fields cmd and cmdsize.</p><p>Her load command ortak bir başlıkla (cmd türü + cmdsize) başladığı için, bir yükleyici tanımadığı bir command'i boyutu kadar atlayıp devam edebilir; format bu sayede ileriye dönük uyumludur.</p></div>

<h3>3. Segments ve sections</h3>
<p>Bir <strong>segment</strong> dosyanın belleğe bir bütün olarak eşlenen ve ortak koruma (protection) taşıyan bir parçasıdır. Her segment sıfır veya daha çok <strong>section</strong> içerir. Koruma bitleri segment düzeyindedir: kod yazılamaz, veri çalıştırılamaz.</p>
<div class="deflist">
<div><dt>__TEXT (r-x)</dt><dd>Kod ve salt okunur veri. section'lar: __text (makine kodu), __cstring (string sabitleri), __const.</dd></div>
<div><dt>__DATA (rw-)</dt><dd>Yazılabilir veri: __data, __bss, __objc_* (Objective-C metadata). __DATA_CONST ile bazıları başlangıçtan sonra salt okunur yapılır.</dd></div>
<div><dt>__LINKEDIT</dt><dd>Linker ve dyld'nin ürettiği her şey: symbol table, string table, rebase/bind opcode'ları ve code signature.</dd></div>
</div>
<div class="manpage src-apple"><div class="ref">xnu · loader.h</div><p class="orig">A segment is made up of zero or more sections. ... __LINKEDIT: the segment containing all structs created and maintained by the link editor.</p><p>__LINKEDIT kritiktir: code signature imza doğrulanırken bu segment üzerinden hesaplanır; dyld de bind/rebase tablolarını buradan okur.</p></div>

<h3>4. Fat (universal) binary</h3>
<p>Tek bir dosya birden çok mimari için kod taşıyabilir: başta bir <strong>fat_header</strong> + her mimari için bir fat_arch kaydı, ardından arka arkaya Mach-O'lar. macOS'un Intel'den Apple Silicon'a geçişini tek bir ikili ile mümkün kılan budur; <code>lipo</code> aracıyla parçalar ayrılır veya birleştirilir. Çekirdek çalıştırırken CPU'ya uyan parçayı seçer.</p>

<h3>5. ELF ile karşılaştırma</h3>
<p>Kavramsal olarak Mach-O load command'leri ELF program header'larına benzer: ikisi de "şu parçayı belleğe şöyle eşle" der. Ama Mach-O daha fazlasını formatın içine gömer. ELF'te code signing, dinamik bağlama bilgisi ve entitlements genelde ayrı mekanizmalar veya bölümlerdeyken, Mach-O'da bunlar birer load command'dir (LC_CODE_SIGNATURE, LC_DYLD_INFO/LC_DYLD_CHAINED_FIXUPS). Bu yüzden Apple platformlarında "ikili = kod + imza + bağlama planı" tek bir dosyadır — bu bütünlük, code signing ve AMFI zorlamasının temelidir.</p>`
  },
