  deepDive: {
    heading: "Derinlemesine: libmalloc, compression ve Jetsam",
    html: `<p class="lead">macOS ve iOS aynı user-space allocator'ı (libmalloc) paylaşır ama bellek baskısına çok farklı tepki verir: macOS sayfaları RAM'de sıkıştırır, iOS ise uygulamaları öldürür. Bu bölüm allocator'ın iç yapısını ve iki platformun memory pressure stratejisini açar.</p>

<h3>1. libmalloc: nano zone ve scalable malloc</h3>
<p>Apple'ın allocator'ı tek bir yapı değil, boyuta göre ayrılmış birkaç <strong>malloc zone</strong>'dan oluşur. Küçük ve çok sık yapılan tahsisler (tipik olarak ≤ 256 byte) <strong>nano zone</strong>'dan gelir: boyut sınıflarına bölünmüş, kilitsiz hızlı yollar olan, cache-dostu bir bölge. Daha büyük tahsisler <strong>scalable malloc</strong> (magazine malloc) tarafından karşılanır: her CPU'ya bir <strong>magazine</strong> düşer, böylece çok çekirdekli yükte lock contention azalır. Çok büyük istekler doğrudan <code>mmap</code> benzeri sanal bellek çağrılarıyla ayrılır.</p>
<div class="manpage src-apple"><div class="ref">malloc(3) · DESCRIPTION</div><p class="orig">The malloc() function allocates size bytes of memory and returns a pointer to the allocated memory.</p><p>Bu basit sözleşmenin altında, libmalloc isteği boyutuna göre doğru zone'a yönlendirir; nano zone küçük nesneler için optimize edilmiştir, scalable malloc ise büyük ve paralel yükler için.</p></div>
<div class="deflist">
<div><dt>nano zone</dt><dd>Küçük tahsisler (≤ 256 byte). Boyut sınıflarına bölünmüş, çok hızlı; kısa ömürlü nesnelerin çoğunu karşılar.</dd></div>
<div><dt>scalable malloc</dt><dd>Orta/büyük tahsisler. Per-CPU magazine'ler ile lock contention'ı azaltır.</dd></div>
<div><dt>malloc zone</dt><dd>Bağımsız heap bölgesi (kendi metadata ve kilidiyle). Uygulamalar özel zone da yaratabilir.</dd></div>
</div>

<h3>2. Hata ayıklama: Guard Malloc ve MallocStackLogging</h3>
<p>libmalloc'un güçlü tanı araçları vardır. <code>libgmalloc</code> (Guard Malloc) her tahsisi ayrı bir sayfaya koyup komşu sayfayı korumasız bırakır, böylece bir buffer overflow anında segmentation fault'a döner. <code>MallocStackLogging</code> her tahsisin stack trace'ini tutar; <code>leaks</code> ve <code>malloc_history</code> araçları bununla bir use-after-free veya leak'i tahsis noktasına bağlar. Bunlar ASan'ın macOS'taki tamamlayıcılarıdır.</p>

<h3>3. Memory pressure: sistem haber verir</h3>
<p>Linux'ta bellek azaldığında genelde iş <strong>page fault</strong> ve OOM killer'a kalır. macOS/iOS daha proaktiftir: kernel bir <strong>memory pressure</strong> seviyesi yayınlar ve uygulamalar bir <code>DISPATCH_SOURCE_TYPE_MEMORYPRESSURE</code> dispatch source ile bunu dinleyip önbelleklerini gönüllü boşaltabilir. Seviyeler kabaca normal → warn → critical olarak ilerler; iyi davranan uygulamalar critical'dan önce bellek bırakarak kendilerinin öldürülmesini önler.</p>

<h3>4. macOS: compressed memory</h3>
<p>macOS, bellek dolduğunda hemen diske swap yapmak yerine en az kullanılan (least-recently-used) sayfaları <strong>RAM içinde</strong> sıkıştırır (WKdm benzeri hızlı bir algoritma). Sıkıştırılmış bir sayfaya tekrar erişilirse anında açılır — bu, diske gitmekten çok daha hızlıdır. Yalnızca compression de yetmezse sıkıştırılmış sayfalar swap dosyasına yazılır. Böylece "kullanılan bellek" fiziksel RAM'den fazla görünebilir; <code>vm_stat</code> çıktısındaki "compressed" sayacı bunu gösterir.</p>

<h3>5. iOS: Jetsam (memorystatus)</h3>
<p>iOS'ta kullanıcı tarafından yönetilen bir swap dosyası <strong>yoktur</strong>. Bellek azaldığında devreye <strong>Jetsam</strong> (çekirdekteki <code>memorystatus</code> alt sistemi) girer: her process'e bir <strong>jetsam priority</strong> band'i atanır (ön plandaki uygulama en yüksek, arka plandakiler ve daemon'lar daha düşük) ve bellek baskısında en düşük öncelikli process'ten başlayarak sonlandırır. Ayrıca her process'in bir <strong>dirty page limit</strong>'i vardır; bunu aşan uygulama tek başına da öldürülebilir. Bu yüzden iOS'ta "arka plandaki uygulama hatırlanmıyor" davranışı aslında bir bellek güvenlik politikasıdır.</p>
<div class="deflist">
<div><dt>jetsam priority</dt><dd>Process'in öldürülme sırası. Foreground uygulama en korunaklı; idle daemon'lar ilk kurban.</dd></div>
<div><dt>dirty page limit</dt><dd>Bir process'in tutabileceği değiştirilmiş (dirty) sayfa üst sınırı; aşılırsa tek başına Jetsam hedefi olur.</dd></div>
</div>

<h3>6. Linux ile karşılaştırma</h3>
<p>Üç strateji de aynı problemi (fiziksel RAM'den fazla talep) çözer ama farklı tercihlerle: Linux swap/zram + OOM killer kullanır (reaktif, son çare süreç öldürme); macOS compressed memory ile süreçleri yaşatmaya öncelik verir; iOS ise swap'ı tamamen reddedip Jetsam ile agresif ama öngörülebilir biçimde öldürür. zram ile macOS compression kavramsal olarak çok benzer: ikisi de diske gitmeden önce RAM içinde sıkıştırır.</p>`
  },
