  deepDive: {
    heading: "Derinlemesine: donanım çekirdeğe neden güvenmez?",
    html: `<p class="lead">Apple Silicon'ın temel varsayımı çarpıcıdır: çekirdeğin kendisi ele geçirilmiş olabilir. Bu yüzden en kritik yazma yetkileri yazılımdan alınıp donanıma ya da çekirdekten daha ayrıcalıklı bir bağlama verilir. Bir saldırgan keyfi çekirdek okuma/yazma (kernel arbitrary read/write) elde etse bile kodu yamalayamaz, sayfa izinlerini çeviremez ve sayfa tablolarını değiştiremez. Bu bölüm Apple Platform Security belgesine ve Antid0te Kernel Internals izleğine dayanır.</p>

<h3>1. KTRR / CTRR: çekirdek kodunu donanım kilitler</h3>
<p>Açılış sırasında çekirdek kodu (kernel text) ve değişmez sabitler belleğe yerleşir. Yerleştikten sonra donanım, bu fiziksel aralığı salt okunur (read-only) olarak mühürler: bellek denetleyicisi (memory controller) o aralığa yapılan her yazmayı reddeder. Araştırmacıların <strong>KTRR</strong> (Kernel Text Read-only Region) ve genişletilmiş hâli <strong>CTRR</strong> (Configurable Text Read-only Region) dediği register'lar budur; Apple bu mekanizmayı <em>Kernel Integrity Protection (KIP)</em> adıyla belgeler.</p>
<div class="manpage src-apple"><div class="ref">Apple Platform Security</div><p class="orig">Kernel Integrity Protection (KIP) is enabled to help prevent modifications of kernel and driver code.</p><p>KIP, çekirdek ve sürücü kodunun değiştirilmesini engeller. Kritik ayrıntı yazmanın <em>nerede</em> durdurulduğudur: koruma, sayfa tablosundaki bir bit değil, doğrudan bellek denetleyicisidir.</p></div>
<div class="manpage src-apple"><div class="ref">Apple Platform Security</div><p class="orig">After startup is complete, the memory controller denies writes to the protected physical memory region.</p><p>Açılış bittikten sonra, korunan fiziksel bölgeye yapılan yazmalar donanımca reddedilir. Çekirdek kendi kod sayfasına yazmak istese bile bu istek donanım katmanında düşer.</p></div>
<p>Peki saldırgan kilidi açamaz mı? Açamaz: KIP'i etkinleştiren donanım açılış bitince <em>kilitlenir</em> ve yeniden yapılandırılamaz. Bu, Linux'taki <code>CONFIG_STRICT_KERNEL_RWX</code> fikriyle aynı amacı taşır ama orada korumayı çekirdeğin kendi MMU ayarları zorlar; burada çekirdeğin ötesindeki bir donanım bloğu zorlar.</p>
<div class="manpage src-apple"><div class="ref">Apple Platform Security</div><p class="orig">To prevent reconfiguration, the hardware used to enable KIP is locked after the boot process is complete.</p><p>Yeniden yapılandırmayı önlemek için KIP'i etkinleştiren donanım, açılış tamamlandıktan sonra kilitlenir. "Yeniden aç ve yaz" yolu da böylece kapanır.</p></div>

<h3>2. APRR / SPRR: sayfa izinleri register'da zorlanır</h3>
<p>Madem kod salt okunur, saldırganın bir sonraki refleksi kod sayfasının <em>iznini</em> değiştirmektir. Apple Silicon bunu da zorlaştırır: sayfa izinleri yalnızca sayfa tablosundaki bir bite bağlı değildir. <strong>APRR</strong> (Access Protection Rights Register) ve halefi <strong>SPRR</strong> (Secure Page Rights Register) bir indeks tablosu üzerinden izinleri donanımda yeniden eşler. Böylece W^X (bir sayfa aynı anda hem yazılabilir hem çalıştırılabilir olamaz) kuralı donanımda korunur; bu register JIT gibi meşru durumlarda hızlı izin değişimi için, PPL gibi korumalarda ise izinleri çekirdekten bağımsız dayatmak için kullanılır.</p>
<div class="deflist">
<div><dt>APRR / SPRR</dt><dd>Sayfa izinlerini bir register tablosu üzerinden yeniden eşleyen donanım. Sayfa tablosundaki ham izin biti tek başına geçerli değildir; gerçek izin bu tablodan geçer.</dd></div>
<div><dt>W^X</dt><dd>Write XOR eXecute: bir sayfa ya yazılabilir ya çalıştırılabilir; ikisi birden değil. Donanımda zorlanınca "yaz, sonra çalıştır" saldırısı tek primitifle kurulamaz.</dd></div>
</div>

<h3>3. PPL: sayfa tablolarını çekirdekten bile ayırır</h3>
<p>Son ve en güçlü kilit sayfa tablolarının (page tables) kendisidir. Saldırgan onları değiştirebilseydi belleğin haritasını keyfi olarak yeniden çizer, bütün diğer korumaları dolaşırdı. <strong>PPL</strong> (Page Protection Layer), sayfa tablolarını ve imzalanmış kullanıcı kodunu yalnızca kendi ayrıcalıklı bağlamının yazabileceği korumalı sayfalara koyar. EL1'deki çekirdek — ve içine sızmış saldırgan — bu sayfaların dışında kalır.</p>
<div class="manpage src-apple"><div class="ref">Apple Platform Security</div><p class="orig">only the PPL can alter protected pages containing user code and page tables.</p><p>Korunan sayfaları — kullanıcı kodu ve sayfa tabloları — yalnızca PPL değiştirebilir. Çekirdekteki keyfi yazma primitifi bu sayfalara eriştiğinde yazma başarısız olur.</p></div>
<p>PPL'nin tasarım hedefi doğrudan bu modülün tehdit modelidir: korumanın bütünü, çekirdek <em>düşmüş</em> olsa bile ayakta kalmalıdır.</p>
<div class="manpage src-apple"><div class="ref">Apple Platform Security</div><p class="orig">systemwide code integrity enforcement, even in the face of a compromised kernel.</p><p>Sistem genelinde kod bütünlüğü, ele geçirilmiş bir çekirdek karşısında bile zorlanır. "Çekirdekte R/W var" artık "her şeyi yapabilirim" demek değildir.</p></div>

<h3>4. GXF: PPL'ye yalnızca denetimli geçiş</h3>
<p>Çekirdek sayfa tablolarını hiç mi güncelleyemez? Güncelleyebilir, ama kapıdan değil, turnikeden geçerek. <strong>GXF</strong> (Guarded Exception Feature / Guarded eXecution Feature), EL1 ile PPL arasına sabit, denetlenmiş bir geçiş koyar: çekirdek <code>genter</code> ile PPL bağlamına yalnızca önceden tanımlı giriş noktalarından girer, orada küçük ve doğrulanmış PPL rutinleri işi yapar, <code>gexit</code> ile döner. Saldırgan keyfi kod çalıştıramadığı için bu kapıyı istediği gibi kullanamaz; yalnızca PPL'nin onayladığı, doğrulanmış işlemler geçer.</p>
<div class="deflist">
<div><dt>genter / gexit</dt><dd>GXF'in giriş/çıkış komutları. PPL bağlamına yalnızca sabit giriş noktalarından girilir; keyfi bir adrese atlayıp PPL yetkisi kazanmak mümkün değildir.</dd></div>
<div><dt>GL (Guarded Level)</dt><dd>EL1'in yanındaki, çekirdekten ayrık ayrıcalıklı yürütme seviyesi. PPL kodu burada koşar; normal çekirdek kodu buraya giremez.</dd></div>
</div>

<h3>5. Birlikte: saldırıyı "data-only"a indirgemek</h3>
<p>Bu dört kilit üst üste bindiğinde tek bir çekirdek R/W primitifi artık kalıcı kontrole yetmez. Kod KTRR/CTRR ile yamalanamaz, izinler APRR/SPRR ile çevrilemez, sayfa tabloları PPL ile değiştirilemez, PPL'ye geçiş GXF ile denetlenir. Geriye kalan yüzey çoğunlukla <strong>veri odaklı (data-only)</strong> saldırılardır: kodu değil, çekirdek veri yapılarını (ör. kimlik/yetki alanları) bozmak. En yeni nesilde (SPTM/TXM) sayfa tablosu koruması, saldırgan çekirdek yazma yetkisine sahip olup kontrol akışı korumalarını aşsa bile sürdürülecek biçimde tasarlanır.</p>
<div class="manpage src-apple"><div class="ref">Apple Platform Security</div><p class="orig">attackers have kernel write capabilities and can bypass control flow protections</p><p>SPTM ve TXM, saldırganların çekirdek yazma yeteneğine sahip olduğu ve kontrol akışı korumalarını aştığı senaryoyu bile hesaba katarak sayfa tablolarını korur. Tehdit modeli artık "saldırgan çekirdekte" varsayımıyla başlar — bir sonraki modülün konusu budur.</p></div>`
