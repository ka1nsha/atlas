  deepDive: {
    heading: "Derinlemesine: XNU ağ yığını",
    html: `<p class="lead">XNU'nun ağ yığını, FreeBSD'den gelen köklü bir mimariyi taşır: socket katmanı en üstte, protosw ile birbirine bağlı protokol katmanları ortada, dlil ve ifnet ile aygıt sürücüleri en altta. Veriyi tüm bu katmanlar boyunca taşıyan ortak para birimi ise mbuf'tur. Bu bölüm BSD man sayfalarına, Apple geliştirici belgelerine ve Levin'in OS Internals Cilt II (Bölüm 17) kaynağına dayanır.</p>

<h3>1. Socket: her şeyin başladığı uç nokta</h3>
<p>Ağ programlamanın tanıdık yüzü socket API'sidir. Bir socket, çekirdekte iki tampona (send ve receive <em>sockbuf</em>) sahip bir uç noktadır ve VFS modülündeki gibi bir file descriptor ile temsil edilir — bu yüzden <code>read</code>/<code>write</code>/<code>close</code> socket'lerde de çalışır.</p>
<div class="manpage src-docs"><div class="ref">2 socket · DESCRIPTION</div><p class="orig">The socket() system call creates an endpoint for communication and returns a descriptor.</p><p><code>socket()</code> bir "iletişim uç noktası" yaratır ve geriye bir descriptor döndürür. <code>AF_INET</code> (adres ailesi) ve <code>SOCK_STREAM</code> (tür) argümanları hangi protokol yığınının (ör. TCP/IP) devreye gireceğini belirler.</p></div>

<h3>2. mbuf: ağ verisinin taşıma birimi</h3>
<p>Ağ verisi katmanlar arasında düz bir tampon olarak değil, <strong>mbuf</strong> adı verilen küçük, zincirlenebilir çekirdek tamponlarında taşınır. Bu tasarım, header eklemeyi/soymayı kopyalamadan yapmayı ve dağınık veriyi (scatter-gather) verimli işlemeyi sağlar.</p>
<div class="manpage src-docs"><div class="ref">9 mbuf · DESCRIPTION</div><p class="orig">An mbuf is a basic unit of memory management in the kernel IPC subsystem. Network packets and socket buffers are stored in mbufs.</p><p>mbuf, çekirdeğin IPC alt sistemindeki temel bellek yönetim birimidir; network packet'ler ve socket buffer'lar mbuf'larda saklanır. Küçük bir mbuf'a sığmayan büyük veri için harici depolama devreye girer:</p></div>
<div class="manpage src-docs"><div class="ref">9 mbuf · CLUSTERS</div><p class="orig">The system also supplies a default type of external storage buffer called an mbuf cluster.</p><p>Sistem, <strong>mbuf cluster</strong> denen bir harici depolama tamponu da sunar (tipik olarak 2 KB). Büyük bir paket böylece birkaç mbuf + cluster zinciriyle temsil edilir; her katman zincirin başına kendi header'ını ekleyerek veriyi kopyalamaktan kaçınır.</p></div>

<h3>3. protosw: katmanları birbirine bağlayan tablo</h3>
<p>XNU protokolleri <code>protosw</code> adlı bir anahtar tablosuyla bağlar. Her protokol kendi giriş (<em>input</em>) ve çıkış (<em>output</em>) işlevlerini bu tabloya kaydeder; böylece <code>tcp_output()</code> bir sonraki katmanı sabit kodlamadan <code>ip_output()</code>'a geçebilir. Giden yol yukarıdan aşağı (socket → TCP → IP → dlil), gelen yol aşağıdan yukarı akar.</p>
<div class="deflist">
<div><dt>tcp_output / tcp_input</dt><dd>TCP durum makinesi: header ekleme/soyma, sıra numaraları, akış kontrolü, yeniden gönderim. En karmaşık ve tarihsel olarak en çok incelenen parser'lardan biri.</dd></div>
<div><dt>ip_output / ip_input</dt><dd>IP datagram oluşturma/doğrulama, route lookup, fragment (parça) birleştirme. Fragment yeniden birleştirme klasik bir güvenlik riski noktasıdır.</dd></div>
<div><dt>ifnet</dt><dd>Her ağ arayüzünü (en0, lo0...) temsil eden soyutlama; sürücüyü üst katmanlardan ayırır.</dd></div>
<div><dt>dlil</dt><dd>Data Link Interface Layer: protokol katmanı ile sürücü arasındaki ortak ara katman. Tüm arayüzler için tek bir giriş/çıkış noktası sağlar.</dd></div>
</div>

<h3>4. Filtreleme: socket filter, pf ve NetworkExtension</h3>
<p>Ağ yığınına birkaç noktadan müdahale edilebilir. Çekirdek içinde <strong>socket filter</strong>'lar (eski adıyla NKE — Network Kernel Extension) ve <strong>pf</strong> (packet filter, OpenBSD'den gelen firewall) trafiği inceleyip değiştirebilir. Modern macOS/iOS'ta Apple, çekirdeğe kod yüklemeyi kısıtladığı için bu işi kullanıcı alanına taşımıştır.</p>
<div class="manpage src-apple"><div class="ref">docs NetworkExtension · OVERVIEW</div><p class="orig">With the NetworkExtension framework, you can customize and extend the system's core networking features.</p><p>NetworkExtension çatısı, sistemin çekirdek ağ özelliklerini (içerik filtresi, DNS proxy, VPN) özelleştirmeyi sağlar. İçerik filtresi sağlayıcısı için Apple'ın tarifi nettir:</p></div>
<div class="manpage src-apple"><div class="ref">docs Content filter · TOPIC</div><p class="orig">Create an on-device network content filter.</p><p>İçerik filtresi artık imzalı, sandbox'lı bir <em>system extension</em> olarak çalışır; eski KEXT tabanlı NKE'lerin aksine çekirdek belleğine doğrudan erişmez. Bu, saldırı yüzeyini çekirdekten kullanıcı alanına indiren bilinçli bir güvenlik kararıdır.</p></div>

<h3>5. Neden ağ yığını kritik bir saldırı yüzeyidir?</h3>
<p>Ağ yığınının her katmanı, <strong>dışarıdan gelen ve güvenilmeyen</strong> baytı ayrıştırır: TCP header'ları, IP opsiyonları, fragment'ler, protokol seçenekleri. Bir parser'daki tek bir sınır hatası (out-of-bounds read/write) uzaktan, kimlik doğrulaması olmadan tetiklenebilir — üstelik bu kod çekirdek ayrıcalığıyla çalışır. Tarihsel olarak TCP/IP yığınları, uzaktan çekirdek ele geçirme için en değerli hedefler arasında olmuştur.</p>
<p>Savunma bu yüzden katmanlıdır: ayrıştırıcıları olabildiğince sadeleştirmek, kullanıcı alanına taşımak (NetworkExtension), bellek-güvenli sınır denetimleri eklemek ve çekirdek mitigasyonlarıyla (bkz. donanım destekli korumalar modülü) bir hatanın tam ele geçirmeye dönüşmesini zorlaştırmak. Ağ yığınını okurken "bu baytlar nereden geliyor ve kim doğruluyor?" sorusu, bir güvenlikçinin pusulasıdır (bkz. ofansif izlek: kernel saldırı yüzeyi).</p>`
  },
