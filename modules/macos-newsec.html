  deepDive: {
    heading: "Derinlemesine: ayrıcalığın çekirdekten ayrılması",
    html: `<p class="lead">Apple'ın bu mimarisi tek bir cümlede özetlenebilir: en kritik yetkileri çekirdekten alıp çekirdeğin <em>daha ayrıcalıklı</em> ve ondan yalıtılmış bileşenlere vermek. Böylece bir kernel R/W primitifi artık "her şey" anlamına gelmez. Bu bölüm Apple'ın <em>Operating system integrity</em> belgesine ve kamuya açık analizlere (Antid0te) dayanan yüksek seviyeli bir genel bakıştır — bu bileşenler yenidir ve uygulama ayrıntısı sınırlıdır.</p>

<h3>1. Önce gelen katmanlar: KIP ve PPL</h3>
<p>Bu mimari sıfırdan doğmadı; daha eski kernel integrity korumalarının devamıdır. <strong>KIP (Kernel Integrity Protection)</strong>, çekirdek ve sürücü kodunun boot'tan sonra değiştirilmesini engeller; yapılandırması donanım tarafından kilitlenir. <strong>PPL (Page Protection Layer)</strong> ise bir adım öteye geçip, code signature doğrulaması bittikten sonra user space kodunun değiştirilmesini önler — ama yalnızca iOS/iPadOS/watchOS/visionOS gibi "yalnızca imzalı kod" platformlarında; macOS keyfi kod çalıştırabildiği için PPL kullanmaz.</p>
<div class="manpage src-apple"><div class="ref">Apple Platform Security · OS integrity</div><p class="orig">Kernel Integrity Protection (KIP) is enabled to help prevent modifications of kernel and driver code.</p><p>KIP, çekirdek ve sürücü kodunun boot sonrası değiştirilmesini engellemek için vardır; yapılandırması kilitlendiğinden saldırgan onu yeniden ayarlayamaz.</p></div>
<div class="manpage src-apple"><div class="ref">Apple Platform Security · PPL</div><p class="orig">designed to prevent user space code from being modified after code signature verification is complete</p><p>PPL, imza doğrulaması tamamlandıktan sonra user space kodunun değiştirilmesini önlemek üzere tasarlanmıştır. SPTM, bu fikrin halefi ve genellemesidir.</p></div>

<h3>2. SPTM: sayfa tablolarının tek yetkili sahibi</h3>
<p>Klasik modelde page table'ları çekirdek yönetir; bu da kernel write'ı olan saldırganın bir sayfayı yazılabilir+çalıştırılabilir yapıp kod enjekte etmesine kapı açar. <strong>SPTM (Secure Page Table Monitor)</strong> bu yetkiyi çekirdekten alır: sayfa tablolarını değiştirebilen tek bileşendir ve bunu çekirdekten <em>daha yüksek bir privilege level</em>'da çalışarak yapar. Çekirdek bir eşleme isterse SPTM'ye başvurur; SPTM kuralları uygular. Saldırgan kernel R/W'ye sahip olsa bile page table'lara doğrudan dokunamaz — PPL'in halefidir.</p>
<div class="manpage src-apple"><div class="ref">Apple Platform Security · SPTM</div><p class="orig">does this by utilizing a higher privilege level than the kernel</p><p>SPTM, bunu çekirdekten daha yüksek bir ayrıcalık seviyesi (privilege level) kullanarak yapar. Bu yüzden ele geçirilmiş bir çekirdek bile SPTM'nin yönettiği sayfa tablolarını değiştiremez.</p></div>

<h3>3. TXM: kod yürütme politikasını zorlar</h3>
<p>SPTM belleğin yazma/çalıştırma izinlerini tutar; peki hangi kodun çalışmasına izin verileceğine kim karar verir? Burada <strong>TXM (Trusted Execution Monitor)</strong> devreye girer. SPTM, kod yürütmeyi yöneten politikaları fiilen uygulamak için daha düşük ayrıcalıklı TXM'yi kullanır. Yani code signing / entitlement kararlarının mantığı çekirdekten çıkıp TXM'ye taşınmıştır (eskiden bunu AMFI çekirdekte zorlardı). İkili yapı bilinçlidir: SPTM güçlü ama küçük tutulur, politika mantığı gibi daha büyük yüzey TXM'ye bırakılır.</p>
<div class="manpage src-apple"><div class="ref">Apple Platform Security · TXM</div><p class="orig">the lower privileged TXM to actually enforce the policies that govern code execution</p><p>SPTM, kod yürütmeyi yöneten politikaları fiilen uygulamak için daha düşük ayrıcalıklı TXM'yi kullanır. Böylece en ayrıcalıklı bileşen (SPTM) küçük ve denetlenebilir kalır.</p></div>

<h3>4. Güven alanları birbirinden de yalıtık</h3>
<p>Kritik tasarım kararı: bu bileşenler yalnızca çekirdekten değil, <em>birbirinden</em> de ayrılmıştır. Apple'a göre mimari, bir TXM ihlalinin otomatik olarak bir SPTM bypass'ına dönüşmemesi için tasarlanmıştır. Yani daha büyük yüzeyli TXM düşse bile, sayfa tablolarının gerçek bekçisi olan SPTM ayakta kalır. Bu, "defense in depth" ilkesinin bileşenler arası uygulanışıdır.</p>
<div class="manpage src-apple"><div class="ref">Apple Platform Security · SPTM/TXM</div><p class="orig">designed so that a TXM compromise doesn't automatically translate to an SPTM bypass</p><p>Mimari, bir TXM ihlalinin kendiliğinden bir SPTM bypass'ına dönüşmemesi için tasarlanmıştır — tek bir bileşenin düşmesi zinciri bitirmez.</p></div>

<h3>5. SK ve Exclaves: izole hizmet dünyası</h3>
<p>Son halka, hassas hizmetleri de çekirdekten çıkarmaktır. <strong>Secure Kernel (SK)</strong>, çekirdekten ayrı bir güvenli dünyada çalışan küçük bir çekirdektir; onun üzerinde <strong>Exclaves</strong> adı verilen yalıtılmış bölmeler koşar. Her exclave, kendi dar görevine sahip bir mikroservis gibidir ve XNU çekirdeği bunların belleğine giremez — yalnızca tanımlı arayüzlerle konuşur. Örnek: mikrofon/kamera gibi gizlilik göstergelerinin (privacy indicators) durumu. Çekirdek ele geçse bile bir exclave'in tuttuğu "kamera açık" sinyali kapatılamaz.</p>
<div class="deflist">
<div><dt>SPTM</dt><dd>Secure Page Table Monitor — sayfa tablolarını değiştirebilen tek bileşen; çekirdekten yüksek privilege level. PPL'in halefi.</dd></div>
<div><dt>TXM</dt><dd>Trusted Execution Monitor — kod yürütme / code signing politikalarını zorlar; SPTM'nin altında, çekirdeğin dışında.</dd></div>
<div><dt>SK</dt><dd>Secure Kernel — Exclaves'in üzerinde koştuğu, çekirdekten yalıtık güvenli çekirdek.</dd></div>
<div><dt>Exclaves</dt><dd>Çekirdekten izole, dar görevli güvenli hizmet bölmeleri (ör. privacy indicator durumu).</dd></div>
</div>

<h3>6. Savunmacı için anlamı</h3>
<p>Bu mimarinin asıl dersi exploit geliştirme değil, <em>hata bedelinin düşürülmesidir</em>. Çekirdek hâlâ büyük ve karmaşıktır, yani bug barındıracaktır; ama bir kernel R/W primitifi artık page table yazmaya, imzasız kod çalıştırmaya veya izole hizmetlere erişmeye yetmez. Aynı felsefe PAC/PAN/MTE (Modül 19) ve kalloc_type (Modül 20) ile paraleldir: tek bir savunmaya güvenmek yerine saldırının her aşamasına ayrı bir engel koymak ve en kritik yetkiyi en iyi korunan yere taşımak. "Çekirdeği aldı" artık "her şeyi aldı" demek değildir.</p>`
