  deepDive: {
    heading: "Derinlemesine: profil nasıl yazılır, nasıl zorlanır?",
    html: '<p class="lead">Sandbox "uygulamayı kapat" kadar basit değildir: her uygulamaya, yapması gereken işe göre biçilmiş bir profile verilir ve bu profil çekirdekte, işlem işlem zorlanır. Profil dilinden MACF kancalarına, container izolasyonundan sandboxd\'ye kadar ayrıntılar, kafesin ne kadar sağlam olduğunu belirler. Bu bölüm Apple belgelerine ve Levin\'in OS Internals serisine dayanır.</p>' +

      '<h3>1. Profil ve SBPL</h3>' +
      '<p>Bir sandbox profile, sürecin neye izinli olduğunu tanımlayan kurallar kümesidir. Kurallar <strong>SBPL</strong> (Sandbox Profile Language) adlı, Scheme (TinyScheme) benzeri bir dilde yazılır ve çalışmadan önce bir bytecode\'a derlenir; çekirdek bu derlenmiş biçimi değerlendirir. Tipik bir profil <code>(deny default)</code> ile başlar — yani <strong>deny by default</strong> — sonra yalnızca gereken işlemleri tek tek açar: <code>(allow file-read* (subpath "..."))</code>, <code>(allow mach-lookup (global-name "..."))</code> gibi. Profilde açıkça izin verilmeyen her şey reddedilir; bu, profil yazarının aklına gelmeyen yolların da kapalı kalmasını sağlar.</p>' +
      '<div class="manpage src-apple"><div class="ref">sandbox-exec · DESCRIPTION</div><p class="orig">The sandbox-exec command enters a sandbox using a profile specified by the -f, -n, or -p option.</p><p>Bir süreç, verilen bir profile ile başlatılır. SBPL kaynağı (<code>-f</code> dosya, <code>-p</code> satır içi) veya yerleşik bir profil (<code>-n</code>) seçilir; o andan sonra süreç o kafesin içindedir. Not: <code>sandbox-exec</code> artık deprecated\'tir (geliştiriciler App Sandbox\'ı benimsemeli), ama kavramı net gösterir.</p></div>' +

      '<h3>2. Çekirdekte zorlama: MACF ve Sandbox.kext</h3>' +
      '<p>Profil bir dosyada değil, çekirdekte zorlanır. Sandbox bir kernel extension\'dır (<code>Sandbox.kext</code>) ve XNU\'nun <strong>MACF</strong> (Mandatory Access Control Framework) politika motoruna bir policy module olarak kaydolur. MACF, dosya (<code>mac_vnode_check_*</code>), ağ (<code>mac_socket_check_*</code>), IPC (Mach port / XPC), süreç ve syscall yollarına kancalar yerleştirir. Kısıtlı bir işlem bu kancalardan birine uğradığında çekirdek, sürece bağlı derlenmiş profili istenen işleme karşı değerlendirir ve allow/deny kararı verir. Uygulama kendi kodunda çalıştığı için kafesini kendisi gevşetemez — zorlama uygulamanın erişemediği bir katmandadır.</p>' +
      '<div class="deflist">' +
      '<div><dt>SBPL</dt><dd>Profilin yazıldığı dil; derlenip bytecode olarak çekirdeğe yüklenir.</dd></div>' +
      '<div><dt>MACF</dt><dd>XNU\'da policy module\'lerin takıldığı çerçeve; her kısıtlı işlemde kancaları çağrılır.</dd></div>' +
      '<div><dt>Sandbox.kext</dt><dd>MACF\'e kaydolan policy module; profili işleme karşı değerlendirir.</dd></div>' +
      '<div><dt>mac_syscall</dt><dd>Profil yükleme/sorgulama için kullanıcı-alanı ile çekirdek arasındaki arayüz.</dd></div>' +
      '<div><dt>sandboxd</dt><dd>Pahalı veya etkileşimli kararları (ör. kullanıcı izni) işleyen kullanıcı-alanı daemon.</dd></div>' +
      '</div>' +

      '<h3>3. App Sandbox ve entitlement</h3>' +
      '<p>Modern macOS\'ta geliştiriciler profili elle yazmaz; <strong>App Sandbox</strong>\'ı etkinleştirir ve ihtiyaç duyduğu yetkileri <strong>entitlement</strong>\'larla (uygulama imzasına gömülü anahtar/değer hakları) talep eder: <code>com.apple.security.network.client</code>, <code>com.apple.security.files.user-selected.read-write</code> gibi. Sistem bu entitlement\'lardan sürece uygun bir profil türetir. Entitlement\'lar kod imzasının parçası olduğu için AMFI tarafından doğrulanır — yani bir uygulama sahip olmadığı bir yetkiyi sonradan kendine ekleyemez.</p>' +
      '<div class="manpage src-apple"><div class="ref">App Sandbox</div><p class="orig">Restrict access to system resources and user data in macOS apps to contain damage if an app becomes compromised.</p><p>App Sandbox\'ın amacı tam da budur: bir uygulama ele geçirilse bile verebileceği zararı, erişebildiği kaynakları ve kullanıcı verisini önceden daraltarak sınırlamak. Bu, en az ayrıcalık (least privilege) ilkesinin uygulama paketine gömülü hali.</p></div>' +

      '<h3>4. iOS container izolasyonu</h3>' +
      '<p>iOS\'ta her uygulama, App Store\'dan gelen her şey gibi, sıkı bir varsayılan profille ve kendi <strong>container</strong>\'ında çalışır: uygulamanın dosya alanı (<code>Documents</code>, <code>Library</code>…) diğer uygulamalardan yalıtılmıştır ve uygulama bu dizinin dışını göremez. Paylaşım yalnızca denetimli arayüzlerle (ör. share sheet, app groups, belgelenmiş IPC) olur. macOS\'ta App Sandbox opt-in iken (özellikle App Store dışı uygulamalar sandbox\'sız olabilir), iOS\'ta sandbox zorunludur — bu, iki platformun saldırı yüzeyi arasındaki temel farklardan biridir.</p>' +

      '<h3>5. Diğer katmanlarla ilişki ve saldırgan bakışı</h3>' +
      '<p>Sandbox tek başına durmaz; macOS/iOS güvenliği katmanlıdır. <strong>AMFI</strong> çalıştırılan <em>kodun</em> imzalı olmasını zorlar (kim?); <strong>sandbox</strong> o kodun <em>erişimini</em> kısıtlar (neye?); <strong>SIP</strong> ise root dahil kimsenin sistem dosyalarına dokunmamasını sağlar (nereye?). Android tarafında aynı işi UID ayrımı + SELinux (MAC) + seccomp birlikte yapar — "politikayı çekirdekte zorla" fikri ortaktır.</p>' +
      '<p>Saldırgan açısından sandbox, aşılması gereken bir duvardır. Doğrudan delmek yerine tipik yol, <strong>profilde zaten izinli bir IPC servisini</strong> (bir XPC/Mach servisi) kötüye kullanmaktır: sandbox\'lı süreç, daha ayrıcalıklı bir servise kendi adına iş yaptırır (confused deputy). Bu yüzden asıl saldırı yüzeyi, profilin izin verdiği her arayüzdür ve savunma, o servislerin caller\'ı titizlikle doğrulamasıdır. Bu mekanizma ofansif izlekteki <strong>sandbox kaçışı</strong> modülünde kavramsal olarak ele alınır; burada odak, kafesin nasıl çizilip zorlandığıdır.</p>',
  },

      '</ol>' +
      '<p class="prose" style="margin-top:14px">Diğer katmanlarla ilişki: AMFI çalıştırılan <em>kodun</em> imzalı olmasını zorlar; sandbox o kodun <em>erişimini</em> kısıtlar; SIP ise sistem dosyalarını korur. Android tarafında benzer işi UID ayrımı + SELinux + seccomp birlikte yapar — çekirdekte zorlanan politika fikri aynıdır. Saldırgan açısından bakış (profilde izinli bir IPC servisini "kafası karışık vekil" olarak kullanıp sınırı aşma) ofansif sandbox kaçışı modülünde kavramsal olarak işlenir.</p>'

  tryIt: {
