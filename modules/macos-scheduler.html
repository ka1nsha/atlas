  deepDive: {

    html: `<p class="lead">Mach scheduler, Linux'tan iki temel noktada ayrılır: zamanlama birimi task değil <strong>thread</strong>'dir ve öncelik, mutlak sayısal bir priority band sistemine dayanır (Linux'un göreli vruntime/fairness modelinin aksine). Bu bölüm Apple'ın Kernel Programming Guide'ına, XNU kaynağına ve Jonathan Levin'in OS Internals serisine dayanır.</p>

<h3>1. Thread tabanlı zamanlama</h3>
<p>Mach'ta bir task yalnızca bir kaynak konteyneridir (address space, port name space); gerçek işi thread'ler yapar ve zamanlanan da onlardır. Her thread'in bir base priority'si ve anlık bir sched_priority'si vardır. Bir process'in birden çok thread'i birbirinden bağımsız zamanlanır.</p>

<h3>2. Priority band'ler (0–127)</h3>
<p>Mach, 0–127 arası 128 öncelik seviyesini dört banda böler. Bir thread her zaman bir bandın içinde kalır; yalnızca band içinde yukarı/aşağı hareket eder.</p>
<div class="manpage src-apple"><div class="ref">apple · kernel · scheduling</div><p class="orig">The priority levels are divided into four bands according to their characteristics.</p><p>Dört band: <strong>normal</strong> (0–63, sıradan uygulama thread'leri), <strong>system high priority</strong> (daha önemli ama real-time değil), <strong>kernel mode</strong> (çekirdek thread'leri) ve <strong>real-time</strong> (96–127, deadline garantisi isteyen ses/video).</p></div>
<div class="deflist">
<div><dt>normal (0–63)</dt><dd>Sıradan uygulama thread'leri. Timesharing bu bandda devreye girer.</dd></div>
<div><dt>system high</dt><dd>Normalin üstünde ama real-time değil; sistem için önemli işler.</dd></div>
<div><dt>kernel mode</dt><dd>Çekirdek içi thread'ler için ayrılmış band.</dd></div>
<div><dt>real-time (96–127)</dt><dd>Deadline tabanlı; en yüksek öncelik, ses/video gibi zaman kritik iş.</dd></div>
</div>

<h3>3. Timesharing ve priority decay</h3>
<p>Normal banddaki bir thread CPU'yu ne kadar çok kullanırsa, anlık önceliği o kadar düşer (CPU usage decay). Böylece CPU'yu uzun tutan bir thread yavaşça geri çekilir ve bekleyenler öne geçer; boşta kalan thread'in önceliği zamanla geri toparlanır. Bu, Linux'un vruntime fikriyle aynı amaca (adalet) farklı bir yolla ulaşır.</p>
<div class="manpage src-apple"><div class="ref">apple · kernel · scheduling</div><p class="orig">Threads can migrate between priority levels for a number of reasons, largely as an artifact of the time sharing algorithm used. However, this migration is within a given band.</p><p>Thread'ler timesharing yüzünden seviyeler arasında gezer — ama yalnızca kendi bandı içinde. Bir normal-band thread'i asla kendiliğinden real-time banda çıkamaz.</p></div>

<h3>4. QoS class'larının band'e eşlenmesi</h3>
<p>GCD modülündeki QoS class'ları (userInteractive, userInitiated, utility, background) soyut niyet ifadeleridir; scheduler bunları somut priority seviyelerine çevirir. userInteractive yüksek önceliğe, background ise alt seviyelere düşer. Böylece geliştirici ham sayı yerine "bu iş kullanıcıyı mı bekletiyor" niyetini bildirir.</p>
<div class="deflist">
<div><dt>userInteractive</dt><dd>En yüksek (UI, animasyon). Anında yanıt beklenir.</dd></div>
<div><dt>userInitiated</dt><dd>Kullanıcının başlattığı, sonucu beklenen iş.</dd></div>
<div><dt>utility</dt><dd>Uzun süren, ilerleme gösterilen iş (indirme).</dd></div>
<div><dt>background</dt><dd>En düşük. Kullanıcı farkında değil (senkronizasyon, yedekleme).</dd></div>
</div>

<h3>5. Real-time thread'ler</h3>
<p>Real-time band, deadline garantisi isteyen thread'ler içindir: thread, scheduler'a "önümüzdeki B döngünün A'sında çalışmam gerek" der. Ama bu <em>soft</em> real-time'dır — kernel elinden geleni yapar, kesin garanti vermez.</p>
<div class="manpage src-apple"><div class="ref">apple · kernel · scheduling</div><p class="orig">The kernel will make every effort to honor the request, but since this is soft real-time, it cannot be guaranteed.</p><p>Ses motorları (CoreAudio) bu bandı kullanır: bir ses buffer'ı zamanında dolmazsa duyulabilir bir çatırtı olur, bu yüzden deadline kritiktir.</p></div>

<h3>6. Apple Silicon: P-core ve E-core</h3>
<p>Apple Silicon'da iki tür çekirdek vardır: performance core (P-core, hızlı ama güç yiyen) ve efficiency core (E-core, yavaş ama tasarruflu). Scheduler, QoS'a göre çekirdek seçer: userInteractive iş P-core'a, background iş E-core'a yönlendirilir. Bu, hem performansı hem pil ömrünü QoS niyetinden türetir — Linux'un homojen çekirdek varsayımından farklı bir boyut.</p>

<h3>Linux EEVDF ile karşılaştırma</h3>
<p>Linux EEVDF, adaleti göreli vruntime ve virtual deadline ile sağlar; tüm normal thread'ler aynı havuzda yarışır. Mach ise mutlak priority band'lere dayanır: bir band tamamen başka bir bandın üstündedir, band içinde timesharing devreye girer. Mach'ın real-time bandı Linux'un SCHED_FIFO/SCHED_RR + SCHED_DEADLINE sınıflarına denk düşer. Pratik sonuç: Mach'ta öncelik daha katı ve öngörülebilir, Linux'ta daha akışkan ve adildir.</p>`
