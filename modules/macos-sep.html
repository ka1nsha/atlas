  deepDive: {
    heading: "Derinlemesine: çekirdek düşse bile anahtarlar neden düşmez?",
    html: `<p class="lead">Secure Enclave\'in (SEP) tek bir tasarım fikri vardır: en kritik sırları, onları kullanan yazılımdan <strong>fiziksel olarak</strong> ayırmak. Böylece ana işletim sisteminin çekirdeği tamamen ele geçirilse bile saldırgan anahtarların kendisine ulaşamaz. Bu bölüm Apple Platform Security belgelerine dayanır ve alıntılar oradan birebir alınmıştır.</p>

<h3>1. SEP nedir: çip içinde ayrı bir bilgisayar</h3>
<p>SEP, ana SoC\'un içine gömülü ama ondan yalıtılmış bir alt sistemdir. Kendi işlemcisi (Secure Enclave Processor), kendi işletim sistemi (sepOS) ve kendi belleği vardır. Ana çekirdekle paylaşılan tek şey, sıkı bir mesajlaşma arayüzüdür.</p>
<div class="manpage src-apple"><div class="ref">Platform Security · Secure Enclave</div><p class="orig">The Secure Enclave is isolated from the main processor to provide an extra layer of security.</p><p>SEP, ek bir güvenlik katmanı sağlamak için ana işlemciden izole edilmiştir. Bu izolasyon, ana işlemcinin çekirdeği (kernel) ele geçirilse bile korumanın ayakta kalması için tasarlanmıştır.</p></div>
<div class="manpage src-apple"><div class="ref">Platform Security · Secure Enclave</div><p class="orig">The Secure Enclave Processor provides the main computing power for the Secure Enclave.</p><p>Secure Enclave Processor, SEP için asıl işlem gücünü sağlar; çekirdekleri yalnızca SEP\'e hizmet eder — yani ayrı, adanmış bir işlemcidir.</p></div>

<h3>2. Şifreli bellek: Memory Protection Engine</h3>
<p>SEP ana DRAM\'in bir bölgesini kullanır, ama bu bölge dışarıdan okunduğunda anlamsızdır: Memory Protection Engine her erişimi satır-içi (inline) şifreler ve bütünlüğünü doğrular. Fiziksel olarak belleğe erişen bir saldırgan bile yalnızca şifreli, doğrulanmış veri görür.</p>
<div class="manpage src-apple"><div class="ref">Platform Security · Secure Enclave</div><p class="orig">The Memory Protection Engine operates inline and transparently to the Secure Enclave.</p><p>Memory Protection Engine, SEP\'in belleğine giden tüm erişimlerde satır-içi (inline) ve saydam biçimde çalışır; SEP\'in DRAM bölgesini şifreler ve kurcalamaya karşı doğrular.</p></div>

<h3>3. AES Engine: anahtarın asla görünmediği yer</h3>
<p>SEP\'in en güçlü garantisi burada: donanım anahtarları çipe özgü <strong>UID</strong> (ya da çip ailesine özgü GID) kimliğinden türetilir ve AES Engine\'in içinde kalır. Yazılım "bununla şifrele/çöz" diyebilir, ama ham anahtarı okuyamaz — sepOS\'un kendisi bile.</p>
<div class="manpage src-apple"><div class="ref">Platform Security · Secure Enclave</div><p class="orig">Hardware keys are derived from the Secure Enclave UID or GID.</p><p>Donanım anahtarları, SEP\'in UID (cihaza özgü) veya GID (çip ailesine özgü) kimliğinden türetilir. UID her cihazda benzersizdir ve üretim sırasında bile kaydedilmez.</p></div>
<div class="manpage src-apple"><div class="ref">Platform Security · Secure Enclave</div><p class="orig">These keys stay within the AES Engine and aren't made visible even to sepOS software.</p><p>Bu anahtarlar AES Engine içinde kalır ve sepOS yazılımına bile görünür kılınmaz. Yazılım yalnızca işlem talep edebilir; anahtarın kendisini elde edemez.</p></div>

<h3>4. Biyometri: veri SEP\'ten çıkmaz</h3>
<p>Touch ID, Face ID ve Optic ID için alınan biyometrik şablonlar SEP içinde saklanır ve eşleştirme de orada yapılır. Uygulamalar yalnızca "eşleşti / eşleşmedi" sonucunu alır; parmak izi veya yüz haritası hiçbir zaman ana işletim sistemine veya Apple\'a aktarılmaz.</p>
<div class="manpage src-apple"><div class="ref">Platform Security · Secure Enclave</div><p class="orig">Other protected device-specific secrets include Optic ID, Face ID, or Touch ID data.</p><p>SEP içinde korunan cihaza özgü sırlar arasında Optic ID, Face ID ve Touch ID verisi de vardır. Bu veri SEP sınırının içinde kalır; dışarı aktarılmaz.</p></div>

<h3>5. Data Protection: her dosyaya ayrı anahtar</h3>
<p>Dosya şifreleme SEP\'in üstüne kurulu bir anahtar hiyerarşisidir. Her dosya bir <strong>sınıfa (class)</strong> atanır; erişilebilirlik, o sınıfın anahtarının (class key) o an açık olup olmamasına bağlıdır. <code>Complete</code> sınıfı cihaz kilitlenince kilitlenir; <code>Complete Until First User Authentication</code> ilk açılıştan sonra erişilebilir kalır.</p>
<div class="manpage src-apple"><div class="ref">Platform Security · Data Protection</div><p class="orig">Data Protection is controlled on a per-file basis by assigning each file to a class</p><p>Data Protection dosya bazında denetlenir: her dosya bir sınıfa atanır ve erişilebilirlik, sınıf anahtarlarının (class keys) açılmış olup olmamasına göre belirlenir.</p></div>
<div class="manpage src-apple"><div class="ref">Platform Security · Data Protection</div><p class="orig">Every time a file on the data volume is created, Data Protection creates a new 256-bit key</p><p>Veri biriminde bir dosya her oluşturulduğunda Data Protection yeni bir 256-bit anahtar üretir ve bunu donanım AES Engine\'ine verir; dosya flash\'a yazılırken bu anahtarla şifrelenir. Dosya anahtarının kendisi de sınıf anahtarıyla sarılır (wrap).</p></div>
<div class="deflist">
<div><dt>per-file key</dt><dd>Her dosyaya özel 256-bit anahtar; dosya içeriğini şifreler. Diskte, sınıf anahtarıyla sarılı (wrapped) durur.</dd></div>
<div><dt>class key</dt><dd>Bir koruma sınıfının anahtarı; cihaz kilidine/parolaya bağlı açılır. Kapalıyken o sınıftaki dosya anahtarları çözülemez.</dd></div>
<div><dt>UID key</dt><dd>Çipe özgü, donanıma gömülü kök anahtar. Hiyerarşinin tabanı; AES Engine dışına hiç çıkmaz.</dd></div>
<div><dt>effaceable storage</dt><dd>Anahtarları hızlıca ve geri dönülemez biçimde silmek için ayrılmış depolama; "uzaktan sil" anında etkisizleştirmeyi sağlar.</dd></div>
</div>

<h3>6. Secure boot: SEP kendini de doğrular</h3>
<p>SEP\'in güveni, değiştirilemez bir Boot ROM\'a dayanır: açılışta ilk çalışan koddur ve yalnızca geçerli imzalı bir sepOS\'u başlatır. Böylece güven zinciri donanım kök güveninden (hardware root of trust) sepOS\'a kadar kesintisizdir.</p>
<div class="manpage src-apple"><div class="ref">Platform Security · Secure Enclave</div><p class="orig">The Secure Enclave Boot ROM is immutable code</p><p>Secure Enclave Boot ROM değiştirilemez (immutable) koddur ve SEP için güvenin köküdür. İmzası geçerliyse kontrolü sepOS\'a devreder; değilse SEP, bir sonraki çip sıfırlamasına kadar kullanılamaz.</p></div>
<p>Sonuç: ARM64 modülündeki donanım korumaları (PAC, PAN) ana çekirdeği sertleştirirken, SEP en kritik sırları o çekirdeğin <em>tamamen dışına</em> taşır. İki yaklaşım birbirini tamamlar — biri çekirdeği zor hedef yapar, diğeri çekirdek düşse bile kaybı sınırlar.</p>`
  },
