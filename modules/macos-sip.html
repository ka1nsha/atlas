    html: `<p class="lead">macOS'un üst katman savunması iki ayağa dayanır: SIP sistemin kendisini root'tan bile korur, TCC ise kullanıcının verisini uygulamalardan korur. İkisi de "kim olduğuna" değil "neye izin verildiğine" bakar — klasik Unix'in root-her-şeyi-yapar modelinin kırıldığı yer burasıdır.</p>

<h3>1. SIP (System Integrity Protection / rootless)</h3>
<p>Klasik Unix'te root (UID 0) her şeyi yapabilir. SIP bunu kırar: kernel, root olsan bile belirli kritik yolları ve process'leri korur. Koruma kimliğe değil, dosya/process üzerindeki işarete ve csr flag'lerine bakar.</p>
<div class="manpage src-apple"><div class="ref">Apple Platform Security · SIP</div><p class="orig">SIP restricts components to read-only in specific critical file system locations.</p><p>SIP, kritik sistem konumlarını (/System, /bin, /sbin, /usr — ama /usr/local hariç) salt okunur yapar. root bile bu yolları değiştiremez; yazma denemesi EPERM ile reddedilir.</p></div>
<div class="manpage src-apple"><div class="ref">Apple Platform Security · SIP</div><p class="orig">macOS applies this security policy to every process running on the system.</p><p>Politika istisnasız her process'e uygulanır — administrative privilege (root) bir muafiyet sağlamaz. SIP ayrıca korunan process'leri debug etmeyi, unsigned kext yüklemeyi ve boot-args ile kernel'i gevşetmeyi de engeller.</p></div>

<h3>2. SIP nasıl işaretlenir ve yapılandırılır</h3>
<div class="deflist">
<div><dt>restricted flag</dt><dd><code>com.apple.rootless</code> extended attribute (xattr) ile işaretlenen dosya/dizinler korunur; işaret dosya sisteminde taşınır, sahiplik veya izin bitlerinden bağımsızdır.</dd></div>
<div><dt>csr flags</dt><dd>CSR_ALLOW_* bit'leri SIP'in hangi kısımlarının gevşediğini belirler (ör. CSR_ALLOW_UNRESTRICTED_FS, CSR_ALLOW_TASK_FOR_PID). NVRAM'de saklanır.</dd></div>
<div><dt>csrutil</dt><dd>SIP durumunu gösterir/değiştirir — ama yalnızca Recovery ortamından. Çalışan sistemden kapatılamaz, ki bir saldırgan onu basitçe devre dışı bırakamasın.</dd></div>
</div>

<h3>3. TCC (Transparency, Consent, Control)</h3>
<p>SIP sistemi korur; TCC kullanıcının verisini korur. Bir uygulama Camera, Microphone, Contacts, Full Disk Access veya Screen Recording gibi hassas kaynaklara erişmek istediğinde sistem bunu keser ve kullanıcıya açık bir consent istemi gösterir. Karar <code>tccd</code> adlı userspace daemon tarafından yönetilir ve <code>TCC.db</code>'de saklanır; bu veritabanının kendisi SIP korumalıdır, yani bir uygulama kendine izin yazamaz. (Kaynak: Apple Platform Security.)</p>
<div class="deflist">
<div><dt>protected data</dt><dd>Camera, Microphone, Location, Contacts, Calendar, Photos, Full Disk Access, Screen Recording, Accessibility — her biri ayrı bir consent gerektirir.</dd></div>
<div><dt>tccd</dt><dd>Consent kararlarını yöneten userspace daemon; onay istemini gösterir ve sonucu TCC.db'ye yazar.</dd></div>
<div><dt>TCC.db</dt><dd>Hangi uygulamanın neye izinli olduğunu tutar; SIP korumalı olduğu için elle veya uygulama tarafından düzenlenemez.</dd></div>
</div>

<h3>4. Birlikte: katmanlı savunma</h3>
<p>SIP ve TCC farklı katmanlarda ama aynı felsefeyle çalışır: ayrıcalık (root) artık tek başına yetki anlamına gelmez. Bir saldırgan root elde etse bile SIP korumalı sistemi değiştiremez, TCC korumalı veriye kullanıcı onayı olmadan erişemez. Bu yüzden modern macOS saldırıları genellikle bir SIP/TCC bypass'ına odaklanır — böyle bir bypass'ın NE başarması gerektiği (korumalı bir yola yazmak, consent olmadan veriye erişmek) kavramsal olarak Ofansif izlekte ele alınır; bu modül yalnızca savunma mekanizmasını anlatır.</p>`
