  deepDive: {
    heading: "Derinlemesine: Mach VM'in katmanlı soyutlaması",
    html: `<p class="lead">Mach'ın virtual memory sistemi, Linux'un nispeten düz "VMA + donanım page table" modelinden daha katmanlıdır. Bellek, üç soyutlama üzerinden yönetilir: bir task'ın adres uzayını tanımlayan VM map, belleğin içeriğini temsil eden paylaşılabilir VM object ve bunların gerçek sayfa tablosuna indiği machine-dependent pmap katmanı. Bu ayrım, aynı çekirdeğin hem Intel hem Apple Silicon üzerinde çalışmasını ve belleğin esnek biçimde paylaşılmasını sağlar. Bu bölüm Apple'ın XNU kaynağına ve Kernel Programming Guide'a dayanır.</p>

<h3>1. Üç katman: VM map → VM object → VM page</h3>
<p>Bir task'ın belleği tek bir tablo değil, iç içe geçmiş soyutlamalardan oluşur. En üstte adres uzayını tarif eden harita, altında belleğin "nereden geldiğini" bilen kaynak nesnesi vardır.</p>
<div class="deflist">
<div><dt>VM map</dt><dd>Bir task'ın tüm adres uzayı. Sıralı vm_map_entry aralıklarından oluşur; her entry bir adres aralığını bir VM object'e ve offset'e bağlar. Linux'taki vm_area_struct (VMA) listesine karşılık gelir.</dd></div>
<div><dt>VM object</dt><dd>Belleğin içeriğinin soyut kaynağı — bir dosya, anonim bellek ya da paylaşılan bir bölge. Birden çok map entry aynı VM object'i gösterebilir; paylaşımın temeli budur.</dd></div>
<div><dt>VM page</dt><dd>VM object içindeki tek bir sayfa (resident page). Fiziksel bir sayfa çerçevesine karşılık gelebilir ya da henüz bellekte olmayıp pager'dan getirilmeyi bekliyor olabilir.</dd></div>
</div>
<div class="manpage src-apple"><div class="ref">xnu · vm_map.h</div><p class="orig">A VM map represents an address space or sub-address space that is managed by the Mach VM.</p><p>VM map, bir task'ın (veya alt adres uzayının) tüm adres uzayıdır. İçindeki her entry bir adres aralığını bir VM object'e bağlar — yani "bu adreslerde hangi bellek var?" sorusunun cevabı buradadır.</p></div>

<h3>2. pmap: machine-dependent katman</h3>
<p>XNU'nun en güçlü tasarım kararlarından biri, VM sistemini ikiye ayırmaktır. Üst kısım (VM map/object/page) tamamen machine-independent'tır — mimariden bağımsız mantık burada yaşar. Gerçek donanım sayfa tablosunu kuran ve virtual-to-physical çeviriyi yapan machine-dependent kısım ise ayrı bir katmanda, pmap'te toplanır. Yeni bir mimariye (örneğin Intel'den Apple Silicon'a) geçerken yalnızca pmap yeniden yazılır; VM sisteminin geri kalanı değişmez.</p>
<div class="manpage src-apple"><div class="ref">apple · Kernel Programming Guide</div><p class="orig">VM objects are managed by the machine-independent VM system, with the underlying virtual to physical mappings handled by the machine-dependent pmap system.</p><p>Linux'ta sayfa tablosu doğrudan donanıma bağlıdır; Mach'ta araya pmap girer. Böylece üst katman soyut kalır, pmap ise donanımın (x86-64 veya ARM64) gerçek page table formatını bilir. Bu ayrım, Linux'ta ayrı ayrı çözülen sorunları tek bir yerde toplar.</p></div>

<h3>3. Pager'lar: sayfa nereden gelir?</h3>
<p>Bir VM object bellekte olmayan bir sayfaya erişildiğinde, o sayfanın içeriği bir <strong>pager</strong> tarafından getirilir. Pager, "bu sayfanın gerçek verisi nerede saklanıyor?" sorusunun cevabını veren nesnedir. Farklı bellek türleri farklı pager kullanır.</p>
<div class="deflist">
<div><dt>vnode pager</dt><dd>mmap'lenmiş bir dosyayı destekler. Page fault olunca sayfayı diskteki dosyadan okur. Çalıştırılabilir dosyalar ve mmap'li veriler bununla gelir.</dd></div>
<div><dt>default pager</dt><dd>Anonim belleği (malloc, stack) destekler. Bellek baskısı altında bu sayfalar sıkıştırılır ya da (macOS'ta) swap'e yazılır.</dd></div>
<div><dt>device pager</dt><dd>Bir aygıtın fiziksel belleğini (örneğin GPU/framebuffer) adres uzayına eşler; içerik donanımdadır.</dd></div>
</div>
<div class="manpage src-apple"><div class="ref">apple · Kernel Programming Guide</div><p class="orig">A VM object can be backed by one or more memory objects, which are, in turn, managed by a pager.</p><p>VM object'in kendisi veriyi tutmaz; onu bir memory object üzerinden bir pager besler. Bu dolaylılık sayesinde aynı mekanizma hem dosya hem anonim bellek hem aygıt belleği için çalışır — fark yalnızca hangi pager'ın bağlı olduğudur.</p></div>

<h3>4. Page fault: vm_fault'un yolculuğu</h3>
<p>Bir thread henüz bellekte olmayan (ya da izinsiz) bir adrese dokunduğunda donanım bir page fault üretir ve kernel <code>vm_fault</code>'a girer. vm_fault önce adresi VM map'te bulur (hangi entry, hangi VM object, hangi offset), sonra o VM object'in sayfa zincirinde (shadow chain) sayfayı arar. Sayfa hiçbir yerde resident değilse, bağlı pager'dan page-in yapılır: içerik getirilir, bir fiziksel çerçeveye yerleştirilir ve pmap ile sanal adrese eşlenir. Bundan sonraki erişimler doğrudan donanımdan, fault olmadan gerçekleşir.</p>

<h3>5. Copy-on-write ve shadow object</h3>
<p>fork() ve bazı paylaşım senaryolarında Mach, copy-on-write'ı <strong>shadow object</strong> ile uygular. İki task bir VM object'i paylaşırken biri yazmaya kalkarsa, kernel yazan tarafın önüne boş bir shadow object koyar: değiştirilen sayfalar shadow'da birikir, değiştirilmeyenler alttaki orijinal object'ten okunmaya devam eder. Böylece fiziksel kopya yalnızca gerçekten yazılan sayfalar için yapılır — Linux'un do_wp_page mantığının Mach karşılığıdır, ama object zinciri üzerinden ifade edilir.</p>

<h3>6. 16KB page ve Linux karşılaştırması</h3>
<p>Apple Silicon'da temel page boyutu 16KB'dir (Intel'de ve çoğu Linux sisteminde 4KB). Daha büyük sayfa, daha az page table entry ve daha iyi TLB kapsama anlamına gelir ama iç parçalanmayı (internal fragmentation) artırır. Özetle fark: Linux'ta adres uzayı VMA listesi + tek bir donanım page table ile ifade edilir; Mach'ta aynı iş VM map + paylaşılabilir VM object + ayrık pmap ile, daha katmanlı ama daha esnek biçimde yapılır. Bu esneklik, dyld shared cache gibi geniş bellek paylaşımını ve pager tabanlı mmap'i doğal kılar.</p>`
  },
