    heading: "Derinlemesine: XNU neden hybrid kernel?",
    html: `<p class="lead">XNU, "X is Not Unix" — ama aslında derinden Unix'tir. İki büyük çekirdek geleneğini (Mach microkernel ve BSD) tek bir binary içinde birleştirir. Bu melez yapı, macOS ve iOS'un davranışının çoğunu açıklar: neden iki ayrı system call dünyası var, neden her process'in hem bir task hem bir proc kimliği var, neden sürücüler C++ ile yazılır. Bu bölüm Apple'ın açık kaynak XNU deposuna ve Jonathan Levin'in OS Internals serisine dayanır.</p>

<h3>1. Üç miras: Mach + BSD + IOKit</h3>
<p>XNU tek bir kernel binary olarak derlenir, ama kaynak ağacı net biçimde ayrı altsistemlere bölünür. Her biri farklı bir kökenden gelir ve farklı bir sorumluluk taşır.</p>
<div class="deflist">

<div><dt>bsd/ (BSD layer)</dt><dd>FreeBSD'den türetilmiştir. POSIX API'si, process (proc), signal, VFS (dosya sistemi), network stack ve BSD system call'ları burada yaşar. Mach'ın üstünde, tanıdık Unix yüzü.</dd></div>
<div><dt>iokit/ + libkern/</dt><dd>IOKit, sürücüler için C++ (Embedded C++) framework'üdür; libkern onun temel sınıflarını sağlar. Linux'un C sürücü modelinden farklı olarak nesne yönelimli.</dd></div>
<div><dt>pexpert/</dt><dd>Platform Expert: platforma özel kod — interrupt handling, atomics, boot. Donanım farklılıklarını soyutlar (Intel vs Apple Silicon).</dd></div>
</div>
<div class="manpage src-apple"><div class="ref">xnu · README</div><p class="orig">XNU is a hybrid kernel combining the Mach kernel developed at Carnegie Mellon University with components from FreeBSD and a C++ API for writing drivers called IOKit.</p><p>Apple'ın kendi tanımı: Mach çekirdeği + FreeBSD bileşenleri + IOKit. "Hybrid" kelimesi tam da bu birleşimi anlatır — saf microkernel de değil, saf monolitik de değil.</p></div>

<h3>2. "Hybrid kernel" tam olarak ne demek?</h3>
<p>Mach aslında bir <strong>microkernel</strong> olarak tasarlandı: fikir, servisleri (dosya sistemi, sürücüler, network) çekirdek dışında, ayrı user-space server'larda çalıştırmak ve aralarında Mach message ile konuşmaktı. Bu tasarım temiz ama yavaştır — her servis çağrısı bir IPC round-trip demektir.</p>
<p>XNU bu saflıktan vazgeçer: Mach ve BSD katmanları <strong>aynı address space</strong>'te, tek bir kernel içinde çalışır. Yani Mach'ın soyutlamaları (task, port, VM) korunur ama servisler çekirdeğin içindedir, IPC maliyeti ödenmez. İşte "hybrid" bu: microkernel'in <em>yapısı</em>, monolitik kernel'in <em>performansı</em>. Mach IPC hâlâ gerçektir ve her yerde kullanılır (XPC, launchd, sürücüler bunun üstüne kuruludur — bkz. Mach port ve XPC modülleri), ama çekirdek-içi olduğu için ucuzdur.</p>

<h3>3. İki ayrı system call dünyası</h3>
<p>XNU'nun melez doğasının en somut sonucu: tek bir syscall tablosu yoktur, iki ayrı çağrı mekanizması vardır. Çağrı numarasının <strong>işareti</strong> hangi dünyaya gidileceğini belirler.</p>
<div class="deflist">
<div><dt>BSD system call</dt><dd>Pozitif numara. Tanıdık POSIX çağrıları: <code>open</code>, <code>read</code>, <code>fork</code>, <code>mmap</code>. <code>bsd/kern/syscalls.master</code>'dan üretilir, Linux'taki gibi bir tabloya (sysent) girer.</dd></div>
<div><dt>Mach trap</dt><dd>Negatif numara. Mach'ın kendi çağrıları: <code>mach_msg</code>, <code>task_self_trap</code>, <code>mach_port_allocate</code>. Ayrı bir tabloya (mach_trap_table) gider. IPC ve düşük seviye primitive'ler buradan geçer.</dd></div>
</div>
<p>Bu yüzden bir process'in hem bir BSD <strong>proc</strong> yapısı (PID, signal, dosya) hem de bir Mach <strong>task</strong> yapısı (port namespace, VM map, thread'ler) vardır — ikisi birbirine bağlıdır ama ayrı kimliklerdir. BSD modülünde bu "dual identity" ayrıntılı işlenir.</p>

<h3>4. Darwin ve tek çekirdek, çok platform</h3>
<p>XNU, Apple'ın açık kaynak <strong>Darwin</strong> temelinin çekirdeğidir ve <code>apple-oss-distributions/xnu</code> deposunda yayımlanır (tamamen değil — bazı Apple Silicon parçaları kapalıdır). Aynı çekirdek macOS, iOS, iPadOS, tvOS, watchOS ve visionOS'ta çalışır; platform farkları büyük ölçüde pexpert ve derleme bayraklarıyla ele alınır. Bu, iOS güvenlik araştırmasının neden büyük ölçüde macOS üzerinde yapılabildiğini de açıklar — çekirdek ortaktır.</p>

<h3>5. Linux ile karşılaştırma</h3>
<p>Linux saf bir <strong>monolitik</strong> kernel'dir: tek bir tasarım, tek bir syscall tablosu, C sürücü modeli, process = tek kimlik. XNU ise iki geleneği birleştirir. Pratik farklar: XNU'da IPC birinci sınıf bir vatandaştır (Mach port), sürücüler C++'tır (IOKit), ve bir "process" iki katmanlı bir nesnedir (task + proc). Linux'ta bunların karşılığı sırasıyla pipe/socket/eventfd, C <code>file_operations</code>, ve tek bir <code>task_struct</code>'tır. İkisi de modern, hızlı çekirdeklerdir; farklı tasarım felsefelerinden aynı pratik sonuçlara ulaşırlar.</p>`
