  deepDive: {
    heading: "Derinlemesine: XPC nasıl güvenli IPC sağlar?",
    html: `<p class="lead">XPC, Mach port'larının ham gücünü alıp üstüne tip-güvenli bir API, launchd yönetimi ve bir güvenlik modeli koyar. macOS/iOS'ta uygulamaların ayrıcalıklı işi ayrı, kum havuzlu süreçlere devretmesinin standart yoludur — tarayıcıdan sistem servislerine kadar. Bu bölüm Apple belgelerine ve Mach port modülüne (Modül 2) dayanır.</p>

<h3>1. Mach port üstüne kurulu connection</h3>
<p>XPC, Modül 2'deki Mach port'larının üstünde oturur: bir XPC connection, altında bir Mach port çiftidir (bir yöne send right, dönüş için reply port). Geliştirici ham <code>mach_msg</code> yerine bir connection soyutlamasıyla çalışır.</p>
<div class="manpage src-apple"><div class="ref">xpc_connection · DESCRIPTION</div><p class="orig">Connections are the fundamental primitives for sending and receiving messages.</p><p>Bir connection, iki süreç arasındaki iki yönlü mesaj kanalıdır. Her connection'ın bir event handler'ı olmalıdır; gelen mesajlar ve bağlantı olayları (interruption, invalidation) bu bloğa düşer.</p></div>

<h3>2. xpc_object: tip-güvenli serialization</h3>
<p>Mesajlar düz byte dizisi değil, tipli <strong>xpc_object</strong>'lerdir. En yaygını bir dictionary'dir; içine string, integer, data, hatta bir file descriptor veya başka bir connection endpoint konabilir. libxpc bunları alıcı tarafta aynı tiplerle yeniden kurar — Binder'ın Parcel'ına benzer ama tiplidir.</p>
<div class="deflist">
<div><dt>xpc_dictionary</dt><dd>Anahtar-değer mesaj gövdesi; en sık kullanılan mesaj tipi.</dd></div>
<div><dt>xpc_array</dt><dd>Sıralı değer listesi.</dd></div>
<div><dt>xpc_data</dt><dd>Ham byte bloğu (büyük veri).</dd></div>
<div><dt>xpc_fd / endpoint</dt><dd>Bir file descriptor veya connection endpoint'i başka sürece aktarır — Mach right transfer'in XPC karşılığı.</dd></div>
</div>
<div class="manpage src-apple"><div class="ref">xpc_connection · EVENT HANDLERS</div><p class="orig">If the event handler block delivers an object of type XPC_TYPE_DICTIONARY, the event is a message that needs processing.</p><p>Servis, event handler'ında gelen objenin tipine bakar: bir dictionary ise işlenecek bir mesajdır; bir error objesi ise bağlantı koptu veya geçersiz kılındı demektir.</p></div>

<h3>3. launchd ile on-demand yaşam döngüsü</h3>
<p>XPC service'ler genelde elle başlatılmaz. Bir service, bir bundle içinde tanımlanır ve launchd'a kayıtlıdır; ilk mesaj geldiğinde launchd onu <strong>on-demand</strong> başlatır, boştaysa sonlandırır. Geliştirici süreç yönetimiyle uğraşmaz — Modül 8'deki launchd mantığının XPC'ye yansımasıdır.</p>
<div class="manpage src-apple"><div class="ref">xpc_connection · LAUNCH-ON-DEMAND</div><p class="orig">if the remote end is not yet running, the act of sending a message will cause it to launch on-demand.</p><p>Mesaj göndermek servisi gerektiğinde ayağa kaldırır; bu, kaynakları yalnızca iş oldukça kullanmayı sağlar ve servisin çökmesi durumunda launchd'ın yeniden başlatmasına izin verir.</p></div>

<h3>4. Privilege separation: XPC'nin asıl tasarım amacı</h3>
<p>XPC'nin varlık nedeni güvenliktir. Riskli veya ayrıcalıklı iş (ayrıştırma, ağ, ayrıcalık gerektiren bir işlem) ana uygulamadan koparılıp ayrı bir XPC service'e konur. Bu service kendi sandbox'ında, en az ayrıcalıkla çalışır; çökerse veya ele geçirilirse ana uygulama ve sistem korunmuş olur. Bu "privilege separation" deseni, modern macOS güvenlik mimarisinin temelidir.</p>

<h3>5. Güvenlik: caller'ı audit token ile doğrulamak</h3>
<p>Bir XPC service, bir isteğin kimden geldiğini bilmelidir. Geçmişte PID kullanmak yaygındı ama PID yeniden kullanılabilir (PID reuse) — bir saldırgan araya girebilir. Doğru yöntem, çekirdeğin ürettiği ve taklit edilemeyen <strong>audit token</strong>'dır (veya yeni peer requirement API'leri).</p>
<div class="manpage src-apple"><div class="ref">xpc_connection · CREDENTIALS</div><p class="orig">Modern XPC applications should use peer requirement APIs for secure validation of connecting processes.</p><p>Bağlanan süreci güvenilir biçimde doğrulamak için peer requirement API'leri önerilir; bu, caller'ın code signing kimliğini denetler. Hatalı caller doğrulaması, XPC service'lerinin tekrar eden bir saldırı yüzeyidir (kavramsal — bkz. sandbox kaçışı modülü).</p></div>

<h3>6. Binder ile karşılaştırma</h3>
<p>XPC ve Android Binder aynı problemi çözer: süreçler arası tip-güvenli, güvenli RPC. İkisi de çekirdek bir IPC ilkelinin (Mach port vs binder driver) üstüne kurulur, mesajları serialize eder (xpc_object vs Parcel), bir isim servisiyle (launchd vs Service Manager) bulunur ve caller kimliğini çekirdekten alır (audit token vs UID/PID). Fark: XPC servisleri launchd ile on-demand yönetilir, Binder ise daha düşük seviyeli bir transaction mekanizmasıdır.</p>`
  },
