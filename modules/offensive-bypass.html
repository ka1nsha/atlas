/* bu modüle özel: ROP yığını + gadget kataloğu */
.ropwrap { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .ropwrap { grid-template-columns: 1fr; } }
.stack { display: grid; gap: 4px; align-content: start; }
.stack .sl { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.slot { border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); padding: 7px 9px; display: grid; gap: 1px; min-width: 0; }
.slot .addr { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.slot .lbl { font-family: var(--f-mono); font-size: 12px; font-weight: 600; overflow-wrap: anywhere; }
.slot.cur { border-color: var(--track); background: var(--track-soft); }
.slot.cur .lbl { color: var(--track); }
.slot.done { opacity: .5; }
.slot.ret .lbl { color: var(--muted); font-weight: 400; }
.gcat { display: grid; gap: 5px; align-content: start; }
.gcat .sl { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.gad { border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; display: grid; gap: 1px; min-width: 0; background: var(--surface); }
.gad .ga { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.gad .gi { font-family: var(--f-mono); font-size: 12px; }
.gad.used { border-color: var(--track); }
.gad.used .ga { color: var(--track); }
.wall { border: 1.5px dashed var(--bad); background: var(--bad-soft); border-radius: var(--r); padding: 9px 11px; font-size: 13px; color: var(--bad); display: flex; gap: 8px; align-items: center; }
.achieve { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; font-size: 13.5px; }
.achieve b { font-family: var(--f-mono); font-size: 11px; color: var(--muted); font-weight: 700; display: block; margin-bottom: 2px; }
</style>

  deepDive: {
    heading: 'Derinlemesine: neden tek bir koruma yetmez',
    html:
      '<p class="lead">Bir mitigation bir saldırı sınıfını kapatır, saldırganı yok etmez. Kapatılan yeteneğin yerine aynı sonucu veren, hâlâ açık başka bir yetenek aranır. Bu bölüm o devinimi savunmacı gözüyle çözer: her aşım kavramını hangi modern korumanın hedeflediğini gösterir. Amaç saldırmak değil, <strong>defense-in-depth</strong>\'in neden zorunlu olduğunu görmek. Kaynaklar aşağıda; silahlandırılmış hiçbir ayrıntı yoktur.</p>' +

      '<h3>1. DEP/NX kod enjeksiyonunu öldürür</h3>' +
      '<p>İlk kuşak saldırı basitti: tampona (buffer) makine kodu yaz, akışı oraya çevir. <strong>DEP</strong> (Data Execution Prevention) / <strong>NX</strong> (No-eXecute) biti buna son verir: bir bellek sayfası ya yazılabilir ya çalıştırılabilir olur, ikisi birden değil (W^X). Veri taşıyan sayfalar çalıştırılamaz işaretlenir; CPU oradaki baytları çalıştırmayı reddeder.</p>' +
      '<div class="manpage src-docs"><div class="ref">Wikipedia · Data Execution Prevention</div><p class="orig">marking certain parts of memory as being intended to hold only data</p><p>Bellek sayfaları yalnızca veri tutacak şekilde işaretlenir ve bu işaret, enjekte edilen kabuk kodunun (shellcode) çalıştırılmasını donanım düzeyinde engeller. Böylece "veriyi koda çevirme" yolu kapanır.</p></div>' +

      '<h3>2. Code reuse: ROP/JOP neden DEP\'i aşar</h3>' +
      '<p>DEP yeni kod yazmayı engeller ama <em>var olan</em> kodu engellemez. Program ve libc zaten çalıştırılabilir işaretli, imzalı kodla doludur. Saldırgan kendi kodunu enjekte etmek yerine bu koddan küçük parçaları (gadget) yeni bir sırayla zincirler. <strong>ROP</strong> (return-oriented programming) <code>ret</code> ile biten parçaları, <strong>JOP</strong> (jump-oriented programming) dolaylı dallanmaları (indirect branch) kullanır.</p>' +
      '<div class="manpage src-docs"><div class="ref">Wikipedia · Return-oriented programming</div><p class="orig">Return-oriented programming (ROP) is a computer security exploit technique that allows an attacker to execute code</p><p>ROP, saldırganın korumalar yürürlükteyken bile kod çalıştırmasına izin veren bir sömürü tekniğidir. Kritik nokta: çalıştırılan kod <em>zaten çalıştırılabilir işaretli</em> olduğundan DEP devreye girmez.</p></div>' +
      '<div class="manpage src-docs"><div class="ref">Wikipedia · Return-oriented programming</div><p class="orig">rather uses instruction sequences already present in executable memory</p><p>Teknik, bellekte hâlihazırda bulunan komut dizilerini kullanır. Hiçbir yeni kod yazılmadığı için W^X ihlali olmaz; DEP\'in kapattığı yol, var olan kodu yeniden kullanarak (code reuse) atlanır.</p></div>' +

      '<h3>3. ASLR ve bilgi sızıntısı (info leak)</h3>' +
      '<p>ROP\'un işe yaraması için gadget\'ların <em>adresini</em> bilmek gerekir. <strong>ASLR</strong> (Address Space Layout Randomization) kod ve kütüphaneleri her çalıştırmada rastgele adreslere koyarak bunu zorlaştırır. Ama randomizasyon tek başına yetmez: saldırgan bir <strong>info leak</strong> (bir adresi dışarı sızdıran ikinci bir zafiyet) bulursa tüm haritayı yeniden hesaplar.</p>' +
      '<div class="manpage src-docs"><div class="ref">Wikipedia · Return-oriented programming</div><p class="orig">Although widely deployed by modern operating systems, ASLR is vulnerable to information leakage attacks</p><p>ASLR modern işletim sistemlerinde yaygın olsa da bilgi sızıntısı saldırılarına açıktır. Dersi nettir: bir rastgelelik katmanı, onu açığa çıkaran tek bir sızıntıyla çökebilir — bu yüzden ASLR tek savunma değil, bir katman olarak düşünülür.</p></div>' +

      '<h3>4. Zayıf halka: saldırı sınıfı → onu kapatan koruma</h3>' +
      '<p>Her aşım kavramı belirli bir korumanın bıraktığı boşluğu hedefler. Savunmacının işi bu boşlukları üst üste bindirmektir; bir katman delinse bile diğeri saldırıyı durdurur. Aşağıdaki eşleme, modern sistemlerin neden <em>birçok</em> koruma taşıdığını özetler.</p>' +
      '<dl class="deflist">' +
      '<dt>Code injection</dt><dd>DEP / NX / W^X — veri sayfalarını çalıştırılamaz yapar.</dd>' +
      '<dt>ROP (return-oriented)</dt><dd>Shadow stack (ör. Intel CET) ve <strong>PAC</strong> (Pointer Authentication) — dönüş adreslerini (return address) doğrular/imzalar.</dd>' +
      '<dt>JOP / dolaylı çağrı ele geçirme</dt><dd><strong>CFI</strong> (Control Flow Integrity) ve BTI (Branch Target Identification) — dolaylı dalların geçerli hedeflere gitmesini zorlar.</dd>' +
      '<dt>Sabit adres varsayımı</dt><dd>ASLR / KASLR — düzeni rastgeleleştirir; info leak\'e karşı pointer tagging ile desteklenir.</dd>' +
      '<dt>UAF / heap yeniden kullanımı</dt><dd>Type isolation (ör. kalloc_type), guard page, <strong>MTE</strong> (Memory Tagging) — bellek yeniden kullanımını tipe/etikete bağlar.</dd>' +
      '</dl>' +

      '<h3>5. Savunma dersi: korumalar neyi hedefler</h3>' +
      '<p>ROP\'un gücü, akışı meşru görünen adımlarla ele geçirmesidir. Modern korumalar tam da bu akış bütünlüğünü hedef alır: <strong>shadow stack</strong> dönüş adresini ikinci, korunan bir kopyayla karşılaştırır; <strong>PAC</strong> işaretçiye kriptografik imza ekler; <strong>CFI</strong> dolaylı çağrıların yalnızca derleme zamanında bilinen geçerli hedeflere gitmesine izin verir.</p>' +
      '<div class="manpage src-docs"><div class="ref">Clang/LLVM · Control Flow Integrity</div><p class="orig">designed to abort the program upon detecting certain forms of undefined behavior</p><p>CFI, belirli türde tanımsız davranışları (undefined behavior) saptadığında programı sonlandıracak şekilde tasarlanmıştır. Yani bir gadget zinciri geçersiz bir hedefe dallanmaya çalıştığı anda program güvenli biçimde çöker.</p></div>' +
      '<div class="manpage src-docs"><div class="ref">Clang/LLVM · Control Flow Integrity</div><p class="orig">that can potentially allow attackers to subvert the program’s control flow</p><p>Korunan senaryo, saldırganın programın kontrol akışını (control flow) ele geçirebildiği durumlardır — ROP/JOP tam olarak budur. Bu yüzden forward-edge (dolaylı çağrı) ve backward-edge (dönüş) korumaları birlikte konuşlandırılır: biri diğerinin boşluğunu kapatır.</p></div>'
  },
  underHood: {
    heading: 'Kaputun altında: her aşmanın ortak mantığı',
