<h3>1. Heartbleed — eksik bounds check (CVE-2014-0160, 2014)</h3>
<p>OpenSSL'in TLS <code>heartbeat</code> uzantısı, karşı taraftan gelen "bu kadar bayt geri gönder" isteğindeki uzunluk alanını, gerçekte gelen veri boyutuna karşı doğrulamıyordu. Saldırgan küçük bir paketle büyük bir uzunluk belirtince, sunucu kendi process belleğinden o kadar baytı yanıtta geri gönderiyordu — bu bir <strong>out-of-bounds read</strong> (buffer over-read) idi. Sonuç: özel anahtarlar, oturum çerezleri, parolalar sızabiliyordu.</p>
<div class="manpage src-docs"><div class="ref">NVD · CVE-2014-0160</div><p class="orig">… Heartbeat Extension packets, which allows remote attackers to obtain sensitive information … that trigger a buffer over-read …</p><p>Resmi kayıt, zafiyetin özünü tek cümlede verir: Heartbeat paketleri bir <strong>buffer over-read</strong> tetikliyor ve uzaktaki saldırganın hassas bilgiyi okumasına izin veriyor. Dikkat: bu bir yazma (write) değil, yalnızca <strong>okuma</strong> hatasıdır — kod çalıştırmaz, ama sır sızdırır.</p></div>
<p><strong>Ders.</strong> Tek bir eksik uzunluk doğrulaması dünya çapında bir kriz yarattı. Bir okuma primitifinin bile (write olmadan) ne kadar yıkıcı olabileceğini gösterdi; bu, bilgi sızıntısının (information disclosure) neden ciddiye alınması gerektiğinin ders kitabı örneğidir. Savunma: her uzunluk/sınır alanının kaynağa karşı doğrulanması, fuzzing ile sınır testleri ve bellek-güvenli ayrıştırma.</p>

<h3>2. Dirty COW — race condition (CVE-2016-5195, 2016)</h3>
<p>Linux çekirdeğinin copy-on-write (CoW) mekanizmasında bir <strong>race condition</strong> vardı: iki işlemin zamanlaması belirli biçimde çakıştırıldığında, salt-okunur (read-only) olması gereken bir bellek eşlemesine (memory mapping) yazılabiliyordu. Bu, sıradan bir kullanıcının çekirdek yardımıyla yetki yükseltmesine (privilege escalation) olanak verdi.</p>
<div class="manpage src-docs"><div class="ref">NVD · CVE-2016-5195</div><p class="orig">Race condition in mm/gup.c in the Linux kernel 2.x through 4.x before 4.8.3 allows local users to gain privileges by …</p><p>Kayıt bug sınıfını açıkça adlandırır: <code>mm/gup.c</code> içinde bir <strong>race condition</strong>. Zafiyet, copy-on-write'ın yanlış ele alınmasını kullanarak read-only bir eşlemeye yazmaya ve böylece yetki kazanmaya izin veriyordu. Yaklaşık on bir yıl boyunca çekirdekte sessizce durdu.</p></div>
<p><strong>Ders.</strong> Bellek bozulması (memory corruption) olmadan, yalnızca <strong>zamanlama</strong> ile de güvenlik sınırı aşılabilir. Yarış koşulları gözle görülmesi en zor bug sınıflarından biridir çünkü kod tek başına okunduğunda "doğru" görünür; hata yalnızca eşzamanlılıkta ortaya çıkar. Savunma: paylaşılan duruma erişimde doğru kilitleme (locking), TOCTOU pencerelerini kapatmak ve eşzamanlılık testleri.</p>

<h3>3. Stagefright — parser bir saldırı yüzeyidir (CVE-2015-1538, 2015)</h3>
<p>Android'in <code>libstagefright</code> medya kütüphanesinde, bir MP4 dosyasındaki tablo boyutlarını işleyen fonksiyonda bir <strong>integer overflow</strong> vardı. Hazırlanmış bir medya dosyası (örneğin bir MMS ile gelen) ayrıştırılırken çarpma taşması, yetersiz boyutlu bir tampon ayrılmasına ve ardından bellek bozulmasına yol açıyordu. En çarpıcı yanı: kurbanın dosyayı açması bile gerekmeyebiliyordu — ayrıştırma otomatik tetikleniyordu.</p>
<div class="manpage src-docs"><div class="ref">NVD · CVE-2015-1538</div><p class="orig">Integer overflow in the SampleTable::setSampleToChunkParams function in SampleTable.cpp in libstagefright …</p><p>Kayıt hem bug sınıfını (<strong>integer overflow</strong>) hem de tam konumu (<code>SampleTable.cpp</code>) verir. Hazırlanmış MP4 "atom"ları, kontrol edilmeyen bir çarpma yoluyla kod çalıştırmaya giden yolu açıyordu. Ders açısından önemli olan: hata, güvenilmeyen girdiyi ayrıştıran koddaydı.</p></div>
<p><strong>Ders.</strong> Güvenilmeyen (untrusted) girdiyi ayrıştıran her <strong>parser</strong> birinci sınıf bir saldırı yüzeyidir (attack surface) — özellikle medya, görüntü ve font ayrıştırıcıları gibi karmaşık, C/C++ ile yazılmış bileşenler. Stagefright'tan sonra Android, medya ayrıştırmayı ayrı bir süreçte izole etti (sandboxing) ve aylık güvenlik güncellemesi sürecini başlattı. Savunma: parser izolasyonu, bellek-güvenli diller ve integer overflow denetimleri.</p>

<h3>4. checkm8 — yamalanamaz güven kökü (2019)</h3>
<p>checkm8, birçok iPhone neslinin (A5–A11) <strong>Boot ROM</strong>'unda bulunan bir use-after-free sınıfı zafiyettir. Boot ROM, cihaz açılışındaki ilk ve en güvenilir kod katmanıdır — güven kökü (root of trust). Önemi tekniğinde değil, <strong>konumundadır</strong>: Boot ROM silikona yazılıdır ve salt-okunurdur, dolayısıyla bir yazılım yamasıyla düzeltilemez. Bu nedenle etkilenen nesil cihazlarda kalıcıdır.</p>
<div class="manpage src-docs"><div class="ref">kavramsal · kamuya açık analiz</div><p class="orig">unpatchable: a Boot ROM is mask-programmed and read-only, so a software update cannot change it.</p><p>Bu kutu resmi bir CVE alıntısı değil, vakanın mimari dersinin özetidir. Çekirdeği ne kadar sertleştirirseniz sertleştirin, güven zincirinin <strong>en altı</strong> değiştirilemez bir bug içeriyorsa, üstteki tüm korumalar o temelin üzerinde durur. Sonraki nesiller bu dersle güven kökünü güncellenebilir katmanlara taşıdı.</p></div>
<p><strong>Ders.</strong> Güvenlik kararlarının <strong>değiştirilebilir</strong> (updatable) katmanlarda alınması gerekir; değiştirilemez donanıma gömülen bir hata kalıcı bir risk olur. Bu, Apple'ın sonradan SPTM/TXM gibi bileşenleri ayrı, güncellenebilir güven alanlarına taşımasının arkasındaki mantığın bir parçasıdır (bkz. macOS güvenlik modülleri).</p>
