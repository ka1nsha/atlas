/* bu modüle özel: imza doğrulama akışı */
.vchain { display: grid; gap: 6px; margin-top: 2px; }
.vstep { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; border: 1.5px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 8px 10px; min-width: 0; opacity: .5; transition: opacity .2s; }
.vstep.done { opacity: 1; border-color: var(--ok); }
.vstep.cur { opacity: 1; border-color: var(--track); background: var(--track-soft); }
.vstep.fail { opacity: 1; border-color: var(--bad); background: var(--bad-soft); }
.vstep .vi { font-family: var(--f-mono); font-weight: 700; text-align: center; }
.vstep.done .vi { color: var(--ok); } .vstep.cur .vi { color: var(--track); } .vstep.fail .vi { color: var(--bad); }
.vstep .vt { min-width: 0; } .vstep .vt b { font-family: var(--f-display); font-size: 14px; } .vstep .vt span { display: block; font-size: 12px; color: var(--muted); }
.vstep .vs { font-family: var(--f-mono); font-size: 11px; font-weight: 700; }
.pagegrid { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
.ph2 { width: 30px; height: 22px; border-radius: 4px; border: 1px solid var(--ok); background: var(--ok-soft); display: grid; place-items: center; font-family: var(--f-mono); font-size: 9px; color: var(--ok); }
.ph2.bad { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); font-weight: 700; }
.verdict2 { margin-top: 12px; border-radius: var(--r); padding: 10px 12px; font-family: var(--f-mono); font-size: 13px; font-weight: 700; display: flex; gap: 8px; align-items: center; }
.verdict2.ok { background: var(--ok-soft); color: var(--ok); border: 1px solid var(--ok); }
.verdict2.deny { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad); }
</style>

      'Saldırgan gözüyle bakınca sorun nettir: imzasız veya değiştirilmiş kod çalıştırmak istiyorsan, bu sayfa-sayfa doğrulamayı aşman gerekir. İşte bu yüzden bir "imza baypası" bu kadar değerlidir ve bu kadar zordur.'
    ],
    ideas: [

  lab: {
    intro: 'Bir ikili imzalandığında, çekirdek onu çalıştırmadan önce bir dizi kontrolden geçirir. Sağda doğrulama zincirini izle: her adım geçerse yeşil, son adımda karar verilir. Son iki adımda bir saldırganın bir baytı değiştirdiği senaryoyu göreceksin.',

    ],
    steps: [
      { pc: [3, 4], title: 'İkili + gömülü imza', cur: 'cd', done: [], fail: null, verdict: null, pages: 'ok',
        text: 'İmzalanan ikili, bir <strong>kod dizini (code directory)</strong> taşır: her 4 KB\'lik bellek sayfasının (page) kriptografik hash\'inden oluşan bir tablo. Buna ek olarak imzayı atan kimliğin sertifikaları ve entitlements gömülüdür. Bu blok <code>LC_CODE_SIGNATURE</code> ile Mach-O\'ya eklenir.' },
      { pc: [8], title: 'Sertifika zinciri doğrulanır', cur: 'cert', done: ['cd'], fail: null, verdict: null, pages: 'ok',
        text: 'Çekirdek (macOS/iOS\'ta AMFI) önce <strong>sertifika zincirini (certificate chain)</strong> doğrular: imza → geliştirici sertifikası → güvenilen kök (root). Zincir bilinen bir köke bağlanmıyorsa imza en baştan geçersizdir. Android\'de de APK, imzalayan anahtarın sürekliliğiyle doğrulanır (v2/v3 şeması).' },
      { pc: [9, 10], title: 'Her sayfa hash\'lenir', cur: 'page', done: ['cd', 'cert'], fail: null, verdict: null, pages: 'ok',
        text: 'Asıl güç burada: çekirdek her kod sayfasını — iOS\'ta belleğe alınırken, sayfa sayfa (page-in) — yeniden hash\'ler ve kod dizinindeki değerle karşılaştırır. Hepsi tutarsa bütünlük kanıtlanmıştır. Bu, "imzayı bir kez kontrol et" değil, "çalışırken sürekli denetle" demektir.' },
      { pc: [5], title: 'Entitlements okunur', cur: 'ent', done: ['cd', 'cert', 'page'], fail: null, verdict: null, pages: 'ok',
        text: '<strong>Entitlements</strong> (yetkiler), imzaya gömülü ve bu yüzden kurcalanamayan bir izin listesidir: sürecin JIT belleği oluşturup oluşturamayacağı, kameraya erişip erişemeyeceği, hangi sandbox istisnalarına sahip olduğu. Yetki imzanın parçası olduğundan, yetkiyi değiştirmek imzayı bozar.',
        verdict: { cls: 'ok', txt: '✓ İmza geçerli → kod çalışır' } },
      { pc: [10], title: 'Saldırgan bir baytı değiştirir', cur: 'page', done: ['cd', 'cert'], fail: 'page', verdict: null, pages: 'bad',
        text: 'Şimdi saldırgan senaryosu: saldırgan ikilinin bir kod sayfasını değiştiriyor (örneğin bir kontrolü atlamak için). O sayfanın yeniden hesaplanan hash\'i, kod dizinindeki değerle artık <strong>tutmaz</strong>. Çekirdek bunu çalıştırmadan — veya o sayfaya ilk erişimde — fark eder.' },
      { pc: [10], title: 'Çekirdek reddeder', cur: 'dec', done: ['cd', 'cert'], fail: 'page', verdict: 'deny', pages: 'bad',
        text: 'Hash uyuşmazlığı → çekirdek süreci öldürür (<code>Code Signature Invalid</code>, SIGKILL). Bir baypasın başarması gereken tam olarak budur: imzasız veya değiştirilmiş bir sayfayı çalıştırılabilir kıldırmak. Neden zor? Çünkü her sayfa denetlenir, kontrolü çekirdek yapar ve dinamik kod (JIT) için bile özel bir entitlement gerekir. Tek bir mantık hatası değil, bu zincirin tamamını kırmak gerekir.',
        verdict: { cls: 'deny', txt: '✗ Hash uyuşmazlığı → süreç öldürüldü' } }
    ],
    render: function (s, stateEl, u) {
      var steps = VSTEPS.map(function (v) {
        var cls = 'vstep';
        var mark = '•';
        var st = '';
        if (s.fail === v.id) { cls += ' fail'; mark = '✗'; st = 'RED'; }
        else if (s.cur === v.id) { cls += ' cur'; mark = '▸'; st = 'kontrol'; }
        else if (s.done.indexOf(v.id) >= 0) { cls += ' done'; mark = '✓'; st = 'geçti'; }
        else if (v.id === 'dec' && s.verdict) { cls += (s.verdict.cls === 'ok' ? ' done' : ' fail'); mark = s.verdict.cls === 'ok' ? '✓' : '✗'; }
        return '<div class="' + cls + '"><span class="vi">' + mark + '</span><span class="vt"><b>' + u.esc(v.t) + '</b><span>' + u.esc(v.e) + '</span></span><span class="vs">' + st + '</span></div>';
      }).join('');
      var pages = '';
      for (var i = 0; i < 8; i++) {
        var bad = s.pages === 'bad' && i === 3;
        pages += '<div class="ph2' + (bad ? ' bad' : '') + '">' + (bad ? '≠' : '✓') + '</div>';
      }
      stateEl.innerHTML =
        '<p class="lab-label">Doğrulama zinciri</p><div class="vchain">' + steps + '</div>' +
        '<p class="lab-label" style="margin-top:14px">Kod sayfaları (hash kontrolü)</p><div class="pagegrid">' + pages + '</div>' +
        (s.verdict ? '<div class="verdict2 ' + s.verdict.cls + '"><span>' + u.esc(s.verdict.txt) + '</span></div>' : '');
    }
  },
  underHood: {
    heading: 'Kaputun altında: imzanın parçaları',
    html: '<p class="prose">Kod imzası tek bir şey değil, bir arada çalışan birkaç bileşendir. Saldırgan açısından her birinin ayrı bir önemi vardır:</p>' +
      '<div class="tbl-wrap"><table class="bugs"><thead><tr><th>Bileşen</th><th>Görevi</th><th>Saldırgan için önemi</th></tr></thead><tbody>' +
      '<tr><td><b>Code directory</b></td><td>Her sayfanın hash\'ini tutar</td><td>Değiştirilen her sayfayı ele verir; aşmak için hash\'i de tutarlı kılmak gerekir</td></tr>' +
      '<tr><td><b>CMS imza + sertifikalar</b></td><td>Kimin imzaladığını kanıtlar</td><td>Kendi sertifikan güvenilen köke bağlı değilse baştan reddedilir</td></tr>' +
      '<tr><td><b>Entitlements</b></td><td>Sürecin yetkilerini belirler</td><td>İmzanın parçası; yetki eklemek imzayı bozar (ör. JIT için <code>dynamic-codesigning</code>)</td></tr>' +
      '<tr><td><b>AMFI (çekirdek)</b></td><td>Doğrulamayı zorlar (macOS/iOS)</td><td>Kontrolü kullanıcı alanı değil çekirdek yapar; aşmak çekirdek erişimi gerektirir</td></tr>' +
      '<tr><td><b>Trust cache</b></td><td>Platform ikililerinin önceden onaylı hash listesi</td><td>Sistem ikililerini değiştirmeyi ayrıca zorlaştırır</td></tr>' +
      '</tbody></table></div>' +
      '<p class="prose" style="margin-top:14px">Özetle bir imza baypası şu üçünden en az birini gerektirir: güvenilen bir anahtarla imzalatmak (ör. çalınmış sertifika), doğrulama mantığında bir kusur bulmak, ya da doğrulamayı yapan çekirdeği zaten ele geçirmiş olmak. Bu yüzden kod imzalama tek başına değil; sandbox, AMFI ve donanım güven kökü (hardware root of trust) ile <em>katmanlı</em> çalışır.</p>'
  },
  deepDive: {
    heading: 'Derinlemesine: imza neyi garanti eder, neyi etmez',
    html: '<p class="lead">Kod imzalama güçlüdür, ama her şeyi çözmez. Saldırgan gözüyle asıl soru şudur: imza <em>tam olarak</em> neyi kanıtlar, neyi kanıtlamaz? Bu ayrımı anlamak, bir baypasın neyi hedeflemek zorunda olduğunu ve neden tek bir katmanın yetmediğini (defense in depth) açıklar. Bu bölüm Apple\'ın platform güvenlik belgelerine ve <code>codesign</code> davranışına dayanır; somut baypas tekniği değil, güven modelinin sınırlarını anlatır.</p>' +

      '<h3>1. İmzanın iki garantisi: köken ve bütünlük</h3>' +
      '<p>Bir code signature iki ayrı soruyu yanıtlar. <strong>Köken (provenance):</strong> bunu kim üretti? Yanıt sertifika zincirinden gelir — imza, bir geliştirici sertifikasına, o da güvenilen bir köke (Apple Root CA) bağlanır. <strong>Bütünlük (integrity):</strong> üretildiğinden beri değişti mi? Yanıt sayfa hash\'lerinden gelir. Gatekeeper, indirilen yazılımı çalıştırmadan önce tam olarak bu ikisini denetler.</p>' +
      '<div class="manpage src-apple"><div class="ref">Platform Security · Gatekeeper</div><p class="orig">Gatekeeper … verifies that the software is from an identified developer and hasn\'t been altered.</p><p>Gatekeeper iki şeyi birden doğrular: yazılımın <em>tanımlı bir geliştiriciden</em> (identified developer) geldiğini ve <em>değiştirilmediğini</em> (hasn\'t been altered). Biri bile sağlanmazsa yazılım engellenir. Köken sertifika zincirinden, bütünlük hash\'ten gelir.</p></div>' +

      '<h3>2. Notarization: "kötü amaçlı içerik bilinmiyor" ≠ "güvenli"</h3>' +
      '<p>macOS\'ta imzaya ek bir katman daha vardır: <strong>notarization</strong>. Geliştirici yazılımı Apple\'a gönderir, Apple bilinen zararlı içerik için tarar ve bir onay (ticket) döner. Bu önemli bir ayrımdır: notarization yazılımın <em>bilinen</em> zararlıdan arınmış olduğunu söyler — yazılımın güvenli ya da hatasız olduğunu değil. Saldırgan açısından bu, "imzalı ve notarize" bir ikilinin bile henüz keşfedilmemiş bir açık ya da kötü niyetli ama "temiz görünen" mantık taşıyabileceği anlamına gelir.</p>' +
      '<div class="manpage src-apple"><div class="ref">Platform Security · Notarization</div><p class="orig">The … notarization pipeline are designed to ensure that apps contain no known malware.</p><p>Notarization hattı, uygulamaların <em>bilinen</em> zararlı yazılım (no known malware) içermediğini güvence altına almak için tasarlanmıştır. Anahtar kelime "known" (bilinen): bu bir kötü amaçlılık taraması, bütünsel bir güvenlik kanıtı değil. İmza kökeni ve bütünlüğü kanıtlar; notarization yalnızca bilinen zararlıyı eler.</p></div>' +

      '<h3>3. İmzanın kör noktası: runtime bellek</h3>' +
      '<p>İşte saldırgan için en kritik nokta. Kod imzalama <em>diskteki</em> ya da <em>belleğe alınan</em> kod sayfalarının bütünlüğünü doğrular. Ama bir süreç çalışırken belleğinde bir buffer overflow ya da use-after-free yoluyla veri/işaretçi bozulması olursa — imza bundan habersizdir. İmza, kodun değişmediğini kanıtlar; <strong>kontrol akışının kaçırılmadığını kanıtlamaz</strong>. Bu yüzden imza tek başına yetmez: bir bellek güvenliği hatası, imzalı kodun içindeki mevcut parçaları (gadget) saldırganın istediği sırada çalıştırabilir (ROP/JOP), tek bir baytı bile diske yazmadan.</p>' +
      '<div class="deflist">' +
      '<div><dt>imza doğrular</dt><dd>Kod sayfalarının diskten belleğe değişmeden geldiğini; imzalayanın kimliğini. Statik bütünlük.</dd></div>' +
      '<div><dt>imza doğrulamaz</dt><dd>Çalışma anında bellekteki veri/işaretçi bozulmasını; kontrol akışının kaçırılıp kaçırılmadığını. Dinamik bütünlük ayrı korumaların işi.</dd></div>' +
      '<div><dt>sonuç</dt><dd>Bir bellek bozulması açığı, imzalı kodu bile saldırganın amacı doğrultusunda yeniden yönlendirebilir. İmza gerekli ama yeterli değildir.</dd></div>' +
      '</div>' +

      '<h3>4. Tarihsel zayıflık sınıfları (kavramsal)</h3>' +
      '<p>İmza mekanizmasının kendisi de kusursuz değildir. Kamuya açık araştırmalarda tekrarlayan <em>sınıflar</em> şunlardır — somut istismar adımı değil, savunmacının haritası olarak:</p>' +
      '<div class="deflist">' +
      '<div><dt>doğrulama mantığı hatası</dt><dd>İmzayı ayrıştıran kodun bir durumu yanlış ele alması (ör. çok mimarili/çok imzalı dosyalarda hangi imzanın geçerli sayıldığı karışıklığı). Düzeltme: ayrıştırıcıyı sadeleştirmek, tek doğru yol.</dd></div>' +
      '<div><dt>TOCTOU</dt><dd>Time-of-check / time-of-use: doğrulanan ile çalıştırılan içeriğin arasında bir pencere bırakmak. Düzeltme: doğrulamayı belleğe alma (page-in) anına bağlamak — XNU\'nun sayfa sayfa denetiminin amacı tam da budur.</dd></div>' +
      '<div><dt>entitlement kötüye kullanımı</dt><dd>Güçlü bir entitlement (ör. JIT için <code>dynamic-codesigning</code>) taşıyan meşru bir sürecin, saldırgan tarafından kaldıraç olarak kullanılması. Düzeltme: en az ayrıcalık — yalnızca mutlaka gereken entitlement.</dd></div>' +
      '</div>' +

      '<h3>5. Savunma: Hardened Runtime ve library validation</h3>' +
      '<p>İmzanın "runtime bellek" kör noktasını kapatmak için macOS, <strong>Hardened Runtime</strong>\'ı ekler. Bu, imzalı bir sürece ek çalışma-anı kısıtlamaları getirir: başka kodun enjekte edilmesini, imzalı kodun dinamik olarak değiştirilmesini ve süreç bellek alanının kurcalanmasını engeller. Yanına <strong>library validation</strong> gelir: bir süreç yalnızca aynı Team ID ile imzalı ya da Apple imzalı kütüphaneleri yükleyebilir — böylece "meşru uygulamaya yabancı dylib yükletme" yolu kapanır.</p>' +
      '<div class="manpage src-apple"><div class="ref">Security · Hardened Runtime</div><p class="orig">The Hardened Runtime, along with System Integrity Protection (SIP), protects the runtime integrity of your software by preventing certain classes of exploits, like code injection, dynamically linked library (DLL) hijacking, and process memory space tampering.</p><p>Hardened Runtime, SIP ile birlikte yazılımın <em>çalışma-anı bütünlüğünü</em> (runtime integrity) korur: code injection, kütüphane kaçırma (DLL/dylib hijacking) ve süreç bellek alanının kurcalanması gibi belirli istismar sınıflarını engeller. İmzanın kapatamadığı dinamik boşluğu tam da bu doldurur.</p></div>' +
      '<div class="manpage src-docs"><div class="ref">Hardened Runtime · entitlements</div><p class="orig">Make sure to use only the entitlements that are absolutely necessary for your app\'s functionality.</p><p>Her korumanın bir istisna entitlement\'ı vardır (ör. <code>disable-library-validation</code>, <code>allow-unsigned-executable-memory</code>). Apple\'ın kuralı nettir: yalnızca <em>mutlaka gerekli</em> olanı kullan. Çünkü açılan her istisna, saldırgana bir yüzey açar — en az ayrıcalık ilkesi burada doğrudan saldırı yüzeyini küçültür.</p></div>' +
      '<p class="prose">Toparlarsak: kod imzalama kökeni ve statik bütünlüğü kanıtlar; notarization bilinen zararlıyı eler; Hardened Runtime + library validation runtime boşluğunu daraltır; AMFI bunları çekirdekte zorlar; donanım güven kökü (hardware root of trust) ise en alta sabitler. Bir baypasın bu katmanların hepsini birden aşması gerekir — <code>macos-codesign</code> ve <code>macos-amfi</code> modülleri bu zinciri makine tarafından nasıl kurulduğuyla anlatıyor. Saldırganı anlamanın savunmaya kattığı şey budur: nereye kaç katman koymak gerektiğini görmek.</p>'
