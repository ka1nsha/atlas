  deepDive: {
    heading: 'Derinlemesine: fuzzing bir arama stratejisidir',
    html: `<p class="lead">Fuzzing, bir programa çok sayıda hatalı/beklenmedik girdi verip çökme (crash) ya da bellek ihlali tetiklemeye çalışan otomatik bir test yöntemidir. Modern fuzzer’ı değerli kılan şey rastgelelik değil, <strong>geri bildirim</strong>dir: hangi girdinin yeni kod yolu açtığını ölçer (coverage-guided) ve aramayı oraya yöneltir. Bu bölüm libFuzzer, AFL++, syzkaller ve AddressSanitizer’ın kamuya açık belgelerine dayanır. Amaç kavramsaldır — hazır bir saldırı reçetesi değil, bug’ı kötü niyetli biri bulmadan kendi kodunda bulma disiplini.</p>

<h3>1. Neden rastgelelik tek başına yetmez</h3>
<p>Saf (dumb) fuzzing bir programa tamamen rastgele baytlar verir. Sorun şudur: girdilerin ezici çoğunluğu daha ilk ayrıştırma (parsing) adımında elenir, bu yüzden çökmeye götüren derin kod yollarına neredeyse hiç ulaşılamaz. Çözüm, girdinin programda <em>ne kadar ilerlediğini</em> ölçüp bunu bir arama sinyali olarak kullanmaktır. libFuzzer belgeleri aracı tam da bu çerçevede tanımlar.</p>
<div class="manpage src-docs"><div class="ref">LLVM · libFuzzer</div><p class="orig">LibFuzzer is an in-process, coverage-guided, evolutionary fuzzing engine.</p><p>libFuzzer; süreç-içi (in-process), kapsam güdümlü (coverage-guided) ve evrimsel (evolutionary) bir fuzzing motorudur. "In-process" girdiyi ayrı süreç başlatmadan aynı süreçte test fonksiyonuna vermesi (çok hızlı); "coverage-guided" kapsamı sinyal olarak kullanması; "evolutionary" ise değerli girdileri saklayıp onların üzerine mutasyon yaparak nesilden nesile "geliştirmesi" demektir.</p></div>

<h3>2. Fuzzer türleri</h3>
<p>Fuzzer’lar iki eksende ayrışır: girdiyi <em>nasıl</em> ürettikleri ve kapsam geri bildirimi kullanıp kullanmadıkları.</p>
<div class="deflist">
<div><dt>mutation-based</dt><dd>Var olan geçerli girdileri (tohum/seed) bit çevirme, bayt ekleme/silme, birleştirme ile bozar. Formatı bilmeye gerek yoktur; iyi bir tohum korpusu şarttır. libFuzzer ve AFL++ temelde böyle çalışır.</dd></div>
<div><dt>generation-based</dt><dd>Girdiyi bir dilbilgisine/modele göre sıfırdan üretir (ör. bir dosya formatı veya protokol grammar’ı). Format farkındalığı derin yollara daha hızlı ulaştırır ama grammar yazmak emek ister.</dd></div>
<div><dt>dumb (kör)</dt><dd>Kapsam geri bildirimi yoktur; ürettiğini körlemesine dener. Kurulumu kolay, verimi düşük.</dd></div>
<div><dt>coverage-guided</dt><dd>Her girdinin açtığı kod yollarını ölçer; yeni yol açanı korpusa ekleyip temel alır. Bugün standart olan yaklaşım budur.</dd></div>
</div>

<h3>3. Kapsam güdümlü döngü: enstrümantasyon + evrim</h3>
<p>Coverage-guided bir fuzzer derleme anında koda sayaçlar yerleştirir (SanitizerCoverage / AFL instrumentation) ve her çalıştırmada hangi dalların çalıştığını görür. Yeni kapsam açan girdi "değerli" sayılır, korpusa eklenir ve sonraki mutasyonlara tohum olur — klasik AFL bunu bir genetik algoritma olarak tanımlar.</p>
<div class="manpage src-docs"><div class="ref">AFL · genel bakış</div><p class="orig">american fuzzy lop is a security-oriented fuzzer that employs a novel type of compile-time instrumentation and genetic algorithms to automatically discover clean, interesting test cases that trigger new internal states in the target binary.</p><p>AFL, derleme-zamanı enstrümantasyonu ve genetik algoritmalar kullanarak hedef ikilide yeni iç durumları tetikleyen "ilginç" test durumlarını otomatik keşfeden güvenlik odaklı bir fuzzer’dır. Anahtar fikir: "yeni iç durum" (new internal state) = yeni kod yolu; fuzzer bunları ödül sayar ve çoğaltır. AFL++ bu yaklaşımın bakımı sürdürülen, daha hızlı modern halefidir.</p></div>
<p>Pratikte döngü şudur: korpustan girdi seç → mutasyona uğrat → çalıştır → kapsamı ölç → yeni yol açtıysa sakla → tekrarla. Bu yüzden kapsam zamanla "tırmanır" ve fuzzer, elle haftalarca aranacak derin yolları saatler içinde bulabilir.</p>

<h3>4. Sanitizer: sessiz hatayı görünür kılan göz</h3>
<p>Bir fuzzer yalnızca gözlemleyebildiği hatayı bulur. Bir buffer overflow ya da use-after-free çoğu zaman programı anında çökertmez — bellek bozulur ama çalışma sürer. Sanitizer bu boşluğu kapatır: ihlali tam oluştuğu anda, satır bilgisiyle yakalar ve süreci durdurur.</p>
<div class="manpage src-docs"><div class="ref">AddressSanitizer</div><p class="orig">AddressSanitizer is a fast memory error detector.</p><p>AddressSanitizer (ASan) hızlı bir bellek hatası dedektörüdür; out-of-bounds erişim, use-after-free, use-after-return gibi ihlalleri derleme anında eklenen kontrollerle anında yakalar. Fuzzing’de ASan olmadan bir girdi bug’ı tetiklese bile fuzzer bunu "çökme yok" sanıp geçebilir — bu yüzden fuzzing ve sanitizer neredeyse her zaman birlikte kullanılır. İlgili dedektörler: UBSan (undefined behavior), MSan (başlatılmamış okuma).</p></div>

<h3>5. Çekirdek fuzzing ve sürekli fuzzing</h3>
<p>Aynı üçlü (üret → çalıştır → ölç) kullanıcı alanının ötesine taşınır. Çekirdeğin saldırı yüzeyi syscall arayüzüdür; syzkaller syscall dizileri üretip bir VM’de çalıştırır, kapsamı KCOV ile ölçer ve çökmeleri KASAN ile yakalar.</p>
<div class="manpage src-docs"><div class="ref">google/syzkaller</div><p class="orig">syzkaller is an unsupervised coverage-guided kernel fuzzer.</p><p>syzkaller, denetimsiz (unsupervised) ve kapsam güdümlü bir çekirdek fuzzer’ıdır. "Unsupervised" insan müdahalesi olmadan kendi başına syscall dizileri üretip çökmeleri toplaması, kök nedene doğru küçültmesi (minimization) ve raporlaması demektir. Linux, bu yöntemle bulunup düzeltilen binlerce çekirdek hatasına ev sahipliği yapmıştır.</p></div>
<p>Son parça ölçektir: bir bug’ı bir kez bulmak değil, kod her değiştiğinde yeniden aramaktır. Google’ın OSS-Fuzz hizmeti açık kaynak projeleri sürekli (continuous) fuzz’lar; her commit’te fuzzer’ları yeniden koşarak regresyonları saldırgandan önce yakalamayı hedefler. Savunmacı için fuzzing’in asıl değeri buradadır: <strong>bulma işini otomatikleştirip saldırganın önüne geçmek.</strong></p>`
  },
