  deepDive: {
    heading: 'Derinlemesine: belirsizlikten belirliliğe, ve geri',
    html:
      '<p class="lead">Heap exploitation\'ın asıl zorluğu bug bulmak değil, bug\'ı <strong>güvenilir</strong> kılmaktır. Bu bölüm heap\'i neden öngörülemez olduğunu, saldırganın onu nasıl deterministik hale getirmeye çalıştığını (spray ve grooming) ve modern allocator\'ların bu determinizmi nasıl geri aldığını savunmacı gözüyle çözer. Her şey kavramsaldır; silahlandırılmış hiçbir ayrıntı yoktur.</p>' +

      '<h3>1. Heap neden öngörülemez</h3>' +
      '<p>Stack\'in aksine heap\'in düzeni derleme zamanında belli değildir: hangi nesnenin nereye düşeceği, programın o ana dek yaptığı tüm <code>malloc</code>/<code>free</code> çağrılarının sırasına, allocator\'ın serbest listelerinin (free list) durumuna ve boyut sınıflarına (size class) bağlıdır. Aynı program iki kez çalıştığında aynı nesne farklı yerlere düşebilir. Bir saldırgan için bu belirsizlik düşmandır: serbest kalan bir deliğe neyin düşeceğini bilemezse, bir UAF yalnızca rastgele bir çökmedir.</p>' +

      '<h3>2. Heap spraying: belleği kendi verinle doldur</h3>' +
      '<p><strong>Heap spraying</strong>, tek bir deliği hedeflemek yerine heap\'in büyük bir bölümünü saldırganın verisiyle doldurma tekniğidir. Fikir basittir: aynı boyutta yüzlerce/binlerce nesne tahsis edersen, kontrol akışı öngörülemez bir adrese atlasa bile büyük olasılıkla senin verine düşer.</p>' +
      '<div class="manpage src-docs"><div class="ref">Wikipedia · Heap spraying</div><p class="orig">In computer security, heap spraying is a technique used in exploits to facilitate arbitrary code execution.</p><p>Heap spraying, keyfi kod çalıştırmayı (arbitrary code execution) <em>kolaylaştıran</em> bir tekniktir — tek başına bir zafiyet değil, var olan bir bug\'ı güvenilir kılan bir yardımcıdır. Bug akışı ele geçirir; spray, o akışın saldırgan verisine düşmesini olasılıkla garantiler.</p></div>' +
      '<div class="manpage src-docs"><div class="ref">Wikipedia · Heap spraying</div><p class="orig">This means that the sprayed heap will roughly be in the same location each and every time the heap spray is run.</p><p>Sprey sonrası heap kabaca her çalıştırmada aynı yerde olur. "Kabaca aynı yer" ifadesi kritiktir: spray determinizmi <em>olasılıksal</em> olarak sağlar. Saldırganın istediği tam da budur — belirsizliği, exploit\'in güvenilir çalışacağı kadar azaltmak.</p></div>' +

      '<h3>3. Heap feng shui / grooming: düzeni önceden şekillendir</h3>' +
      '<p>Spray kaba kuvvetse, <strong>feng shui</strong> hassas cerrahidir. Terim Alexander Sotirov\'un 2007\'deki "Heap Feng Shui in JavaScript" çalışmasından gelir: saldırgan, hedef bug\'ı tetiklemeden <em>önce</em> bir dizi dikkatli tahsis ve serbest bırakma yaparak heap\'i istediği şekle sokar. Amaç, serbest kalacak deliğin tam da saldırganın kontrol ettiği bir nesneyle komşu (veya onunla dolacak) olmasını sağlamaktır.</p>' +
      '<p>Pratikte grooming şu adımlara dayanır: (1) hedefle <strong>aynı size class\'tan</strong> çok sayıda nesne tahsis ederek allocator\'ı düzenli bir duruma getir; (2) aralara bilinçli delikler aç; (3) bug\'ı tetikle; (4) serbest kalan deliği, hemen ardından yapılan bir tahsisle (reclaim) kendi nesnenle doldur. Bu yüzden grooming bir "güvenilirlik mühendisliğidir": rastgele bir çökmeyi, her seferinde aynı sonucu veren bir primitife dönüştürür.</p>' +
      '<div class="manpage src-docs"><div class="ref">docs · size class &amp; reclaim</div><p class="orig">allocators serve same-sized requests from the same pool of free chunks</p><p>Allocator\'lar aynı boyuttaki istekleri aynı serbest yonga (chunk) havuzundan karşılar. Grooming\'in temel kaldıracı budur: serbest kalan bir nesnenin yerini, <em>aynı size class\'tan</em> yeni bir tahsis alabilir. Bu yüzden saldırgan hedefle aynı boyutta nesneler sprey\'ler. (Kavramın özeti; ayrıntı için allocator belgelerine bakınız.)</p></div>' +

      '<h3>4. UAF ile bağ: deliği yeniden ele geçirmek</h3>' +
      '<p>Grooming\'in en klasik kullanımı use-after-free\'dir. Bir nesne serbest kalır ama bir dangling pointer onu gösterir. Saldırgan, serbest kalan bölmeyi aynı boyuttan kontrollü bir nesneyle yeniden ele geçirirse (reclaim), dangling pointer artık saldırganın verisini gösterir. Program eski tipi (<code>Session</code>) beklerken belleği saldırgan kontrol eder — bu bir <strong>type confusion</strong>\'a dönüşebilir. Bu zincirin ayrıntısı için bu serideki UAF ve kalloc modüllerine bakınız.</p>' +

      '<h3>5. Savunma: determinizmi geri al</h3>' +
      '<p>Modern allocator\'lar tam olarak bu güvenilirliği hedef alır. Mantık nettir: saldırgan determinizme muhtaçsa, savunma belirsizliği (ve yakalanabilirliği) geri getirmelidir.</p>' +
      '<dl class="deflist">' +
      '<dt>free-list randomization</dt><dd>Serbest bölmelerin hangi sırayla yeniden verileceğini rastgeleleştirir; reclaim\'in öngörülebilirliğini düşürür.</dd>' +
      '<dt>type isolation (kalloc_type)</dt><dd>XNU\'da farklı C tipleri ayrı zone\'lara düşer; serbest kalan bir nesnenin yerini <em>farklı tipte</em> bir nesne alamaz, type confusion zorlaşır.</dd>' +
      '<dt>guard page</dt><dd>Zone\'ların arasına erişilince hata veren sayfalar koyar; sınır-dışı (out-of-bounds) grooming girişimlerini çökertir.</dd>' +
      '<dt>free-list mangling</dt><dd>Serbest liste işaretçilerini şifreler/karıştırır; bir sızıntı olmadan listenin ele geçirilmesini zorlaştırır.</dd>' +
      '<dt>MTE (Memory Tagging)</dt><dd>Her tahsise bir etiket atar; serbest sonrası etiket değişir. Dangling pointer eski etiketi taşıdığı için reclaim edilen belleğe erişim <em>anında</em> yakalanır — grooming ne kadar iyi olursa olsun.</dd>' +
      '</dl>' +
      '<p>Sonuç: heap grooming, saldırının "görünmeyen yarısıdır" — bug kadar önemli ama daha az konuşulur. Savunmacı için dersi açıktır: bir bug\'ı kapatmak kadar, bug\'ın <em>güvenilir</em> hale gelmesini engellemek de değerlidir. kalloc_type ve MTE gibi korumalar tam da bu güvenilirliği kırdığı için modern sistemlerde bir UAF\'in exploit\'e dönme maliyetini katbekat artırır.</p>'
  },

  },
  tryIt: {
