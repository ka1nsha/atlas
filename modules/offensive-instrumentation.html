<h3>1. Enstrümantasyon nedir, neden "dinamik"?</h3>
<p>Statik analiz ikiliyi çalıştırmadan okur (bir önceki modül). Ama şifre çözülmüş değerler, sunucu yanıtları ve koşullu dalların gerçek sonucu ancak program koşarken belli olur. Dinamik enstrümantasyon bu boşluğu doldurur: hedef sürecin içine küçük bir ajan yerleştirip canlı gözlem yapar. En yaygın araç olan Frida kendini tek cümlede şöyle tanımlar.</p>
<div class="manpage src-docs"><div class="ref">Frida · docs</div><p class="orig">a dynamic code instrumentation toolkit — Greasemonkey for native apps.</p><p>Frida bir dynamic code instrumentation araç takımıdır; belgeler onu "native uygulamalar için Greasemonkey" diye tanımlar. Yani tarayıcıda bir sayfaya kullanıcı script'i enjekte etmek gibi, çalışan bir uygulamaya da küçük script'ler enjekte edip davranışını gözlemleyip yönlendirebilirsin — kaynak kod gerekmeden.</p></div>

<h3>2. Mimari: hedefe bir script motoru enjekte etmek</h3>
<p>Frida'nın çekirdeği native koddur ve hedef sürece bir JavaScript motoru yerleştirir; senin script'in o motorda, hedefin bellek alanına tam erişimle çalışır. Belgelerin kendi ifadesi bunu nettir.</p>
<div class="manpage src-docs"><div class="ref">Frida · docs</div><p class="orig">Frida's core is written in C and injects QuickJS into the target processes, where your JS gets executed with full access to memory, hooking functions...</p><p>Frida'nın çekirdeği C ile yazılmıştır ve hedef süreçlere QuickJS (bir JavaScript motoru) enjekte eder; JS kodun orada, belleğe tam erişimle ve fonksiyonları hook'layarak çalışır. Script ile ana tarafın arasında çift yönlü bir iletişim kanalı (bi-directional channel) vardır — gözlem sonuçları dışarı, komutlar içeri akar.</p></div>
<div class="deflist">
<div><dt>frida-server</dt><dd>Jailbreak'li/root'lu bir cihazda arka planda çalışan ajan; dışarıdan (USB/ağ) gelen enstrümantasyon isteklerini karşılar. Cihazın tümünde süreçlere bağlanabilir.</dd></div>
<div><dt>Frida Gadget</dt><dd>Jailbreak gerektirmeyen senaryoda uygulamanın içine gömülen paylaşımlı kütüphane. Ajanı sürecin kendisiyle birlikte taşır — test edilebilir yapılar için.</dd></div>
<div><dt>QuickJS motoru</dt><dd>Hedefe enjekte edilen küçük JS motoru. Script'in burada çalışır; <code>Module</code>, <code>Interceptor</code>, <code>Memory</code> gibi API'lerle belleği ve fonksiyonları ele alır.</dd></div>
</div>

<h3>3. Hooking ve tracing: iki temel işlem</h3>
<p>Enstrümantasyonun kalbi <strong>hook</strong>'tur: bir fonksiyonun giriş/çıkışına kendi kodunu iliştirmek. Frida'da bunu <code>Interceptor</code> yapar; API referansı işlevini tek satırda özetler.</p>
<div class="manpage src-docs"><div class="ref">Frida · JavaScript API</div><p class="orig">Interceptor.attach(target, callbacks): intercept calls to function at target.</p><p><code>Interceptor.attach</code>, <code>target</code> adresindeki fonksiyona yapılan çağrıları yakalar (intercept eder). <code>onEnter</code> ile argümanları fonksiyon çalışmadan önce, <code>onLeave</code> ile dönüş değerini sonra okursun. <strong>Hooking</strong> belirli bir fonksiyona odaklanır; <strong>tracing</strong> ise hangi fonksiyonların hangi sırayla çağrıldığını geniş ölçekte dökerek davranışın haritasını çıkarır.</p></div>
<p>Daha düşük seviyede, Frida'nın <code>Stalker</code> API'si bir iş parçacığını (thread) komut komut izleyebilir: <span class="mono">Stalker.follow(threadId)</span> "belirtilen thread'i izlemeye başlar". Bu, hangi kod yollarının gerçekte yürüdüğünü komut düzeyinde görmeyi sağlar — kapsam (coverage) tabanlı analiz ve fuzzing ile doğrudan bağlanır.</p>

<h3>4. Neden yönetilen runtime'lar enstrümantasyona açık?</h3>
<p>iOS'un Objective-C/Swift ve Android'in Java/Kotlin runtime'ları, çalışma anında zengin <strong>metadata</strong> taşır: sınıf adları, metod imzaları, metod tabloları. Objective-C'nin mesajlaşma modeli (<code>objc_msgSend</code>) ve ART'ın metod çözümü, bir metodu adıyla bulup araya girmeyi kolaylaştırır — native, sembolü silinmiş (stripped) C koduna göre çok daha şeffaftır.</p>
<div class="deflist">
<div><dt>Objective-C / Swift</dt><dd>Dinamik mesajlaşma ve runtime introspection sayesinde sınıf/metod adları çalışırken erişilebilir; metod yer değiştirme (swizzling) zaten dilin bir özelliğidir.</dd></div>
<div><dt>Java / Kotlin (ART)</dt><dd>Yönetilen metodlar ART içinde çözülür; metod tabloları üzerinden hook takmak yapısal olarak mümkündür. Bu yüzden Android enstrümantasyonu da olgun araçlara sahiptir.</dd></div>
</div>

<h3>5. Savunma tarafı: tespit bir duvar değil, yavaşlatıcıdır</h3>
<p>Uygulama bu müdahaleye karşı savunmasız değildir. Tipik önlemler: kendi kod bölgelerinin <strong>integrity check</strong>'i (checksum değişti mi — hook iz bırakır), bilinen enstrümantasyon araçlarının izlerini arama (yüklü kütüphane adları, açık portlar, bellekteki imzalar) ve anti-debug kontrolleri. Bunların hepsi saldırganın maliyetini artırır. Ama güvenlik mühendisliğinin değişmez ilkesi burada da geçerlidir: istemci (client) tarafında çalışan hiçbir kontrol mutlak değildir, çünkü enstrümantasyon tam da o kontrolü çalıştıran ortama müdahale edebilir. Bu yüzden client-side tespit <strong>defense in depth</strong>'in bir katmanıdır — asıl güven sunucu tarafı doğrulamasında ve en baştan hassas mantığı istemciye koymamakta olmalıdır.</p>
<p>Savunmacı için dersin özü nettir: enstrümantasyonu imkânsız kılamazsın, ama pahalı ve gürültülü kılabilirsin; kritik kararları (yetki, ödeme, lisans) yalnızca istemciye bırakmazsın. Enstrümantasyon tespiti, jailbreak/root tespitiyle (sonraki modül) birlikte katmanlı bir caydırıcılık oluşturur.</p>`
