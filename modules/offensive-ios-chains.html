<h3>1. FORCEDENTRY — JBIG2 integer overflow (CVE-2021-30860, 2021)</h3>
<p>FORCEDENTRY, Project Zero'nun "gördüğümüz en sofistike exploit'lerden biri" dediği bir <strong>zero-click</strong> iMessage zinciridir. Giriş noktası bir görüntü ayrıştırıcısıdır: <code>.gif</code> uzantılı ama aslında başka formatta olan bir dosya, iMessage'ın <code>IMTranscoderAgent</code> sürecindeki ImageIO yoluna ulaşır — ve bu süreç o dönemde <strong>BlastDoor</strong> sandbox'ının <strong>dışındadır</strong>. Asıl bug, CoreGraphics'in PDF yolunda kullanılan JBIG2 ayrıştırıcısının segment-referans sayımında bir <strong>integer overflow</strong>'dur: taşan sayım, gereğinden küçük bir heap tamponu boyutlandırır ve sonraki yazmalar komşu belleği bozar.</p>
<div class="manpage src-docs"><div class="ref">NVD · CVE-2021-30860</div><p class="orig">An integer overflow was addressed with improved input validation.</p><p>Resmi kayıt bug sınıfını net verir: <strong>integer overflow</strong>, "iyileştirilmiş girdi doğrulaması" ile giderildi. Apple, bu açığın "vahşi doğada etkin biçimde istismar edilmiş olabileceğine dair bir rapordan haberdar olduğunu" belirtti — yani gerçek bir operasyonda kullanıldı.</p></div>
<p>Teknik akışın çarpıcı yanı, bundan sonrasıdır: JBIG2'nin bitmap üzerindeki mantıksal işlemleri (AND, OR, XOR, XNOR), tek bir çözme (decompression) geçişi içinde binlerce segment komutuyla zincirlenerek küçük bir <strong>sanal makine</strong> — register'ları, 64-bit toplayıcısı ve karşılaştırıcısı olan bir "mantık devresi" — oluşturur. Saldırgan bu emüle ortamda belleği arar ve sonraki aşamayı kurar; yani bellek güvenliği hatası, kod çalıştırmadan bir hesaplama ortamına dönüştürülmüştür.</p>
<div class="manpage src-docs"><div class="ref">docs · Project Zero (Beer &amp; Groß, 2021)</div><p class="orig">this weird, emulated environment created out of a single decompression pass through a JBIG2 stream</p><p>Project Zero, saldırganın tek bir JBIG2 çözme geçişinden "tuhaf, emüle bir ortam" kurduğunu anlatır. <strong>Ders:</strong> güvenilmeyen girdiyi işleyen ayrıştırıcılar sıkı izole edilmeli. Apple yanıtı: iMessage eklerini <strong>BlastDoor</strong> içinde ayrıştırmak ve iOS 15'te GIF kod yolunu <code>IMTranscoderAgent</code>'tan kaldırmak.</p></div>
<div class="deflist">
<div><dt>Bug sınıfı</dt><dd>Integer overflow (JBIG2 segment-referans sayımı) → heap buffer overflow.</dd></div>
<div><dt>Zincirdeki yeri</dt><dd>Giriş + RCE: zero-click ulaşım ve ilk kod-eşdeğeri yetenek (emüle makine).</dd></div>
<div><dt>Yenilen savunma</dt><dd>Ek ayrıştırmanın izolasyonsuzluğu (BlastDoor öncesi süreç).</dd></div>
<div><dt>Alınan ders</dt><dd>Parser izolasyonu (BlastDoor), bellek-güvenli kodlayıcılar, saldırı yüzeyini kaldırmak.</dd></div>
</div>

<h3>2. CVE-2020-27950 — çekirdek bellek sızıntısı (info leak)</h3>
<p>Bu açık, 2020 sonunda vahşi doğada kullanılan üç-bug'lık bir iOS zincirinin bir halkasıydı. Tek başına kod çalıştırmaz; görevi <strong>bilgi sızdırmaktır</strong>. Mach mesajlarının işlenmesindeki bir bellek ilklendirme (memory initialization) hatası nedeniyle, kötü niyetli bir uygulama çekirdek belleğinden veri okuyabiliyordu.</p>
<div class="manpage src-docs"><div class="ref">NVD · CVE-2020-27950</div><p class="orig">A memory initialization issue was addressed.</p><p>İkinci cümle sonucu söyler: "Kötü niyetli bir uygulama çekirdek belleğini ifşa edebilir" (<em>disclose kernel memory</em>). Bu bir <strong>info leak</strong>'tir — zincirin KASLR'yi yenen halkası.</p></div>
<p>Teknik akıştaki rolü kritiktir: modern çekirdekte KASLR adresleri rastgeleleştirdiği için, saldırganın bir yere yazmadan önce <strong>nereye</strong> yazacağını öğrenmesi gerekir. Sızan çekirdek belleği bu haritayı verir; sonraki halka (ör. bir type confusion / UAF) bu bilgiyle güvenilir hale gelir. Mach mesaj yapısı için <a href="macos-mach-ports.html">Mach portları</a> modülüne bak.</p>
<div class="deflist">
<div><dt>Bug sınıfı</dt><dd>Uninitialized memory → kernel info disclosure.</dd></div>
<div><dt>Zincirdeki yeri</dt><dd>Keşif: KASLR'yi yenen bilgi sızıntısı; sonraki halkanın ön koşulu.</dd></div>
<div><dt>Yenilen savunma</dt><dd>KASLR (adres rastgeleleştirme).</dd></div>
<div><dt>Alınan ders</dt><dd>Belleği kullanmadan önce ilklendir; info-leak yüzeyleri bellek bozulması kadar ciddiye alınmalı.</dd></div>
</div>

<h3>3. mach_portal — Mach port hakkı yönetimi (2016)</h3>
<p>mach_portal, iOS 10 döneminde kamuya açık olarak anlatılan bir çekirdek tekniğidir. Çarpıcı yanı, klasik bir bellek taşması <strong>kullanmamasıdır</strong>: temelinde Mach port haklarının (port rights) referans/yaşam döngüsü yönetimindeki bir hata — kavramsal olarak bir <strong>use-after-free / over-release</strong> sınıfı — yatar. Bir port hakkı beklenenden fazla serbest bırakıldığında, saldırgan çekirdek içindeki bir nesnenin kontrolünü ele geçirebilir ve nihayetinde <strong>kernel task port</strong>'a ulaşabilir — ki bu, çekirdek belleğine tam okuma/yazma demektir.</p>
<p>Teknik akış, <a href="macos-mach-ports.html">Mach portları</a> modülündeki kavramlara dayanır: port'lar çekirdekte sayımla (reference count) yönetilen nesnelerdir; sayımın yanlış düşmesi, hâlâ kullanımda olan bir nesnenin erken yok edilmesine yol açar. <strong>Ders:</strong> IPC nesnelerinin yaşam döngüsünü titizlikle doğrulamak ve kernel task port gibi aşırı güçlü primitifleri korumak. Apple yanıtı: port erişimini sıkılaştırmak ve işaretçi bütünlüğü için <strong>PAC</strong> (bkz. <a href="macos-arm64.html">ARM64</a>).</p>
<div class="deflist">
<div><dt>Bug sınıfı</dt><dd>Kaynak yönetimi hatası (Mach port over-release) — UAF sınıfı.</dd></div>
<div><dt>Zincirdeki yeri</dt><dd>Kernel: port kontrolünden kernel task port'a (tam R/W).</dd></div>
<div><dt>Yenilen savunma</dt><dd>Çekirdek nesne bütünlüğü (port güveni).</dd></div>
<div><dt>Alınan ders</dt><dd>IPC yaşam döngüsü doğrulaması; aşırı güçlü primitifleri (task port) korumak; PAC.</dd></div>
</div>

<h3>4. Pegasus / NSO — operasyonel zincir bağlamı</h3>
<p>FORCEDENTRY tek başına bir "bug" değil, bir <strong>ürünün</strong> giriş halkasıydı: NSO Group'un Pegasus casus yazılımı. Operasyonel açıdan önemli olan, tam zincirin anatomisidir: <strong>zero-click giriş</strong> (RCE) → <strong>sandbox escape</strong> → <strong>kernel</strong> → <strong>kalıcılık ve veri toplama</strong>. Her halka ayrı bir güven sınırını aşar ve hepsi, kurban hiçbir şeye dokunmadan, arka planda çalışır.</p>
<div class="manpage src-docs"><div class="ref">docs · Project Zero (2021)</div><p class="orig">In the zero-click scenario no user interaction is required.</p><p>Project Zero'nun vurgusu: zero-click senaryoda <strong>hiçbir kullanıcı etkileşimi gerekmez</strong>. Bu, bu tür zincirleri en tehlikeli sınıf yapar — ne bir bağlantıya tıklanır ne bir dosya açılır. <strong>Ders:</strong> saldırı yüzeyini kaldırmak (ayrıştırıcıları izole/iptal etmek) ve <strong>Lockdown Mode</strong> gibi sıkı modlarla yüksek-riskli kullanıcıların yüzeyini küçültmek.</p></div>
<p>Pegasus bağlamı, savunmanın yalnızca teknik değil <strong>tehdit modeli</strong> boyutunu da gösterir: devlet-seviyesi, hedefli, ticari casus yazılım. Buna karşı Apple'ın yanıtı katmanlıdır — BlastDoor (giriş), PAC ve SPTM/TXM (kernel bütünlüğü, bkz. <a href="macos-newsec.html">yeni güvenlik bileşenleri</a>), Lockdown Mode (yüzey azaltma) ve tehdit bildirimleri.</p>
<div class="deflist">
<div><dt>Bug sınıfı</dt><dd>Zincir: parser integer overflow (giriş) + sonraki aşamalar.</dd></div>
<div><dt>Zincirdeki yeri</dt><dd>Uçtan uca: giriş → sandbox escape → kernel → kalıcılık.</dd></div>
<div><dt>Yenilen savunma</dt><dd>Katmanlı — sandbox, KASLR, kod imzalama, kernel bütünlüğü.</dd></div>
<div><dt>Alınan ders</dt><dd>Zero-click en tehlikelisi; yanıt katmanlı olmalı (BlastDoor + PAC + Lockdown Mode).</dd></div>
</div>

<h3>5. Ortak desen: halka halka savunma</h3>

<div><dt>Pegasus → yüzey azaltma</dt><dd>Tüm zinciri zorlaştır: Lockdown Mode, katmanlı kernel bütünlüğü (SPTM/TXM).</dd></div>
</div>
