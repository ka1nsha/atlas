  deepDive: {
    heading: 'Derinlemesine: güven zinciri ve jailbreak türleri',
    html: '<p class="lead">Jailbreak zincirini anlamanın en temiz yolu, onun saldırdığı şeyi — <strong>chain of trust</strong>, yani güven zincirini — anlamaktır. Cihaz açılırken her katman bir sonrakini doğrular; jailbreak bu zincirin bir halkasını kırmaya çalışır, ve <em>hangi</em> halkayı kırdığı jailbreak\'in türünü ve ömrünü belirler. Bu bölüm Apple\'ın platform güvenlik belgelerindeki açılış (boot) modeline dayanır; somut istismar değil, saldırının hedeflediği mimariyi ve savunmanın bu mimariyi neden böyle kurduğunu anlatır.</p>' +

      '<h3>1. Güven zinciri: her halka bir sonrakini doğrular</h3>' +
      '<p>Modern bir cihaz, açılışta tek bir yazılımı değil, bir <strong>dizi</strong> yazılımı sırayla çalıştırır: en alttaki değiştirilemez (immutable) kod başlar, bir sonraki aşamayı doğrular, ona kontrolü devreder; o da bir sonrakini doğrular. Bu zincir, kriptografik imza doğrulamasıyla en alttaki <strong>hardware root of trust</strong>\'a (donanım güven kökü) dayanır. Jailbreak\'in nihai hedefi bu zincirin bir yerinde doğrulamayı atlatıp imzasız/değiştirilmiş kodu çalıştırtmaktır.</p>' +
      '<div class="manpage src-apple"><div class="ref">Platform Security · Boot process</div><p class="orig">This is the first step in the chain of trust, in which each step checks that the next is signed by Apple.</p><p>Güven zincirinin (chain of trust) temel kuralı: her adım, bir sonraki adımın <em>Apple tarafından imzalandığını</em> doğrular. Zincir ancak böyle yürür — bir halka bile kendinden sonrakini doğrulamazsa, saldırgan oraya imzasız kod sokabilir. Jailbreak tam da bu doğrulama adımlarından birini hedefler.</p></div>' +
      '<div class="manpage src-apple"><div class="ref">Platform Security · iBoot → kernel</div><p class="orig">When the iBoot finishes its tasks, it verifies and runs the iOS or iPadOS kernel.</p><p><code>iBoot</code> (ikinci aşama yükleyici), işini bitirince çekirdeği <em>doğrular ve çalıştırır</em> (verifies and runs). Yani çekirdek bile, kendinden önceki halka tarafından imza kontrolünden geçirilir. Bir saldırgan değiştirilmiş bir çekirdek çalıştırmak isterse, ya iBoot\'u kandırmalı ya da zinciri daha aşağıda kırmalıdır.</p></div>' +

      '<h3>2. Bootrom jailbreak vs kernel jailbreak</h3>' +
      '<p>Jailbreak\'in hangi halkayı kırdığı, onun en önemli ayrımını belirler. İki uç vardır:</p>' +
      '<div class="deflist">' +
      '<div><dt>kernel jailbreak</dt><dd>Zincir, cihaz normal açıldıktan <em>sonra</em>, çalışan çekirdekteki bir bug ile kırılır. Çoğu modern jailbreak budur. Çekirdek ya da iBoot yazılımla korunduğu için Apple bu açığı bir yazılım güncellemesiyle <strong>kapatabilir</strong>; o yüzden bu tür jailbreak\'ler belirli sürümlere bağlıdır ve güncellemeyle ölür.</dd></div>' +
      '<div><dt>bootrom jailbreak</dt><dd>Zincir en alttaki halkada, yani <strong>Boot ROM</strong>\'da (çipe fabrikada gömülen, değiştirilemez ilk kod) kırılır. Buradaki bir hata kalıcıdır: kod salt-okunur silikona yazılmıştır, yazılım güncellemesiyle <em>yamanamaz</em>. <code>checkm8</code> bu türe kavramsal bir örnektir — etkilenen çipler için düzeltme yalnızca yeni donanımla gelir. Bu modül onun tekniğini vermez; önemli olan <em>neden yamalanamaz</em> olduğudur.</dd></div>' +
      '</div>' +
      '<div class="manpage src-apple"><div class="ref">Platform Security · hardware root of trust</div><p class="orig">This immutable code, known as the hardware root of trust, is laid down during chip fabrication and is implicitly trusted.</p><p>Boot ROM\'daki bu <em>değiştirilemez</em> (immutable) kod, çip üretimi sırasında (during chip fabrication) döşenir ve <em>örtük olarak güvenilir</em> (implicitly trusted) kabul edilir. Değiştirilemez olması güvenliğin temelidir — ama aynı özellik, oradaki bir hatanın da asla yazılımla düzeltilememesi demektir. Donanım güven kökünü kırmak en zorudur; kırılırsa da sonucu en kalıcısıdır.</p></div>' +

      '<h3>3. Tethered vs untethered: kalıcılık güven zincirine karşı</h3>' +
      '<p>Bir jailbreak çekirdeği bir kez ele geçirse bile, cihaz yeniden başladığında güven zinciri sıfırdan, temiz haliyle yeniden çalışır. Jailbreak\'in yeniden başlatmaya nasıl dayandığı onu ikiye ayırır:</p>' +
      '<div class="deflist">' +
      '<div><dt>tethered</dt><dd>Her yeniden başlatmada zincirin yeniden uygulanması gerekir (genelde bir bilgisayara bağlanarak). Cihaz tek başına yeniden açıldığında stok (temiz) duruma döner. Çünkü açılış exploit\'i açılış anında yeniden tetiklenmek zorundadır.</dd></div>' +
      '<div><dt>untethered</dt><dd>Jailbreak yeniden başlatmadan sağ çıkar: güven zincirinin kendisine, imzasız kodun açılışta yeniden çalışmasını sağlayan kalıcı bir kanca kurulmuştur. Bu çok daha zordur, çünkü doğrulanmış açılış (verified boot) zincirini her açılışta yeniden yenmek gerekir.</dd></div>' +
      '</div>' +
      '<p class="prose">Kalıcılığın zor olması tesadüf değil, tasarımdır: Secure Enclave bile kendi yazılımını (sepOS) açılışta ayrıca doğrular. Apple\'ın ifadesiyle, "The Secure Enclave also performs a secure boot that checks its software (sepOS) is verified and signed by Apple." Yani ana çekirdek ele geçse dahi, ayrı bir güven alanı kendi zincirini bağımsızca denetlemeye devam eder.</p>' +

      '<h3>4. Savunmanın dersi: ayrıcalığı çekirdekten almak</h3>' +
      '<p>Jailbreak anatomisinin savunmaya kattığı en büyük içgörü şudur: zincirin en pahalı halkası "çekirdek R/W\'den korumaları kapatmaya" geçiştir. Eğer çekirdek R/W elde etmek sistemi tamamen teslim ediyorsa, tek bir çekirdek bug\'ı her şeyi verir. Apple\'ın modern mimarisi tam da bunu kırar: <strong>PPL</strong> ve halefi <strong>SPTM</strong> sayfa tablolarını çekirdekten bile korur, <strong>TXM</strong> kod imzalama kararlarını çekirdekten ayrı bir güven alanına taşır, <strong>PAC</strong> ise çekirdek R/W\'nin kontrol akışına kolayca çevrilmesini zorlaştırır. Sonuç: çekirdeği ele geçirmek artık "oyunu bitirmek" değildir — saldırganın önünde hâlâ ayrı ayrı kırması gereken donanım destekli halkalar durur.</p>' +
      '<div class="deflist">' +
      '<div><dt>eski model</dt><dd>Çekirdek R/W ≈ tam kontrol. Tek bir çekirdek açığı AMFI\'yi, sandbox\'ı ve sayfa tablolarını doğrudan değiştirmeye yeterdi.</dd></div>' +
