  deepDive: {
    heading: 'Derinlemesine: istemci-tarafı güven ve attestation',
    html: '<p class="lead">Jailbreak/root tespitini doğru konumlandırmak için OWASP\'ın mobil güvenlik standardı MASVS, bu tür kontrolleri ayrı bir kategoride — <strong>MASVS-RESILIENCE</strong> — toplar ve onları net bir dille "ikinci savunma hattı" olarak tanımlar. Buradaki ayrım, bu modülün tüm mesajını taşır: dayanıklılık (resilience) kontrolleri, güvenlik kontrollerinin <em>yerine</em> geçmez; eforu artırır. Bu bölüm o çerçeveye ve istemci-tarafı güvenin neden sunucu-tarafı doğrulama ile desteklenmesi gerektiğine dayanır.</p>' +

      '<h3>1. Tehdit modeli: cihaza tam erişimi olan saldırgan</h3>' +
      '<p>MASVS-RESILIENCE kontrollerinin varsaydığı tehdit modeli diğer kategorilerden farklıdır: burada saldırgan, uzaktaki bir yabancı değil, <strong>cihazın kendisine ve uygulamaya tam erişimi olan</strong> ve tersine mühendislik araçlarını kullanabilen biridir. Yani savunmanın koştuğu zemin, düşmanın kontrolündedir. Bu varsayım kabul edildiğinde, "tespit atlatılamaz" iddiası baştan anlamsızlaşır — soru eforun ne kadar yükseltildiğidir.</p>' +
      '<div class="manpage src-docs"><div class="ref">OWASP MASVS · MASVS-RESILIENCE</div><p class="orig">The controls in this category are a second line of defense.</p><p>MASVS, dayanıklılık kontrollerini açıkça <em>ikinci bir savunma hattı</em> (second line of defense) olarak konumlar. Yani jailbreak/root tespiti, kimlik doğrulama veya şifreleme gibi birincil kontrollerin yerini tutmaz; onların üstüne oturan, saldırıyı pahalılaştıran bir katmandır. Birincil güvenlik başka kategorilerde (MASVS-AUTH, MASVS-CRYPTO, MASVS-NETWORK) kurulur.</p></div>' +

      '<h3>2. İstemci-tarafı güven problemi (client-side trust)</h3>' +
      '<p>Tespitin temel kısıtı mimaridir: kontrol, korumaya çalıştığı ortamın <em>içinde</em> çalışır. Bir fonksiyon "jailbreak var mı?" diye sorduğunda, bu sorunun yanıtını üreten her şey — dosya sistemi, syscall\'lar, hatta fonksiyonun kendi dönüş değeri — saldırganın değiştirebileceği bellekte durur. Dinamik enstrümantasyon (ör. bir hooking framework ile fonksiyon dönüşlerini değiştirmek — bkz. <code>offensive-instrumentation</code>) tam da bunu yapar: kodu değil, kodun gördüğü gerçekliği değiştirir.</p>' +
      '<div class="deflist">' +
      '<div><dt>client-side check</dt><dd>Kararın istemcide (cihazda) hesaplandığı kontrol. Hızlı ve çevrimdışı çalışır, ama sonucu saldırganca değiştirilebilir; çünkü hesaplama düşmanın zeminindedir.</dd></div>' +
      '<div><dt>runtime hooking</dt><dd>Çalışan bir sürecin fonksiyon çağrılarını/dönüşlerini çalışma zamanında araya girip değiştirme (kavramsal). Tespit fonksiyonunun dönüşü <code>true</code>\'ya zorlanırsa, altındaki tüm sinyaller doğru olsa bile karar atlatılır.</dd></div>' +
      '<div><dt>bar raising</dt><dd>İstemci kontrollerinin asıl değeri: saldırıyı imkânsız değil, <em>pahalı</em> kılmak. Çok sayıda, çeşitli ve obfuscate edilmiş sinyal, otomatik/toplu saldırıların maliyetini yükseltir.</dd></div>' +
      '</div>' +

      '<h3>3. Neden sunucu-tarafı ve attestation daha güçlü?</h3>' +
      '<p>İstemci-tarafı güvenin çözümü, güvenin <em>kökünü</em> saldırganın kontrol etmediği bir yere taşımaktır. İki tamamlayıcı yaklaşım vardır:</p>' +
      '<div class="deflist">' +
      '<div><dt>server-side validation</dt><dd>Kritik kararı (ör. bir işlemin geçerliliği) sunucuda, saldırganın değiştiremediği bir ortamda vermek. İstemciden gelen her şeyi güvenilmez kabul etmek — güvenlik mühendisliğinin temel ilkesi.</dd></div>' +
      '<div><dt>hardware-backed attestation</dt><dd>Cihazın bütünlüğü hakkındaki kanıtı, uygulamanın kendi koduyla değil, platformun donanım destekli güven kökü ile üretmek: Android\'de <strong>Play Integrity / Key Attestation</strong> (TEE/StrongBox imzalı), iOS\'ta <strong>App Attest / DeviceCheck</strong> (Secure Enclave destekli). Burada imzayı saldırganın cihazdaki uygulaması değil, ayrı bir güven alanı üretir; bu yüzden basit bir runtime hook ile taklit edilemez.</dd></div>' +
      '</div>' +
      '<p class="prose">Attestation da mutlak değildir (donanım güven kökü de araştırma hedefidir), ama güven kökünü uygulama belleğinden alıp ayrı bir güven alanına taşıdığı için istemci-tarafı tespitten kategorik olarak daha güçlüdür. Bu, <code>macos-sep</code> (Secure Enclave) ve <code>android-attestation</code> (Play Integrity, Key Attestation) modülleriyle doğrudan bağlanır.</p>' +

      '<h3>4. Savunmanın dersi: katman olarak kullan, duvar sanma</h3>' +
      '<p>Doğru zihinsel model şudur: jailbreak/root tespiti bir <strong>detective/responsive</strong> kontroldür — ortamı sezip riski azaltır (ör. ek doğrulama ister, hassas özelliği kısar), ama güvenliğin temeli değildir. Onu bir duvar sanmak tehlikelidir, çünkü atlatıldığında geriye hiçbir şey kalmaz. Katman olarak kurmak ise doğrudur: tespiti <em>sunucu-tarafı doğrulama ve attestation</em> ile birlikte kullanan bir uygulama, tek bir bypass ile çökmez.</p>' +
      '<div class="manpage src-docs"><div class="ref">OWASP MASVS · RESILIENCE · kapsam</div><p class="orig">Resilience against reverse engineering and tampering.</p><p>Kategorinin adı bile amacını verir: tersine mühendislik ve kurcalamaya karşı <em>dayanıklılık</em>. "Önleme" değil, "dayanıklılık" — yani saldırganın işini zorlaştırıp maliyetini artırma. Bu çerçeveyi kabul etmek, tespiti doğru yere koymak demektir: birincil güvenliğin üstüne eklenen, onu güçlendiren ama onun yerini almayan bir katman.</p></div>' +
      '<p class="prose">Özetle: istemci-tarafı tespit "mümkün mü" sorusuyla değil, "ne kadar pahalı ve neyle destekleniyor" sorusuyla değerlendirilir. Bir sonraki modül (<code>offensive-mobile-app</code>) aynı istemci-tarafı güven problemini ağ katmanında — trafik araya girme ve certificate pinning — inceliyor.</p>'
  },
