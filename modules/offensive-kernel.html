  deepDive: {
    heading: 'Derinlemesine: çekirdek saldırı yüzeyi',
    html: `<p class="lead">Çekirdek, tüm sistemin tek güven köküdür (trust anchor): belleği, süreçleri ve donanımı o yönetir ve ring 0'da her şeye erişir. Bu yüzden çekirdekteki tek bir bug, kullanıcı alanındaki bir bug'dan niteliksel olarak farklıdır — sonucu o kullanıcı değil, <strong>tüm sistemdir</strong>. Bu bölüm, saldırı yüzeyini (attack surface) bir saldırgan gibi haritalar; ama amaç onu <em>küçültmek</em> ve <em>sertleştirmek</em>, yani savunmaktır. Alıntılar doğrudan Linux çekirdeğinin kendi güvenlik belgelerinden (Kernel Self-Protection) gelir.</p>

<h3>1. Neden sınır her şeydir: user space → kernel</h3>
<p>Donanım, kodu ayrıcalık halkalarına (privilege ring) böler: kullanıcı kodu ring 3'te kısıtlı, çekirdek ring 0'da tam yetkili çalışır. Kullanıcı bir süreci ele geçirse bile yalnızca o sürecin yetkisine sahiptir; asıl ödül, bu sınırı aşıp çekirdeğe geçmektir (local privilege escalation, LPE). Sınırın kritikliği, çekirdeğin bir bug sonrası ne kadar çabuk tümüyle ele geçirilebildiğinden gelir — bu yüzden çekirdek, kendi belleğini kullanıcıdan katı biçimde ayırmak zorundadır.</p>
<div class="manpage src-docs"><div class="ref">docs · The Linux Kernel · Kernel Self-Protection</div><p class="orig">The kernel must also never access userspace memory without explicit expectation to do so.</p><p>Kural tersten okunduğunda saldırı yüzeyini tanımlar: çekirdek kullanıcı belleğine yalnızca <em>açıkça beklediği</em> yerlerde (ör. copy_from_user) dokunmalıdır. Bu beklenen temas noktalarının dışındaki her erişim bir bug'dır; SMAP/PAN gibi donanım korumaları da tam bu kuralı zorunlu kılarak saldırıları çekirdek belleğiyle sınırlı tutar.</p></div>

<h3>2. Saldırı yüzeyinin bileşenleri: her kapı bir giriş noktası</h3>
<p>Kullanıcının çekirdeğe ulaştığı her yol bir <strong>entry point</strong>'tir ve bunların toplamı saldırı yüzeyidir. Bir saldırgan en geniş ve en az denetlenen kapıyı arar; bir savunmacı ise erişilebilir kapı sayısını azaltmaya çalışır.</p>
<div class="deflist">
<div><dt>syscall interface</dt><dd>Çekirdeğin kullanıcıya açtığı ~370 sistem çağrısı. Her çağrının argümanları ve işaretçileri güvenilmezdir; doğrulama hataları en temel yüzeydir.</dd></div>
<div><dt>ioctl / driver</dt><dd><code>/dev/*</code> aygıtlarına açılan sürücü komutları. 3rd-party ve aygıta özel sürücüler, çekirdeğin en az denetlenen, en değişken kod tabanıdır — bu yüzden çoğu zaman en zayıf halkadır.</dd></div>
<div><dt>network stack</dt><dd>Uzaktan gelen paketleri ayrıştıran (parsing) kod. Tek fark: tetik için yerel erişim bile gerekmeyebilir.</dd></div>
<div><dt>filesystem parsers</dt><dd>Bozuk/kötü niyetli bir imajı mount ederken çalışan ayrıştırıcılar. Güvenilmez bir imaj, karmaşık bir ayrıştırma koduna doğrudan saldırgan verisi besler.</dd></div>
<div><dt>IPC / shared interfaces</dt><dd>Süreçler arası ve kullanıcı-çekirdek paylaşımlı arayüzler; sınırda dönüşüm/doğrulama yapılan her yer.</dd></div>
</div>
<p>Çekirdeğin kendi belgeleri, bu kapı sayısını azaltmayı açık bir savunma hedefi sayar:</p>
<div class="manpage src-docs"><div class="ref">docs · The Linux Kernel · Kernel Self-Protection</div><p class="orig">This limits the breadth of kernel code that can be reached</p><p>Fikir doğrudan: ulaşılabilen çekirdek kodunun genişliğini sınırlamak, bir bug'ı saldırıya çevirmeyi zorlaştırır. Erişilemeyen kod, pratikte saldırılamayan koddur — bu yüzden "attack surface reduction" bir lüks değil, temel bir savunma ilkesidir.</p></div>

<h3>3. Sınırda doğrulama: copy_from_user ve güvenilmez girdi</h3>
<p>İstek sınırı geçerken çekirdek, kullanıcıdan gelen <em>her şeyi</em> güvenilmez kabul etmek zorundadır. Kullanıcı işaretçileri asla doğrudan dereference edilmez; <code>copy_from_user</code> / <code>copy_to_user</code> gibi denetimli yardımcılarla kopyalanır, uzunluklar ve indeksler sınır kontrolünden geçirilir. Bu doğrulamanın atlanması ya da yanlış yapılması (ör. doğrulanmamış bir index ile out-of-bounds write) bir çekirdek bug'ının ta kendisidir — ve önceki modüldeki primitif merdiveni burada da işler, yalnızca hedef çekirdeğin kendisidir (<code>struct cred</code>, görev yapıları, fonksiyon işaretçileri).</p>

<h3>4. Yüzey daraltma: seccomp ve least privilege</h3>
<p>Saldırı yüzeyini küçültmenin en etkili yollarından biri, bir sürecin yapabileceği syscall kümesini daraltmaktır. <strong>seccomp</strong> filtreleri tam da bunu yapar: tarayıcılar ve konteyner çalışma zamanları, ele geçirilse bile bir sürecin dokunabileceği çekirdek kodunu en aza indirir (least privilege / assume breach).</p>
<div class="manpage src-docs"><div class="ref">docs · The Linux Kernel · seccomp filter</div><p class="orig">The resulting set reduces the total kernel surface exposed to the application.</p><p>Bir sürece yalnızca ihtiyaç duyduğu syscall'lara izin vermek, geri kalan tüm çekirdek giriş noktalarını o süreç için kapatır. Çekirdek belgeleri bunun tek başına bir sandbox olmadığını, bir <em>yapı taşı</em> olduğunu vurgular — yani derinlemesine savunmanın (defense in depth) bir katmanıdır, tek savunma değil.</p></div>

<h3>5. Sömürüyü kırmak: writable belleği kilitlemek ve katmanlı savunma</h3>
<p>Saldırgan sınırı aşıp çekirdek belleğinde kontrollü bir etki elde etse bile, modern çekirdek bunu tam sistem devralmaya çevirmeyi ayrıca zorlaştırır. Temel fikir, çekirdeğin değiştirilebilir (writable) yüzeyini daraltmaktır: kod ve kritik tabloları salt okunur yapmak, kullanıcı belleğini çekirdekten erişilemez kılmak (SMEP/SMAP/PAN) ve kontrol akışını doğrulamak (KCFI).</p>
<div class="manpage src-docs"><div class="ref">docs · The Linux Kernel · Kernel Self-Protection</div><p class="orig">When all of kernel memory is writable, it becomes trivial for attacks to redirect execution flow.</p><p>Belge sorunu çıplak biçimde koyar: çekirdek belleğinin tamamı yazılabilirse, yürütme akışını saptırmak <em>önemsiz</em> hâle gelir. Çözüm, bellek izinlerini kilitlemek — yazılabilir sayfaların çalıştırılamaması (W^X), kod bölgelerinin değiştirilememesi. Bu, kullanıcı alanındaki RELRO/NX'in çekirdek karşılığıdır.</p></div>
<p>Bu korumalar birbirinin yerine değil, <strong>üst üste</strong> anlam taşır: KASLR saldırganı önce bir çekirdek info leak'e zorlar (tıpkı user space'teki ASLR gibi); SMEP eski "çekirdeği kullanıcı koduna atlatma" hilesini kapatıp saldırganı tümüyle çekirdek içinde kalan çok daha zor zincirlere (çekirdek ROP) iter; KCFI o zinciri de doğrular. Çekirdeğin kendi hedefi, bu korumaların istisna değil kural olmasıdır:</p>
<div class="manpage src-docs"><div class="ref">docs · The Linux Kernel · Kernel Self-Protection</div><p class="orig">The goals for successful self-protection systems would be that they are effective, on by default</p><p>Bir savunma ancak <em>varsayılan olarak açık</em> ve etkili olduğunda gerçek koruma sağlar — kullanıcının elle açması gereken bir koruma, çoğu sistemde kapalı kalır. Saldırı yüzeyini anlamanın savunmacı için anlamı budur: her giriş noktasının karşısına, varsayılan açık bir koruma koyabilmek.</p></div>`
  },
