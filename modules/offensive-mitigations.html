    heading: 'Derinlemesine: her korumanın hedefi ve sınırı',
    html: `<p class="lead">Bir mitigation sihir değildir: tam olarak bir sömürü primitifini hedefler, onu pahalılaştırır ve bilinen bir aşma yolu bırakır. Bu bölüm korumaları derleyici (GCC/Clang) ve çekirdek belgelerinin kamuya açık tanımlarına dayanarak tek tek açar. Fikir basit: hangi korumanın hangi basamağı kestiğini bilmek, hem savunmacının neyi açık bırakmaması gerektiğini hem de bir katman aşıldığında arkada ne kaldığını gösterir.</p>

<h3>1. DEP / NX ve W^X: veri çalıştırılamaz</h3>
<p>İlk ve en temel koruma, belleğin aynı anda hem yazılabilir hem çalıştırılabilir olmasını engeller: W^X (write xor execute). Yığına (stack) ya da heap'e enjekte edilen veri artık kod olarak çalışamaz; bu, klasik shellcode enjeksiyonunu öldürür. Çekirdek de aynı ilkeyi kendi üzerinde uygular.</p>
<div class="manpage src-docs"><div class="ref">docs · kernel self-protection · W^X</div><p class="orig">Any areas of the kernel with executable memory must not be writable. … The kernel must never execute userspace memory.</p><p>Çekirdeğin çalıştırılabilir (executable) bölgeleri yazılabilir (writable) olmamalı; çekirdek asla userspace belleğini çalıştırmamalıdır. Birincisi kod yamasını, ikincisi ret2usr tarzı saldırıları keser. <strong>Sınırı:</strong> veri çalıştırılamayınca saldırgan var olan kodu yeniden kullanır — ROP (return-oriented programming) ve JOP doğar.</p></div>

<h3>2. ASLR / KASLR: adresleri gizle, ama sızıntı her şeyi açar</h3>
<p>ASLR her çalıştırmada modülleri rastgele adreslere yerleştirir (PIE ile çalıştırılabilirin kendisi de). Saldırgan gadget'ların nerede olduğunu bilmediği için önce bir bilgi sızıntısı (info leak) bulmak zorunda kalır. Korumanın gücü doğrudan entropy'ye (rastgelelik miktarına) bağlıdır: entropy düşükse kaba kuvvetle (brute force) tahmin edilebilir.</p>
<div class="deflist">
<div><dt>randomize_va_space</dt><dd>Linux'ta ASLR anahtarı: <code>0</code> kapalı, <code>1</code> mmap/stack/vdso, <code>2</code> ek olarak heap (tam ASLR). <code>/proc/sys/kernel/</code> altından okunur.</dd></div>
<div><dt>entropy</dt><dd>Rastgeleleştirilen bit sayısı. Ne kadar yüksekse tahmin o kadar zor; 32-bit sistemlerde düşük entropy ASLR'yi kaba kuvvete açık bırakır.</dd></div>
<div><dt>info leak</dt><dd>Tek bir sızdırılmış adres tüm modülün tabanını (base) çözer; ASLR o modül için etkisiz kalır. Bu yüzden leak, modern zincirlerin kilit basamağıdır.</dd></div>
</div>
<div class="manpage src-docs"><div class="ref">docs · kernel self-protection · KASLR</div><p class="orig">Printing kernel addresses to userspace leaks sensitive information about the kernel memory layout.</p><p>Çekirdek adreslerini userspace'e yazdırmak, kernel bellek düzeni hakkında hassas bilgi sızdırır. KASLR'nin tüm değeri adreslerin gizli kalmasına dayandığından, <code>dmesg</code>'de ya da bir yapı alanında sızan tek bir pointer korumayı devre dışı bırakabilir. Savunma tarafı bu yüzden adresleri <code>%pK</code> ile maskeler ve <code>kptr_restrict</code> uygular.</p></div>

<h3>3. Stack canary: dönüş adresinin bekçisi</h3>
<p>Derleyici, yerel tampon (buffer) ile kaydedilmiş dönüş adresi arasına rastgele bir "bekçi" (canary) değeri koyar ve fonksiyon dönmeden önce bu değeri kontrol eder. Klasik yığın taşması (stack overflow) dönüş adresine ulaşmak için canary'yi de ezeceğinden, uyuşmazlık yakalanır ve program güvenle sonlandırılır.</p>
<div class="manpage src-docs"><div class="ref">docs · gcc · -fstack-protector</div><p class="orig">This is done by adding a guard variable to functions with vulnerable objects. … If a guard check fails, an error message is printed and the program exits.</p><p>Koruma, savunmasız nesneler içeren fonksiyonlara bir guard variable (canary) ekleyerek yapılır; guard kontrolü başarısız olursa bir hata basılır ve program çıkar (<code>*** stack smashing detected ***</code>). <code>-fstack-protector-all</code> ise "all functions are protected" — yani seçmeli değil, her fonksiyonu korur. <strong>Sınırı:</strong> saldırgan ya canary'yi sızdırmalı ya da onu ezmeyen bir yol (örn. heap taşması, tek-byte yazma) bulmalıdır.</p></div>

<h3>4. RELRO ve FORTIFY_SOURCE: yazılabilir hedefleri daralt</h3>
<p>Bir keyfi yazma (arbitrary write) primitifi bulunduğunda, saldırganın en kolay klasik hedefi GOT (Global Offset Table) gibi fonksiyon işaretçisi tablolarıdır. <strong>Full RELRO</strong> (<code>-Wl,-z,relro,-z,now</code>), tüm sembolleri yükleme anında çözer ve GOT'u başlatmadan sonra salt okunur (read-only) yapar; böylece çalışma zamanında GOT'a yazma kapanır. Partial RELRO yalnızca bir kısmını korur. Bu, ld (bağlayıcı) belgelerinde <code>-z relro</code> ve <code>-z now</code> seçenekleri olarak tanımlıdır.</p>
<p><strong>FORTIFY_SOURCE</strong> (<code>-D_FORTIFY_SOURCE=2/3</code>) farklı bir açıdan yaklaşır: <code>memcpy</code>, <code>strcpy</code>, <code>sprintf</code> gibi tehlikeli fonksiyonların derleme anında boyutu bilinen çağrılarını, taşmayı çalışma zamanında yakalayan güvenli sürümleriyle değiştirir (glibc belgeleri). İkisi birlikte, "yazma primitifi var ama nereye?" sorusunu saldırgan için zorlaştırır: kolay hedefler kapanır, geriye vtable ve fonksiyon işaretçileri gibi daha zahmetli hedefler kalır.</p>

<h3>5. CFI, shadow stack ve BTI: akış kaçırmayı kır</h3>
<p>DEP enjeksiyonu, ASLR adres tahminini, canary yığın taşmasını kapatınca saldırgan ROP/JOP ile var olan kodu zincirlemeye çalışır. Control-flow integrity (CFI) bu basamağı hedefler: dolaylı çağrı, dönüş ve atlamaların yalnızca meşru hedeflere gitmesini doğrular. Forward-edge (dolaylı çağrı) ve backward-edge (dönüş) olmak üzere iki yönü vardır.</p>
<div class="deflist">
<div><dt>CFI (forward edge)</dt><dd>Dolaylı çağrının (indirect call) yalnızca tipe/izin listesine uyan bir hedefe gitmesini denetler; sahte fonksiyon işaretçisiyle sapmayı kırar.</dd></div>
<div><dt>shadow stack (backward edge)</dt><dd>Dönüş adreslerinin ayrı, korumalı bir kopyasını tutar; ROP dönüş adresini ezse bile uyuşmazlık yakalanır. Intel CET ve ARM'de donanım desteklidir.</dd></div>
<div><dt>BTI (ARM)</dt><dd>Branch Target Identification: dolaylı dalların yalnızca özel bir <code>BTI</code> komutuyla işaretlenmiş hedeflere inmesine izin verir; JOP gadget'larını daraltır.</dd></div>
</div>
<div class="manpage src-docs"><div class="ref">docs · gcc · -fcf-protection</div><p class="orig">This is intended to protect against such threats as Return-oriented Programming (ROP) … On x86 GNU/Linux, the implementation is based on Intel Control-flow Enforcement Technology (CET).</p><p>CFI tam olarak ROP (return-oriented programming) gibi tehditlere karşı tasarlanmıştır; x86 Linux'ta uygulama Intel CET (Control-flow Enforcement Technology) üzerine kuruludur. Apple Silicon tarafında bunun karşılığı PAC (pointer authentication) ve BTI'dır — ayrıntısı macOS ARM64 ve korumalar modüllerinde. <strong>Sınırı:</strong> CFI meşru hedefler kümesi içinde kalan "data-only" saldırılara ve COOP'a kapalı değildir; bu yüzden MTE gibi hatayı kaynağında yakalayan korumalarla katmanlanır.</p></div>

<p>Bütün resim şudur: hiçbir koruma tek başına mutlak değildir; her biri bir basamağı keser ve saldırganı daha pahalı, daha kırılgan, daha çok ön koşul (örn. bir sızıntı) gerektiren bir yola iter. Nihai çözüm ise merdivenin ilk basamağını yok etmektir — bellek-güvenli diller (Rust) ve donanım etiketleme (MTE), korumaların aştığı hatanın kendisini azaltır.</p>`
