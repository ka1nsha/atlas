  deepDive: {
    heading: "Derinlemesine: pinning bir bütünlük kontrolüdür",
    html: `<p class="lead">Certificate pinning sık yanlış anlaşılır: trafiği "daha çok şifrelediği" sanılır. Oysa TLS trafiği zaten şifreler; pinning\'in eklediği şey <strong>kiminle konuşulduğunun bütünlüğüdür</strong> (integrity) — araya giren bir tarafın geçerli ama sahte bir sertifikayla kendini sunucu yerine koymasını (MITM) engeller. Bu bölüm OWASP\'ın kamuya açık Pinning Cheat Sheet\'ine dayanır; somut bir bypass tarifi değil, pinning\'in ne yaptığını ve sınırını açar.</p>

<h3>1. Pinning tam olarak nedir?</h3>
<p>Pinning, bir host\'u beklediği sertifika ya da public key ile ilişkilendirmektir. Birden çok kabul edilebilir anahtar varsa bunların kümesine <strong>pinset</strong> denir — sertifika yenileme sırasında bağlantının kopmaması için pratikte neredeyse her zaman birden çok pin tutulur.</p>
<div class="manpage src-docs"><div class="ref">OWASP · Pinning Cheat Sheet</div><p class="orig">Pinning is the process of associating a host with their expected X509 certificate or public key. … If more than one certificate or public key is acceptable, then the program holds a pinset.</p><p>Pinning, bir host\'u beklenen X509 sertifikası veya public key\'i ile ilişkilendirme sürecidir. Birden fazla sertifika/anahtar kabul edilebilirse program bir pinset tutar. Dikkat: pinlenen şey tercihen sertifikanın tamamı değil, içindeki <strong>public key</strong>\'tir — çünkü sertifika yenilendiğinde anahtar aynı kalabilir ve pin bozulmaz.</p></div>

<h3>2. Neyi çözer: güven deposunun kötüye kullanımı</h3>
<p>Standart TLS\'te bir sertifika, cihazın güvendiği <em>herhangi bir</em> kök CA\'ya zincirleniyorsa kabul edilir. Sorun şudur: bu güven deposu geniştir ve bir noktası ele geçerse (hileli CA, cihaza elle kurulan sertifika, kurumsal MITM kutusu) saldırgan geçerli görünen bir sertifika üretebilir. Pinning tam da bu "herhangi bir CA yeter" varsayımını hedefler.</p>
<div class="manpage src-docs"><div class="ref">OWASP · neden pinning</div><p class="orig">… can be vulnerable to Man-in-the-Middle (MITM) attacks if certificate-based trusts are misused.</p><p>Sertifika temelli güvenler kötüye kullanılırsa kanallar MITM saldırılarına açık hâle gelebilir. Pinning, kabul edilen anahtar kümesini tek bir bilinen değere daraltarak bu riski azaltır: araya giren taraf geçerli bir CA zinciri sunabilse bile, public key pinset\'te olmadığı için reddedilir. Lab\'daki son iki adım tam olarak bu farkı gösterir.</p></div>

<h3>3. Nasıl uygulanır: doğrulama geri çağrısında</h3>
<p>Pinning yeni bir protokol icat etmez; mevcut TLS altyapısını sertleştirerek kullanır. Kontrol, bağlantı kurulurken kütüphanenin sunduğu bir doğrulama geri çağrısında (callback) yapılır: gelen sertifika ya da anahtar, programa gömülü değerle karşılaştırılır.</p>
<div class="manpage src-docs"><div class="ref">OWASP · uygulama</div><p class="orig">The idea is to reuse the existing protocols and infrastructure, but use them in a hardened manner. … Within the callback, you compare the retrieved certificate with the certificate embedded within the program.</p><p>Fikir, var olan protokol ve altyapıyı yeniden kullanmak ama sertleştirilmiş biçimde işletmektir. Geri çağrının (callback) içinde, alınan sertifika program içine gömülü sertifikayla karşılaştırılır. Buradaki kritik gerçek şudur: <strong>karşılaştırma istemci tarafındadır.</strong> Bu, pinning\'in hem gücü (sunucuya güvenmeden çalışır) hem de sınırıdır (istemci ortamı tümüyle ele geçerse kontrol de ele geçer).</p></div>

<h3>4. Pinning bypass neden "mümkün" kabul edilir?</h3>
<p>Saldırı yüzeyi bakışıyla kritik nokta ikinci kez vurgulanmalı: pin karşılaştırması uygulamanın kendi kodunda çalışan bir <code>if</code>\'tir. Saldırganın cihaz üzerinde tam kontrolü varsa (root/jailbreak + dinamik enstrümantasyon), bu karşılaştırmayı yapan fonksiyonun davranışı kavramsal olarak değiştirilebilir — yani pinning, <strong>uç noktanın kendisi düşman olduğunda</strong> koruma sağlamaz. Bu bir pinning kusuru değil, bir tehdit modeli gerçeğidir: istemci tarafı hiçbir kontrol, istemciyi tümüyle kontrol eden bir saldırgana karşı mutlak değildir. (Bu modül o değişikliğin <em>nasıl</em> yapıldığını anlatmaz; amacı sınırı doğru yere koymaktır.)</p>
<p>Ayrı bir pratik ayrıntı: bazı uygulamalar sistem proxy ayarını hiç dikkate almaz (<strong>proxy-unaware</strong> — örneğin kendi ağ yığınını taşıyan bazı Flutter uygulamaları). Burada trafiğin test için görünür kılınması, pinning\'den bağımsız olarak, ağ seviyesinde yönlendirme gerektirir; bu da yine yalnızca yetkili test ortamında yapılır.</p>

<h3>5. Doğru savunma duruşu</h3>
<p>OWASP pinning\'i herkes için varsayılan önermez; yanlış yönetilirse (pin kaybı → uygulama sunucusuna hiç bağlanamaz) kırılgandır. Savunma duruşu katmanlıdır:</p>
<div class="deflist">
<div><dt>Önce temel</dt><dd>Her yerde TLS, sertifika doğrulamasını asla kapatma, güncel protokol sürümleri. Pinning bunların yerine değil, üstüne gelir.</dd></div>
<div><dt>Public key pin + yedek</dt><dd>Sertifika yerine public key pinle ve pinset\'te yedek anahtar tut; rotasyonda uygulamayı kilitlememek için.</dd></div>
<div><dt>Sunucu tarafı doğrulama</dt><dd>Kritik kararları yalnızca istemciye bırakma. İstemci kontrolü kullanıcı deneyimi ve maliyet içindir; güvenlik kararının son mercii sunucudur.</dd></div>
<div><dt>Anti-fraud sinyalleri</dt><dd>Anormal istemci davranışını (ele geçmiş ortam belirtileri) tespit edip risk bazlı yanıt vermek — pinning\'i tamamlayan, onun yerini almayan bir katman.</dd></div>
</div>
<p>Özet: pinning, MITM\'e karşı güçlü bir <strong>bütünlük</strong> katmanıdır ve geniş CA güvenini daraltır; ama istemci tarafı olduğu için tek başına yeterli değildir. Doğru kullanım, onu derinlemesine savunmanın bir parçası olarak konumlandırmaktır.</p>`
