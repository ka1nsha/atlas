  deepDive: {
    heading: 'Derinlemesine: bug değil, yetenek',
    html: `<p class="lead">Bir saldırgan bir bellek hatasını "çökme" olarak değil, bir <strong>yetenek</strong> (capability) olarak okur: bu bug bana ne <em>yaptırıyor</em>? Primitif (primitive), bir bug'ın saldırgana sağladığı bu soyut yetenektir — belirli bir exploit'ten, offset'ten veya gadget'tan bağımsız olarak. Bu bölüm tamamen kavramsaldır ve yetenekleri MITRE CWE'nin kamuya açık, savunma odaklı tanımlarıyla adlandırır; amaç bir saldırıyı kurmak değil, savunmanın neyi hedeflediğini görebilmektir.</p>

<h3>1. Primitif: bug'ın soyut yeteneği</h3>
<p>Aynı tür bug (UAF, taşma, OOB) farklı programlarda çok farklı görünür; ama saldırgana sağladıkları yetenek birkaç soyut sınıfta toplanır. Bir primitif bu yüzden "hangi CVE" değil, "bana ne okutuyor/yazdırıyor/çalıştırıyor" sorusunun yanıtıdır. Bellek-bozucu bir bug'ın (memory-corruption bug) nihai ağırlığı, tam da hangi primitife yükseltilebildiğiyle ölçülür.</p>
<div class="manpage src-docs"><div class="ref">MITRE · CWE-416 · Use After Free</div><p class="orig">The product reuses or references memory after it has been freed. … execution of arbitrary code can be achieved.</p><p>Tek bir bug ("serbest bırakılmış belleği yeniden kullanmak") doğru koşullarda arbitrary code execution'a kadar yükselebilir. Bug ile sonuç arasındaki bu mesafeyi kapatan şey, aradaki primitif basamaklarıdır — bug kendiliğinden kod çalıştırmaz, önce bir yeteneğe çevrilir.</p></div>

<h3>2. Okuma primitifleri: relative read'den arbitrary read'e</h3>
<p>İlk ve çoğu zaman en değerli yetenek <strong>okuma</strong>dır. İki ucu vardır. Sınırlı uçta <strong>relative read</strong> / out-of-bounds read: saldırgan yalnızca bir tamponun yakınındaki belleği, kendi konumuna göreli okur. Güçlü uçta <strong>arbitrary read</strong>: saldırgan istediği mutlak adresi okur.</p>
<div class="manpage src-docs"><div class="ref">MITRE · CWE-125 · Out-of-bounds Read</div><p class="orig">The product reads data past the end, or before the beginning, of the intended buffer. … An attacker could get secret values such as cryptographic keys, PII, memory addresses</p><p>Sınır dışı okumanın confidentiality sonucu doğrudan tanımda: saldırgan cryptographic key, PII ve <strong>memory address</strong> gibi gizli değerleri ele geçirebilir. Burada en kritik ganimet adrestir — çünkü sızan tek bir pointer, bir sonraki basamağın anahtarıdır.</p></div>
<p>Bir adresin neden bu kadar değerli olduğunu <strong>information disclosure</strong> primitifi açıklar: modern sistemlerde ASLR/KASLR modül tabanını her çalıştırmada rastgeleleştirir, dolayısıyla saldırgan "nereye" yazacağını baştan bilemez. Sızdırılan tek bir pointer'dan sabit bir derleme-zamanı offset'i çıkararak modül tabanı hesaplanır ve rastgelelik etkisiz kalır. Bu yüzden bir info leak neredeyse her zaman zincirin <em>ilk</em> adımıdır.</p>
<div class="manpage src-docs"><div class="ref">MITRE · CWE-200 · Exposure of Sensitive Information</div><p class="orig">The product exposes sensitive information to an actor that is not explicitly authorized to have access to that information.</p><p>Bir bilgi sızıntısı tek başına "kod çalıştırmaz"; ama yetkisiz tarafa bir adres açarak ASLR'yi işlevsiz bırakır ve sonraki keyfi okuma/yazma adımlarının hedefini belirlenebilir kılar. Savunma tarafında bu, "zararsız görünen" bir okuma bug'ının neden ciddiye alındığını açıklar.</p></div>

<h3>3. Yazma primitifi: write-what-where</h3>
<p>Okumadan sonraki basamak <strong>yazma</strong>dır. En güçlü soyut biçimi klasik adıyla <em>write-what-where</em>'dir: saldırgan hangi değeri (what) hangi adrese (where) yazacağını seçebilir. Bu noktada artık veri değil, programın durumu (state) kontrol edilir.</p>
<div class="manpage src-docs"><div class="ref">MITRE · CWE-123 · Write-what-where Condition</div><p class="orig">Any condition where the attacker has the ability to write an arbitrary value to an arbitrary location … Even when the attacker can only modify a single byte arbitrary code execution can be possible.</p><p>Tanım, yeteneği iki serbestlik derecesiyle verir: keyfi değer (what) ve keyfi konum (where). CWE'nin altını çizdiği nokta savunma açısından çarpıcıdır: saldırgan yalnızca <strong>tek bir byte</strong> değiştirebilse bile arbitrary code execution mümkün olabilir. Bu yüzden "küçük" bir yazma bug'ı küçük bir risk değildir.</p></div>
<p>Keyfi yazma hemen kod çalıştırmaz; bir sonraki basamağa köprüdür. Saldırgan onu, kontrol akışını yönlendiren bir hedefi üzerine yazmak için kullanır.</p>

<h3>4. Control-flow hijack'e giden yol</h3>
<p>Son basamak <strong>control-flow hijack</strong>: yürütmenin saldırganın seçtiği yere gitmesi. Yazma primitifinin doğal hedefleri, CPU'nun "bundan sonra nereye gideceğim?" kararını tutan konumlardır — bu yüzden dönüş adresi (return address), function pointer, GOT girdileri ve C++ vtable'ları klasik hedeftir: üzerlerine yazmak doğrudan bir sonraki dalı (branch) saldırgana devreder.</p>
<p>DEP/NX saldırganın yazdığı veriyi kod olarak çalıştırmayı engelleyince, saldırgan kendi kodunu enjekte etmek yerine var olan kod parçalarını zincirler (code-reuse). Bunun kavramsal adı <strong>ROP</strong>'tur; bu modül bilinçli olarak somut gadget/offset vermez, yalnızca "bir koruma bir yolu kapatınca saldırganın başka yol araması" fikrini adlandırır.</p>

<h3>5. Zincir ve her basamağı kıran koruma</h3>
<p>Primitifler bir merdiven oluşturur: zayıf bir bug, basamak basamak daha güçlü yeteneklere çevrilir ve çoğu zaman tek bir basamak tek başına yetmez. Savunmayı anlamak, her basamağın karşısına onu hangi korumanın (mitigation) zorlaştırdığını koymaktır — çünkü her koruma tam da belirli bir primitifi hedefler.</p>
<div class="deflist">
<div><dt>information disclosure</dt><dd>Hedef: adres sızdırıp ASLR'yi yenmek. Onu zorlaştıran: <strong>ASLR / KASLR</strong> (tahmin edilmesi gereken entropiyi artırır).</dd></div>
<div><dt>arbitrary read</dt><dd>Hedef: çekirdek/iç yapıları okumak. Onu zorlaştıran: <strong>PAN / SMAP</strong> (çekirdeğin kullanıcı belleğine gelişigüzel erişimini keser).</dd></div>
<div><dt>write-what-where</dt><dd>Hedef: kritik tabloları/durumu üzerine yazmak. Onu zorlaştıran: <strong>RELRO</strong>, read-only GOT/vtable, sayfa izinleri.</dd></div>
<div><dt>kod enjeksiyonu</dt><dd>Hedef: yazılan veriyi çalıştırmak. Onu zorlaştıran: <strong>DEP / NX, W^X</strong> (yazılabilir sayfa çalıştırılamaz).</dd></div>
<div><dt>control-flow hijack</dt><dd>Hedef: yürütmeyi yönlendirmek. Onu zorlaştıran: <strong>CFI, PAC, shadow stack</strong> (geçerli dal hedeflerini / dönüş adreslerini doğrular).</dd></div>
</div>
<p>İki sonuç çıkar. Birincisi, korumalar tek tek değil <strong>katmanlı</strong> (defense in depth) anlamlıdır: biri bir basamağı kapatınca saldırgan komşu basamağa kayar, o da kapalı olmalıdır. İkincisi, en köktenci savunma merdivenin <em>ilk</em> basamağını yok etmektir — bellek-güvenli diller ve MTE gibi önlemler bug'ı bir primitife dönüşmeden, kaynağında yakalamayı hedefler.</p>`
  },
