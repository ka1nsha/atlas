  deepDive: {
    heading: 'Derinlemesine: derlenmişi geri okumanın yöntemi',
    html: `<p class="lead">Tersine mühendislik (reverse engineering), kaynağı elinde olmayan bir ikiliyi (binary) insan tarafından anlaşılır hâle getirme disiplinidir: makine kodundan assembly'e, oradan okunur mantığa ve çalışma-anı davranışına inmek. Bu bölüm araçların kendi resmî belgelerine dayanır; tüm çalışma kendi derlediğin ya da analiz etme iznin olan bir ikili üzerinde yapılır. Amaç kırma tarifi değil, kapalı bir bileşeni denetleyebilme becerisidir.</p>

<h3>1. İki temel mod: static vs dynamic analysis</h3>
<p>Her tersine mühendislik oturumu iki moddan birine ya da ikisine birden dayanır. İkisi aynı ikiliye farklı pencerelerden bakar ve birbirini doğrular: statik "ne olabilir"i, dinamik "ne oluyor"u gösterir.</p>
<div class="deflist">
<div><dt>Static analysis</dt><dd>İkiliyi <strong>çalıştırmadan</strong> incelemek. Tüm kod yolları (code paths) görünür ama hangisinin gerçekte yürüyeceği belirsizdir — bir fotoğraf gibi. Disassembly, decompilation, symbol ve string çıkarımı bu moddadır. Zararlı yazılım (malware) analizinde tercih edilir: şüpheli kodu çalıştırmadan okursun.</dd></div>
<div><dt>Dynamic analysis</dt><dd>Programı bir debugger ya da instrumentation aracıyla <strong>çalıştırırken</strong> izlemek. Yalnızca gidilen yol görünür ama register ve bellek gerçek değerlerle okunur — bir film gibi. Breakpoint, single-step, bellek inceleme ve çağrı izleme (tracing) buradadır.</dd></div>
</div>
<p>Pratikte önce statik analizle harita çıkarılır (fonksiyonlar, string'ler, ilgi çeken dallar), sonra dinamik analizle o haritadaki hipotez gerçek değerlerle sınanır.</p>

<h3>2. Disassembler ve decompiler: makine kodunu yükseltmek</h3>
<p>Statik analizin iki seviyesi vardır. Bir <strong>disassembler</strong> ham baytları işlemci komutlarına (assembly) çevirir; bir <strong>decompiler</strong> bir adım daha gider ve assembly'i C benzeri, okunur bir sözde-koda yükseltir. NSA'nın açık kaynak yaptığı Ghidra bu alanın en bilinen ücretsiz aracıdır ve tam bir SRE (software reverse engineering) çatısıdır.</p>
<div class="manpage src-docs"><div class="ref">Ghidra · README</div><p class="orig">Ghidra is a software reverse engineering (SRE) framework developed by NSA's Research Directorate for NSA's cybersecurity mission.</p><p>Ghidra, NSA Araştırma Direktörlüğü'nün kendi siber güvenlik görevi için geliştirdiği ve sonradan açık kaynak yaptığı bir software reverse engineering çatısıdır. İçinde disassembler, decompiler, script motoru ve çapraz referans (cross-reference) görünümleri bir arada gelir; aynı ikiliye hem assembly hem C benzeri pencereden bakmanı sağlar.</p></div>
<p>radare2/rizin ve ticari IDA Pro aynı işi farklı arayüzlerle yapar. Bir decompiler çıktısı her zaman <em>temsilîdir</em>: derleyicinin ürettiği assembly'den geri üretilmiş bir tahmindir, orijinal kaynak kod değil. Değişken adları, yorumlar ve tip bilgisi çoğu zaman kaybolmuştur; analist bunları bağlamdan yeniden kurar.</p>

<h3>3. Dinamik analiz: debugger ve instrumentation</h3>
<p>Dinamik tarafın klasik aracı debugger'dır. GNU projesinin gdb'si, bir programın içinde çalışırken ne olup bittiğini görmeni sağlar — standart man/manual tanımı bu amacı tek cümlede özetler.</p>
<div class="manpage src-docs"><div class="ref">GNU gdb · manual</div><p class="orig">GDB, the GNU Project debugger, allows you to see what is going on 'inside' another program while it executes -- or what another program was doing at the moment it crashed.</p><p>gdb, başka bir programın yürürken "içinde" ne olduğunu — ya da çöktüğü (crash) anda ne yapmakta olduğunu — görmeni sağlar. Pratikte bu, bir fonksiyona breakpoint koyup programı orada durdurmak, argümanları ve register'ları (ör. <code>$rdi</code>) gerçek değerleriyle okumak demektir. Lab'daki <code>check_license</code> örneğinde statik tahmini canlı gözlemle doğrulamak tam olarak budur.</p></div>
<p>Debugger'ın ötesinde, çalışan bir sürece kod enjekte ederek davranışını izleyen <strong>dynamic instrumentation</strong> araçları vardır. Frida bu alanın en yaygınıdır ve kendini doğrudan geliştiriciler ile tersine mühendisler için tanımlar.</p>
<div class="manpage src-docs"><div class="ref">Frida · tagline</div><p class="orig">Dynamic instrumentation toolkit for developers, reverse-engineers, and security researchers.</p><p>Frida, geliştiriciler, reverse-engineer'lar ve güvenlik araştırmacıları için bir dynamic instrumentation araç takımıdır. Çalışan bir uygulamaya küçük script'ler enjekte edip fonksiyon çağrılarını yakalamanı (hook), argümanları ve dönüş değerlerini okumanı/değiştirmeni sağlar. Kaynak kod gerektirmez; bu yüzden kapalı kaynak bir uygulamanın gerçek çalışma-anı davranışını gözlemlemekte güçlüdür.</p></div>

<h3>4. Bir bug'ı ikilide bulmak: semboller, string'ler, patch diffing</h3>
<p>Analist bir ikiliye körlemesine dalmaz; en ucuz ipuçlarından başlar. <code>strings</code> gömülü metinleri (anahtar, URL, hata mesajı) saniyeler içinde döker; <code>nm</code>/<code>readelf</code> sembol tablosundan fonksiyon haritasını çıkarır. ELF ve Mach-O modüllerinde gördüğün dosya yapısı tam da bu araçların okuduğu haritadır.</p>
<div class="deflist">
<div><dt>Symbol &amp; string keşfi</dt><dd>İsimler ve metinler ilk yön levhasıdır: <code>check_license</code> gibi bir sembol mantığın nerede olduğunu doğrudan söyler. <strong>Stripped</strong> (çıkarılmış) bir ikilide semboller silinmiştir; iş desen ve çapraz referansa kalır.</dd></div>
<div><dt>Patch diffing</dt><dd>Bir yama (patch) yayımlandığında, yama öncesi ve sonrası ikilileri karşılaştırmak düzeltilen fonksiyonu — dolayısıyla kapatılan açığın yerini — ortaya çıkarır. Savunmada hızlı değerlendirme için; saldırıda "n-day" tespiti için kullanılan iki ucu keskin bir tekniktir.</dd></div>
</div>

<h3>5. Anti-RE ve etik çerçeve</h3>
<p>Yazılımlar tersine mühendisliği zorlaştırmak için <strong>obfuscation</strong> (kodu okunmaz kılma), <strong>anti-debug</strong> (debugger varlığını tespit edip davranış değiştirme), string şifreleme ve sanallaştırma gibi teknikler kullanır. Bunlar maliyeti artırır ama mutlak koruma sağlamaz: yeterli zamanla statik ve dinamik analiz birbirini tamamlayarak obfuscation'ı çözer, anti-debug kontrolleri ise çalışma-anında atlatılabilir. Güvenlik mühendisliğinin değişmez ilkesidir — gizlilikle güvenlik (security through obscurity) tek başına savunma değildir.</p>
<p>Tersine mühendislik meşru ve çoğu yerde yasal bir beceridir: birlikte çalışabilirlik (interoperability), malware analizi, bug avı ve kendi yazılımını denetleme. Yine de yasal sınır ülkeye ve lisansa göre değişir. İlke nettir: analizini yalnızca <strong>kendi ikililerinde ya da açık izinli (yetkili) hedeflerde</strong> uygula; başkasının yazılımını izinsiz çözmek ya da koruma kırmak bu modülün kapsamı dışındadır.</p>`
