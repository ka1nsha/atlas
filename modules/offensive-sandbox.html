  deepDive: {
    heading: "Derinlemesine: sandbox bir izin listesidir, kaçış izinli bir kapıdır",
    html: `<p class="lead">Sandbox'ı doğru anlamanın anahtarı şudur: o bir duvar değil, bir <strong>izin listesidir (allow-list)</strong>, ve onu süreç değil çekirdek zorlar. Dolayısıyla kaçış neredeyse hiçbir zaman "duvarı kırmak" değildir — profilde izin verilmiş bir kapıdan, çoğunlukla bir IPC kanalından, daha ayrıcalıklı bir bileşeni kandırarak geçmektir. Bu bölüm Chromium sandbox tasarım belgesi ve Apple Platform Security'nin kamuya açık metinlerine dayanır; kavramsaldır, çalışır kaçış adımı içermez.</p>

<h3>1. Sandbox ne için var: ihlal sonrası hasar sınırlama</h3>
<p>Sandbox, bir sürecin ele geçirileceğini baştan kabul eder ve amacını buna göre daraltır: ele geçirilen süreç kalıcı zarar veremesin, yanındakine bulaşamasın. Chromium bunu açıkça "ihlali varsay" (assume breach) üzerine kurar.</p>
<div class="manpage src-docs"><div class="ref">Chromium · sandbox design</div><p class="orig">Sandbox leverages the OS-provided security to allow code execution that cannot make persistent changes to the computer</p><p>Sandbox, işletim sisteminin sağladığı güvenliği kullanarak kodun <strong>bilgisayarda kalıcı değişiklik yapamayacağı</strong> bir çalışma ortamı kurar. Yani hedef, kötü kodu engellemek değil — zaten çalıştığını varsayıp etkisini geçici ve sınırlı tutmaktır.</p></div>
<div class="manpage src-docs"><div class="ref">Chromium · threat model</div><p class="orig">Assume sandboxed code is malicious code: For threat-modeling purposes, we consider the sandbox compromised</p><p>Tasarım, sandbox içindeki kodu doğrudan <em>kötü niyetli</em> sayar; tehdit modeli açısından sandbox'ı daha baştan "ele geçirilmiş" kabul eder. Bu, lab'daki başlangıç durumunun — ele geçirilmiş süreç — neden gerçekçi olduğunu açıklar.</p></div>
<p>Apple tarafında aynı fikir app sandbox olarak somutlaşır: her uygulama kendi alanına hapsedilir ve dışarıya yalnızca sistemin açıkça sunduğu servisler üzerinden uzanabilir.</p>
<div class="manpage src-apple"><div class="ref">Apple Platform Security · app sandbox</div><p class="orig">Sandboxing is designed to prevent apps from gathering or modifying information stored by other apps</p><p>Sandbox'ın tasarım amacı, bir uygulamanın <strong>başka uygulamaların verisini toplamasını ya da değiştirmesini</strong> engellemektir. Yani izolasyon yatay bir duvardır: bir uygulama çökse bile komşusuna erişemez.</p></div>

<h3>2. Politika modeli: izin verilen ne varsa, yüzey odur</h3>
<p>Bir sandbox profili, sürecin yapabileceklerini tek tek sayar: hangi syscall'lar, hangi dosyalar, hangi IPC kanalları. Geri kalan her şey varsayılan olarak reddedilir. Bu yüzden saldırı yüzeyi (attack surface) tam olarak <strong>profilde izin verilen kümedir</strong> — ne eksik, ne fazla. Profilin mutlaka bıraktığı kapı ise ayrıcalıklı servislere açılan IPC'dir, çünkü sandbox'lı süreç işini tek başına yapamaz.</p>
<div class="deflist">
<div><dt>allow-list</dt><dd>Süreç yalnızca açıkça izin verilene erişir; eksik bırakılan her şey reddedilir. Güvenli varsayılan budur: "yoksa yasak".</dd></div>
<div><dt>mandatory</dt><dd>Politikayı çekirdek uygular, süreç değil. Süreç kendi kısıtlamasını kaldıramaz — bu yüzden duvar "içeriden" kırılamaz.</dd></div>
<div><dt>least privilege</dt><dd>Profil, işi yapmaya yetecek en dar kümeyle sınırlanır. Erişilemeyen kaynak, saldırılamayan kaynaktır.</dd></div>
<div><dt>attack surface</dt><dd>Profilde izin verilen her kanal/kaynak. Daraldıkça kaçış yüzeyi küçülür; gereksiz her izin risktir.</dd></div>
</div>
<div class="manpage src-docs"><div class="ref">Chromium · least privilege</div><p class="orig">Principle of least privilege: This should be applied both to the sandboxed code and to the code that controls the sandbox.</p><p>En az ayrıcalık (least privilege) yalnızca sandbox içindeki koda değil, <strong>sandbox'ı kontrol eden koda da</strong> uygulanmalıdır. Bu, lab'ın son dersidir: broker/servis tarafı da en dar yetkiyle çalışmazsa, onu kandıran saldırgan büyük bir kazanç elde eder.</p></div>

<h3>3. Neden kaçışın adresi IPC'dir: broker ve confused deputy</h3>
<p>Sandbox'lı bir süreç yasak bir işi yapmak istediğinde onu kendisi yapmaz; ayrıcalıklı bir <strong>broker</strong>'a (macOS'ta XPC servisleri, Android'de Binder ile erişilen sistem servisleri, Chromium'da broker süreci) IPC üzerinden ricada bulunur. İzinli işlem broker tarafından çalıştırılıp sonuç geri döner.</p>
<div class="manpage src-docs"><div class="ref">Chromium · broker model</div><p class="orig">The policy-allowed calls are then executed by the broker and the results returned to the target process via the same IPC.</p><p>Politikanın izin verdiği çağrılar <strong>broker tarafından</strong> çalıştırılır ve sonuç aynı IPC üzerinden hedef sürece döner. İşte kaçışın kaldıracı tam burada: eğer broker, isteğin <em>kimden</em> geldiğini ve o kişinin o işe yetkili olup olmadığını doğrulamazsa, sandbox içindeki sürecin yapamadığı işi onun adına kendi yüksek yetkisiyle yapar. Bu, "kafası karışık vekil" (confused deputy) tam da budur.</p></div>
<p>Bu yüzden sağlam sandbox tasarımı, ayrıcalıklı işi ayrı sürece taşımayı zorunlu kılar — ve o süreci de kendi kafesine koyar.</p>
<div class="manpage src-docs"><div class="ref">Chromium · isolation</div><p class="orig">Anything that needs to be sandboxed needs to live on a separate process.</p><p>Sandbox'lanması gereken her şey <strong>ayrı bir süreçte</strong> yaşamalıdır. İzolasyonun birimi süreçtir; aynı süreç içinde "güvenli bölge" yoktur. Kaçış da bu süreç sınırının (trust boundary) IPC üzerinden aşılmasıdır.</p></div>

<h3>4. Ayrıcalık yükselmesini neyin kestiği: imzalı entitlement ve katmanlı savunma</h3>
<p>Apple, sandbox'ın bıraktığı yetkileri (entitlement) kod imzasına bağlar: bir süreç çalışırken kendi yetkisini genişletemez, çünkü yetki listesi imzalıdır ve değiştirilemez.</p>
<div class="manpage src-apple"><div class="ref">Apple Platform Security · entitlements</div><p class="orig">Since entitlements are digitally signed, they can't be changed. … This greatly reduces the potential for privilege escalation by a compromised system app or daemon.</p><p>Entitlement'lar dijital imzalı olduğu için <strong>değiştirilemez</strong>; bu da ele geçirilmiş bir sistem uygulaması ya da daemon'ın ayrıcalık yükseltme (privilege escalation) olasılığını büyük ölçüde azaltır. Yani saldırgan kandırdığı servisten ancak servisin zaten sahip olduğu yetki kadarını alabilir — fazlasını değil. Bu, broker'ı da en dar yetkiyle çalıştırmanın (least privilege) neden kritik olduğunu gösterir.</p></div>
<p>Pratik savunma iki ilkeyi birleştirir ve bu modülün özetidir:</p>
<div class="deflist">
<div><dt>caller validation</dt><dd>Broker/servis, her isteğin kimliğini (audit token, UID, yetki) doğrular ve en dar işi yapar. Kaçışların çoğu tam burada, eksik doğrulamada doğar.</dd></div>
<div><dt>attack surface reduction</dt><dd>Profilden gereksiz her IPC kanalı ve syscall çıkarılır. Linux'ta seccomp-BPF, macOS'ta Seatbelt profilleri bunun aracıdır.</dd></div>
<div><dt>defense in depth</dt><dd>Tek duvar yerine katman: her servis kendi küçük sandbox'ında, en az yetkiyle. Bir vekil kandırılsa bile kazanç sınırlı kalır.</dd></div>
</div>
<p>Bağlantı: Linux tarafında aynı izolasyonun yapı taşları <code>namespaces</code>/cgroups ve seccomp modüllerinde, macOS tarafında Seatbelt'in kendisi <strong>macOS Sandbox</strong> modülünde işlenir. Bu modülün kavramları (trust boundary, least privilege, confused deputy) doğrudan <strong>tehdit modeli</strong> modülünden gelir ve bir sonraki durak olan <strong>kernel saldırı yüzeyi</strong> modülüne bağlanır: ayrıcalıklı servise ulaşmak çoğu zaman çekirdeğe giden zincirin yalnızca ilk halkasıdır.</p>`
