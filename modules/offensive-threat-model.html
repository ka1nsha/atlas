  deepDive: {
    heading: "Derinlemesine: tehdit modelleme bir yöntemdir",
    html: `<p class="lead">Tehdit modeli (threat model) sezgisel bir "bu sistem güvenli mi?" tahmini değil, tekrarlanabilir bir yöntemdir. Dört soruya sırayla yanıt arar ve çıktısı paylaşılabilir, denetlenebilir bir tablodur. Bu bölüm OWASP ve Microsoft'un kamuya açık güvenlik belgelerine dayanır; hedef alınmış saldırı değil, saldırganın ve savunmacının ortak haritasını kurma disiplinidir.</p>

<h3>1. Tehdit modeli nedir, ne işe yarar?</h3>
<p>Bir tehdit modeli, bir sistemin güvenliğini etkileyen bilgilerin yapılandırılmış bir temsilidir. Amaç kusursuz bir sistem tasarlamak değil; hangi tehditlerin var olduğunu açıkça görmek ve her biri için bilinçli bir karar (azaltma, kabul, devretme) vermektir.</p>
<div class="manpage src-docs"><div class="ref">OWASP · Threat Modeling</div><p class="orig">A threat model is a structured representation of all the information that affects the security of an application. … Threat modeling is a family of activities for improving security by identifying threats, and then defining countermeasures to prevent, or mitigate the effects of, threats to the system.</p><p>Tehdit modeli, bir uygulamanın güvenliğini etkileyen tüm bilginin yapılandırılmış bir temsilidir. Tehdit modelleme ise tehditleri belirleyip her biri için countermeasure (karşı önlem) tanımlayarak güvenliği iyileştiren bir etkinlik ailesidir. Anahtar fikir şudur: kararlar sezgiyle değil, "tüm bilgi masadayken" rasyonel biçimde verilir.</p></div>
<p>Bu yüzden tehdit modeli tek seferlik bir denetim değildir; sistem değiştikçe güncellenir.</p>
<div class="manpage src-docs"><div class="ref">OWASP · ne zaman</div><p class="orig">Threat modeling is best applied continuously throughout a software development project.</p><p>Tehdit modelleme en iyi, bir yazılım projesi boyunca sürekli uygulandığında işe yarar. Mimari değiştiğinde yeni bir giriş noktası (entry point) ya da yeni bir güven sınırı (trust boundary) doğar; model onunla birlikte güncellenmezse eskir.</p></div>

<h3>2. Dört soru: yöntemin iskeleti</h3>
<p>OWASP tehdit modellemeyi dört soruya indirger. Saldırgan da savunmacı da aynı dört soruya bakar; yalnızca niyetleri terstir.</p>
<div class="deflist">
<div><dt>What are we working on?</dt><dd>Kapsamı ve varlıkları (assets) belirle: neyi koruyoruz, sistem hangi bileşenlerden oluşuyor, veri nereden nereye akıyor. Güven sınırları bu adımda çizilir.</dd></div>
<div><dt>What can go wrong?</dt><dd>Her giriş noktası için tehditleri çıkar. Beyin fırtınası ya da STRIDE, kill chain, attack tree gibi yapılandırılmış yöntemler kullanılır.</dd></div>
<div><dt>What are we going to do about it?</dt><dd>Her tehdit için karar ver: azalt (mitigate), kabul et, devret ya da ortadan kaldır. Bu adımın çıktısı countermeasure listesidir.</dd></div>
<div><dt>Did we do a good enough job?</dt><dd>Modeli gözden geçir: eldeki sisteme yetecek kadar iyi mi? Eksik kalan sınır veya doğrulanmamış giriş var mı?</dd></div>
</div>
<div class="manpage src-docs"><div class="ref">OWASP · dört soru</div><p class="orig">Did you do a good enough job for the system at hand?</p><p>Son soru kasıtlı olarak görelidir: "eldeki sisteme yetecek kadar iyi iş çıkardın mı?" Bir not uygulaması ile bir ödeme sistemi aynı eşiği gerektirmez. Tehdit modeli mükemmeliyet değil, <strong>yeterlilik</strong> arar.</p></div>

<h3>3. STRIDE: "ne kötüye gidebilir?" sorusunu sınıflandırmak</h3>
<p>İkinci sorunun ("what can go wrong?") en yaygın yanıt çerçevesi STRIDE'dır. Altı tehdit sınıfının her biri bir güvenlik özelliğini (security property) ihlal eder. Bir giriş noktasına bu altı mercekle tek tek bakmak, gözden kaçan tehdidi azaltır.</p>
<div class="deflist">
<div><dt>Spoofing</dt><dd>Başkasının kimlik bilgilerini (username/password gibi authentication bilgisi) ele geçirip onun yerine geçmek. İhlal edilen özellik: <strong>authentication</strong> (kimlik doğrulama).</dd></div>
<div><dt>Tampering</dt><dd>Verinin kötü niyetle değiştirilmesi — diskteki kalıcı veri ya da ağda akan veri üzerinde. İhlal edilen özellik: <strong>integrity</strong> (bütünlük).</dd></div>
<div><dt>Repudiation</dt><dd>Bir kullanıcının yaptığı işlemi inkâr etmesi ve sistemin bunu kanıtlayamaması. İhlal edilen özellik: <strong>non-repudiation</strong> (inkâr edilemezlik).</dd></div>
<div><dt>Information disclosure</dt><dd>Bilginin erişim yetkisi olmayan kişilere açılması — yetkisiz dosya okuma ya da transit veriyi dinleme. İhlal edilen özellik: <strong>confidentiality</strong> (gizlilik).</dd></div>
<div><dt>Denial of service</dt><dd>Geçerli kullanıcılara hizmetin reddi — bir sunucuyu erişilmez kılmak. İhlal edilen özellik: <strong>availability</strong> (erişilebilirlik).</dd></div>
<div><dt>Elevation of privilege</dt><dd>Yetkisiz bir kullanıcının ayrıcalıklı erişim kazanması. İhlal edilen özellik: <strong>authorization</strong> (yetkilendirme). İç içe sistemlerde en ağır sınıf budur.</dd></div>
</div>
<div class="manpage src-docs"><div class="ref">Microsoft · STRIDE · EoP</div><p class="orig">An unprivileged user gains privileged access and thereby has sufficient access to compromise or destroy the entire system … an attacker has effectively penetrated all system defenses and become part of the trusted system itself, a dangerous situation indeed.</p><p>Ayrıcalık yükseltmede (elevation of privilege) yetkisiz bir kullanıcı ayrıcalıklı erişim kazanır ve tüm sistemi tehlikeye atacak yetkiye ulaşır. Microsoft'un tanımıyla saldırgan "tüm savunmaları aşıp güvenilen sistemin bir parçası hâline gelmiştir". Bu yüzden lab'da app→kernel sınırını aşmak en kritik senaryo olarak işaretlendi: o sınırı aşmak ring 0 demektir.</p></div>

<h3>4. Attack surface: neden daraltılır?</h3>
<p>Saldırı yüzeyi (attack surface), güvenilmeyen tarafın güvenilen tarafa veri soktuğu tüm giriş noktalarının toplamıdır: her syscall, her <code>ioctl(/dev/*)</code>, her ağ portu, her dosya ayrıştırıcı (parser). İki değişmez kural vardır:</p>
<ul>
<li><strong>Yüzey ne kadar genişse risk o kadar yüksektir</strong> — çünkü her giriş noktası ayrı ayrı doğru doğrulanmak zorundadır ve tek bir zayıf nokta yeter.</li>
<li><strong>Saldırgan en zayıf halkayı seçer</strong> — en güçlü korunan yolu değil, en kötü doğrulanan ve en geniş yüzeyi. Bu yüzden savunmanın ilk adımı kullanılmayan girişleri kapatıp yüzeyi küçültmektir (attack surface reduction).</li>
</ul>
<p>Yüzey daraltma, <strong>least privilege</strong> (en az ayrıcalık) ilkesinin somut hâlidir: bir bileşene yalnızca işini yapacak kadar erişim verilir, fazlası kapatılır. seccomp-BPF ile syscall kümesini kısmak, bir servisin açık portlarını azaltmak, kullanılmayan sürücüleri derlemeden çıkarmak — hepsi aynı fikrin uygulamalarıdır.</p>

<h3>5. Trust boundary: doğrulamanın zorunlu olduğu çizgi</h3>
<p>Güven sınırı (trust boundary), ayrıcalığın değiştiği her çizgidir: remote→app, app→servis, app/servis→kernel, kernel→secure world. Tanımın pratik sonucu nettir: <strong>bir sınırı aşan her veri, güvenilmeyen taraftan geldiği için doğrulanmalıdır.</strong> Sınırın güvenilen tarafında "nasılsa bizim bileşenimiz gönderdi" varsayımı, güven sınırı kavramının çöküşüdür.</p>
<p>Modern savunma iki ilkeyi birleştirir. <strong>Defense in depth</strong> (derinlemesine savunma): tek bir kontrol değil, her sınırda üst üste kontroller — biri aşılsa diğeri tutar (seccomp + SELinux + KASLR + PAC birlikte). <strong>Assume breach</strong> (ihlali varsay): bir katmanın er geç aşılacağını kabul edip "aşılırsa saldırgan ne kadar ilerleyebilir?" diye tasarlamak. İkisi birlikte, tek bir açığın tüm sistemi düşürmesini engellemeyi hedefler.</p>
<p>Bu harita serinin geri kalanının iskeletidir: sonraki modüller her sınırın giriş noktalarını — bellek hataları, sömürü primitifleri, korumalar, sandbox kaçışı, kernel saldırı yüzeyi — tek tek, yine yalnızca kavram ve kamuya açık vaka düzeyinde açar.</p>`
