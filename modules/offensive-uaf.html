  deepDive: {
    heading: "Derinlemesine: bellek güvenliği hata sınıfları",
    html: `<p class="lead">Use-after-free tek bir hata değil, bir ailenin en görünür üyesidir. Bu bölüm bellek güvenliği (memory safety) ihlallerini kök nedenleriyle sınıflandırır: neden C/C++'ta yoğunlaşırlar, birbirlerinden nasıl ayrılırlar ve hangi savunma her birini kaynağında keser. Tüm tanımlar MITRE CWE kataloğu ve derleyici sanitizer belgeleri gibi kamuya açık savunma kaynaklarına dayanır; amaç mekanizmayı tanımak, sömürü primitifi kurmak değil.</p>

<h3>1. İki eksen: temporal ve spatial safety</h3>
<p>Bellek güvenliği iki bağımsız garantinin birleşimidir. <strong>Spatial safety</strong> (uzamsal güvenlik): bir erişim nesnenin sınırları içinde kalır — ne öncesine ne de sonrasına taşar. <strong>Temporal safety</strong> (zamansal güvenlik): bir erişim nesnenin yaşadığı zaman aralığında olur — tahsis edildikten sonra, serbest bırakılmadan önce. Her bellek hatası bu iki eksenden en az birini ihlal eder: overflow ve OOB uzamsal, use-after-free ve double-free zamansal ihlallerdir.</p>
<div class="deflist">
<div><dt>temporal safety</dt><dd>Nesneye yalnızca geçerli (canlı) olduğu sürece erişilir. İhlali: dangling pointer üzerinden erişim — use-after-free, double-free, use-after-return.</dd></div>
<div><dt>spatial safety</dt><dd>Erişim nesnenin tahsis edilmiş sınırları içinde kalır. İhlali: sınır dışına okuma/yazma — heap/stack overflow, out-of-bounds (OOB).</dd></div>
</div>

<h3>2. Use-after-free: zamansal ihlalin anatomisi</h3>
<p>UAF'in kök tanımı CWE-416'da nettir: bellek serbest bırakıldıktan sonra hâlâ kullanılır. Kritik nokta <em>yeniden tahsis</em>tir — serbest bırakılan bölge başka bir nesneye verilince, eski işaretçi (dangling pointer) artık yeni nesnenin baytlarını okur/yazar. Lab'daki <code>s</code> ve <code>note</code> çakışması tam olarak budur.</p>
<div class="manpage src-docs"><div class="ref">CWE-416 · Use After Free</div><p class="orig">The product reuses or references memory after it has been freed. … At some point afterward, the memory may be allocated again and saved in another pointer, while the original pointer references a location somewhere within the new allocation. Any operations using the original pointer are no longer valid because the memory "belongs" to the code that operates on the new pointer.</p><p>Bellek serbest bırakıldıktan sonra yeniden kullanılır veya referans edilir. Bir süre sonra o bellek yeniden tahsis edilip başka bir pointer'a atanabilir; orijinal pointer ise yeni tahsisin içindeki bir konumu gösterir. Orijinal pointer üzerinden yapılan işlemler artık geçersizdir, çünkü bellek yeni pointer ile çalışan koda "aittir". Tehlikenin kaynağı budur: aynı baytlar iki ayrı anlam taşır.</p></div>
<p>Buradaki <em>dangling pointer</em> (sarkan işaretçi) kavramı UAF'in merkezidir: serbest bırakma işaretçiyi sıfırlamaz, sadece belleği tahsis ediciye iade eder. İşaretçi hâlâ eski adresi tutar.</p>
<div class="manpage src-docs"><div class="ref">CWE-416 · dangling pointer</div><p class="orig">a pointer that no longer points to valid memory, often after it has been freed</p><p>Sarkan işaretçi: artık geçerli belleği göstermeyen, çoğunlukla serbest bırakma sonrası bu hâle gelen işaretçi. Savunmanın en ucuz adımı bu yüzden <code>free(p); p = NULL;</code> alışkanlığıdır — sarkan işaretçiyi kaynağında yok eder.</p></div>

<h3>3. Komşu sınıflar: double-free ve out-of-bounds</h3>
<p>Aynı zamansal/uzamsal çerçevede iki hata daha sık görülür. <strong>Double-free</strong> yine zamansaldır ama bu kez tahsis edicinin kendi defterini bozar; <strong>out-of-bounds write</strong> uzamsaldır ve komşu belleği ezer.</p>
<div class="manpage src-docs"><div class="ref">CWE-415 · Double Free</div><p class="orig">The product calls free() twice on the same memory address. … the program's memory management data structures may become corrupted, potentially leading to the reading or modification of unexpected memory addresses.</p><p>Aynı bellek adresinde <code>free()</code> iki kez çağrılır. Sonuç olarak programın bellek yönetimi veri yapıları (free list / tcache gibi) bozulabilir; bu da beklenmeyen bellek adreslerinin okunmasına veya yazılmasına yol açabilir. Kök neden genelde sahiplik (ownership) belirsizliğidir: iki kod yolu aynı nesneyi serbest bırakma sorumluluğunu üstlenir.</p></div>
<div class="manpage src-docs"><div class="ref">CWE-787 · Out-of-bounds Write</div><p class="orig">The product writes data past the end, or before the beginning, of the intended buffer.</p><p>Hedeflenen tamponun sonundan sonrasına ya da başından öncesine veri yazılır. Bu uzamsal ihlal komşu nesneleri, metadata'yı ya da dönüş adresini ezebilir. CWE-787, yıllardır en tehlikeli yazılım zafiyetleri listelerinin üst sıralarında yer alır; çünkü tek bir yanlış uzunluk veya indeks kontrolü yeterlidir.</p></div>
<p>Bir <strong>type confusion</strong> ise farklı bir mekanizmadır: bellek geçerlidir ama yanlış türde yorumlanır (hatalı cast, union yanlış kullanımı). Lab'daki senaryoda UAF + type confusion birlikte çalışır: aynı baytlar önce <code>session</code>, sonra <code>char[]</code> olarak okunur.</p>

<h3>4. Neden C/C++ ve savunma nasıl keser</h3>
<p>Bu hataların C/C++'ta yoğunlaşmasının nedeni dildir: bellek yönetimi programcıya bırakılır, sınır ve yaşam süresi denetimi çalışma zamanında otomatik yapılmaz. Savunma iki katmanda çalışır — hatayı <em>bulmak</em> (geliştirme sırasında) ve hatayı <em>sömürülemez</em> kılmak (çalışma zamanında).</p>
<div class="deflist">
<div><dt>Sanitizer (bulma)</dt><dd>AddressSanitizer "fast memory error detector"; use-after-free, heap/stack/global OOB, double-free ve invalid-free yakalar. Test ve fuzzing sırasında hatayı sessizlikten çıkarıp çökmeye çevirir.</dd></div>
<div><dt>Hardened allocator (zorlaştırma)</dt><dd>Serbest yongaları hemen geri vermeyen, metadata'yı ayıran, guard page ekleyen allocator'lar UAF'i güvenilmez kılar.</dd></div>
<div><dt>MTE / tagging (donanım)</dt><dd>Her tahsise bir tag verilir; dangling pointer eski tag'i taşır, yeniden tahsis yeni tag alır — uyuşmazlık donanımda yakalanır. Hem temporal hem spatial.</dd></div>
<div><dt>Ownership / Rust (eleme)</dt><dd>Derleme zamanında yaşam süresi ve sahiplik denetlenir; dangling pointer ve double-free sınıfı bir bütün olarak elenir — bulmaya gerek kalmaz.</dd></div>
</div>
<div class="manpage src-docs"><div class="ref">Clang · AddressSanitizer</div><p class="orig">AddressSanitizer is a fast memory error detector.</p><p>AddressSanitizer hızlı bir bellek hatası dedektörüdür. <code>-fsanitize=address</code> ile derlenen program, serbest bırakılmış belleğe erişimi (use-after-free), sınır dışı erişimleri (out-of-bounds) ve çift serbest bırakmayı (double-free) erişim anında yakalar. Lab'daki program ASan olmadan sessizce yanlış çalışırken, ASan ile ilk sarkan erişimde durur — bu fark, "hatayı gizleyen" ile "yüzüne vuran" derleme arasındaki farktır.</p></div>
<p>Bütün bu katmanların ortak hedefi aynıdır: bir bellek hatasının <em>var olması</em> ile onun <em>sömürülebilir bir primitife dönüşmesi</em> arasındaki yolu kesmek. Bir sonraki modül tam da o yolu — bug'dan info leak'e, oradan keyfi okuma/yazmaya — kavramsal olarak izler.</p>`
  },
