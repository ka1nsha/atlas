    html: `<p class="lead">Windows çekirdeği, güvenlik ürünlerinin olayları görmesi için belgelenmiş, resmi mekanizmalar sunar. Bunlar iki aileye ayrılır: olay anında bir fonksiyonu çağıran <strong>kernel callback</strong>’ler ve olayları bir akışa yazan <strong>ETW</strong>. Bir EDR’nin "gözü" neredeyse tümüyle bu ikisinden oluşur; bu yüzden hem savunmanın temelidirler hem de saldırganın susturmak istediği hedeftirler.</p>

<h3>1. Notify routine’lar: süreç, thread ve image olayları</h3>
<p>Bir sürücü, çekirdeğe "şu olay olunca beni çağır" demek için <strong>notify routine</strong> kaydeder. En önemlileri süreç, thread ve image (modül) yaşam döngüsünü kapsar. Süreç oluşumu için modern API <code>PsSetCreateProcessNotifyRoutineEx</code>’tir:</p>
<div class="manpage src-docs"><div class="ref">docs · PsSetCreateProcessNotifyRoutineEx</div><p class="orig">The PsSetCreateProcessNotifyRoutineEx routine registers or removes a callback routine that notifies the caller when a process is created or exits.</p><p>Bu rutin, bir callback’i süreç oluşturma/çıkış olaylarına bağlar. "Ex" biçiminin kritik farkı: callback, süreç <strong>çalışmaya başlamadan önce</strong> senkron çağrılır ve <code>CreationStatus</code> alanını ayarlayarak süreci <strong>engelleyebilir</strong>. Yani yalnızca gözlem değil, önleme noktasıdır.</p></div>
<p>Benzer rutinler diğer olayları kapsar ve bir EDR tipik olarak hepsini birden kaydeder:</p>
<div class="deflist">
<div><dt>PsSetCreateThreadNotifyRoutine</dt><dd>Bir thread oluşturulduğunda veya sonlandığında çağrılır. Uzak thread oluşturma (remote thread) klasik bir enjeksiyon sinyali olduğundan bu olay EDR için değerlidir.</dd></div>
<div><dt>PsSetLoadImageNotifyRoutine</dt><dd>Bir image (EXE, DLL, sürücü) bir adres alanına yüklendiğinde çağrılır. İmzasız veya beklenmedik bir modülün yüklenmesini burada yakalanır.</dd></div>
<div><dt>CmRegisterCallback(Ex)</dt><dd>Registry işlemlerinden (anahtar/değer oku-yaz-sil) önce/sonra çağrılır. Kalıcılık (persistence) ve yapılandırma kurcalamaları çoğunlukla registry’de iz bırakır.</dd></div>
</div>

<h3>2. Object callback’ler: handle’a müdahale</h3>
<p>Bir süreç veya thread’e dokunmak için önce ona bir <strong>handle</strong> açmak gerekir. <code>ObRegisterCallbacks</code>, handle açma/çoğaltma işlemlerine araya girmeyi sağlar:</p>
<div class="manpage src-docs"><div class="ref">docs · ObRegisterCallbacks</div><p class="orig">The ObRegisterCallbacks routine registers a list of callback routines for thread, process, and desktop handle operations.</p><p>Bu, bir callback’in handle açma anında devreye girip istenen erişim haklarını <strong>kısmasını</strong> sağlar. Örneğin korunan bir sürecin belleğine yazma hakkıyla handle açılmasını engellemek (process protection) bu mekanizmayla yapılır. Antivirüs/EDR kendi süreçlerini de böyle korur.</p></div>

<h3>3. ETW: telemetrinin omurgası</h3>
<p>Callback’ler "an"a müdahale için; <strong>ETW</strong> ise olayların geniş, yapılandırılmış bir akışını toplamak içindir. ETW çekirdek düzeyinde verimli bir izleme altyapısıdır:</p>
<div class="manpage src-docs"><div class="ref">docs · Event Tracing for Windows</div><p class="orig">Event Tracing for Windows (ETW) is an efficient kernel-level tracing facility that lets you log kernel or application-defined events to a log file.</p><p>ETW, hem çekirdek hem uygulama olaylarını düşük maliyetle bir oturuma yazmayı sağlar. Mimarisi üç parçadır:</p></div>
<div class="deflist">
<div><dt>provider</dt><dd>Olayları üreten bileşen ("Providers are applications that contain event tracing instrumentation"). İşletim sistemi yüzlerce yerleşik provider içerir; güvenlik için en kritiği Microsoft-Windows-Threat-Intelligence (ETW-Ti) provider’ıdır.</dd></div>
<div><dt>controller</dt><dd>Oturumu başlatıp durduran, provider’ları etkinleştiren ("start and stop an event tracing session and enable providers") yönetici bileşen.</dd></div>
<div><dt>consumer</dt><dd>Oturumu bir olay kaynağı olarak seçip olayları işleyen ("select one or more event tracing sessions as a source of events") bileşen — EDR’nin olayları okuduğu yer.</dd></div>
</div>
<p>ETW-Ti özellikle önemlidir çünkü klasik kullanıcı-alanı API hook’larının kaçırdığı düşük seviyeli davranışları (bellek tahsisi desenleri, uzak thread, bazı syscall’lar) çekirdekten görünür kılar.</p>

<h3>4. Neden göz aynı zamanda hedef?</h3>
<p>Bir EDR’nin tüm görüşü bu callback ve ETW akışlarından geldiği için, saldırgan tarafının bir hedefi bu kaynakları <strong>köreltmektir</strong>: kayıtlı callback’i listeden çıkarmak, ETW oturumunu/provider’ı susturmak veya provider’a giden yolu bozmak. Bunların çoğu çekirdek düzeyinde yazma yetkisi gerektirir (bir sürücü veya BYOVD ile) — yani zaten yüksek ayrıcalık varsayar. Bu, savunma açısından iki ders verir: (1) bu mekanizmaların bütünlüğü korunmalıdır (imzalı sürücü zorunluluğu, callback listelerinin denetimi, ETW susturmanın kendisinin bir anomali sinyali olarak izlenmesi); (2) tek bir telemetri kaynağına güvenmek kırılgandır — savunma, birden fazla bağımsız kaynağı (callback + ETW + kullanıcı-alanı) çaprazlamalıdır. Bu bölüm kurcalamayı yalnızca tehdit modeli düzeyinde anar; somut teknik veya kod vermez.</p>`
