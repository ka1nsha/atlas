<h3>1. Koruma katmanları: AV, EPP, EDR, XDR</h3>
<p>Terimler sık karıştırılır; aslında artan kapsamı tanımlarlar:</p>
<div class="deflist">
<div><dt>AV (antivirus)</dt><dd>Klasik imza ve sezgisel (heuristic) tarama; bilinen kötücül dosyaları tanır. Tek başına, daha önce görülmemiş (zero-day) ve dosyasız (fileless) tehditlerde zayıftır.</dd></div>
<div><dt>EPP (Endpoint Protection Platform)</dt><dd>Önleme odaklı paket: AV + güvenlik duvarı + cihaz/uygulama denetimi + exploit azaltma. Olay <em>olmadan önce</em> durdurmaya çalışır.</dd></div>
<div><dt>EDR (Endpoint Detection and Response)</dt><dd>Tespit ve müdahale odaklı: sürekli telemetri toplar, davranışsal tespit yapar, olay sonrası görünürlük ve müdahale (izolasyon, sonlandırma) sağlar. "Önleme kaçarsa yakala ve yanıtla" katmanıdır.</dd></div>
<div><dt>XDR (Extended Detection and Response)</dt><dd>EDR\'nin kapsamını uç noktadan kimlik, e-posta, bulut ve ağ gibi başka sinyallere genişletir; farklı alanları tek bir korelasyon motorunda birleştirir.</dd></div>
</div>
<p>Pratikte modern ürünler bu katmanları birleştirir: önleme (EPP) ilk savunma hattı, tespit+müdahale (EDR/XDR) ise kaçanı yakalayan ikinci hattır (defense in depth).</p>

<h3>2. Meşru veri kaynakları: EDR ne ile görür?</h3>
<p>Bir EDR\'nin görüşü, işletim sisteminin sunduğu belgeli telemetri kaynaklarından gelir — önceki modüldeki callback\'ler ve ETW bunun çekirdeğidir:</p>
<div class="deflist">
<div><dt>kernel notify routine\'leri</dt><dd>Süreç/thread/image/registry olayları (<code>PsSetCreateProcessNotifyRoutineEx</code>, <code>CmRegisterCallback</code>). Gerçek-zamanlı, çekirdekten, kaçırmadan.</dd></div>
<div><dt>ETW (consumer)</dt><dd>Geniş, yapılandırılmış olay akışı. EDR bir consumer olarak oturumu dinler. Özellikle Threat-Intelligence provider\'ı düşük seviyeli davranışları görünür kılar.</dd></div>
<div><dt>minifilter (dosya sistemi)</dt><dd>Dosya oluşturma/okuma/yazma olaylarına filtre sürücüsüyle görünürlük — fidye yazılımı davranışı (toplu şifreleme) burada belirir.</dd></div>
<div><dt>kullanıcı-alanı telemetri</dt><dd>API gözlemi, AMSI (Antimalware Scan Interface — betik/bellek içeriğini tarama), komut satırı yakalama. Çekirdek sinyalleriyle çaprazlanır.</dd></div>
</div>
<p>ETW consumer\'ının olayları nasıl aldığı belgelidir — olaylar birleştirilip sıralanarak teslim edilir:</p>
<div class="manpage src-docs"><div class="ref">docs · ETW · consuming events</div><p class="orig">The ProcessTrace function combines the events, sorts them into chronological order, and then delivers them to the callbacks one at a time.</p><p>Consumer, <code>OpenTrace</code> ile oturumu açar ve <code>ProcessTrace</code> ile olayları işler; olaylar kronolojik sıraya konup callback\'e tek tek teslim edilir. "Event trace consumers can process events from one or more providers" — yani tek bir consumer birden çok kaynağı birleştirebilir. EDR\'nin olay zincirlerini kurabilmesi tam da bu sıralı, çok-kaynaklı akış sayesindedir.</p></div>

<h3>3. Davranışsal tespit: imza yerine zincir</h3>
<p>İmza tabanlı tespit "bu dosyanın hash\'i kötü listede mi?" diye sorar; davranışsal tespit ise "bu olay <em>dizisi</em> bilinen bir kötüye kullanım desenine benziyor mu?" diye sorar. İkincisi, daha önce hiç görülmemiş bir ikiliyi bile davranışından yakalayabilir — çünkü saldırganlar dosyayı kolayca değiştirir ama davranış kalıbını (süreç enjeksiyonu, kalıcılık kurma, telemetri susturma) değiştirmek zordur. Modern bellek tarama (memory scanning) da buna eklenir: diskte masum görünüp yalnızca bellekte açığa çıkan (fileless) yükleri yakalamak için çalışan süreçlerin belleği periyodik/olay-tetikli taranır. Tespitin kalitesi, gürültüyü (false positive) bastırırken gerçek zinciri yakalayabilmesinde yatar; bu yüzden çok-kaynak çaprazlama kritiktir.</p>

<h3>4. Önleme vs müdahale (prevention vs remediation)</h3>
<p>Savunmanın iki farklı anı vardır. <strong>Önleme</strong>, kötü olayın <em>hiç gerçekleşmemesini</em> hedefler (ör. create-process callback\'inin süreci baştan reddetmesi, exploit azaltmaların saldırıyı çökertmesi). <strong>Müdahale</strong> ise gerçekleşmiş bir olayın etkisini sınırlar ve geri alır: süreci sonlandırma, makineyi ağdan izole etme, oluşturulan kalıcılık artefaktlarını temizleme, zaman çizelgesini yeniden kurma. Olgun bir savunma ikisini de planlar; çünkü hiçbir önleme %100 değildir ve "ihlal varsay" (assume breach) ilkesi müdahale yeteneğini zorunlu kılar.</p>

<h3>5. Savunma kendini korur: PPL, HVCI, VBS</h3>
<p>Görünürlük ancak savunmanın kendisi bozulamazsa anlamlıdır. Bu yüzden EDR süreçleri ve çekirdek, kurcalamaya karşı donanım/işletim sistemi düzeyinde sertleştirilir:</p>
<div class="manpage src-docs"><div class="ref">docs · protected service (anti-malware)</div><p class="orig">After the service is launched as protected, other non-protected processes on the system won't be able to inject threads, and they won't be allowed to write into the virtual memory of the protected process.</p><p>Anti-malware servisleri <strong>protected process</strong> (yaygın adıyla PPL) olarak başlatılır: yönetici dahil korumasız süreçler bu sürece thread enjekte edemez, belleğine yazamaz, hatta servisi durduramaz. İçine yalnızca Windows-imzalı veya satıcı sertifikasıyla imzalı kod yüklenebilir. Böylece saldırganın "önce EDR\'yi öldür" hamlesi donanım/OS düzeyinde zorlaşır.</p></div>
<div class="manpage src-docs"><div class="ref">docs · memory integrity (HVCI)</div><p class="orig">Memory integrity is a critical component that protects and hardens Windows by running kernel mode code integrity within the isolated virtual environment of VBS.</p><p>Memory integrity (HVCI — hypervisor-protected code integrity), çekirdek-modu kod bütünlüğü denetimini VBS\'in izole sanal ortamında çalıştırır ve "kernel memory allocations that could be used to compromise the system" tahsislerini kısıtlar. Sonuç: çekirdekte imzasız kod çalıştırmak ve belleği keyfî yürütülebilir yapmak çok zorlaşır — bu, imzalı-ama-zafiyetli sürücü kötüye kullanımına (BYOVD) karşı en etkili savunma katmanlarından biridir. VBS, donanım sanallaştırmasıyla güvenlik sınırlarını çekirdeğin bile dışına taşıyarak "çekirdek ele geçirilse bile" modelini güçlendirir.</p></div>
<p>Diğer platformlarda karşılığı vardır: Linux\'ta eBPF/auditd ile çekirdek olay telemetrisi ve LSM kancaları; macOS\'ta EndpointSecurity framework\'ü aynı "çekirdekten olay akışı + AUTH kararı" modelini sunar. Üçünde de ortak ders aynıdır: savunma, bağımsız kaynakların çaprazlandığı, kendi bütünlüğü korunan, hem önleme hem müdahale yeteneği olan katmanlı bir sistemdir.</p>`
  },
