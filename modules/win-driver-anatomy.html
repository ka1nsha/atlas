    html: `<p class="lead">Bir Windows sürücüsünün iskeleti üç şeyin üstüne kuruludur: nesneler (DriverObject/DeviceObject), IRP dispatch tablosu ve kernel bellek yönetimi. Bu bölüm Microsoft'un resmi belgelerine dayanır; kavramları Linux karakter aygıtı ve macOS IOKit karşılıklarıyla ilişkilendirir. Tamamı "doğru ve güvenli sürücü nasıl yazılır" perspektifindedir.</p>

<h3>1. DriverObject: sürücünün kendisi</h3>
<p>İşletim sistemi bir sürücüyü yüklediğinde, onu temsil eden bir nesne oluşturur ve bu nesneyi sürücünün giriş noktasına verir.</p>
<div class="manpage src-docs"><div class="ref">Microsoft Learn · Driver objects</div><p class="orig">The I/O manager creates a driver object for each driver that has been installed and loaded. Driver objects are defined using DRIVER_OBJECT structures.</p><p>I/O Manager, yüklenen her sürücü için bir <strong>DRIVER_OBJECT</strong> oluşturur. Bu nesne sürücünün standart rutinlerinin (dispatch, unload vb.) giriş noktalarını saklar — sürücünün "kimlik kartı" ve fonksiyon tablosudur.</p></div>
<div class="manpage src-docs"><div class="ref">Microsoft Learn · DriverEntry</div><p class="orig">When the I/O manager calls a driver's DriverEntry routine, it supplies the address of the driver's driver object. The driver object contains storage for entry points to many of a driver's standard routines. The driver is responsible for filling in these entry points.</p><p><code>DriverEntry</code> çağrıldığında sürücüye kendi <code>DRIVER_OBJECT</code>'inin adresi verilir. Sürücü, bu nesnedeki giriş noktalarını (örneğin <code>MajorFunction</code> dizisi ve <code>DriverUnload</code>) <strong>doldurmakla sorumludur</strong>. Boş bıraktığın her giriş noktası, o tür istek geldiğinde varsayılan davranışa düşer.</p></div>

<h3>2. DeviceObject: isteklerin hedefi</h3>
<p>Sürücünün yönettiği aygıt ayrı bir nesneyle temsil edilir. İstekler sürücüye değil, bu aygıt nesnesine gönderilir.</p>
<div class="manpage src-docs"><div class="ref">Microsoft Learn · Device objects</div><p class="orig">The operating system represents devices by device objects. One or more device objects are associated with each device. Device objects serve as the target of all operations on the device.</p><p>İşletim sistemi aygıtları <strong>DEVICE_OBJECT</strong> ile temsil eder ve bu nesneler <strong>aygıt üzerindeki tüm işlemlerin hedefidir</strong>. Nesneler <code>object manager</code> tarafından yönetilir; sürücü genellikle <code>IoCreateDevice</code> ile oluşturur. Bir aygıt için birden fazla device object bir <strong>device stack</strong> oluşturabilir (filtre + fonksiyonel + alt sürücü) — bu, bir filtre sürücüsünün (örn. bir güvenlik ürününün minifilter'ı) I/O'yu araya girerek görmesini sağlayan yapıdır.</p></div>
<div class="deflist">
<div><dt>IoCreateDevice</dt><dd>Device object oluşturur. İsimli (\\Device\\...) veya isimsiz olabilir; isimli aygıtlar erişim denetimi açısından dikkat ister.</dd></div>
<div><dt>Symbolic link</dt><dd><code>IoCreateSymbolicLink</code> aygıtı user mode isim alanına (\\\\.\\Name) bağlar; <code>CreateFile</code> bu isimle handle alır.</dd></div>
<div><dt>Device stack</dt><dd>Aynı aygıt için katmanlı device object yığını; IRP tepeden aşağı iner, her katman görüp geçirebilir.</dd></div>
</div>

<h3>3. IRP dispatch: hangi istek hangi rutine?</h3>
<p>Bir sürücü, işleyebileceği IRP türlerini <code>DRIVER_OBJECT</code>'in <code>MajorFunction</code> dizisine rutin adresleri yazarak bildirir. Dizi, <code>IRP_MJ_*</code> major function kodlarıyla (örn. <code>IRP_MJ_CREATE</code>, <code>IRP_MJ_READ</code>, <code>IRP_MJ_DEVICE_CONTROL</code>) indekslenir. Bir IRP geldiğinde I/O Manager, IRP'nin major function koduna karşılık gelen dispatch rutinini çağırır. Bu yapı, Linux'taki <code>file_operations</code> tablosunun (her operasyon için bir fonksiyon işaretçisi) ve IOKit'teki external method tablosunun doğrudan karşılığıdır. <em>(Microsoft Learn — Writing Dispatch Routines; sayfa bu oturumda yüklenemedi, tanım kanonik olarak verilmiştir.)</em></p>
<p>Güvenli sürücü yazımının kalbi bu rutinlerdedir: özellikle <code>IRP_MJ_DEVICE_CONTROL</code> işleyicisi, user mode'dan gelen tampon ve uzunlukları <strong>kullanmadan önce doğrulamalıdır</strong>. Buffering yöntemi (buffered / direct / neither I/O) IOCTL kodunda kodlanır; "neither I/O" seçildiğinde ham user mode işaretçileri gelir ve bunları doğrulamadan dereference etmek klasik bir hata sınıfıdır. Bu, Linux'ta <code>copy_from_user</code> sınır denetimiyle ve XNU IOKit external method girdi doğrulamasıyla aynı risk sınıfıdır.</p>

<h3>4. Kernel bellek: paged vs non-paged pool</h3>
<p>Sürücüler kernel belleğini havuzlardan (pool) tahsis eder; modern API <code>ExAllocatePool2</code>'dur (eski <code>ExAllocatePoolWithTag</code> yerine). İki temel havuz türü vardır ve doğru seçim güvenlik/kararlılık için kritiktir:</p>
<div class="deflist">
<div><dt>non-paged pool</dt><dd>Her zaman fiziksel bellekte kalır (sayfalanmaz). DISPATCH_LEVEL ve üstünde (kesme/DPC bağlamında) erişilecek veri <strong>zorunlu</strong> buraya konur — çünkü o seviyede page fault çözülemez ve sistem çöker.</dd></div>
<div><dt>paged pool</dt><dd>Gerektiğinde diske sayfalanabilir; yalnızca PASSIVE_LEVEL/APC_LEVEL'da (page fault'un çözülebildiği bağlamda) erişilebilir. Daha bol ama kısıtlı.</dd></div>
<div><dt>pool tag</dt><dd>Tahsise 4 karakterlik etiket verilir; sızıntı ve bozulma teşhisini (poolmon, !pool) kolaylaştırır.</dd></div>
</div>
<p><em>(Microsoft Learn — ExAllocatePool2 / pool tagging sayfaları bu oturumda yüklenemedi; pool türü kuralları kanonik olarak özetlenmiştir.)</em> IRQL kavramının bellek tahsisini nasıl kısıtladığı, Windows yürütme modeli modülünde (APC/DPC/IRQL) ayrıntılı işlenir.</p>

<h3>5. Temiz yaşam döngüsü: Unload</h3>
<p>Sürücü <code>DriverUnload</code> rutinini doldurduysa kaldırılabilir. İyi bir sürücü, kurduğu her şeyi <strong>oluşturma sırasının tersine</strong> yıkar: önce symbolic link (<code>IoDeleteSymbolicLink</code>), sonra device object (<code>IoDeleteDevice</code>), ayrılan pool bellekleri ve kaydedilen callback'ler. Kernel mode'da garbage collector yoktur; sızdırılan bir device object veya pool tahsisi yeniden başlatmaya kadar kalır. macOS IOKit'te <code>free()</code>/<code>stop()</code> ve Linux'ta <code>module_exit</code> ile aynı disiplindir — yarattığını geri al.</p>`
  },
