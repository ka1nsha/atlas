    html: `<p class="lead">Windows'un yürütme modelini tek cümleyle özetlemek gerekirse: <strong>bir kod parçasının ne yapabileceğini, çalıştığı IRQL belirler.</strong> Bu bölüm IRQL merdivenini, işin ISR + DPC olarak nasıl bölündüğünü, APC'lerin bir thread bağlamına kod sokma mekanizmasını ve bunların Linux karşılıklarını ayrıntılandırır.</p>

<h3>1. IRQL: tek bir sayı neyi belirler?</h3>
<p>Her processor her an bir <strong>IRQL</strong> (Interrupt Request Level) değerindedir. Kural basittir: processor yalnızca o anki IRQL'den <em>yüksek</em> IRQL'li kesmelere cevap verir; eşit veya düşük olanlar maskelenir ve bekler. Dolayısıyla IRQL, hem kesme önceliğini hem de — daha önemlisi — kodun hangi API'leri çağırabileceğini belirler.</p>
<div class="manpage src-docs"><div class="ref">docs · Managing Hardware Priorities</div><p class="orig">The IRQL at which a driver routine executes determines which kernel-mode driver support routines it can call.</p><p>Yani IRQL yalnızca "ne zaman kesilirim" değil, "şu an hangi çekirdek fonksiyonlarını çağırabilirim" sorusunun da cevabıdır. Seviye yükseldikçe çağrılabilir API kümesi daralır.</p></div>
<p>Soldan sağa, düşükten yükseğe başlıca seviyeler:</p>
<div class="deflist">
<div><dt>PASSIVE_LEVEL (0)</dt><dd>Normal thread kodunun çalıştığı seviye. Hiçbir şey maskeli değildir; kod pageable belleğe erişebilir, bir nesneyi bekleyip <strong>uyuyabilir</strong>, çoğu kernel API'sini çağırabilir. Kullanıcı modundaki ve çoğu sürücü giriş noktasındaki kod buradadır.</dd></div>
<div><dt>APC_LEVEL (1)</dt><dd>Yalnızca <strong>APC</strong> teslimini maskeler. Sayfalama (paging) hâlâ mümkündür ama bazı bekleme işlemleri kısıtlıdır. Bir thread kendi APC'lerine karşı kısa süreli korunmak istediğinde bu seviyeye çıkar.</dd></div>
<div><dt>DISPATCH_LEVEL (2)</dt><dd>Thread zamanlayıcının (dispatcher) ve <strong>DPC</strong>'lerin seviyesi. Burada ve üstünde kod <strong>uyuyamaz, bloklayamaz ve pageable belleğe dokunamaz</strong>. Zamanlayıcı maskeli olduğundan, bu seviyedeki kod başka bir thread'e geçiş yapamaz — bitene kadar processor'ı tutar.</dd></div>
<div><dt>DIRQL (Device IRQL)</dt><dd>Aygıt kesmelerinin (ISR) çalıştığı, DISPATCH'in de üstündeki yüksek seviyeler. Son derece kısıtlıdır: yalnızca ISR-güvenli, non-paged işlemler yapılabilir.</dd></div>
</div>
<p>DISPATCH_LEVEL'da nelerin maskelendiğini belgenin kendi ifadesiyle:</p>
<div class="manpage src-docs"><div class="ref">docs · Managing Hardware Priorities</div><p class="orig">DISPATCH_LEVEL and APC_LEVEL interrupts are masked off. Device, clock, and power failure interrupts can occur.</p><p>DISPATCH_LEVEL'da thread zamanlayıcı ve APC teslimi durur; yalnızca aygıt, saat ve güç kesmeleri gibi daha yüksek seviyeler gelebilir. Bu yüzden DPC kodu bir bekleme işlemine giremez — onu uyandıracak zamanlayıcının kendisi maskelidir.</p></div>

<h3>2. ISR + DPC: işin ikiye bölünmesi</h3>
<p>Bir aygıt kesmesi geldiğinde processor IRQL'i DIRQL'e yükseltir ve sürücünün <strong>ISR</strong>'sini (Interrupt Service Routine) çağırır. Bu seviye o kadar kısıtlıdır ki ISR yalnızca ertelenemez minimumu yapmalıdır: donanım kayıtlarını oku, kesmeyi onayla ve geri kalanı ertele. Erteleme aracı <strong>DPC</strong>'dir — ISR bir DPC kuyruklar ve çıkar.</p>
<div class="manpage src-docs"><div class="ref">docs · Introduction to DPCs</div><p class="orig">A DpcForIsr or CustomDpc routine is called in an arbitrary DPC context at IRQL DISPATCH_LEVEL.</p><p>DPC, ISR'den daha düşük olan DISPATCH_LEVEL'de çalışır; yani kesmeler yeniden açıkken ağır işi yapar ama hâlâ uyuyamaz. "Arbitrary DPC context" ifadesi önemlidir: DPC belirli bir thread'in bağlamında çalışmaz, o an processor'da hangi thread varsa onun üstünde çalışır — bu yüzden thread'e özel hiçbir şeye güvenemez.</p></div>
<p>Bu bölünme Linux'taki <strong>top half / bottom half</strong> modelinin birebir karşılığıdır: ISR ≈ top half (hardirq), DPC ≈ softirq/tasklet. Her iki sistemde de amaç aynıdır — yüksek öncelikli bağlamda minimum süre kal, gerisini daha rahat bir seviyeye ertele.</p>

<h3>3. APC: bir thread'in bağlamına kod sokmak</h3>
<p><strong>APC</strong> (Asynchronous Procedure Call), belirli bir thread'in bağlamında, o thread uygun bir noktaya geldiğinde çalıştırılacak bir fonksiyondur. DPC'den farkı şudur: DPC bağlamsızdır (herhangi bir thread üstünde çalışır), APC ise <em>hedef thread'in</em> adres alanında ve kimliğinde çalışır. İki türü vardır:</p>
<div class="deflist">
<div><dt>kernel APC</dt><dd>Çekirdek modunda, APC_LEVEL'de çalışır. Çekirdek, bir işi tam olarak belirli bir thread'in bağlamında yaptırmak istediğinde kullanır (ör. I/O tamamlandığında sonucu başlatan thread'e taşımak).</dd></div>
<div><dt>user APC</dt><dd>Hedef thread "alertable" bir bekleme durumuna girdiğinde kullanıcı modunda çalışır. Windows'ta I/O completion routine'leri ve <code>QueueUserAPC</code> bunun üstüne kuruludur.</dd></div>
</div>
<p>APC mekanizması güçlüdür çünkü kodu <em>başka bir thread'in</em> bağlamına taşımaya yarar; bu, I/O tamamlama gibi meşru işlerin temelidir.</p>

<h3>4. System thread: uyuyabilen iş nereye gider?</h3>
<p>DPC ve ISR uyuyamadığına göre, bloklaması gereken iş (bir olayı beklemek, pageable belleğe erişmek, uzun süren bir işlem) bir <strong>system thread</strong>'e devredilir. System thread tamamen çekirdek modunda yaşayan, <code>PsCreateSystemThread</code> ile oluşturulan ve PASSIVE_LEVEL'de çalışan bir thread'dir; dolayısıyla <code>KeWaitForSingleObject</code> gibi bloklayan çağrıları rahatça yapabilir. Sürücüler sık sık bir DPC'den "work item" kuyruklayıp asıl işi bir system worker thread'ine bırakır. Bu, Linux'ta işin bir <strong>workqueue</strong>'ya (process context, uyuyabilir) düşmesinin tam karşılığıdır.</p>

<h3>5. User'dan kernel'e: syscall ve fault yolu</h3>
<p>Bir kullanıcı programı bir sistem hizmeti istediğinde, <code>syscall</code>/<code>sysenter</code> komutuyla çekirdeğe geçer; giriş noktası <code>KiSystemCall64</code> gibi bir dispatcher'dır ve istek <strong>SSDT</strong> (System Service Descriptor Table) üzerinden ilgili çekirdek fonksiyonuna yönlendirilir. Bu geçiş PASSIVE_LEVEL'de olur, çünkü syscall işleyicisi bloklayabilen, pageable koda dokunabilen gerçek işi yapacaktır.</p>
<p>Pageable bir adrese erişim o an bellekte değilse bir <strong>page fault</strong> oluşur; fault işleyicisi sayfayı diskten getirir. İşte DISPATCH_LEVEL ve üstünde pageable belleğe dokunmanın yasak olmasının asıl nedeni budur: page fault'u çözecek mekanizma daha düşük IRQL ve thread geçişi gerektirir, ama o seviyede zamanlayıcı maskelidir — sonuç çözülemeyen bir fault, yani <strong>bug check</strong> (ünlü mavi ekran, BSOD) olur. Bir sürücünün DISPATCH_LEVEL'de pageable belleğe dokunması Windows'ta klasik bir çökme sebebidir.</p>`
  },
