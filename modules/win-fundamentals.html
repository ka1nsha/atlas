    html: `<p class="lead">Windows NT kernel'i, Linux ve XNU ile aynı temel fikri (user/kernel ayrımı, denetimli geçiş) paylaşır ama kendi mimarisi, sürücü modeli ve soyutlamaları vardır. Bu bölüm Microsoft'un resmi sürücü belgelerine dayanır ve kavramları Linux/macOS karşılıklarıyla ilişkilendirir.</p>

<h3>1. İki mod: user mode ve kernel mode</h3>
<p>Windows işlemciyi iki modda çalıştırır. Uygulamalar user mode'da izole, her biri kendi private virtual address space'inde koşar; bir uygulama çökse diğerlerini etkilemez. Kernel mode ise tek bir paylaşılan adres uzayıdır — bu, performans getirir ama izolasyon maliyetine mal olur.</p>
<div class="manpage src-docs"><div class="ref">Microsoft Learn · User mode and kernel mode</div><p class="orig">A processor in a computer that runs Windows operates in two different modes: user mode and kernel mode. Applications operate in user mode. Core operating system components function in kernel mode.</p><p>Uygulamalar <strong>user mode</strong>'da, çekirdek bileşenleri <strong>kernel mode</strong>'da çalışır. User mode'da her uygulama izole bir <code>process</code> içindedir ve işletim sistemi için ayrılmış sanal adreslere erişemez.</p></div>
<div class="manpage src-docs"><div class="ref">Microsoft Learn · Kernel mode</div><p class="orig">All code that runs in kernel mode shares a single virtual address space. As a result, a kernel-mode driver isn't isolated from other drivers or the operating system.</p><p>Kernel mode'da tüm kod <strong>tek bir sanal adres uzayını paylaşır</strong>. Bu yüzden bir kernel-mode driver yanlış bir adrese yazarsa işletim sistemini ya da başka bir sürücüyü bozabilir; çökerse <strong>tüm sistem çöker</strong> (BSOD). Linux'ta bir kernel modülü hatası ve XNU'da bir kernel panic ile aynı kritik sınır budur.</p></div>

<h3>2. Mimari katmanlar: ntoskrnl, HAL, Executive</h3>
<p>Windows kernel mode'u katmanlıdır:</p>
<div class="deflist">
<div><dt>ntoskrnl.exe</dt><dd>NT kernel'in çekirdeği. Alt seviyede <strong>Kernel (Ke)</strong> katmanı (zamanlama, senkronizasyon, interrupt), üstünde <strong>Executive</strong> katmanı (I/O Manager, Memory Manager, Object Manager, Process Manager gibi alt sistemler).</dd></div>
<div><dt>HAL</dt><dd>Hardware Abstraction Layer. Donanım/anakart farklarını kernel'den gizler — Linux'taki arch-bağımlı katmanın karşılığı.</dd></div>
<div><dt>Executive alt sistemleri</dt><dd>I/O Manager (sürücü istekleri, IRP), Memory Manager, Object Manager (handle'lar, nesneler), Configuration Manager (registry) gibi servisler.</dd></div>
<div><dt>Device drivers</dt><dd>Kernel mode'a yüklenen, donanımı veya sanal aygıtları yöneten modüller. Güvenlik ve kararlılık için en kritik üçüncü-taraf koddur.</dd></div>
</div>

<h3>3. Sürücü türleri: WDM'den WDF'ye</h3>
<p>Windows sürücü modeli zamanla evrildi. Eski model doğrudan ve hataya açıktı; yeni framework'ler güvenli varsayılanlar sağlar.</p>
<div class="manpage src-docs"><div class="ref">Microsoft Learn · WDM</div><p class="orig">The Windows Driver Model (WDM) was introduced to enable driver developers to write device drivers that are source-code compatible across all Microsoft Windows operating systems. Kernel-mode drivers that follow WDM rules are called WDM drivers.</p><p><strong>WDM</strong>, sürücülerin tüm Windows sürümlerinde kaynak-uyumlu olmasını sağlamak için getirildi. Ancak Microsoft artık WDM'i önermiyor: üstüne kurulan <strong>WDF</strong> (Windows Driver Frameworks) tercih ediliyor — <strong>KMDF</strong> (kernel-mode) ve <strong>UMDF</strong> (user-mode). WDF, IRP yönetimi, PnP ve güç durumu gibi hataya açık ayrıntıların çoğunu framework'e devreder.</p></div>
<div class="deflist">
<div><dt>Legacy / WDM</dt><dd>En düşük seviye; IRP'leri, PnP ve power olaylarını sürücü elle yönetir. Hata payı yüksek.</dd></div>
<div><dt>KMDF</dt><dd>Kernel-Mode Driver Framework. Çoğu kernel sürücüsü için önerilen model; nesne tabanlı, güvenli varsayılanlar.</dd></div>
<div><dt>UMDF</dt><dd>User-Mode Driver Framework. Mümkün olduğunda sürücüyü user mode'a taşır — çökme tüm sistemi değil yalnızca sürücü host'unu düşürür.</dd></div>
<div><dt>Minifilter</dt><dd>Dosya sistemi filtre sürücüsü (Filter Manager üzerinden). Antivürüs, EDR ve şifreleme ürünleri dosya I/O'sunu buradan izler.</dd></div>
</div>

<h3>4. IRP: I/O isteklerinin zarfı</h3>
<p>Windows'ta sürücülere giden isteklerin çoğu bir <strong>IRP</strong> (I/O Request Packet) içinde paketlenir. IRP, isteği işlemek için gereken tüm bilgiyi (major function kodu, tampon işaretçileri, parametreler) kendi içinde taşıyan, kendine yeten bir yapıdır.</p>
<div class="manpage src-docs"><div class="ref">Microsoft Learn · I/O request packets</div><p class="orig">Most of the requests that are sent to device drivers are packaged in I/O request packets (IRPs). The IRP structure is self-contained in the sense that it holds all of the information that a driver needs to handle an I/O request.</p><p>Bir IRP, <code>IoCallDriver</code> ile bir <code>DEVICE_OBJECT</code>'e gönderilir ve genellikle önce <strong>device stack</strong>'in tepesindeki nesneye ulaşır; oradan aşağı doğru iner. Bir filtre sürücüsü (örn. bir EDR'nin minifilter'ı) IRP'yi görür, işler ve bir alttaki fonksiyonel aygıta geçirir — "IRP'yi device stack'te aşağı geçirmek" denir. Bu stack yapısı, güvenlik ürünlerinin I/O'yu araya girerek izlemesini mümkün kılar.</p></div>

<h3>5. User ↔ kernel iletişimi ve neden saldırı/savunmanın merkezi</h3>
<p>User mode ile sürücü arasındaki ana köprü <code>DeviceIoControl</code> çağrısı ve ona karşılık gelen <code>IRP_MJ_DEVICE_CONTROL</code> IRP'sidir. Kontrol kodu (IOCTL), buffering yöntemini (buffered / direct / neither I/O) de kodlar. Bu arayüz hem meşru sürücü denetiminin hem de saldırının merkezidir: zayıf doğrulanmış bir IOCTL işleyicisi, user mode'dan kernel'e bir zafiyet kapısı açar. Linux'ta <code>ioctl()</code> + <code>copy_from_user</code> sınır denetimi, XNU'da IOKit external method yüzeyi ile aynı risk sınıfıdır — ve bu izleğin ileriki modüllerinde (rootkit teknikleri, BYOVD, EDR/ETW savunması) tam da bu sınır işlenir.</p>`
