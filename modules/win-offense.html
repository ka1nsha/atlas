  deepDive: {

    html: `<p class="lead">Rootkit, bir saldırganın çekirdek ayrıcalığını <em>kalıcı ve görünmez</em> kılma sanatıdır. Ama her teknik bir varsayıma dayanır — "imza güvendir", "araçlar listeye güvenir" — ve her varsayımın karşısında onu çürüten bir savunma durur. Bu bölüm teknikleri saldırgan gözüyle haritalar; amaç her birinin karşısına varsayılan açık bir koruma koyabilmektir. Alıntılar doğrudan MITRE ATT&CK ve Microsoft'un kendi güvenlik belgelerinden gelir.</p>

<h3>1. Rootkit nedir: gerçekliğin kendisini yazmak</h3>
<p>Bir rootkit, kötü amaçlı yazılımın varlığını işletim sisteminin <em>kendi</em> bilgi kaynaklarını değiştirerek gizler. Güvenlik araçları süreç listesine, dosya sistemine, ağ tablolarına güvenir; çekirdekteki bir rootkit bu kaynakları çarpıtarak araçlara yalan söyletir.</p>
<div class="manpage src-docs"><div class="ref">docs · MITRE ATT&amp;CK · T1014 Rootkit</div><p class="orig">programs that hide the existence of malware by intercepting/hooking and modifying operating system API calls that supply system information</p><p>Tanımın özü şu: rootkit yeni bir açık yaratmaz; <em>mevcut bilgi akışını</em> kesip değiştirir. API çağrıları "hangi süreçler çalışıyor?" sorusuna yanıt verirken araya girip kötü niyetli olanı listeden çıkarır. Bu yüzden rootkit tespiti, OS\'un verdiği cevaba değil, o cevabı <em>çapraz doğrulamaya</em> dayanır.</p></div>

<h3>2. Giriş kapısı: BYOVD (Bring Your Own Vulnerable Driver)</h3>
<p>Modern Windows imzasız çekirdek sürücüsü yüklenmesini engeller (Driver Signature Enforcement). Saldırgan bu duvarı aşmak için imzasız kod yazmaz; <strong>imzalı ama zafiyetli</strong> meşru bir sürücüyü sisteme yükler ve onun açığı üzerinden çekirdek R/W elde eder. "İmza" yalnızca sürücünün <em>kim tarafından</em> yazıldığını doğrular; <em>güvenli</em> olduğunu değil.</p>
<div class="manpage src-docs"><div class="ref">docs · Microsoft · Vulnerable driver blocklist</div><p class="orig">The vulnerable driver blocklist is designed to help harden systems against non-Microsoft-developed drivers across the Windows ecosystem with any of the following attributes: Known security vulnerabilities that an attacker could exploit to elevate privileges in the Windows kernel</p><p>Microsoft\'un yanıtı imza modelini tamir etmek değil, <em>bilinen kötü sürücüleri bir blocklist ile reddetmek</em>. Çözümün burada olması, imzanın tek başına yetmediğinin resmi kabulüdür: güven, imzaya değil, sürücünün bilinen güvenlik geçmişine bağlanır. BYOVD\'ye karşı ilk ve en etkili katman budur.</p></div>

<h3>3. DKOM: süreç listesinden "unlink"</h3>
<p>Çekirdek R/W elde eden saldırganın klasik gizlenme tekniği <strong>Direct Kernel Object Manipulation</strong>\'dır. Çalışan süreçler <code>EPROCESS</code> yapılarından oluşan çift bağlı bir listede (<code>ActiveProcessLinks</code>) tutulur. Saldırgan kötü niyetli sürecin komşularının Flink/Blink işaretçilerini yeniden yazarak onu listeden koparır — süreç çalışmaya devam eder ama listeyi gezen araçlara görünmez olur.</p>
<div class="deflist">
<div><dt>EPROCESS</dt><dd>Her süreci temsil eden çekirdek yapısı. Listeden çıkarılsa bile zamanlayıcı, handle tablosu ve bellekte varlığını sürdürür.</dd></div>
<div><dt>ActiveProcessLinks</dt><dd>Süreçleri birbirine bağlayan çift bağlı liste (Flink/Blink). Task Manager ve tasklist bunu gezer.</dd></div>
<div><dt>unlink</dt><dd>Komşu işaretçileri hedefi atlayacak şekilde yeniden yazma. Nesneyi listeden siler ama bellekten silmez — tespit açığı buradadır.</dd></div>
<div><dt>cross-view detection</dt><dd>Listeyi bellek taramasıyla karşılaştırma. Listede olmayan ama bellekte duran EPROCESS, gizlenmiş süreçtir.</dd></div>
</div>

<h3>4. Telemetriyi köreltmek: IRP hooking ve callback tampering</h3>
<p>Rootkit yalnızca gizlenmekle kalmaz, kendisini izleyen gözleri de köreltmeye çalışır. <strong>IRP hooking</strong> ile sürücü istek paketlerini (I/O Request Packet) araya girip değiştirebilir; <strong>callback tampering</strong> ile EDR\'lerin kullandığı çekirdek bildirim kayıtlarını (process/thread/image yükleme callback\'leri) devre dışı bırakmaya veya kaldırmaya çalışır. Hedef, güvenlik ürününün olay akışını (telemetri) kesmektir. Ama bu callback\'lerin kendileri korunan yapılardır ve kurcalanmaları da bir anomalidir.</p>

<h3>5. Savunmanın temeli: bütünlük ve çapraz doğrulama</h3>
<p>Windows\'un modern çekirdek savunması, saldırganın çekirdek belleğini özgürce yazabileceği varsayımına karşı belleğin bütünlüğünü donanım/hypervisor düzeyinde korur. <strong>HVCI / memory integrity</strong>, çekirdek kod bütünlüğünü VBS\'in izole sanal ortamında çalıştırır; <strong>PatchGuard (KPP)</strong> kritik yapıların izinsiz değişimini denetler.</p>
<div class="manpage src-docs"><div class="ref">docs · Microsoft · Memory integrity (HVCI)</div><p class="orig">Memory integrity is a critical component that protects and hardens Windows by running kernel mode code integrity within the isolated virtual environment of VBS. Memory integrity also restricts kernel memory allocations that could be used to compromise the system.</p><p>Fikir, çekirdeğin güvenliğini artık çekirdeğin <em>kendisine</em> emanet etmemektir: kod bütünlüğü denetimi, saldırganın ulaşamadığı daha ayrıcalıklı bir katmana (hypervisor) taşınır. Bu, macOS\'taki PPL/SPTM mantığının Windows karşılığıdır — çekirdek ele geçse bile belleğin bütünlüğünü koruyan ayrı bir güven alanı. DKOM ve rootkit\'lere karşı nihai savunma, "gizlenen her nesnenin başka bir yerde iz bıraktığı" ilkesiyle bu bütünlük denetimlerini birleştirmektir.</p></div>
<p>Özet: her rootkit tekniği bir varsayıma yaslanır ve her varsayımın bir panzehiri vardır — BYOVD\'ye blocklist + HVCI, DKOM\'a cross-view detection + PatchGuard, callback tampering\'e korunan callback\'ler + ETW. Saldırıyı anlamanın savunmacı için anlamı budur: tekniği bilirsen, onun kaçınılmaz izini aramayı da bilirsin.</p>`
